stable_id: activity:dotnet:stage-12
type: manual
title: Stage 12 Frontend state, request races, accessible forms, and performance evidence
instructions: 'This single manual unit maps to the complete original 12.md. Use a learner-owned scratch project
  and synthetic learning data. Source status remains draft; this is guided evidence, not course, runtime or operational
  approval. Record environment, commands, inputs, expected outcomes, observed outputs and exact blockers. Each rubric
  criterion earns its one point only when all named positive evidence is present; unavailable or unperformed observations
  earn zero.


  Complete Stage 11 first. Draw a discriminated-union loading/empty/success/error state and pure reducer transitions.
  The chapter''s Expense[] reducer alone does not represent loading/error; implement a state object or a separate
  explicit status contract. Separate transient UI state from server state; define cache keys, invalidation and whether
  writes return updated data or trigger refetch. Optimistic writes are optional and require rollback evidence.


  Make from/to/category/page/search URL parameters round-trip across refresh, reset and browser back/forward. Validate
  page and filter values and show server-side pagination. Reproduce a delayed food response arriving after food-market.
  Abort alone is insufficient evidence: guard stale success AND stale error with cleanup ignore/request generation
  and prove the successor state survives both. Record cancellation and unmount behavior without treating cancellation
  as a user-visible failure.


  Implement labels, described-by field errors, invalid state, focus placement and pending status announcements.
  Exercise keyboard-only use, 200% zoom, loading/empty/error states, 400/401/403/409/500 responses, duplicate submit,
  and deletion of a stale record. Record observed focus and announced message; a source-code assertion is not a
  browser observation.


  Profile a repeatable 1,000-row case before and after one justified optimization. Record environment, data, duration/render
  counts, costs and behavior equivalence; do not assume memoization helps. Complete the chapter''s 35-minute debugging
  case and explain its interview questions with counterexamples. A query library is optional.'
expected_output: An evidence folder containing the implementation/diff, environment and commands, expected/observed
  case table, relevant test/browser/profiler or recovery records, and a blocker list. Redact secrets and private
  data. Optional extensions are not required for the four-point core rubric.
completion_mode: learner_attest
rubric:
- criterion: Explicit state and URL contract
  evidence: Transition cases and refresh/reset/back-forward recordings demonstrate the agreed state and filter behavior.
  max_points: 1
- criterion: Stale response correctness
  evidence: Reproducible delayed success and delayed error runs show the older request cannot overwrite successor
    state; cancellation/unmount is evidenced.
  max_points: 1
- criterion: Accessible asynchronous behavior
  evidence: Keyboard/focus/status observations plus loading, empty, validation, authorization, conflict, server-error
    and duplicate-submit outcomes.
  max_points: 1
- criterion: Measured performance and explanation
  evidence: Comparable before/after profiler data, behavior checks, debug diagnosis and interview reasoning; claimed
    improvement unsupported by measurements earns zero.
  max_points: 1
resources: []
