stable_id: activity:dotnet:stage-13
type: manual
title: Stage 13 Unit, integration, browser testing, and reproducible CI evidence
instructions: 'This single manual unit maps to the complete original 13.md. Use a learner-owned scratch project
  and synthetic learning data. Source status remains draft; this is guided evidence, not course, runtime or operational
  approval. Record environment, commands, inputs, expected outcomes, observed outputs and exact blockers. Each rubric
  criterion earns its one point only when all named positive evidence is present; unavailable or unperformed observations
  earn zero.


  Complete Stage 12 first. Classify business, HTTP, component and browser behaviors and state what each boundary
  proves. Write report/date/category/CSV cases including empty and malformed data, cancellation and an actual negative-amount
  input if the rule excludes negatives. The chapter''s sample named IgnoresNegativeAmounts has only positive amounts:
  its name is not proof of a negative case. Record inputs, expected outputs and observed assertions, not coverage
  alone.


  Use an isolated test host and learning database. Exercise GET DTO shape, POST 201/Location, invalid 400, unknown
  404, anonymous 401, two-user ownership, conflict 409 and idempotent writes. Verify each case alone and in the
  suite, with deterministic seeding/reset. Record database provider/version and differences from the application
  provider. SQLite, InMemory and mocks do not automatically prove production query, collation or transaction behavior;
  run relevant provider-dependent cases against the actual chosen provider or leave that gate open.


  Test component loading/empty/error, focus/status, pending duplicate-submit prevention, 409 recovery and URL filters.
  In a browser, User A logs in, creates, filters, edits and deletes; User B cannot view or mutate A''s data. Add
  the important conflict/network case and record selectors, environment and isolated data. Unavailable browser observations
  remain incomplete.


  Build a CI sequence for install, lint, build, unit, integration and E2E with explicit timeouts and failure artifacts.
  Avoid blanket retries that hide a defect. Select an ownership or stale-response bug, capture a meaningful failing
  assertion before repair, implement the repair and show the same test and relevant suite passing afterward. Finish
  the 40-minute code-reading exercise and explain the interview questions; 100% coverage or asserting a mock was
  called is not sufficient behavioral evidence.'
expected_output: An evidence folder containing the implementation/diff, environment and commands, expected/observed
  case table, relevant test/browser/profiler or recovery records, and a blocker list. Redact secrets and private
  data. Optional extensions are not required for the four-point core rubric.
completion_mode: learner_attest
rubric:
- criterion: Unit behavior and real input boundaries
  evidence: Executed assertions cover report/category/date/CSV empty/malformed cases and explicit negative data
    where required.
  max_points: 1
- criterion: HTTP isolation and provider fidelity
  evidence: Recorded standalone/suite HTTP results, two-user ownership and conflict/idempotency, with provider-specific
    limits and real-provider evidence where necessary.
  max_points: 1
- criterion: Component and browser journey
  evidence: Executed component outcomes and isolated A/B browser journey, including loading/error/focus/pending/URL
    behavior.
  max_points: 1
- criterion: CI failure evidence and red/green repair
  evidence: Actual CI commands/results, preserved failing assertion and matching post-repair test/suite results;
    a hypothetical failure earns zero.
  max_points: 1
resources: []
