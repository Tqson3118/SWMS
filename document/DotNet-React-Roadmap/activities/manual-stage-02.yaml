stable_id: activity:dotnet:stage-02
type: manual
title: Stage 02 collection and search evidence
instructions: |
  This bounded activity covers the collection, search, and complexity tasks in
  DotNet-React-Roadmap/2.md. It follows Stage 01 in the learner sequence, but
  this package may be reviewed independently. It does not certify the complete
  Stage 02 gate or replace the independent checkpoint.

  Prerequisites: complete the Stage 01 console foundations, use the .NET 10
  LTS SDK on Windows, a Windows editor such as Visual Studio Code with the C#
  Dev Kit or Visual Studio, and a terminal with basic dotnet CLI familiarity.
  Work in a learner-owned scratch project and keep course source files
  unchanged.

  Before coding, state inputs, expected outputs, the normalization rule and
  one invalid-input rule in a small specification. Record one reproducible
  missing-key or invalid-input observation, whether expected or a repaired bug.

  Extend the expense example with one observable collection/search slice. Use
  Dictionary<string, decimal> to group totals by category with a stated
  normalization rule, and use HashSet<string> to detect duplicate categories or
  another clearly stated duplicate-input case. Implement or trace one linear
  search and one binary-search example only when its input is sorted. Include
  an empty input, a missing key/target, duplicate input, and a small target at
  the beginning or end. Record the actual inputs, outputs, and any error path.

  Write a short complexity note for the collection lookup, linear search, and
  binary search, including the precondition for binary search. If you inspect a
  failure, record the exact input and observed behavior. Do not invent output,
  timing, memory, or Big O results. If the SDK, editor, or terminal is
  unavailable, leave the activity incomplete and record the blocker; an
  environment blocker is not successful completion.

  Keep the full-stage checkpoint separate: independently add total-by-category,
  duplicate-category detection, largest/threshold search, an empty-list search
  test, and a written Big O explanation for each function. Those checks are not
  claimed by this activity unless independently evidenced with actual work.
expected_output: A learner evidence note with real collection/search inputs, outputs, edge cases, and complexity reasoning
completion_mode: learner_attest
rubric:
  - criterion: Collection evidence
    evidence: The note records actual Dictionary grouping and HashSet duplicate behavior, including the normalization rule, empty input, and duplicate case without fabricated output.
    max_points: 1
  - criterion: Search and boundary evidence
    evidence: The note records a real linear-search and sorted-input binary-search observation, including a missing target and an edge-position target; the binary-search precondition is explicit.
    max_points: 1
  - criterion: Complexity evidence
    evidence: The note explains the observed collection lookup, linear search, and binary-search complexity with scope and preconditions; unavailable tooling remains incomplete.
    max_points: 1
resources: []
