stable_id: activity:dotnet:stage-08
type: manual
title: Stage 08 C# async import, cancellation, resources, and execution evidence
instructions: |
  This single manual unit maps to DotNet-React-Roadmap/8.md. Complete Stage 07
  first and preserve the learner sequence Stage 07 -> Stage 08 -> Stage 09.
  Use the runnable references at
  DotNet-React-Roadmap/reference/stage-08-integration/api/README.md and
  DotNet-React-Roadmap/reference/stage-08-integration/frontend/README.md.
  Run API evidence first with a fresh strict loopback fixture and then run the
  frontend through the same-origin Vite proxy; missing LocalDB/browser/transport
  capability remains an incomplete observation. Authentication and ownership
  are later Stage 11 work, and the broader API test system is Stage 13 work.
  Work in a learner-owned scratch project with learning data only. This is a
  guided learner-attestation activity, not runtime approval or a deployment
  gate. If a tool, SDK, database, or browser is unavailable, record the exact
  blocker and leave the corresponding evidence incomplete; a blocker earns no
  point for that observation.

  Before the import slice, demonstrate value/reference behavior with two
  equal record keys and two Expense class objects, then explain record value
  equality versus entity identity. Implement a generic Map over IEnumerable
  and a delegate/lambda example, and record the result. Build one deferred
  LINQ pipeline and one explicit snapshot; record when each executes. For an
  IQueryable/EF version, record actual SQL/log or ToQueryString evidence when
  available and label unavailable translation evidence incomplete.

  Record a nullable/runtime validation boundary and an expected-input error
  result or 400 versus an invariant exception boundary. Read CSV as a stream
  with using/await using and dispose the reader. Keep the importer contract
  separate from EF entities: IExpenseImporter returns
  IAsyncEnumerable<ExpenseImportRow> and accepts CancellationToken. Do not
  share a DbContext across threads or use .Result/.Wait() in a web request.

  Implement the CSV vertical slice. Validate categoryId, amount, date, note,
  culture and duplicate rows; report rows read, valid, skipped and errors by
  line. Exercise empty, header-only, missing-column, malformed, negative or
  wrongly-cultured amount, invalid date, unknown category, duplicate and large
  files. Record cancellation before reading, during reading, after a batch is
  written, and after completion when those observations are actually made.
  State that this reference import is atomic for a valid file and only duplicate
  rows within the same file are skipped. A rejected validation response has
  acceptedRows=0 but may have readRows and skippedDuplicates greater than zero;
  an empty/header-only file is a committed zero-row no-op. Record the exact
  cancellation result/report and do not confuse this contract with a generic
  partial-batch importer.

  Propagate the token from endpoint to service, reader and database operation;
  check it at meaningful boundaries and distinguish cancellation from an
  ordinary failure. Add a real frontend Hủy import button or equivalent user
  action. Record the click/event path that aborts or cancels the request, the
  token reaching the API/service/reader/database boundaries, and the UI
  transition to server-confirmed cancelled. A browser abort, network failure,
  or unreadable response remains unconfirmed until deliberate reconciliation;
  GET cannot attribute rows to a particular POST. Exercise or record the no-hang behavior and the
  distinction between cancellation and a normal error; if a browser or UI
  path is unavailable, record that exact blocker and leave this observation
  incomplete with zero points. Add focused parser, cancellation, resource-disposal and
  report tests if the environment permits, recording command and actual
  outcome. Finish with a 35-minute timed code-reading/debug note covering
  async continuation, deferred execution, null/error boundary, disposal,
  shared state and cancellation. Include expected versus observed results and
  explicit blockers. Do not claim a compile, test, API, database or frontend
  result that was not run.
expected_output: A learner evidence note with equality/generic/delegate/map and deferred-versus-snapshot observations, runtime error boundaries, streaming/disposal and token propagation, frontend cancel action through API/service/reader/database to a server-confirmed cancelled UI state or an honestly unconfirmed browser outcome, CSV validation/atomic duplicate-only outcomes, focused test evidence, timed-debug reasoning, and explicit blockers.
completion_mode: learner_attest
rubric:
  - criterion: Type, delegate, generic, and execution evidence
    evidence: The note records actual value/reference/record equality, entity identity reasoning, generic Map and delegate/lambda output, and deferred versus snapshot execution including an EF translation boundary where available. Missing or blocked observations remain incomplete and earn no point.
    max_points: 1
  - criterion: Runtime, resource, and async safety
    evidence: The note identifies nullable/runtime validation and exception boundaries, stream disposal, async continuation, propagated CancellationToken, no shared DbContext or blocking wait, and actual frontend Hủy action/event-to-request cancellation through API/service/reader/database to a cancelled UI state with no-hang and normal-error distinction. Missing or blocked browser/UI evidence remains incomplete and earns no point.
    max_points: 1
  - criterion: CSV import and atomic duplicate-only behavior
    evidence: The note records actual parser contract, culture/category/date/duplicate validation, empty/header-only/missing-column/large-file cases, pre/mid/post-commit cancellation, and the atomic valid-file/rejected-count report. Missing or blocked evidence remains incomplete and earns no point.
    max_points: 1
  - criterion: Tests, debugging, and honest limits
    evidence: The note records parser/cancellation/resource/report tests and a timed code-reading/debug conclusion with commands and outcomes only when run; blockers are retained and do not earn points. Missing or blocked evidence remains incomplete and earns no point.
    max_points: 1
