learning_objectives:
- id: LO-W14-01
  bloom_level: Understand
  statement: Định nghĩa thói quen theo mô hình tự động hóa cue–kích hoạt của Wood
    và cộng sự; giải thích hai đặc điểm tự động hóa (kích hoạt bởi cue lặp lại; ít
    nhạy với thay đổi mục tiêu ngắn hạn); kết nối với điều kiện hóa tác động ở giáo
    trình.
- id: LO-W14-02
  bloom_level: Analyze
  statement: Trình bày bằng chứng về thời gian hình thành thói quen (Lally và cộng
    sự, 2010) và mức độ liên hệ thói quen–hành vi từ phân tích gộp SRHI (Gardner và
    cộng sự, 2011) với đúng phạm vi tương quan.
- id: LO-W14-03
  bloom_level: Apply
  statement: Viết và nhận diện kế hoạch triển khai (implementation intentions) dạng
    nếu–thì; áp dụng năm họ chiến lược tình huống trong mô hình quá trình của tự kiểm
    soát để thiết kế can thiệp cho tình huống giả định; dự đoán hành vi dựa trên quan
    hệ thói quen–tự kiểm soát của Galla & Duckworth.
- id: LO-W14-04
  bloom_level: Evaluate
  statement: Đánh giá tình trạng bằng chứng của mô hình ego depletion qua RRR đa phòng
    lab (d ≈ 0, CI chứa 0) và kết luận 'đang được xem xét lại'; phản biện huyền thoại
    '21 ngày'; nêu giới hạn mẫu/phương pháp của các nghiên cứu thói quen.
