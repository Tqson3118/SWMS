learning_objectives:
- id: LO-W37-01
  bloom_level: Understand
  statement: Phân biệt hạnh phúc khoái lạc (Hedonic) và hạnh phúc ý nghĩa (Eudaimonic), mô hình SWB của Ed Diener.
- id: LO-W37-02
  bloom_level: Analyze
  statement: Phân tích 5 trụ cột của mô hình PERMA (Seligman) và điều kiện xuất hiện trạng thái dòng chảy (Flow của Csikszentmihalyi).
- id: LO-W37-03
  bloom_level: Apply
  statement: Ứng dụng các can thiệp tâm lý tích cực dựa trên bằng chứng (broaden-and-build, gratitude, mindfulness) vào đời sống hàng ngày.
- id: LO-W37-04
  bloom_level: Evaluate
  statement: Đánh giá các giới hạn phương pháp luận của tâm lý học tích cực, phản biện sự lạc quan độc hại và bác bỏ tỷ lệ Losada.
