learning_objectives:
- id: LO-W06-01
  bloom_level: Understand
  statement: Định nghĩa Ý thức và mô tả phổ các trạng thái nhận thức; giải thích cơ
    chế điều hòa của Nhịp sinh học ngày đêm qua trục SCN ở vùng dưới đồi và hormone
    Melatonin của tuyến tùng.
- id: LO-W06-02
  bloom_level: Analyze
  statement: 'Phân tích tác hại của nợ giấc ngủ và thiếu ngủ mãn tính; lập bản đồ
    kiến trúc giấc ngủ: phân biệt các giai đoạn NREM (N1, N2 với thoi ngủ, N3 sóng
    chậm delta) và giấc ngủ REM (sóng não nhanh, liệt cơ vân atonia, củng cố trí nhớ).'
- id: LO-W06-03
  bloom_level: Apply
  statement: Phân loại các rối loạn giấc ngủ chính (mất ngủ, ngưng thở khi ngủ, ngủ
    rũ do thiếu orexin, parasomnias); phân tích cơ chế hóa synap của các nhóm chất
    tác động tâm thần (Depressants, Stimulants, Opioids, Hallucinogens).
- id: LO-W06-04
  bloom_level: Evaluate
  statement: 'Đánh giá cơ sở khoa học của các trạng thái ý thức biến đổi: giải thích
    cơ chế thôi miên (thuyết phân ly Hilgard vs thuyết vai xã hội) và thiền chánh
    niệm (làm dày vỏ não trước trán, giảm cortisol); xây dựng chiến lược vệ sinh giấc
    ngủ dựa trên bằng chứng.'
