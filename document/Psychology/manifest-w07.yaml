learning_objectives:
- id: LO-W07-01
  bloom_level: Understand
  statement: Định nghĩa Học tập theo tâm lý học khoa học và phân biệt với phản xạ
    bẩm sinh và bản năng; giải thích cơ chế Điều kiện hóa cổ điển của Pavlov thông
    qua các thành tố NS, UCS, UCR, CS, CR.
- id: LO-W07-02
  bloom_level: Analyze
  statement: 'Lập bản đồ các quy luật điều kiện hóa: Thụ đắc, Dập tắt, Hồi phục tự
    phát, Khái quát hóa kích thích, Phân biệt kích thích và điều kiện hóa cấp cao.'
- id: LO-W07-03
  bloom_level: Apply
  statement: Phân biệt bản chất Điều kiện hóa thao tác dựa trên Định luật Hiệu ứng
    Thorndike; vận dụng Ma trận 4 hệ quả thao tác (Củng cố tích cực/tiêu cực, Trừng
    phạt tích cực/tiêu cực); phân tích 4 Lịch trình củng cố (FR, VR, FI, VI) và kỹ
    thuật tạo hình hành vi.
- id: LO-W07-04
  bloom_level: Evaluate
  statement: 'Đánh giá giới hạn của thuyết hành vi cơ giới qua Học tập tiềm ẩn và
    Bản đồ nhận thức của Tolman; phân tích Thuyết học tập xã hội của Bandura: thí
    nghiệm búp bê Bobo, 4 tiến trình nhận thức và củng cố/trừng phạt gián tiếp.'
