learning_objectives:
- id: LO-W44-01
  bloom_level: Understand
  statement: Giải thích cơ chế tâm lý của sự trì hoãn như một sự thất bại trong điều hòa cảm xúc ngắn hạn thay vì quản lý thời gian kém.
- id: LO-W44-02
  bloom_level: Apply
  statement: Ứng dụng các kỹ thuật học tập có bằng chứng thực nghiệm cao nhất (Retrieval practice, Spaced repetition) và vận dụng Thuyết Động lực Thời gian để vượt qua trì hoãn.
- id: LO-W44-03
  bloom_level: Analyze
  statement: Phân tích chi phí chuyển đổi chú ý, cơ chế dư lượng chú ý và thiết lập ranh giới cho trạng thái làm việc sâu không bị gián đoạn.
- id: LO-W44-04
  bloom_level: Evaluate
  statement: Đánh giá 3 chiều kích cấu thành của hội chứng kiệt sức nghề nghiệp (Burnout theo Maslach) và nhận diện các yếu tố mất cân xứng giữa đòi hỏi công việc và nguồn lực phục hồi.
