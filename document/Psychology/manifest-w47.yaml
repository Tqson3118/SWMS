learning_objectives:
- id: LO-W47-01
  bloom_level: Understand
  statement: Phân tích cơ chế tâm lý và bằng chứng thực nghiệm của Đối chiếu Tinh thần (Mental Contrasting) và phản biện ảo tưởng của tư duy tích cực đơn thuần trong việc theo đuổi mục tiêu.
- id: LO-W47-02
  bloom_level: Apply
  statement: Thiết lập và vận dụng kế hoạch Ý định Thực thi dạng Nếu - Thì (Implementation Intentions - Gollwitzer) và quy trình 4 bước WOOP (Oettingen) để tự động hóa hành vi vượt qua rào cản nội tâm.
- id: LO-W47-03
  bloom_level: Analyze
  statement: Nhận diện và phân tích vòng lặp tự điều hòa hành vi (Carver & Scheier) cùng Hội chứng Hy vọng Hão huyền (False Hope Syndrome - Polivy & Herman) và hiệu ứng 'đằng nào cũng hỏng'.
- id: LO-W47-04
  bloom_level: Evaluate
  statement: Đánh giá vai trò của Tự trắc ẩn (Self-Compassion - Kristin Neff) trong việc giảm tự trách cứ, bảo tồn ý chí và duy trì sự kiên định bền bỉ khi đối mặt với vấp ngã mục tiêu.
