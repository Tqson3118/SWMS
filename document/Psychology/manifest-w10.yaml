learning_objectives:
- id: LO-W10-01
  bloom_level: Understand
  statement: Phân biệt Động lực nội tại và Động lực ngoại tại; giải thích cơ chế của
    Hiệu ứng Biện minh quá mức và các điều kiện tác động của phần thưởng ngoại tại.
- id: LO-W10-02
  bloom_level: Analyze
  statement: Phân tích Thuyết Tự quyết (SDT) dựa trên ba nhu cầu tâm lý cơ bản (Autonomy,
    Competence, Relatedness); so sánh với Thuyết Thúc đẩy của Hull và nguyên lý cân
    bằng nội môi.
- id: LO-W10-03
  bloom_level: Evaluate
  statement: Vận dụng Định luật Yerkes-Dodson để tối ưu hóa kích hoạt sinh lý theo
    độ khó nhiệm vụ; đánh giá có phê phán Tháp nhu cầu Maslow dựa trên nghiên cứu
    thực nghiệm đa văn hóa của Tay & Diener.
- id: LO-W10-04
  bloom_level: Apply
  statement: Áp dụng Thuyết Đặt mục tiêu của Locke & Latham; giải thích sự phân ly
    sinh học thần kinh giữa 'Ham muốn' (Wanting - Dopamine) và 'Thích thú' (Liking
    - Opioid) cùng các hormone điều hòa đói no (Leptin, Ghrelin).
