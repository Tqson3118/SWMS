learning_objectives:
- id: LO-W16-01
  bloom_level: Understand
  statement: Định nghĩa giới hạn tự báo cáo/nội quan theo Nisbett & Wilson (1977);
    trình bày mô hình SOKA của Vazire (2010) ở tầng dự đoán; mô tả choice blindness
    (Johansson và cộng sự, 2005) và chức năng Lie Scale (OpenStax 11.9).
- id: LO-W16-02
  bloom_level: Analyze
  statement: 'Giải thích giá trị của tam giác hóa dữ liệu: vì sao meta-analysis về
    báo cáo từ người quan sát (Connelly & Ones, 2010) và phương pháp đo lặp lại trong
    đời sống (Bolger & Laurenceau, 2013) bổ sung cho tự báo cáo chứ không thay thế
    nó; phân biệt các giới hạn cần nêu (mẫu WEIRD, tương quan).'
- id: LO-W16-03
  bloom_level: Apply
  statement: Vận dụng quy trình 5 bước xây hồ sơ tự hiểu (quan sát cụ thể → đa nguồn
    → ≥ 3 giả thuyết → mức tự tin → ranh giới không chẩn đoán) vào kịch bản giả định;
    nhận diện ranh giới dữ liệu tự hiểu vs chẩn đoán chuyên môn theo NIMH.
- id: LO-W16-04
  bloom_level: Evaluate
  statement: Đánh giá tuyên bố pop psychology về quiz online 'biết hết con người trong
    5 phút'; chỉ ra giới hạn mẫu WEIRD, giới hạn tương quan, và giới hạn phạm vi của
    các nghiên cứu cấu trúc SOKA; trình bày đúng tình trạng 'còn đang phát triển'
    của mô hình SOKA.
