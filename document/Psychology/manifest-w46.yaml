learning_objectives:
- id: LO-W46-01
  bloom_level: Understand
  statement: Phân tích tác động dịch tễ học và cơ chế sinh lý thần kinh của sự cô đơn mãn tính (Cacioppo, Holt-Lunstad) lên nguy cơ tử vong sớm và phản ứng miễn dịch.
- id: LO-W46-02
  bloom_level: Apply
  statement: Phân biệt giữa Hỗ trợ xã hội cấu trúc và Hỗ trợ xã hội chức năng (Sheldon Cohen), đồng thời vận dụng 5 nhóm hành vi bảo trì quan hệ của Stafford & Canary vào đời sống thực tế.
- id: LO-W46-03
  bloom_level: Analyze
  statement: Vận dụng Mô hình Đầu tư Quan hệ của Caryl Rusbult (Commitment = Satisfaction + Investments - Alternatives) để giải thích sự gắn kết và tính ổn định của các mối quan hệ lâu dài.
- id: LO-W46-04
  bloom_level: Evaluate
  statement: Đánh giá cấu trúc các tầng mạng lưới xã hội theo Số Dunbar (5 - 15 - 50 - 150) và phản biện ảo tưởng về số lượng kết nối kỹ thuật số trong thời đại mạng xã hội.
