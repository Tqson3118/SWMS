learning_objectives:
- id: LO-W43-01
  bloom_level: Understand
  statement: Trình bày nguyên lý Thuyết Triển Vọng (Prospect Theory) của Kahneman & Tversky, giải thích vai trò của điểm tham chiếu và hàm giá trị hình chữ S trong việc định hình phán đoán dưới rủi ro.
- id: LO-W43-02
  bloom_level: Apply
  statement: Nhận diện và ứng phó với tâm lý e ngại mất mát (Loss Aversion), hiệu ứng đóng khung (Framing Effect) và các lối tắt nhận thức kinh điển (Anchoring, Availability, Representativeness) trong các quyết định đời sống.
- id: LO-W43-03
  bloom_level: Analyze
  statement: Phân tích Nghịch lý của sự lựa chọn (Paradox of Choice), so sánh chiến lược Thỏa mãn vừa đủ (Satisficing) với Tối đa hóa (Maximizing), chỉ rõ tác động đến sự an tâm và hối tiếc cá nhân.
- id: LO-W43-04
  bloom_level: Evaluate
  statement: Đánh giá các ứng dụng kiến trúc lựa chọn (Choice Architecture) và nghệ thuật Huých nhẹ (Nudge của Thaler & Sunstein), ranh giới đạo đức can thiệp hành vi và giới hạn của khoa học ra quyết định.
