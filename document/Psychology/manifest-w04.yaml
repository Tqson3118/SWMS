learning_objectives:
- id: LO-W04-01
  bloom_level: Understand
  statement: 'Mô tả giải phẫu và cơ chế điện hóa của nơ-ron: 4 bộ phận cấu trúc chính,
    điện thế nghỉ, điện thế động theo quy luật tất cả hoặc không, và cơ chế dẫn truyền
    qua khe synap.'
- id: LO-W04-02
  bloom_level: Analyze
  statement: Phân tích chức năng tâm lý của các chất dẫn truyền thần kinh chính (Acetylcholine,
    Dopamine, Serotonin, GABA, Glutamate); giải thích cơ chế tác động của thuốc hướng
    thần (Agonist, Antagonist, SSRI).
- id: LO-W04-03
  bloom_level: Analyze
  statement: 'Lập bản đồ giải phẫu chức năng của hệ thần kinh: phân nhánh CNS vs PNS
    (somatic vs autonomic: giao cảm vs đối giao cảm); bốn thùy vỏ não và các cấu trúc
    dưới vỏ / hệ viền.'
- id: LO-W04-04
  bloom_level: Evaluate
  statement: 'Đánh giá bản chất tương tác Gene - Môi trường: giải thích cơ chế tính
    mềm dẻo nơ-ron và neurogenesis; phản biện thuyết tiền định di truyền thô thiển
    thông qua mô hình Phạm vi phản ứng và Di truyền biểu sinh.'
