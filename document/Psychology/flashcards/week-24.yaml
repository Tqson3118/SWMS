version: 1.0.0
description: Bộ thẻ ghi nhớ Tuần 24 về Phương pháp Phân tích Giả thuyết Cạnh tranh (ACH), Khiêm tốn nhận thức và Tổng kết Chặng 3.
cards:
- id: fc-psy-w24-001
  concept: Phương pháp ACH (Heuer, 1999)
  front: Bản chất của Phương pháp Phân tích Giả thuyết Cạnh tranh (ACH) là gì?
  back: Là công cụ tư duy lập ma trận đối chiếu nhiều giả thuyết đối lập với bằng chứng thực tế, tập trung vào việc tìm kiếm bằng chứng bác bỏ (Falsification) để vượt qua thiên kiến xác nhận.
  source_lesson: Psychology/notes/03-understanding-others/week-24-competing-hypotheses.md#32-phương-pháp-phân-tích-giả-thuyết-cạnh-tranh-ach-framework
  version: 1.0.0
  tags:
  - w24
  - ach-method
- id: fc-psy-w24-002
  concept: Bác bỏ trong ACH (Falsification)
  front: Tại sao một giả thuyết đáng tin cậy trong ACH được định nghĩa bằng số lượng dấu trừ (-) thay vì dấu cộng (+)?
  back: Vì việc tìm dấu cộng rất dễ bị thiên kiến xác nhận làm sai lệch; chỉ có việc giả thuyết đứng vững và ít bị bác bỏ nhất bởi các bằng chứng khách quan mới chứng minh độ tin cậy thực sự.
  source_lesson: Psychology/notes/03-understanding-others/week-24-competing-hypotheses.md#32-phương-pháp-phân-tích-giả-thuyết-cạnh-tranh-ach-framework
  version: 1.0.0
  tags:
  - w24
  - falsification
- id: fc-psy-w24-003
  concept: Mô hình Sinh thái Đa tầng (Bronfenbrenner)
  front: Mô hình sinh thái đa tầng phân tích hành vi con người qua 4 cấp độ nào?
  back: 1) Cá nhân (Lược đồ, sinh học); 2) Vi mô (Microsystem - gia đình, đồng nghiệp); 3) Ngoại vi (Exosystem - tổ chức, cơ quan); 4) Vĩ mô (Macrosystem - văn hóa, thể chế).
  source_lesson: Psychology/notes/03-understanding-others/week-24-competing-hypotheses.md#33-mô-hình-sinh-thái-đa-tầng-multi-level-social-modeling
  version: 1.0.0
  tags:
  - w24
  - ecological-model
- id: fc-psy-w24-004
  concept: Nguyên lý Tiết kiệm Nhận thức (Parsimony)
  front: Nguyên lý tiết kiệm nhận thức khuyên ta điều gì khi giải thích một hành vi tiêu cực của người khác?
  back: Luôn ưu tiên xem xét các yếu tố áp lực hoàn cảnh, tải trọng công việc và rào cản thông tin trước khi vội vã quy kết cho khiếm khuyết tính cách hay bản chất xấu xa.
  source_lesson: Psychology/notes/03-understanding-others/week-24-competing-hypotheses.md#33-mô-hình-sinh-thái-đa-tầng-multi-level-social-modeling
  version: 1.0.0
  tags:
  - w24
  - parsimony-principle
- id: fc-psy-w24-005
  concept: Khiêm tốn Nhận thức (Epistemic Humility)
  front: Định nghĩa và biểu hiện của Khiêm tốn Nhận thức (Leary et al., 2017) là gì?
  back: Là sự tự ý thức về giới hạn tri thức cá nhân, hiểu rằng quan sát bên ngoài luôn có độ bất định cao, và từ chối dán nhãn tâm lý vội vã lên người khác.
  source_lesson: Psychology/notes/03-understanding-others/week-24-competing-hypotheses.md#42-khiêm-tốn-nhận-thức-epistemic-humility--ranh-giới-đạo-đức
  version: 1.0.0
  tags:
  - w24
  - epistemic-humility
- id: fc-psy-w24-006
  concept: Chống Dán Nhãn Tâm Lý Nghiệp Dư
  front: Vì sao việc tự ý dán nhãn người khác bằng các từ như "toxic", "narcissist" là nguy hại?
  back: Vì nó tước đoạt tính người và bối cảnh cụ thể của đối phương, tạo ra lời tiên tri tự ứng nghiệm và đóng kín mọi cơ hội đối thoại thấu cảm thực sự.
  source_lesson: Psychology/notes/03-understanding-others/week-24-competing-hypotheses.md#42-khiêm-tốn-nhận-thức-epistemic-humility--ranh-giới-đạo-đức
  version: 1.0.0
  tags:
  - w24
  - labeling-harm
- id: fc-psy-w24-007
  concept: Khung SORC trong Can thiệp Hành vi
  front: Bốn mắt xích trong mô hình phân tích hành vi SORC là gì?
  back: S (Stimulus - Kích thích hoàn cảnh), O (Organism - Trạng thái sinh học cá nhân), R (Response - Hành vi phản ứng), C (Consequence - Hệ quả củng cố).
  source_lesson: Psychology/notes/03-understanding-others/week-24-competing-hypotheses.md#43-khung-can-thiệp-hành-vi-4-bước-s-o-r-c-model
  version: 1.0.0
  tags:
  - w24
  - sorc-model
- id: fc-psy-w24-008
  concept: Đỉnh cao của Thấu hiểu Người khác
  front: Mục đích cao nhất của việc học tâm lý học xã hội trong Chặng 3 là gì?
  back: Không phải để thao túng hay phán xét đồng loại, mà là phát triển lòng trắc ẩn, tính khiêm tốn nhận thức và khả năng đồng hành hiệu quả cùng người khác trong sự phức tạp của đời sống.
  source_lesson: Psychology/notes/03-understanding-others/week-24-competing-hypotheses.md#35-điểm-cốt-lõi-cần-nhớ-key-takeaways-
  version: 1.0.0
  tags:
  - w24
  - stage3-synthesis
