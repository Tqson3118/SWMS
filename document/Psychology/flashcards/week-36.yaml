description: "Bộ thẻ ôn tập Tuần 36: Stress, Coping, Thể chất & Khả năng phục hồi (Resilience)"

cards:
  - id: "fc-psy-w36-001"
    concept: "Hội chứng thích ứng chung (GAS của Selye)"
    front: "Ba giai đoạn của Hội chứng Thích ứng Chung (GAS) theo Hans Selye (1956) là gì?"
    back: "1. Báo động (Alarm): huy động phản ứng chiến-hay-biến cấp thời; 2. Kháng cự (Resistance): tiết cortisol duy trì nỗ lực chống chịu; 3. Kiệt quệ (Exhaustion): cạn kiệt nguồn lực sinh lý dẫn đến suy sụp cơ thể và bệnh tật."
    source_lesson: "Psychology/notes/05-development-mental-health/week-36-stress-coping-resilience.md"
    version: "1.0.0"
    claim_ids:
      - "C36-01"
    tags:
      - "stress"
      - "gas"
      - "selye"
      - "physiology"

  - id: "fc-psy-w36-002"
    concept: "Trục HPA và Hormone Cortisol"
    front: "Trục HPA bài tiết hormone gì và chuỗi vận hành sinh học thần kinh của nó diễn ra như thế nào?"
    back: "Vùng hạ đồi tiết CRH -> kích thích Thùy trước Tuyến yên tiết ACTH vào máu -> kích thích Vỏ thượng thận bài tiết Cortisol. Cortisol tăng đường huyết và ức chế các chức năng không cấp bách, tự điều hòa qua phản hồi âm tính lên hạ đồi và hải mã."
    source_lesson: "Psychology/notes/05-development-mental-health/week-36-stress-coping-resilience.md"
    version: "1.0.0"
    claim_ids:
      - "C36-02"
    tags:
      - "hpa-axis"
      - "cortisol"
      - "neuroendocrinology"

  - id: "fc-psy-w36-003"
    concept: "Tác động của Cortisol mãn tính lên Não bộ"
    front: "Tại sao nồng độ cortisol cao kéo dài do stress mãn tính lại gây tổn thương vùng hải mã (hippocampus)?"
    back: "Cortisol cao kéo dài gây ức chế thu nạp glucose, tích tụ glutamate độc hại, teo nhánh sợi nhánh nơ-ron và tiêu hủy tế bào tại hải mã, làm suy giảm trí nhớ và phá vỡ cơ chế phản hồi âm tính (mất phanh ức chế HPA)."
    source_lesson: "Psychology/notes/05-development-mental-health/week-36-stress-coping-resilience.md"
    version: "1.0.0"
    claim_ids:
      - "C36-02"
    tags:
      - "hippocampus"
      - "neurotoxicity"
      - "sapolsky"
      - "memory"

  - id: "fc-psy-w36-004"
    concept: "Allostatic Load (Tải trọng dị ứng tích tụ)"
    front: "Khái niệm 'Allostatic Load' của Bruce McEwen (1998) giải thích hiện tượng gì?"
    back: "Là cái giá hao mòn sinh học tích lũy mà cơ thể phải gánh chịu do sự hoạt động quá mức hoặc mất điều hòa liên tục của các hệ thống đáp ứng stress, làm tăng nguy cơ bệnh tim mạch, béo phì, xơ vữa và tử vong sớm."
    source_lesson: "Psychology/notes/05-development-mental-health/week-36-stress-coping-resilience.md"
    version: "1.0.0"
    claim_ids:
      - "C36-03"
    tags:
      - "allostasis"
      - "allostatic-load"
      - "mcewen"
      - "cardiovascular"

  - id: "fc-psy-w36-005"
    concept: "Mô hình Đánh giá Nhận thức (Lazarus & Folkman)"
    front: "Phân biệt Đánh giá sơ cấp và Đánh giá thứ cấp trong mô hình của Lazarus & Folkman (1984)?"
    back: "Đánh giá sơ cấp (Primary appraisal): Đánh giá sự kiện có đe dọa, tổn hại hay thách thức không. Đánh giá thứ cấp (Secondary appraisal): Đánh giá nguồn lực cá nhân và công cụ sẵn có để kiểm soát tình huống."
    source_lesson: "Psychology/notes/05-development-mental-health/week-36-stress-coping-resilience.md"
    version: "1.0.0"
    claim_ids:
      - "C36-04"
    tags:
      - "cognitive-appraisal"
      - "lazarus"
      - "coping"

  - id: "fc-psy-w36-006"
    concept: "Problem-Focused vs Emotion-Focused Coping"
    front: "Khi nào nên dùng Problem-Focused Coping và khi nào nên dùng Emotion-Focused Coping?"
    back: "Problem-Focused (can thiệp trực tiếp thay đổi vấn đề bên ngoài) tối ưu khi tình huống có thể kiểm soát. Emotion-Focused (điều hòa cảm xúc, chấp nhận, tái định khung) tối ưu khi tình huống bất khả kháng không thể thay đổi."
    source_lesson: "Psychology/notes/05-development-mental-health/week-36-stress-coping-resilience.md"
    version: "1.0.0"
    claim_ids:
      - "C36-04"
    tags:
      - "coping-strategies"
      - "problem-focused"
      - "emotion-focused"

  - id: "fc-psy-w36-007"
    concept: "Resilience là Ordinary Magic (Ann Masten)"
    front: "Luận điểm 'Ordinary Magic' của Ann Masten (2001) về khả năng phục hồi tâm lý là gì?"
    back: "Khả năng phục hồi (Resilience) là hiện tượng phổ biến bắt nguồn từ hoạt động của các hệ thống thích ứng bình thường của con người (não bộ học tập, gắn bó an toàn, hỗ trợ xã hội), không phải phẩm chất phi thường hay biệt lệ hiếm có."
    source_lesson: "Psychology/notes/05-development-mental-health/week-36-stress-coping-resilience.md"
    version: "1.0.0"
    claim_ids:
      - "C36-05"
    tags:
      - "resilience"
      - "ordinary-magic"
      - "masten"

  - id: "fc-psy-w36-008"
    concept: "Giới hạn của Tăng trưởng sau sang chấn (PTG)"
    front: "Nghiên cứu của Patricia Frazier et al. (2009) chỉ ra giới hạn gì của các bảng hỏi tự báo cáo về PTG?"
    back: "Điểm tự báo cáo PTG có tương quan gần như bằng 0 với sự thay đổi chức năng thực tế đo được qua thời gian; tự báo cáo PTG thường phản ánh cơ chế nhận thức xoa dịu nỗi đau hơn là sự phát triển tích cực khách quan."
    source_lesson: "Psychology/notes/05-development-mental-health/week-36-stress-coping-resilience.md"
    version: "1.0.0"
    claim_ids:
