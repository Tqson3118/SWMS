deck_id: "deck-psy-w45"
subject: "Psychology"
lesson_id: "week-45-difficult-conversation"
version: "1.0.0"
description: "Bộ thẻ ôn tập Tuần 45: Thực hành cuộc giao tiếp khó & quản trị bất đồng"

cards:
  - id: "fc-psy-w45-001"
    concept: "Ba tầng của cuộc trò chuyện khó (Harvard Negotiation Project)"
    front: "Ba tầng đối thoại ngầm định trong mọi cuộc trò chuyện khó khăn (Stone, Patton, & Heen, 1999) là gì?"
    back: "1. Tầng 'Chuyện gì đã xảy ra?' (tranh cãi dữ kiện, ý định và đổ lỗi); 2. Tầng Cảm xúc (các cảm giác không được thừa nhận); 3. Tầng Bản sắc cá nhân ('Điều này nói gì về giá trị và năng lực của tôi?')."
    source_lesson: "Psychology/notes/06-integration/week-45-difficult-conversation.md"
    version: "1.0.0"
    claim_ids:
      - "C45-01"
    tags:
      - "difficult-conversations"
      - "harvard-negotiation"
      - "identity"

  - id: "fc-psy-w45-002"
    concept: "Phản ứng tự vệ ở tầng bản sắc (Identity Defense)"
    front: "Tại sao sự phòng vệ (Defensiveness) bùng phát dữ dội nhất khi cuộc đối thoại chạm vào tầng bản sắc?"
    back: "Vì các câu hỏi bản sắc đe dọa trực tiếp lòng tự trọng và tính toàn vẹn bản ngã (tôi có tốt không, có năng lực không), kích hoạt hạch hạnh nhân xem đó là mối đe dọa sinh tồn thực sự."
    source_lesson: "Psychology/notes/06-integration/week-45-difficult-conversation.md"
    version: "1.0.0"
    claim_ids:
      - "C45-01"
    tags:
      - "defensiveness"
      - "identity-conversation"
      - "amygdala"

  - id: "fc-psy-w45-003"
    concept: "Khung Giao tiếp Trắc ẩn 4 bước (OFNR Framework)"
    front: "Bốn bước trong khung Giao tiếp Trắc ẩn (NVC của Marshall Rosenberg) là gì?"
    back: "1. Observation (Quan sát khách quan không phán xét); 2. Feeling (Gọi tên cảm xúc thật); 3. Need (Xác định nhu cầu nhân sinh cốt lõi); 4. Request (Đưa ra đề nghị hành động cụ thể, khả thi và có thể thương lượng)."
    source_lesson: "Psychology/notes/06-integration/week-45-difficult-conversation.md"
    version: "1.0.0"
    claim_ids:
      - "C45-02"
    tags:
      - "nvc"
      - "ofnr"
      - "compassionate-communication"

  - id: "fc-psy-w45-004"
    concept: "Quan sát tách rời Phán xét trong OFNR"
    front: "Tiêu chuẩn vàng của bước Quan sát (Observation) trong khung OFNR là gì?"
    back: "Mô tả dữ kiện hành vi cụ thể như camera ghi hình lại được, tuyệt đối không dùng từ ngữ phán xét đạo đức, suy đoán ác ý hoặc các từ tuyệt đối hóa ('luôn luôn', 'không bao giờ')."
    source_lesson: "Psychology/notes/06-integration/week-45-difficult-conversation.md"
    version: "1.0.0"
    claim_ids:
      - "C45-02"
    tags:
      - "observation"
      - "nonjudgment"
      - "communication"

  - id: "fc-psy-w45-005"
    concept: "Tràn ngập Cảm xúc & Ngưỡng sinh lý (Emotional Flooding - Gottman)"
    front: "Hiện tượng Tràn ngập Cảm xúc (Flooding) xảy ra khi nào và tác động ra sao đến não bộ?"
    back: "Xảy ra khi nhịp tim vượt ngưỡng 100 nhịp/phút do kích hoạt hệ thần kinh giao cảm; lưu lượng máu lên vỏ não trước trán suy giảm, làm tê liệt năng lực lắng nghe logic và thấu cảm."
    source_lesson: "Psychology/notes/06-integration/week-45-difficult-conversation.md"
    version: "1.0.0"
    claim_ids:
      - "C45-03"
    tags:
      - "flooding"
      - "gottman"
      - "physiology-of-conflict"

  - id: "fc-psy-w45-006"
    concept: "Quy trình Hạ nhiệt Sinh lý (Physiological Time-out)"
    front: "Quy trình tạm dừng sinh lý (Time-out) theo John Gottman đòi hỏi điều kiện bắt buộc nào?"
    back: "Tạm dừng đối thoại tối thiểu 20–30 phút để cơ thể chuyển hóa hết hormone căng thẳng (adrenaline, cortisol); thực hành thở sâu thư giãn và không nhại lại các suy nghĩ phản công."
    source_lesson: "Psychology/notes/06-integration/week-45-difficult-conversation.md"
    version: "1.0.0"
    claim_ids:
      - "C45-03"
    tags:
      - "time-out"
      - "de-escalation"
      - "conflict-management"

  - id: "fc-psy-w45-007"
    concept: "Quyết đoán vs Hung hăng (Assertiveness vs Aggressiveness)"
    front: "Sự khác biệt cốt lõi giữa phong cách Quyết đoán (Assertive) và Hung hăng (Aggressive) là gì?"
    back: "Quyết đoán tôn trọng quyền của bản thân VÀ tôn trọng quyền của đối phương, bảo vệ ranh giới bình tĩnh; Hung hăng xâm phạm và giẫm đạp quyền của người khác để áp đặt ý muốn."
    source_lesson: "Psychology/notes/06-integration/week-45-difficult-conversation.md"
    version: "1.0.0"
    claim_ids:
      - "C45-04"
    tags:
      - "assertiveness"
      - "aggressiveness"
      - "boundaries"

  - id: "fc-psy-w45-008"
    concept: "Perspective-Taking vs Empathy (Adam Galinsky et al.)"
    front: "Tại sao Đặt mình vào góc nhìn (Perspective-taking) mang lại hiệu quả đàm phán cao hơn Đồng cảm (Empathy)?"
    back: "Perspective-taking là quá trình nhận thức giúp hiểu động cơ và bối cảnh của đối phương để tạo giải pháp win-win mà không bị kiệt sức cảm xúc hoặc nhượng bộ phi lý vì thương hại."
    source_lesson: "Psychology/notes/06-integration/week-45-difficult-conversation.md"
    version: "1.0.0"
    claim_ids:
      - "C45-05"
    tags:
      - "perspective-taking"
      - "empathy"
      - "negotiation"
