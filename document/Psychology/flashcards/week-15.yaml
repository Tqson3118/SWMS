description: "Bộ thẻ Flashcard chuẩn hóa ôn tập ngắt quãng (Spaced Repetition - R5 Compliant) Tuần 15: Thiên Kiến, Cơ Chế Tự Bảo Vệ và Điểm Mù của Bản Thân"

cards:
  - id: "fc-psy-w15-001"
    concept: "Điểm mù thiên kiến (Pronin et al., 2002; Scopelliti et al., 2015)"
    front: "Bias blind spot là gì, bền ra sao trước giải thích, và có quan hệ gì với năng lực nhận thức?"
    back: "Xu hướng thấy thiên kiến ở người khác nhiều hơn ở chính mình. Follow-up của Pronin và cộng sự (2002): người có thiên kiến 'tốt hơn trung bình' vẫn khẳng định phán xét khách quan ngay sau khi đọc mô tả bias — biết ≠ miễn nhiễm. Scopelliti và cộng sự (2015): mức điểm mù tách biệt với thước đo trí thông minh và năng lực ra quyết định — không có 'chứng chỉ miễn nhiễm'."
    source_lesson: "Psychology/notes/02-understanding-self/week-15-bias-blind-spots.md"
    version: "1.0.0"
    claim_ids:
      - "C15-01"
    tags:
      - "bias-blind-spot"
      - "pronin"
      - "scopelliti"
      - "metacognition"

  - id: "fc-psy-w15-002"
    concept: "Hiệu ứng Dunning–Kruger: mô tả vs. cơ chế (Kruger & Dunning, 1999; Gignac & Zajenkowski, 2020)"
    front: "Hiệu ứng Dunning–Kruger nói gì ở tầng mô tả, và vì sao cơ chế của nó bị gắn nhãn [Tranh luận]?"
    back: "Mô tả [Khá]: người yếu năng lực trong một nhiệm vụ đánh giá quá cao mức tương đối của mình (quartile dưới tự chấm percentile 62 khi thực tế 12). Cơ chế [Tranh luận]: giải thích siêu nhận thức của tác giả gốc vs. giả thuyết artifact thống kê (Gignac & Zajenkowski, 2020 — không thấy heteroscedasticity, quan hệ gần như tuyến tính). Không dùng làm nhãn con người."
    source_lesson: "Psychology/notes/02-understanding-self/week-15-bias-blind-spots.md"
    version: "1.0.0"
    claim_ids:
      - "C15-02"
    tags:
      - "dunning-kruger"
      - "statistical-artifact"
      - "contested"
      - "self-assessment"

  - id: "fc-psy-w15-003"
    concept: "Thiên kiến xác nhận (Nickerson, 1998)"
    front: "Confirmation bias được định nghĩa thế nào và vận hành ở những khâu nào của chuỗi thông tin?"
    back: "Nickerson (1998): 'the seeking or interpreting of evidence in ways that are partial to existing beliefs, expectations, or a hypothesis in hand' — tìm kiếm và diễn giải bằng chứng theo chiều hỗ trợ niềm tin sẵn có. Vận hành ở khâu tìm kiếm, diễn giải và ghi nhớ. Là một họ hiện tượng ('many guises'), không phải một cơ chế đơn — hỏi 'nghiêng ở khâu nào' thay vì dán nhãn chung."
    source_lesson: "Psychology/notes/02-understanding-self/week-15-bias-blind-spots.md"
    version: "1.0.0"
    claim_ids:
      - "C15-03"
    tags:
      - "confirmation-bias"
      - "nickerson"
      - "information-processing"

  - id: "fc-psy-w15-004"
    concept: "Thiên kiến quy kết phục vụ bản thân và biến thiên văn hóa (Mezulis et al., 2004)"
    front: "Self-serving attributional bias phổ biến ra sao, và con số nào cảnh báo đừng áp một chuẩn văn hóa cho mọi người?"
    back: "Phân tích gộp 266 nghiên cứu (503 effect sizes): d trung bình = 0.96 (lớn), hiện diện gần như mọi mẫu. Nhưng moderator văn hóa mạnh: mẫu châu Á d = 0.30 vs. Hoa Kỳ d = 1.05, phương Tây d = 0.70. Đọc đúng: tương quan quy kết được báo cáo, biến thiên theo văn hóa — không suy từ trung bình nhóm xuống cá nhân, không phán xét theo chuẩn một văn hóa."
    source_lesson: "Psychology/notes/02-understanding-self/week-15-bias-blind-spots.md"
    version: "1.0.0"
    claim_ids:
      - "C15-04"
    tags:
      - "self-serving-bias"
      - "attribution"
      - "meta-analysis"
      - "cultural-variation"

  - id: "fc-psy-w15-005"
    concept: "Bất hòa nhận thức: thí nghiệm 1 đô la / 20 đô la (Festinger & Carlsmith, 1959)"
    front: "Trong thí nghiệm kinh điển, vì sao nhóm nhận 1 đô la lại đánh giá nhiệm vụ nhàm chán 'vui hơn', còn nhóm 20 đô la thì không?"
    back: "Kết quả: One Dollar +1.35 vs. Control −0.45 (p = .02); Twenty Dollar −0.05 (không khác đối chứng). Logic: 20 đô la đủ biện minh ngoài cho hành vi nói dối; 1 đô la không đủ → mâu thuẫn 'tôi thật thà — tôi vừa nói dối' tạo bất hòa nhận thức, được giảm bằng chỉnh thái độ ('nhiệm vụ cũng vui'). Mẫu nam sinh viên Mỹ 1959; cơ chế hiện đại còn [Tranh luận]."
    source_lesson: "Psychology/notes/02-understanding-self/week-15-bias-blind-spots.md"
    version: "1.0.0"
    claim_ids:
      - "C15-05"
    tags:
      - "cognitive-dissonance"
      - "festinger-carlsmith"
      - "attitude-change"

  - id: "fc-psy-w15-006"
    concept: "Tự khẳng định giá trị (Cohen & Sherman, 2014)"
    front: "Self-affirmation là gì, can thiệp cụ thể như thế nào, và vì sao nó làm giảm phòng thủ?"
    back: "Can thiệp viết/nhắc về giá trị cốt lõi của bản thân trước khi gặp đe dọa ('Self-affirmation interventions typically have people write about core personal values'). Khi self-integrity được 'nạp' từ nguồn khác, một đe dọa cụ thể (bị chê, thất bại) ít cần cơ chế phòng thủ bóp méo thông tin. Tổng quan báo cáo lợi ích trên giáo dục, sức khỏe, quan hệ, có khi bền hàng tháng/năm. Không phải 'tự khen'."
    source_lesson: "Psychology/notes/02-understanding-self/week-15-bias-blind-spots.md"
    version: "1.0.0"
    claim_ids:
      - "C15-06"
    tags:
      - "self-affirmation"
      - "self-integrity"
      - "cohen-sherman"
      - "intervention"

  - id: "fc-psy-w15-007"
    concept: "Tự gây bất lợi (Berglas & Jones, 1978)"
    front: "Self-handicapping là gì, nghiên cứu gốc minh họa bằng gì, và cần lưu ý phạm vi nào?"
    back: "Chủ động tạo 'lý do dự phòng' cho thất bại sắp tới. Nghiên cứu gốc: sau thành công không chắc chắn do năng lực, nam sinh viên thiên về chọn thuốc được mô tả là gây hại hiệu suất — để thất bại đổ cho thuốc thay vì năng lực. Lưu ý bắt buộc: thuốc giả định; hiệu ứng gốc ở nam, 'did not hold for female subjects'; dạng đời thường (trì hoãn trước thi) là diễn giải thực hành, không phải chẩn đoán."
    source_lesson: "Psychology/notes/02-understanding-self/week-15-bias-blind-spots.md"
    version: "1.0.0"
    claim_ids:
      - "C15-07"
    tags:
      - "self-handicapping"
      - "self-protection"
      - "berglas-jones"

  - id: "fc-psy-w15-008"
    concept: "Debiasing bằng huấn luyện có cấu trúc (Morewedge et al., 2015)"
    front: "Bằng chứng giảm thiên kiến nói gì, yếu tố nào khiến huấn luyện hiệu quả, và giới hạn bắt buộc là gì?"
    back: "Một buổi huấn luyện (game hoặc video) giảm 6 thiên kiến ngay lập tức (game ≥ 31.94%, video ≥ 18.60%), bền ít nhất 2 tháng, lan sang dạng bài chưa dạy. Game > video vì phản hồi cá nhân hóa + luyện tập — 'biết thêm' không đủ, luyện tập có phản hồi mới thay đổi phán xét. Giới hạn: lab + follow-up web, chưa phải thực địa đại trà."
    source_lesson: "Psychology/notes/02-understanding-self/week-15-bias-blind-spots.md"
    version: "1.0.0"
    claim_ids:
      - "C15-08"
    tags:
      - "debiasing"
      - "morewedge"
      - "training"
      - "evidence-limits"

  - id: "fc-psy-w15-009"
    concept: "Backbone giáo trình: heuristics/biases và self-serving bias (OpenStax 7.3, 12.1)"
    front: "OpenStax Psychology 2e trình bày gì ở 7.3 và 12.1 liên quan tuần này?"
    back: "7.3 'Problem Solving': heuristic là phím tắt tư duy; mục 'Pitfalls to Problem Solving' gồm anchoring, confirmation, hindsight, representative, availability. 12.1: self-serving bias = quy thành công cho đặc điểm bên trong, thất bại cho hoàn cảnh bên ngoài; 'This bias serves to protect self-esteem' — cùng điểm văn hóa và FAE (W18 sẽ đi sâu FAE)."
    source_lesson: "Psychology/notes/02-understanding-self/week-15-bias-blind-spots.md"
    version: "1.0.0"
    claim_ids:
      - "C15-09"
    tags:
      - "openstax"
      - "heuristics"
      - "self-serving-bias"

  - id: "fc-psy-w15-010"
    concept: "Phản biện pop psychology: 'bias là bệnh của người đần' (Cấp 5)"
    front: "Vì sao thông điệp 'thiên kiến là lỗi của người kém thông minh' sai, và cách dùng tên bias đúng là gì?"
    back: "Bằng chứng: điểm mù thiên kiến tách biệt với trí thông minh và năng lực ra quyết định (Scopelliti và cộng sự, 2015); các cơ chế tự bảo vệ xuất hiện ở người bình thường trong mọi thực nghiệm kinh điển; chính Dunning nói DK 'is about everybody'. Cách dùng đúng: khái niệm mô tả quy trình nhận thức, không phải nhãn con người — dùng 'bias' để bắt lỗi người khác chính là biểu hiện điểm mù."
    source_lesson: "Psychology/notes/02-understanding-self/week-15-bias-blind-spots.md"
    version: "1.0.0"
    claim_ids:
      - "C15-10"
      - "C15-01"
    tags:
      - "pop-psychology"
      - "debunked"
      - "person-first"
      - "anti-labeling"
