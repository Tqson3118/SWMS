deck_id: "deck-psy-w35"
subject: "Psychology"
lesson_id: "week-35-lifespan-development"
version: "1.0.0"
description: "Bộ thẻ ôn tập Tuần 35: Phát triển suốt đời — Trẻ em, vị thành niên, trưởng thành và tuổi già"

cards:
  - id: "fc-psy-w35-001"
    concept: "Góc nhìn phát triển suốt đời (Lifespan Perspective)"
    front: "Theo Paul Baltes (1987), nguyên lý cốt lõi của 'Góc nhìn phát triển suốt đời' là gì?"
    back: "Phát triển là tiến trình diễn ra suốt đời, đa chiều, đa hướng (đồng thời có tăng trưởng và suy giảm), có tính mềm dẻo (plasticity), và được định hình bởi sự tương tác giữa sinh học, văn hóa và bối cảnh lịch sử."
    source_lesson: "Psychology/notes/05-development-mental-health/week-35-lifespan-development.md"
    version: "1.0.0"
    claim_ids:
      - "C35-01"
    tags:
      - "development"
      - "baltes"
      - "lifespan-perspective"

  - id: "fc-psy-w35-002"
    concept: "Tính vĩnh cửu của vật thể (Object Permanence)"
    front: "Thí nghiệm tấm ván xoay của Renée Baillargeon (1987) đã hiệu chỉnh điều gì về lý thuyết của Piaget?"
    back: "Baillargeon chứng minh trẻ sơ sinh chỉ mới 3.5 đến 4.5 tháng tuổi đã nhận biết vật thể vẫn tiếp tục tồn tại khi bị che khuất (thể hiện qua thời gian nhìn lâu hơn vào sự kiện bất khả thi), sớm hơn nhiều so với mốc 8-9 tháng của Piaget."
    source_lesson: "Psychology/notes/05-development-mental-health/week-35-lifespan-development.md"
    version: "1.0.0"
    claim_ids:
      - "C35-02"
    tags:
      - "piaget"
      - "baillargeon"
      - "cognitive-development"
      - "object-permanence"

  - id: "fc-psy-w35-003"
    concept: "Đồng hóa vs Điều ứng (Assimilation vs Accommodation)"
    front: "Sự khác biệt giữa 'Đồng hóa' (Assimilation) và 'Điều ứng' (Accommodation) trong học thuyết Piaget là gì?"
    back: "Đồng hóa là đưa thông tin mới vào lược đồ (schema) sẵn có mà không làm thay đổi lược đồ. Điều ứng là thay đổi hoặc tạo lược đồ mới để thích ứng khi thông tin mới mâu thuẫn với cấu trúc nhận thức cũ."
    source_lesson: "Psychology/notes/05-development-mental-health/week-35-lifespan-development.md"
    version: "1.0.0"
    claim_ids:
      - "C35-02"
    tags:
      - "piaget"
      - "assimilation"
      - "accommodation"
      - "schemas"

  - id: "fc-psy-w35-004"
    concept: "Bản sắc vs Mơ hồ vai trò (Erikson)"
    front: "Cuộc khủng hoảng tâm lý xã hội ở lứa tuổi vị thành niên theo Erikson là gì và mục tiêu của nó là gì?"
    back: "Khủng hoảng Bản sắc vs Mơ hồ Vai trò (Identity vs Role Confusion). Mục tiêu là khám phá và xác lập căn tính độc lập, hệ giá trị sống và hướng nghiệp cá nhân, hình thành đức hạnh 'Lòng trung thành' (Fidelity)."
    source_lesson: "Psychology/notes/05-development-mental-health/week-35-lifespan-development.md"
    version: "1.0.0"
    claim_ids:
      - "C35-03"
    tags:
      - "erikson"
      - "identity"
      - "adolescence"
      - "psychosocial"

  - id: "fc-psy-w35-005"
    concept: "Bốn trạng thái bản sắc của James Marcia"
    front: "Bốn trạng thái bản sắc theo James Marcia (1966) được phân loại dựa trên hai tiêu chí nào?"
    back: "Dựa trên Khám phá (Exploration/Crisis) và Cam kết (Commitment): (1) Identity Diffusion (không cả hai), (2) Foreclosure (cam kết nhưng không khám phá), (3) Moratorium (đang khám phá, chưa cam kết), (4) Achievement (đã khám phá và cam kết)."
    source_lesson: "Psychology/notes/05-development-mental-health/week-35-lifespan-development.md"
    version: "1.0.0"
    claim_ids:
      - "C35-03"
    tags:
      - "marcia"
      - "identity-status"
      - "adolescence"

  - id: "fc-psy-w35-006"
    concept: "Mô hình Hệ thống Kép về não bộ vị thành niên (Steinberg)"
    front: "Theo Laurence Steinberg (2008), tại sao thanh thiếu niên lại dễ có hành vi bốc đồng và tìm kiếm rủi ro?"
    back: "Do sự phát triển bất đồng bộ: Hệ thống viền xử lý phần thưởng và cảm xúc phát triển sớm và nhạy cảm ở tuổi dậy thì, trong khi Vỏ não trước trán (PFC) kiểm soát ức chế và điều hành nhận thức chỉ hoàn thiện vào giữa độ tuổi 20."
    source_lesson: "Psychology/notes/05-development-mental-health/week-35-lifespan-development.md"
    version: "1.0.0"
    claim_ids:
      - "C35-04"
    tags:
      - "neuroscience"
      - "adolescent-brain"
      - "dual-systems"
      - "steinberg"

  - id: "fc-psy-w35-007"
    concept: "Trí tuệ Linh hoạt vs Trí tuệ Kết tinh (Cattell & Horn)"
    front: "Phân biệt Trí tuệ Linh hoạt (Gf) và Trí tuệ Kết tinh (Gc) theo Cattell & Horn?"
    back: "Gf (Fluid) là khả năng suy luận logic giải quyết vấn đề mới lạ, tốc độ xử lý, giảm dần từ tuổi 25+. Gc (Crystallized) là tri thức tích lũy, vốn từ ngữ và kinh nghiệm thực hành văn hóa, duy trì ổn định và gia tăng đến tuổi già."
    source_lesson: "Psychology/notes/05-development-mental-health/week-35-lifespan-development.md"
    version: "1.0.0"
    claim_ids:
      - "C35-05"
    tags:
      - "intelligence"
      - "fluid-intelligence"
      - "crystallized-intelligence"
      - "cattell"
      - "aging"

  - id: "fc-psy-w35-008"
    concept: "Tính mềm dẻo thần kinh trong lão hóa (Neuroplasticity)"
    front: "Người cao tuổi có thể bảo tồn và kích thích tính mềm dẻo thần kinh bằng những phương pháp nào?"
    back: "Thông qua tập thể dục nhịp điệu (kích thích sản sinh BDNF), học hỏi kỹ năng phức tạp mới liên tục, duy trì giao tiếp xã hội tích cực và lối sống lành mạnh, giúp não hình thành mạng lưới synap bù đắp cho sự suy giảm sinh học."
    source_lesson: "Psychology/notes/05-development-mental-health/week-35-lifespan-development.md"
    version: "1.0.0"
    claim_ids:
      - "C35-05"
    tags:
      - "neuroplasticity"
      - "cognitive-aging"
      - "bdnf"
      - "healthy-aging"
