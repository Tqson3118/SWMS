deck_id: "deck-psy-w43"
subject: "Psychology"
lesson_id: "week-43-decision-under-uncertainty"
version: "1.0.0"
description: "Bộ thẻ ôn tập Tuần 43: Ra quyết định cá nhân dưới bất định"

cards:
  - id: "fc-psy-w43-001"
    concept: "Thuyết Triển Vọng & Điểm tham chiếu (Prospect Theory)"
    front: "Theo Thuyết Triển Vọng (Kahneman & Tversky, 1979), con người đánh giá kết quả của quyết định dựa trên cơ chế nào?"
    back: "Dựa trên sự thay đổi tương đối (lãi hoặc lỗ) so với một điểm tham chiếu (reference point) tâm lý, chứ không phải dựa trên tổng mức tài sản tuyệt đối."
    source_lesson: "Psychology/notes/06-integration/week-43-decision-under-uncertainty.md"
    version: "1.0.0"
    claim_ids:
      - "C43-01"
    tags:
      - "prospect-theory"
      - "reference-point"
      - "decision-making"

  - id: "fc-psy-w43-002"
    concept: "Hàm giá trị hình chữ S (S-shaped Value Function)"
    front: "Đặc tính hình học của hàm giá trị trong Thuyết Triển Vọng phản ánh tâm lý ra quyết định như thế nào?"
    back: "Hàm giá trị lõm ở miền lời (e ngại rủi ro) và lồi ở miền lỗ (tìm kiếm rủi ro), với độ dốc ở miền lỗ dốc hơn miền lời (mất mát đau đớn hơn lợi ích)."
    source_lesson: "Psychology/notes/06-integration/week-43-decision-under-uncertainty.md"
    version: "1.0.0"
    claim_ids:
      - "C43-01"
    tags:
      - "value-function"
      - "risk-aversion"
      - "risk-seeking"

  - id: "fc-psy-w43-003"
    concept: "Tâm lý E ngại Mất mát (Loss Aversion)"
    front: "Tâm lý E ngại Mất mát (Loss Aversion) có quy mô tác động tâm lý như thế nào so với lợi ích tương đương?"
    back: "Nỗi đau tâm lý của sự mất mát tác động mạnh gấp khoảng 1.5 đến 2.5 lần niềm vui của một khoản lợi ích tương đương."
    source_lesson: "Psychology/notes/06-integration/week-43-decision-under-uncertainty.md"
    version: "1.0.0"
    claim_ids:
      - "C43-02"
    tags:
      - "loss-aversion"
      - "behavioral-economics"

  - id: "fc-psy-w43-004"
    concept: "Hiệu ứng Đóng khung (Framing Effect)"
    front: "Hiệu ứng Đóng khung (Framing Effect) làm thay đổi hành vi chấp nhận rủi ro của con người ra sao?"
    back: "Khung lời (Gain frame) thúc đẩy hành vi né tránh rủi ro (chọn phương án an toàn); trong khi khung mất (Loss frame) kích hoạt hành vi liều lĩnh tìm kiếm rủi ro."
    source_lesson: "Psychology/notes/06-integration/week-43-decision-under-uncertainty.md"
    version: "1.0.0"
    claim_ids:
      - "C43-02"
    tags:
      - "framing-effect"
      - "cognitive-bias"

  - id: "fc-psy-w43-005"
    concept: "Heuristic tính sẵn có (Availability Heuristic)"
    front: "Heuristic tính sẵn có là gì và tại sao nó gây sai lệch trong đánh giá rủi ro?"
    back: "Là xu hướng đánh giá xác suất hoặc tần suất của sự kiện dựa trên mức độ dễ dàng hồi tưởng các ví dụ trong trí nhớ. Các sự kiện kịch tính, giật gân thường bị đánh giá quá cao."
    source_lesson: "Psychology/notes/06-integration/week-43-decision-under-uncertainty.md"
    version: "1.0.0"
    claim_ids:
      - "C43-03"
    tags:
      - "availability-heuristic"
      - "heuristics"

  - id: "fc-psy-w43-006"
    concept: "Neo nhận thức (Anchoring Effect)"
    front: "Cơ chế hoạt động của Neo nhận thức (Anchoring Effect) trong phán đoán định lượng là gì?"
    back: "Phán đoán số lượng hoặc giá trị bị kéo lệch về phía con số khởi điểm tiếp xúc ban đầu (mỏ neo), ngay cả khi con số đó hoàn toàn ngẫu nhiên và phi lý."
    source_lesson: "Psychology/notes/06-integration/week-43-decision-under-uncertainty.md"
    version: "1.0.0"
    claim_ids:
      - "C43-03"
    tags:
      - "anchoring-effect"
      - "negotiation"

  - id: "fc-psy-w43-007"
    concept: "Thỏa mãn vừa đủ vs Tối đa hóa (Satisficing vs Maximizing)"
    front: "Tại sao người theo phong cách Thỏa mãn vừa đủ (Satisficing) lại có hạnh phúc chủ quan cao hơn người Tối đa hóa (Maximizers)?"
    back: "Satisficers dừng lại khi gặp phương án 'đủ tốt' đạt chuẩn; Maximizers luôn tìm kiếm điều tốt nhất tuyệt đối nên kiệt sức vì so sánh, ám ảnh chi phí cơ hội và hối tiếc cao."
    source_lesson: "Psychology/notes/06-integration/week-43-decision-under-uncertainty.md"
    version: "1.0.0"
    claim_ids:
      - "C43-04"
    tags:
      - "satisficing"
      - "maximizing"
      - "paradox-of-choice"

  - id: "fc-psy-w43-008"
    concept: "Kiến trúc lựa chọn và Huých nhẹ (Nudge)"
    front: "Định nghĩa và nguyên tắc cốt lõi của 'Nudge' (Thaler & Sunstein) trong thay đổi hành vi?"
    back: "Là cách sắp xếp môi trường lựa chọn nhằm dẫn dắt hành vi theo hướng tích cực mà không cấm đoán hay phạt kinh tế; phải minh bạch và dễ dàng từ chối (easy opt-out)."
    source_lesson: "Psychology/notes/06-integration/week-43-decision-under-uncertainty.md"
    version: "1.0.0"
    claim_ids:
      - "C43-05"
    tags:
      - "nudge"
      - "choice-architecture"
      - "behavioral-design"
