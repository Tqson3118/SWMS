deck_id: "deck-psy-w01"
subject: "Psychology"
lesson_id: "week-01-what-is-psychology"
version: "1.0.0"
description: "Bộ thẻ Flashcard chuẩn hóa ôn tập ngắt quãng (Spaced Repetition - R5 Compliant) Tuần 01: Tâm lý học là gì — phạm vi, lịch sử và các trường phái"

cards:
  - id: "fc-psy-w01-001"
    concept: "Định nghĩa và phương pháp nghiên cứu tâm lý học khoa học"
    front: "Tâm lý học được định nghĩa khoa học như thế nào và vì sao các nhà nghiên cứu bắt buộc phải tiếp cận tâm trí thông qua đo lường gián tiếp?"
    back: "Tâm lý học là ngành nghiên cứu khoa học về tâm trí (mind) và hành vi (behavior). Vì tâm trí là trải nghiệm chủ quan bên trong không thể quan sát trực tiếp, khoa học tâm lý học phải thu thập ba nguồn dữ liệu đo lường được: hành vi quan sát được, chỉ số sinh học/thần kinh và báo cáo tự thuật (self-report) để suy luận có kiểm chứng về các quá trình tâm thần."
    source_lesson: "Psychology/notes/01-scientific-foundations/week-01-what-is-psychology.md"
    version: "1.0.0"
    claim_ids:
      - "C00-01a"
      - "C01-01"
    tags:
      - "definition"
      - "scientific-method"
      - "empirical"

  - id: "fc-psy-w01-002"
    concept: "Bốn mục tiêu khoa học của tâm lý học"
    front: "Bốn mục tiêu khoa học cốt lõi của tâm lý học là gì và vì sao mục tiêu 'dự đoán' không đồng nghĩa với cam kết chắc chắn 100%?"
    back: "Bốn mục tiêu khoa học là: Mô tả (describe), Giải thích (explain), Dự đoán (predict), và Điều chỉnh/can thiệp (modify/control). Dự đoán trong tâm lý học luôn mang tính xác suất ở cấp độ nhóm/quần thể dựa trên các quy luật thống kê, phản ánh xu hướng hành vi chứ không phải sự tiền định tuyệt đối cho từng cá nhân cụ thể."
    source_lesson: "Psychology/notes/01-scientific-foundations/week-01-what-is-psychology.md"
    version: "1.0.0"
    claim_ids:
      - "C00-01b"
    tags:
      - "scientific-goals"
      - "methodology"

  - id: "fc-psy-w01-003"
    concept: "Chủ nghĩa cấu trúc đối lập Chủ nghĩa chức năng"
    front: "Câu hỏi nghiên cứu trọng tâm và phương pháp tiếp cận của Chủ nghĩa cấu trúc (Wundt, Titchener) đối lập với Chủ nghĩa chức năng (James) như thế nào?"
    back: "Chủ nghĩa cấu trúc (Wundt, Titchener) hỏi 'Tâm trí được tạo nên từ những thành phần gì?', sử dụng phương pháp tự quan sát nội tâm (introspection) để phân tích ý thức thành các cảm giác vi mô. Ngược lại, Chủ nghĩa chức năng (James) chịu ảnh hưởng của thuyết tiến hóa Darwin, hỏi 'Hoạt động tâm trí giúp con người thích nghi và sinh tồn ra sao?', tập trung vào chức năng thích nghi của toàn bộ tâm trí trong môi trường thực tế."
    source_lesson: "Psychology/notes/01-scientific-foundations/week-01-what-is-psychology.md"
    version: "1.0.0"
    claim_ids:
      - "C01-02"
      - "C01-03"
    tags:
      - "history"
      - "structuralism"
      - "functionalism"

  - id: "fc-psy-w01-004"
    concept: "Tâm lý học Gestalt"
    front: "Luận điểm cốt lõi của Tâm lý học Gestalt (Wertheimer, Koffka, Köhler) là gì và vì sao trường phái này bác bỏ chủ nghĩa cấu trúc?"
    back: "Luận điểm trung tâm: 'Tổng thể khác với tổng các phần rời rạc' (The whole is other than the sum of its parts). Trải nghiệm tri giác của con người mang tính trọn vẹn và tổ chức có cấu trúc; khi chia nhỏ một bản nhạc hoặc một bức tranh thành các nốt nhạc hay điểm màu riêng lẻ, bản chất của trải nghiệm tri giác sẽ biến mất."
    source_lesson: "Psychology/notes/01-scientific-foundations/week-01-what-is-psychology.md"
    version: "1.0.0"
    claim_ids:
      - "C01-05"
    tags:
      - "history"
      - "gestalt"
      - "perception"

  - id: "fc-psy-w01-005"
    concept: "Chủ nghĩa hành vi (Behaviorism)"
    front: "Đóng góp phương pháp luận lớn nhất của Chủ nghĩa hành vi (Watson, Skinner) cho khoa học tâm lý học là gì và giới hạn lý thuyết cốt lõi của nó là gì?"
    back: "Đóng góp: Thiết lập tâm lý học như một khoa học tự nhiên khách quan, yêu cầu các giả thuyết phải dựa trên hành vi quan sát và đo lường được trong điều kiện thực nghiệm chuẩn hóa (kích thích, phản xạ, củng cố, trừng phạt). Giới hạn: Mang tính quyết định luận và giản lược hóa, loại bỏ hoàn toàn các quá trình nhận thức bên trong (coi tâm trí như chiếc hộp đen)."
    source_lesson: "Psychology/notes/01-scientific-foundations/week-01-what-is-psychology.md"
    version: "1.0.0"
    claim_ids:
      - "C01-06"
    tags:
      - "history"
      - "behaviorism"
      - "learning"

  - id: "fc-psy-w01-006"
    concept: "Tâm lý học nhân văn và Cách mạng nhận thức"
    front: "Tâm lý học nhân văn (Maslow, Rogers) và Cách mạng nhận thức (Chomsky, Neisser) lần lượt ra đời như thế nào để vượt qua những giới hạn của các trường phái trước đó?"
    back: "Tâm lý học nhân văn ra đời nhằm phản kháng cả tính quyết định luận bi quan của phân tâm học lẫn tính cơ giới của chủ nghĩa hành vi, đề cao tiềm năng phát triển bẩm sinh và trải nghiệm chủ quan của con người. Cách mạng nhận thức (thập niên 1950) sử dụng tiến bộ liên ngành (ngôn ngữ học, máy tính, khoa học thần kinh) để đưa tâm trí và các quá trình xử lý thông tin trở lại trung tâm nghiên cứu khoa học thực nghiệm khách quan."
    source_lesson: "Psychology/notes/01-scientific-foundations/week-01-what-is-psychology.md"
    version: "1.0.0"
    claim_ids:
      - "C01-07"
      - "C01-08"
    tags:
      - "history"
      - "humanistic"
      - "cognitive-revolution"

  - id: "fc-psy-w01-007"
    concept: "Mô hình Sinh - Tâm - Xã hội (Biopsychosocial Model)"
    front: "Mô hình Sinh - Tâm - Xã hội (Biopsychosocial Model) giải thích sức khỏe và hành vi của con người dựa trên sự tương tác của những yếu tố nào?"
    back: "Mô hình giải thích mọi trạng thái sức khỏe thể chất, tinh thần và hành vi con người là kết quả tương tác phức hợp giữa ba nhóm yếu tố: Yếu tố Sinh học (gene, hóa sinh não bộ, nội tiết), Yếu tố Tâm lý (niềm tin, cảm xúc, cách ứng phó, nhân cách), và Yếu tố Xã hội (văn hóa, gia đình, kinh tế, bối cảnh công việc). Không có yếu tố đơn lẻ nào chi phối tuyệt đối."
    source_lesson: "Psychology/notes/01-scientific-foundations/week-01-what-is-psychology.md"
    version: "1.0.0"
    claim_ids:
      - "C01-12"
    tags:
      - "biopsychosocial"
      - "contemporary"
      - "health-psychology"

  - id: "fc-psy-w01-008"
    concept: "Phân định vai trò chuyên môn trong tâm lý học"
    front: "Đâu là sự khác biệt cốt lõi giữa Bác sĩ tâm thần (Psychiatrist), Nhà tâm lý học lâm sàng (Clinical Psychologist) và Nhà tâm lý học tư vấn (Counseling Psychologist)?"
    back: "Bác sĩ tâm thần là bác sĩ y khoa (MD), chuyên chẩn đoán và điều trị y khoa các rối loạn tâm thần phức tạp thông qua kê đơn thuốc (psychotropic medications). Nhà tâm lý học lâm sàng (PhD/PsyD) tập trung chẩn đoán và trị liệu tâm lý cho các rối loạn chức năng và hành vi có vấn đề. Nhà tâm lý học tư vấn tập trung hỗ trợ thích ứng cảm xúc, xã hội và nghề nghiệp ở những cá nhân có sức khỏe tâm lý nói chung bình thường."
    source_lesson: "Psychology/notes/01-scientific-foundations/week-01-what-is-psychology.md"
    version: "1.0.0"
    claim_ids:
      - "C01-09"
      - "C01-10"
    tags:
      - "professions"
      - "clinical"
      - "counseling"
      - "psychiatry"
