cards:
  - id: "fc-psy-w37-001"
    concept: "Hedonic vs Eudaimonic Well-being"
    front: "Phân biệt Hạnh phúc Khoái lạc (Hedonic) và Hạnh phúc Ý nghĩa (Eudaimonic) theo Deci & Ryan (2001)?"
    back: "Hedonic tập trung vào trải nghiệm khoái cảm, thỏa mãn và giảm thiểu đau khổ tức thời. Eudaimonic tập trung vào việc sống chân thực theo các giá trị nội tại, phát triển tiềm năng cá nhân và tìm thấy ý nghĩa cuộc sống sâu sắc."
    source_lesson: "Psychology/notes/05-development-mental-health/week-37-wellbeing-positive-psychology.md"
    version: "1.0.0"
    claim_ids:
      - "C37-01"
    tags:
      - "wellbeing"
      - "hedonic"
      - "eudaimonic"
      - "deci-ryan"

  - id: "fc-psy-w37-002"
    concept: "Thuyết Tự Quyết (Self-Determination Theory)"
    front: "Ba nhu cầu tâm lý cơ bản cấu thành sức khỏe eudaimonic trong Thuyết Tự Quyết (Ryan & Deci, 2000) là gì?"
    back: "1. Tự chủ (Autonomy): quyền tự quyết định hành vi theo ý chí riêng; 2. Năng lực (Competence): cảm giác thành thạo và làm chủ thử thách; 3. Gắn kết (Relatedness): cảm giác thuộc về và được kết nối yêu thương với người khác."
    source_lesson: "Psychology/notes/05-development-mental-health/week-37-wellbeing-positive-psychology.md"
    version: "1.0.0"
    claim_ids:
      - "C37-01"
    tags:
      - "sdt"
      - "autonomy"
      - "competence"
      - "relatedness"

  - id: "fc-psy-w37-003"
    concept: "Hạnh phúc Chủ quan (SWB của Ed Diener)"
    front: "Ba thành tố độc lập cấu thành Hạnh phúc Chủ quan (Subjective Well-Being - SWB) theo Ed Diener (1984) là gì?"
    back: "(1) Sự hài lòng cuộc sống tổng thể (Life satisfaction - đánh giá nhận thức); (2) Tần suất cảm xúc tích cực thường xuyên (Positive affect); (3) Tần suất cảm xúc tiêu cực thấp (Negative affect)."
    source_lesson: "Psychology/notes/05-development-mental-health/week-37-wellbeing-positive-psychology.md"
    version: "1.0.0"
    claim_ids:
      - "C37-02"
    tags:
      - "swb"
      - "ed-diener"
      - "life-satisfaction"

  - id: "fc-psy-w37-004"
    concept: "Vòng xoay Khoái lạc (Hedonic Treadmill)"
    front: "Hiện tượng 'Vòng xoay Khoái lạc' (Hedonic Treadmill - Diener et al., 2006) chỉ ra điều gì về sự thích nghi của con người?"
    back: "Con người có xu hướng nhanh chóng thích nghi với những thay đổi tích cực về hoàn cảnh (như tăng lương, mua đồ mới) và trở về mức hạnh phúc cơ bản ban đầu; vì vậy việc theo đuổi khoái cảm vật chất ngắn hạn không mang lại wellbeing bền vững."
    source_lesson: "Psychology/notes/05-development-mental-health/week-37-wellbeing-positive-psychology.md"
    version: "1.0.0"
    claim_ids:
      - "C37-02"
    tags:
      - "hedonic-treadmill"
      - "adaptation"
      - "diener"

  - id: "fc-psy-w37-005"
    concept: "Mô hình PERMA (Martin Seligman)"
    front: "Năm trụ cột tạo nên sự hưng thịnh (Flourishing) trong mô hình PERMA của Martin Seligman (2011) là gì?"
    back: "P - Positive Emotion (Cảm xúc tích cực); E - Engagement (Sự gắn kết/say mê); R - Relationships (Mối quan hệ tích cực); M - Meaning (Ý nghĩa cuộc sống); A - Accomplishment (Thành tựu/Hoàn thành)."
    source_lesson: "Psychology/notes/05-development-mental-health/week-37-wellbeing-positive-psychology.md"
    version: "1.0.0"
    claim_ids:
      - "C37-03"
    tags:
      - "perma"
      - "seligman"
      - "flourishing"

  - id: "fc-psy-w37-006"
    concept: "Trạng thái Dòng chảy (Flow State)"
    front: "Điều kiện tiên quyết để kích hoạt Trạng thái Dòng chảy (Flow) theo Mihaly Csikszentmihalyi (1990) là gì?"
    back: "Sự cân bằng tối ưu giữa mức độ thách thức của nhiệm vụ và kỹ năng cá nhân ở ngưỡng cao, đi kèm mục tiêu rõ ràng, sự tập trung toàn vẹn và thông tin phản hồi trực tiếp ngay lập tức."
    source_lesson: "Psychology/notes/05-development-mental-health/week-37-wellbeing-positive-psychology.md"
    version: "1.0.0"
    claim_ids:
      - "C37-04"
    tags:
      - "flow"
      - "csikszentmihalyi"
      - "optimal-experience"

  - id: "fc-psy-w37-007"
    concept: "Phản biện Tỷ lệ Tích cực Losada (Brown et al., 2013)"
    front: "Bài phản biện của Nicholas Brown, Alan Sokal & Harris Friedman (2013) đã vạch trần sai lầm gì trong tâm lý học tích cực?"
    back: "Vạch trần rằng 'Tỷ lệ tích cực tới hạn Losada 2.9013' (Positivity ratio 3:1) bắt nguồn từ việc ngụy tạo và áp dụng sai lệch các phương trình động lực học chất lưu, buộc Fredrickson phải chính thức rút lại mô hình toán học này."
    source_lesson: "Psychology/notes/05-development-mental-health/week-37-wellbeing-positive-psychology.md"
    version: "1.0.0"
    claim_ids:
      - "C37-05"
    tags:
      - "losada-critique"
      - "sokal"
      - "positivity-ratio"
      - "methodology"

  - id: "fc-psy-w37-008"
    concept: "Lạc quan Độc hại (Toxic Positivity)"
    front: "Tại sao 'Lạc quan độc hại' (Toxic Positivity) lại bị các nhà tâm lý học thực chứng phê phán?"
    back: "Vì nó ép buộc cá nhân phải đè nén các cảm xúc khó khăn chính đáng (buồn rầu, lo âu), gây cảm giác tội lỗi và có nguy cơ đổ lỗi cho nạn nhân trước các bất bình đẳng hoặc tổn thương cấu trúc xã hội thực tế."
    source_lesson: "Psychology/notes/05-development-mental-health/week-37-wellbeing-positive-psychology.md"
    version: "1.0.0"
    claim_ids:
      - "C37-05"
    tags:
      - "toxic-positivity"
      - "critique"
      - "emotional-suppression"
