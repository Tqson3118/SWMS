description: "Bộ thẻ ôn tập Tuần 34: Chia tay, grief, phục hồi và tổng hợp Chặng 4"

cards:
  - id: "fc-psy-w34-001"
    concept: "Giới hạn của mô hình 5 giai đoạn grief (Kübler-Ross)"
    front: "Mô hình 5 giai đoạn grief của Kübler-Ross (phủ nhận, tức giận, thương lượng, trầm cảm, chấp nhận) có những giới hạn gì mà nghiên cứu hiện đại chỉ ra?"
    back: "Giới hạn chính: (1) Kübler-Ross ban đầu nghiên cứu về bệnh nhân sắp chết, không phải người mất người thân — khái quát hóa quá mức; (2) Phần lớn người không trải qua đủ 5 giai đoạn hoặc không theo thứ tự này; (3) Không có thứ tự 'đúng' hay 'sai' khi đau buồn; (4) Bonanno (2004) cho thấy nhiều người resilient và không trải qua giai đoạn mạnh; (5) Có nguy cơ bình thường hóa hoặc phán xét phản ứng grief của người khác. Grief là phản ứng cá nhân và không tuyến tính."
    source_lesson: "Psychology/notes/04-love-relationships/week-34-breakup-grief-stage-review.md"
    version: "1.0.0"
    claim_ids:
      - "C34-01"
    tags:
      - "grief"
      - "kubler-ross"
      - "stages-of-grief"
      - "limitations"
      - "bonanno"

  - id: "fc-psy-w34-002"
    concept: "Co-regulation (Đồng điều hòa)"
    front: "Khái niệm 'Co-regulation' trong mối quan hệ gắn bó lãng mạn có nghĩa là gì?"
    back: "Là quá trình mà các cá nhân trong mối quan hệ giúp nhau điều chỉnh và duy trì sự ổn định của hệ thống sinh lý (nhịp tim, nồng độ hormone) và trạng thái cảm xúc. Khi chia tay, việc mất đi nguồn co-regulation dẫn đến dysregulation (mất điều hòa)."
    source_lesson: "Psychology/notes/04-love-relationships/week-34-breakup-grief-stage-review.md"
    version: "1.0.0"
    claim_ids:
      - "C34-02"
    tags:
      - "co-regulation"
      - "physiology"
      - "attachment"

  - id: "fc-psy-w34-003"
    concept: "Resilience sau mất mát (Bonanno)"
    front: "Theo nghiên cứu của Bonanno (2004), quỹ đạo phản ứng phổ biến nhất của con người sau những biến cố mất mát lớn là gì?"
    back: "Resilience (Khả năng phục hồi). Phần lớn mọi người có khả năng duy trì mức độ chức năng tâm lý tương đối ổn định và phục hồi trở lại cuộc sống bình thường, trái với lầm tưởng rằng ai cũng phải suy sụp nghiêm trọng lâu dài."
    source_lesson: "Psychology/notes/04-love-relationships/week-34-breakup-grief-stage-review.md"
    version: "1.0.0"
    claim_ids:
      - "C34-04"
    tags:
      - "resilience"
      - "bonanno"
      - "recovery-trajectories"

  - id: "fc-psy-w34-004"
    concept: "Prolonged Grief Disorder (PGD)"
    front: "Sự khác biệt chính giữa Grief (đau buồn bình thường) và Prolonged Grief Disorder (Rối loạn đau buồn kéo dài) là gì?"
    back: "Grief là phản ứng tự nhiên. PGD là một chẩn đoán lâm sàng đặc trưng bởi sự đau buồn và khao khát mãnh liệt kéo dài vượt xa kỳ vọng xã hội (thường >6-12 tháng), gây suy giảm nghiêm trọng chức năng sống hàng ngày và cần can thiệp y tế chuyên nghiệp."
    source_lesson: "Psychology/notes/04-love-relationships/week-34-breakup-grief-stage-review.md"
    version: "1.0.0"
    claim_ids:
      - "C34-06"
    tags:
      - "pgd"
      - "grief"
      - "clinical-psychology"

  - id: "fc-psy-w34-005"
    concept: "Pop Psychology vs Chẩn đoán Ái kỷ (Narcissist)"
    front: "Tại sao việc gọi người yêu cũ có hành vi tồi là 'ái kỷ' (narcissist) hay 'độc hại' (toxic) lại bị xem là vấn đề dưới góc độ tâm lý học khoa học?"
    back: "Vì Narcissistic Personality Disorder (NPD) là một chẩn đoán y khoa lâm sàng cần chuyên gia thực hiện. Hành vi tồi trong khi xung đột/chia tay không đủ để kết luận NPD. Việc dán nhãn 'toxic/narcissist' dễ làm đơn giản hóa vấn đề và không giải quyết được căn nguyên của mối quan hệ."
    source_lesson: "Psychology/notes/04-love-relationships/week-34-breakup-grief-stage-review.md"
    version: "1.0.0"
    tags:
      - "pop-psychology"
      - "narcissism"
      - "labels"
      - "critique"

  - id: "fc-psy-w34-006"
    concept: "Expressive Writing (Viết diễn đạt)"
    front: "Phương pháp Expressive Writing của Pennebaker có tác dụng như thế nào đối với quá trình phục hồi tâm lý?"
    back: "Bằng cách viết ra suy nghĩ và cảm xúc sâu sắc về sự kiện, người viết có thể tổ chức lại nhận thức, tạo ra một câu chuyện liền mạch (meaning-making). Nó có thể gây buồn bã ngắn hạn nhưng tương quan với sức khỏe tinh thần và thể chất tốt hơn trong dài hạn."
    source_lesson: "Psychology/notes/04-love-relationships/week-34-breakup-grief-stage-review.md"
    version: "1.0.0"
    claim_ids:
      - "C34-08"
    tags:
      - "expressive-writing"
      - "pennebaker"
      - "recovery"

  - id: "fc-psy-w34-007"
    concept: "Earned Secure Attachment"
    front: "Ôn tập Chặng 4: Phong cách gắn bó (Attachment style) có bị cố định từ thời thơ ấu không?"
    back: "Không. Dù chịu ảnh hưởng lớn từ tuổi thơ, phong cách gắn bó có tính dẻo và có thể thay đổi trong suốt vòng đời. Một người có phong cách bất an có thể xây dựng 'Earned Secure Attachment' (gắn bó an toàn đạt được) qua những mối quan hệ trưởng thành lành mạnh hoặc qua trị liệu."
    source_lesson: "Psychology/notes/04-love-relationships/week-34-breakup-grief-stage-review.md"
    version: "1.0.0"
    tags:
      - "attachment"
      - "earned-secure"
      - "stage-4-review"

  - id: "fc-psy-w34-008"
    concept: "Repair attempt (Gottman)"
    front: "Ôn tập Chặng 4: 'Repair attempt' trong xung đột quan hệ là gì?"
    back: "Bất kỳ nỗ lực nào (lời nói hoặc hành động) nhằm hạ nhiệt căng thẳng, phanh lại sự leo thang của xung đột và kết nối lại cảm xúc. Khả năng thực hiện và đón nhận repair attempts là đặc trưng của một mối quan hệ lành mạnh."
    source_lesson: "Psychology/notes/04-love-relationships/week-34-breakup-grief-stage-review.md"
    version: "1.0.0"
    tags:
      - "repair-attempt"
      - "conflict"
      - "gottman"
      - "stage-4-review"
