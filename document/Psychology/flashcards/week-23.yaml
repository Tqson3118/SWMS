deck_id: deck-psy-w23
subject: Psychology
lesson_id: week-23-prejudice-conflict
version: 1.0.0
description: Bộ thẻ ghi nhớ Tuần 23 về Định kiến, Xung đột nhóm, Hiệu ứng người ngoài cuộc và Hợp tác liên nhóm.
cards:
- id: fc-psy-w23-001
  concept: Mô hình ABC trong Định kiến
  front: Phân biệt ba thành tố Stereotype, Prejudice và Discrimination theo mô hình ABC?
  back: Stereotype là Nhận thức (Cognition - niềm tin khái quát hóa); Prejudice là Cảm xúc (Affect - thái độ thù ghét/lo âu); Discrimination là Hành vi (Behavior - đối xử bất công, loại trừ).
  source_lesson: Psychology/notes/03-understanding-others/week-23-prejudice-conflict.md#31-mô-hình-abc-rập-khuôn-định-kiến--phân-biệt-đối-xử
  version: 1.0.0
  tags:
  - w23
  - abc-model
- id: fc-psy-w23-002
  concept: Mô hình Nhóm Tối thiểu (Minimal Group Paradigm)
  front: Phát hiện cốt lõi của Henri Tajfel (1970) về sự phân biệt đối xử liên nhóm là gì?
  back: Con người tự động thiên vị nội nhóm (In-group favoritism) ngay cả khi được chia nhóm ngẫu nhiên bằng tiêu chí vô nghĩa (chọn tranh), mà không cần có lịch sử thù địch hay cạnh tranh lợi ích.
  source_lesson: Psychology/notes/03-understanding-others/week-23-prejudice-conflict.md#32-nhóm-tối-thiểu-minimal-group--bản-sắc-xã-hội
  version: 1.0.0
  tags:
  - w23
  - minimal-group
- id: fc-psy-w23-003
  concept: Khuếch tán trách nhiệm (Diffusion of Responsibility)
  front: Cơ chế tâm lý nào giải thích tại sao đám đông càng đông thì nạn nhân càng ít cơ hội được giúp đỡ?
  back: Khi có nhiều người chứng kiến, trách nhiệm đạo đức bị san sẻ cho tập thể; ai cũng nghĩ người khác đã hoặc sẽ giúp, làm giảm thôi thúc hành động cá nhân.
  source_lesson: Psychology/notes/03-understanding-others/week-23-prejudice-conflict.md#33-hiệu-ứng-người-ngoài-cuộc-bystander-effect
  version: 1.0.0
  tags:
  - w23
  - bystander-effect
- id: fc-psy-w23-004
  concept: Phá vỡ Bystander Effect nơi công cộng
  front: Biện pháp hiệu quả nhất để yêu cầu sự giúp đỡ khẩn cấp giữa đám đông là gì?
  back: Triệt tiêu sự khuếch tán trách nhiệm bằng cách chỉ định đích danh một người cụ thể với đặc điểm nhận dạng rõ ràng và ra lệnh hành động dứt khoát ("Anh áo đen đeo kính, hãy gọi 115!").
  source_lesson: Psychology/notes/03-understanding-others/week-23-prejudice-conflict.md#35-điểm-cốt-lõi-cần-nhớ-key-takeaways-
  version: 1.0.0
  tags:
  - w23
  - bystander-intervention
- id: fc-psy-w23-005
  concept: Thí nghiệm Hang Cướp (Robbers Cave)
  front: Muzafer Sherif (1961) đã dùng phương pháp nào để xóa bỏ sự thù địch giữa hai nhóm thiếu niên?
  back: Thiết lập các Mục tiêu chung cấp cao (Superordinate Goals) sống còn đòi hỏi sự phụ thuộc và chung sức của cả hai nhóm (như cùng kéo xe nước sinh hoạt bị hỏng).
  source_lesson: Psychology/notes/03-understanding-others/week-23-prejudice-conflict.md#41-thuyết-xung-đột-thực-tế--thí-nghiệm-hang-cướp-robbers-cave
  version: 1.0.0
  tags:
  - w23
  - robbers-cave
- id: fc-psy-w23-006
  concept: Giả thuyết Tiếp xúc của Allport (Contact Hypothesis)
  front: Bốn điều kiện bắt buộc để tiếp xúc liên nhóm làm giảm định kiến theo Gordon Allport (1954) là gì?
  back: 1) Vị thế bình đẳng; 2) Cùng mục tiêu chung; 3) Hợp tác phụ thuộc lẫn nhau không cạnh tranh; 4) Có sự ủng hộ và bảo trợ của thể chế/luật pháp.
  source_lesson: Psychology/notes/03-understanding-others/week-23-prejudice-conflict.md#42-giả-thuyết-tiếp-xúc-của-allport--4-điều-kiện-bắt-buộc
  version: 1.0.0
  tags:
  - w23
  - contact-hypothesis
- id: fc-psy-w23-007
  concept: Phớt lờ đa số (Pluralistic Ignorance)
  front: Hiện tượng Phớt lờ đa số cản trở nhận thức nguy hiểm trong tình huống khẩn cấp như thế nào?
  back: Trong tình huống mơ hồ, mỗi người đều nhìn người khác để dò xét phản ứng; vì ai cũng cố giữ vẻ bình thản bên ngoài, mọi người cùng kết luận sai rằng sự việc không có gì nguy hiểm.
  source_lesson: Psychology/notes/03-understanding-others/week-23-prejudice-conflict.md#33-hiệu-ứng-người-ngoài-cuộc-bystander-effect
  version: 1.0.0
  tags:
  - w23
  - pluralistic-ignorance
- id: fc-psy-w23-008
  concept: Meta-analysis Pettigrew & Tropp (2006)
  front: Bằng chứng thực nghiệm quy mô lớn của Pettigrew & Tropp (2006) khẳng định điều gì về định kiến?
  back: Phân tích trên 515 nghiên cứu khẳng định tiếp xúc liên nhóm làm giảm định kiến một cách có ý nghĩa thực nghiệm vững chắc (r = -0.215), đặc biệt mạnh khi thỏa mãn đủ điều kiện của Allport.
  source_lesson: Psychology/notes/03-understanding-others/week-23-prejudice-conflict.md#42-giả-thuyết-tiếp-xúc-của-allport--4-điều-kiện-bắt-buộc
  version: 1.0.0
  tags:
  - w23
  - pettigrew-tropp-evidence
