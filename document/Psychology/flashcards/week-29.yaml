deck_id: "deck-psy-w29"
subject: "Psychology"
lesson_id: "week-29-needs-communication"
version: "1.0.0"
description: "Flashcards ôn tập Tuần 29 - Giao tiếp nhu cầu"

cards:
  - id: "fc-psy-w29-001"
    concept: "Criticism vs Complaint"
    front: "Sự khác biệt giữa Chỉ trích (Criticism) và Phàn nàn (Complaint) là gì?"
    back: "Phàn nàn tập trung vào một hành vi/sự kiện cụ thể. Chỉ trích tấn công vào bản chất, tính cách của đối tác (thường kèm từ 'luôn luôn', 'không bao giờ')."
    source_lesson: "Psychology/notes/04-love-relationships/week-29-needs-communication.md"
    version: "1.0.0"
    tags:
      - "gottman"

  - id: "fc-psy-w29-002"
    concept: "Contempt"
    front: "Tại sao Khinh miệt (Contempt) là Kỵ sĩ nguy hiểm nhất?"
    back: "Vì nó thể hiện thái độ đứng bề trên, thiếu tôn trọng đối tác (mỉa mai, nhếch mép, châm biếm), phá vỡ nền tảng tôn trọng trong tình yêu."
    source_lesson: "Psychology/notes/04-love-relationships/week-29-needs-communication.md"
    version: "1.0.0"
    tags:
      - "gottman"

  - id: "fc-psy-w29-003"
    concept: "Stonewalling & Flooding"
    front: "Xây tường (Stonewalling) thường xảy ra do trạng thái sinh lý nào?"
    back: "Flooding (Quá tải cảm xúc), khi hệ thần kinh bị kích thích mạnh khiến nhịp tim tăng cao, người đó rút lui để bảo vệ bản thân."
    source_lesson: "Psychology/notes/04-love-relationships/week-29-needs-communication.md"
    version: "1.0.0"
    tags:
      - "gottman"
      - "biology"

  - id: "fc-psy-w29-004"
    concept: "Bids for connection"
    front: "Bids for connection là gì?"
    back: "Là bất kỳ nỗ lực nào (lời nói, cử chỉ) để thu hút sự chú ý, kết nối hoặc ủng hộ từ đối tác."
    source_lesson: "Psychology/notes/04-love-relationships/week-29-needs-communication.md"
    version: "1.0.0"
    claim_ids:
      - "C29-01"
    tags:
      - "gottman"

  - id: "fc-psy-w29-005"
    concept: "Turning toward"
    front: "Hành động 'Turning toward' mang lại lợi ích gì theo Gottman?"
    back: "Việc phản hồi tích cực các bids for connection giúp xây dựng niềm tin và sự hài lòng lâu dài (chiếm 86% ở các cặp hạnh phúc)."
    source_lesson: "Psychology/notes/04-love-relationships/week-29-needs-communication.md"
    version: "1.0.0"
    tags:
      - "relationships"

  - id: "fc-psy-w29-006"
    concept: "Active Listening"
    front: "Yếu tố cốt lõi của Lắng nghe chủ động (Active listening) là gì?"
    back: "Tập trung hoàn toàn vào người nói, không ngắt lời, và thực hiện lắng nghe phản chiếu (reflective listening) để xác nhận sự thấu hiểu cảm xúc."
    source_lesson: "Psychology/notes/04-love-relationships/week-29-needs-communication.md"
    version: "1.0.0"
    tags:
      - "communication"

  - id: "fc-psy-w29-007"
    concept: "NVC Framework"
    front: "4 bước của Giao tiếp phi bạo lực (NVC) là gì?"
    back: "1. Quan sát không phán xét, 2. Nêu cảm xúc, 3. Xác định nhu cầu, 4. Đưa ra yêu cầu cụ thể."
    source_lesson: "Psychology/notes/04-love-relationships/week-29-needs-communication.md"
    version: "1.0.0"
    tags:
      - "framework"

  - id: "fc-psy-w29-008"
    concept: "Repair attempts"
    front: "Repair attempts (Nỗ lực sửa chữa) đóng vai trò gì trong xung đột?"
    back: "Là các hành động (như xin lỗi, hài hước nhẹ nhàng) giúp giảm căng thẳng và ngăn chặn xung đột leo thang vượt khỏi tầm kiểm soát."
    source_lesson: "Psychology/notes/04-love-relationships/week-29-needs-communication.md"
    version: "1.0.0"
    tags:
      - "conflict-resolution"
