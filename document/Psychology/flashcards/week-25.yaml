deck_id: "deck-psy-w25"
subject: "Psychology"
lesson_id: "week-25-attachment"
version: "1.0.0"
description: "Bộ thẻ Flashcard chuẩn hóa ôn tập ngắt quãng (Spaced Repetition - R5 Compliant) Tuần 25: Attachment: Nguồn gốc, bằng chứng và giới hạn"

cards:
  - id: "fc-psy-w25-001"
    concept: "Hệ thống Hành vi Gắn bó (Attachment Behavioral System)"
    front: "Hệ thống hành vi gắn bó (Attachment Behavioral System) theo John Bowlby là gì và cơ chế kích hoạt - ngừng kích hoạt của nó hoạt động như thế nào?"
    back: "Là một hệ thống động lực bẩm sinh tiến hóa nhằm thúc đẩy cá nhân tìm kiếm và duy trì sự gần gũi với người chăm sóc chính (đối tượng gắn bó). Hệ thống được kích hoạt khi đối mặt với đe dọa, đau đớn, mệt mỏi hoặc khoảng cách xa xôi; và được làm dịu (ngừng kích hoạt) khi người bảo bọc xuất hiện và đáp ứng kịp thời, mang lại cảm giác an toàn."
    source_lesson: "Psychology/notes/04-love-relationships/week-25-attachment.md"
    version: "1.0.0"
    claim_ids:
      - "C25-01"
      - "C25-02"
    tags:
      - "attachment"
      - "bowlby"
      - "evolutionary"

  - id: "fc-psy-w25-002"
    concept: "Chức năng Tiến hóa Sinh học của Gắn bó"
    front: "Vì sao John Bowlby bác bỏ quan điểm phân tâm học cổ điển cho rằng trẻ yêu mẹ chỉ vì 'nguồn thức ăn'?"
    back: "Bowlby (cùng bằng chứng từ nghiên cứu khỉ con của Harry Harlow) chỉ ra rằng nhu cầu tiếp xúc trấn an (contact comfort) và sự bảo vệ trước kẻ săn mồi là cơ chế sinh học độc lập, tối quan trọng cho sự sống còn sơ sinh. Gắn bó là một hệ thống bản năng sinh tồn riêng biệt, không phải là sản phẩm phụ thứ cấp của phản xạ bú sữa hay giảm cơn đói."
    source_lesson: "Psychology/notes/04-love-relationships/week-25-attachment.md"
    version: "1.0.0"
    claim_ids:
      - "C25-02"
    tags:
      - "evolutionary"
      - "harlow"
      - "drive-theory"

  - id: "fc-psy-w25-003"
    concept: "Mô hình Hoạt động Nội tâm (Internal Working Models - IWM)"
    front: "Khái niệm 'Mô hình Hoạt động Nội tâm' (Internal Working Models) của John Bowlby bao gồm hai thành phần cốt lõi nào?"
    back: "Gồm hai thành phần: (1) Mô hình về bản thân (Model of Self) — niềm tin về việc bản thân có xứng đáng được yêu thương và tôn trọng hay không; và (2) Mô hình về người khác (Model of Other) — niềm tin về việc người khác có đáng tin cậy, an toàn và sẵn sàng hỗ trợ khi mình gặp hoạn nạn hay không."
    source_lesson: "Psychology/notes/04-love-relationships/week-25-attachment.md"
    version: "1.0.0"
    claim_ids:
      - "C25-02"
    tags:
      - "iwm"
      - "cognitive-schema"
      - "mental-model"

  - id: "fc-psy-w25-004"
    concept: "Quy trình Tình huống Lạ (Strange Situation)"
    front: "Trong thực nghiệm 'Tình huống Lạ' (Strange Situation) của Mary Ainsworth, giai đoạn quan sát nào là thước đo quyết định nhất để phân loại kiểu gắn bó?"
    back: "Giai đoạn tái ngộ (Reunion episodes): phản ứng của đứa trẻ khi người mẹ quay trở lại phòng sau thời gian chia cách. Mức độ khóc lúc mẹ đi không quyết định bằng việc trẻ phản ứng thế nào khi tái hợp: trẻ an toàn chủ động tìm kiếm tiếp xúc và bình tĩnh lại nhanh chóng; trẻ né tránh phớt lờ lạnh nhạt; trẻ kháng cự vừa bám lấy vừa giận dữ cự tuyệt."
    source_lesson: "Psychology/notes/04-love-relationships/week-25-attachment.md"
    version: "1.0.0"
    claim_ids:
      - "C25-03"
    tags:
      - "ainsworth"
      - "strange-situation"
      - "methodology"

  - id: "fc-psy-w25-005"
    concept: "Gắn bó An toàn ở Trẻ nhỏ (Secure - Type B)"
    front: "Đặc điểm hành vi của trẻ gắn bó an toàn (Type B) trong Tình huống Lạ và hành vi chăm sóc tương ứng của người mẹ là gì?"
    back: "Trẻ sử dụng mẹ làm điểm tựa an toàn (secure base) để khám phá đồ chơi; khi mẹ rời đi trẻ có thể buồn bã; khi mẹ quay lại trẻ chào đón nồng nhiệt, được xoa dịu nhanh chóng và tiếp tục chơi. Người mẹ có độ nhạy cảm cao (maternal sensitivity), phản hồi nhất quán, kịp thời và tôn trọng tín hiệu cảm xúc của trẻ."
    source_lesson: "Psychology/notes/04-love-relationships/week-25-attachment.md"
    version: "1.0.0"
    claim_ids:
      - "C25-03"
    tags:
      - "secure-attachment"
      - "parenting"
      - "infancy"

  - id: "fc-psy-w25-006"
    concept: "Gắn bó Né tránh ở Trẻ nhỏ (Insecure-Avoidant - Type A)"
    front: "Phản ứng của trẻ gắn bó né tránh (Type A) khi mẹ rời đi và quay lại phản ánh cơ chế thích nghi tâm lý nào?"
    back: "Trẻ dường như không bận tâm khi mẹ rời đi và lảng tránh, phớt lờ khi mẹ quay lại. Tuy nhiên, đo lường sinh lý (nhịp tim, cortisol) cho thấy trẻ cực kỳ căng thẳng. Đây là cơ chế tự vệ ức chế biểu lộ cảm xúc để tránh bị từ chối thêm bởi người mẹ thường xuyên từ chối tiếp xúc thân thể hoặc áp đặt."
    source_lesson: "Psychology/notes/04-love-relationships/week-25-attachment.md"
    version: "1.0.0"
    claim_ids:
      - "C25-03"
    tags:
      - "avoidant"
      - "deactivating"
      - "infancy"

  - id: "fc-psy-w25-007"
    concept: "Gắn bó Kháng cự / Nửa vời ở Trẻ nhỏ (Insecure-Resistant / Ambivalent - Type C)"
    front: "Trẻ gắn bó kháng cự (Type C) phản ứng ra sao trong Tình huống Lạ và nguyên nhân chăm sóc gia đình là gì?"
    back: "Trẻ quá bận tâm bám lấy mẹ, ít khám phá đồ chơi; khi mẹ đi trẻ hoảng loạn tột độ; khi mẹ trở lại trẻ vừa đòi bế vừa giận dữ đập đánh hoặc đẩy mẹ ra, không thể xoa dịu. Kiểu này bắt nguồn từ sự chăm sóc thất thường (inconsistent caregiving) — lúc ấm áp lúc bỏ bê, khiến trẻ phải duy trì báo động liên tục để giữ chân mẹ."
    source_lesson: "Psychology/notes/04-love-relationships/week-25-attachment.md"
    version: "1.0.0"
    claim_ids:
      - "C25-03"
    tags:
      - "ambivalent"
      - "hyperactivating"
      - "infancy"

  - id: "fc-psy-w25-008"
    concept: "Gắn bó Rối loạn định hướng (Disorganized / Disoriented - Type D)"
    front: "Mary Main & Judith Solomon đã bổ sung kiểu gắn bó Gắn bó Rối loạn (Type D) dựa trên những biểu hiện bất thường nào?"
    back: "Trẻ có những hành vi mâu thuẫn, mất định hướng khi mẹ tái ngộ: đứng bất động, trốn vào góc, tiếp cận rồi đột ngột thụt lùi, hoặc ngã xuống sàn. Cơ chế là 'nỗi sợ không lối thoát' (fright without solution): đối tượng gắn bó vừa là nguồn an toàn sinh học duy nhất vừa lại là nguồn phát sinh đe dọa (do bị lạm dụng, bạo lực hoặc cha mẹ bị sang chấn tâm lý nặng)."
    source_lesson: "Psychology/notes/04-love-relationships/week-25-attachment.md"
    version: "1.0.0"
    claim_ids:
      - "C25-03"
    tags:
      - "disorganized"
      - "trauma"
      - "type-d"

  - id: "fc-psy-w25-009"
    concept: "Gắn bó Lãng mạn ở Người trưởng thành (Hazan & Shaver 1987)"
    front: "Cindy Hazan & Phillip Shaver (1987) đã mở rộng lý thuyết gắn bó sang các mối quan hệ tình yêu lãng mạn người lớn như thế nào?"
    back: "Họ chứng minh rằng tình yêu lãng mạn là một quá trình gắn bó, trong đó bạn đời trở thành đối tượng gắn bó chính (primary attachment figure). Tỷ lệ phân bổ ba phong cách (An toàn ~60%, Né tránh ~25%, Lo âu ~15%) trong dân số người lớn xấp xỉ tương đồng với tỷ lệ ở trẻ sơ sinh, đồng thời dự đoán chất lượng và niềm tin trong mối quan hệ lãng mạn."
    source_lesson: "Psychology/notes/04-love-relationships/week-25-attachment.md"
    version: "1.0.0"
    claim_ids:
      - "C25-04"
    tags:
      - "adult-attachment"
      - "hazan-shaver"
      - "romantic-love"

  - id: "fc-psy-w25-010"
    concept: "Mô hình Bốn Phong cách Gắn bó Người lớn (Bartholomew & Horowitz 1991)"
    front: "Mô hình của Bartholomew & Horowitz (1991) phân loại 4 phong cách gắn bó người lớn dựa trên sự kết hợp của hai trục thứ nguyên nào?"
    back: "Dựa trên hai trục trực giao: Trục Lo âu (Anxiety - Mô hình Bản thân: Tích cực/Xứng đáng vs Tiêu cực/Không xứng đáng) và Trục Né tránh (Avoidance - Mô hình Người khác: Tích cực/Tin cậy vs Tiêu cực/Không tin cậy). Bốn phong cách là: An toàn (Secure), Lo âu - Bận tâm (Preoccupied), Né tránh - Bác bỏ (Dismissing-Avoidant), và Né tránh - Lo âu (Fearful-Avoidant)."
    source_lesson: "Psychology/notes/04-love-relationships/week-25-attachment.md"
    version: "1.0.0"
    claim_ids:
      - "C25-04"
    tags:
      - "bartholomew-horowitz"
      - "four-category-model"
      - "framework"

  - id: "fc-psy-w25-011"
    concept: "Phong cách Né tránh - Bác bỏ (Dismissing-Avoidant)"
    front: "Cơ chế tâm lý phòng vệ cốt lõi của người có phong cách Né tránh - Bác bỏ (Dismissing-Avoidant) là gì?"
    back: "Mô hình bản thân tích cực mang tính phòng thủ ('Tôi hoàn hảo và hoàn toàn tự lập') kết hợp mô hình người khác tiêu cực ('Người khác phiền phức và không đáng tin'). Họ dùng chiến lược vô hiệu hóa (deactivating strategy): chủ động hạ thấp giá trị của sự thân mật, kìm nén nhu cầu cảm xúc và đề cao sự tự chủ cực đoan nhằm không bao giờ bị phụ thuộc vào ai."
    source_lesson: "Psychology/notes/04-love-relationships/week-25-attachment.md"
    version: "1.0.0"
    claim_ids:
      - "C25-04"
    tags:
      - "dismissing"
      - "avoidance"
      - "defense-mechanism"

  - id: "fc-psy-w25-012"
    concept: "Phong cách Né tránh - Lo âu (Fearful-Avoidant)"
    front: "Nghịch lý nội tâm đau khổ của người có phong cách Né tránh - Lo âu (Fearful-Avoidant) trong tình yêu biểu hiện ra sao?"
    back: "Mô hình bản thân tiêu cực ('Tôi khiếm khuyết, không đáng yêu') và mô hình người khác tiêu cực ('Người khác sẽ phản bội, tổn thương tôi'). Họ khao khát mãnh liệt sự gắn kết thân mật nhưng khi đối phương tiến lại gần thì nỗi sợ hãi bị từ chối và tổn thương bị kích hoạt dữ dội, khiến họ lập tức hoảng sợ rút lui."
    source_lesson: "Psychology/notes/04-love-relationships/week-25-attachment.md"
    version: "1.0.0"
    claim_ids:
      - "C25-04"
    tags:
      - "fearful-avoidant"
      - "ambivalence"
      - "inner-conflict"

  - id: "fc-psy-w25-013"
    concept: "Chiến lược Kích hoạt Quá mức (Hyperactivating Strategies)"
    front: "Chiến lược kích hoạt quá mức (Hyperactivating Strategies) của người gắn bó Lo âu bao gồm các biểu hiện cụ thể nào?"
    back: "Cảnh giác cao độ với các dấu hiệu lạnh nhạt hoặc xa cách; phóng đại sự lo lắng và đau khổ nội tâm; liên tục nhắn tin, gọi điện, tra hỏi để tìm kiếm sự trấn an tức thì; đắm chìm trong suy nghĩ luẩn quẩn về việc đối tác sẽ bỏ rơi mình. Mục tiêu là cưỡng ép đối phương phải phản hồi để dập tắt nỗi sợ hãi tức thời."
    source_lesson: "Psychology/notes/04-love-relationships/week-25-attachment.md"
    version: "1.0.0"
    claim_ids:
      - "C25-04"
    tags:
      - "hyperactivating"
      - "anxiety"
      - "regulation"

  - id: "fc-psy-w25-014"
    concept: "Chiến lược Vô hiệu hóa (Deactivating Strategies)"
    front: "Chiến lược vô hiệu hóa (Deactivating Strategies) của người gắn bó Né tránh hoạt động nhằm mục đích gì?"
    back: "Hạ thấp kích hoạt của hệ thống gắn bó để duy trì cảm giác kiểm soát và độc lập. Các biểu hiện: đánh lạc hướng bản thân bằng công việc/sở thích; né tránh thảo luận cảm xúc; phóng đại khuyết điểm nhỏ của đối phương để tạo cớ xa lánh ('chúng ta không hợp nhau'); lạnh lùng và rút lui trong các cuộc đối thoại mâu thuẫn."
    source_lesson: "Psychology/notes/04-love-relationships/week-25-attachment.md"
    version: "1.0.0"
    claim_ids:
      - "C25-04"
    tags:
      - "deactivating"
      - "avoidance"
      - "emotional-suppression"

  - id: "fc-psy-w25-015"
    concept: "Vòng xoáy Đuổi - Chạy (Pursue-Withdraw Cycle)"
    front: "Tại sao sự kết hợp giữa người Gắn bó Lo âu và người Gắn bó Né tránh thường tạo thành cái bẫy mâu thuẫn độc hại 'Đuổi - Chạy'?"
    back: "Người lo âu cảm thấy bất an bèn gia tăng áp lực đòi kết nối (Pursue/Đuổi). Áp lực đó kích hoạt nỗi sợ bị kiểm soát của người né tránh, khiến họ lùi lại và im lặng (Withdraw/Chạy). Sự im lặng của người né tránh càng xác nhận nỗi sợ bị bỏ rơi của người lo âu, khiến họ đuổi gắt hơn, đẩy chu kỳ leo thang thành xung đột kiệt quệ."
    source_lesson: "Psychology/notes/04-love-relationships/week-25-attachment.md"
    version: "1.0.0"
    claim_ids:
      - "C25-04"
    tags:
      - "pursue-withdraw"
      - "relationship-dynamics"
      - "conflict"

  - id: "fc-psy-w25-016"
    concept: "An toàn Có được (Earned Security)"
    front: "Khái niệm 'An toàn Có được' (Earned Security) chứng minh điều gì về tính linh hoạt của phong cách gắn bó?"
    back: "Chứng minh rằng phong cách gắn bó không phải là bản án định mệnh bất biến. Một người dù trải qua tuổi thơ bất an hay tổn thương gia đình vẫn có thể xây dựng phong cách gắn bó an toàn ở tuổi trưởng thành thông qua quá trình tự phản tỉnh sâu sắc, trị liệu tâm lý, hoặc gắn bó lâu dài với một người bạn đời có phong cách an toàn."
    source_lesson: "Psychology/notes/04-love-relationships/week-25-attachment.md"
    version: "1.0.0"
    claim_ids:
      - "C25-05"
    tags:
      - "earned-security"
      - "plasticity"
      - "healing"

  - id: "fc-psy-w25-017"
    concept: "Tính Ổn định Dọc và Mức độ Dự đoán của Gắn bó"
    front: "Nghiên cứu phân tích gộp của Fraley (2002) về tính ổn định của phong cách gắn bó từ thời thơ ấu sang trưởng thành cho kết quả thế nào?"
    back: "Hệ số tương quan duy trì ở mức trung bình ($r \approx 0.25 - 0.39$), chỉ giải thích khoảng 6% - 15% phương sai. Điều này chứng minh quá khứ tạo ra khuynh hướng nền tảng, nhưng trải nghiệm sống, các mối quan hệ trưởng thành và nỗ lực cá nhân đóng vai trò quyết định trong việc duy trì hay chuyển hóa kiểu gắn bó."
    source_lesson: "Psychology/notes/04-love-relationships/week-25-attachment.md"
    version: "1.0.0"
    claim_ids:
      - "C25-05"
    tags:
      - "fraley"
      - "longitudinal"
      - "effect-size"

  - id: "fc-psy-w25-018"
    concept: "Hiểu lầm Cốt lõi về Gắn bó trong Tâm lý học Đại chúng"
    front: "Sai lầm nguy hại nhất của tâm lý học đại chúng (pop psychology) khi ứng dụng lý thuyết gắn bó vào tình yêu là gì?"
    back: "Biến phong cách gắn bó thành các 'nhãn dán tính cách bất biến' (như cung hoàng đạo), định tội người né tránh là 'độc hại' và ngụy biện rằng người lo âu 'vì quá yêu nên mới kiểm soát'. Về mặt khoa học, phong cách gắn bó là chiến lược điều hòa cảm xúc mang tính thứ nguyên và hoàn toàn có thể biến đổi theo bối cảnh quan hệ."
    source_lesson: "Psychology/notes/04-love-relationships/week-25-attachment.md"
    version: "1.0.0"
    claim_ids:
      - "C25-01"
      - "C25-05"
    tags:
      - "pop-psychology"
      - "critical-thinking"
      - "myths"
