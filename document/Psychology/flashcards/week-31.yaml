deck_id: "deck-psy-w31"
subject: "Psychology"
lesson_id: "week-31-conflict-repair"
version: "1.0.0"
description: "Bộ thẻ ôn tập Tuần 31: Xung đột, repair attempts, xin lỗi và tha thứ"

cards:
  - id: "fc-psy-w31-001"
    concept: "Gottman Four Horsemen"
    front: "Bốn 'kỵ sĩ ngày tận thế' (Four Horsemen) của Gottman trong xung đột mối quan hệ là gì, và tại sao contempt được coi là nguy hiểm nhất?"
    back: "Bốn horsemen: (1) Criticism; (2) Contempt; (3) Defensiveness; (4) Stonewalling. Contempt nguy hiểm nhất vì nó truyền tải thông điệp 'tôi thấy bạn thấp hơn tôi'."
    source_lesson: "Psychology/notes/04-love-relationships/week-31-conflict-repair.md"
    version: "1.0.0"
    claim_ids:
      - "C31-01"
    tags:
      - "four-horsemen"
      - "contempt"
      - "gottman"
      - "conflict"

  - id: "fc-psy-w31-002"
    concept: "Repair Attempts"
    front: "Repair attempts là gì và yếu tố nào quyết định sự thành công của nó?"
    back: "Là những hành động/lời nói nhằm giảm nhiệt căng thẳng. Sự thành công phụ thuộc vào chất lượng tình bạn nền tảng của cặp đôi."
    source_lesson: "Psychology/notes/04-love-relationships/week-31-conflict-repair.md"
    version: "1.0.0"
    claim_ids:
      - "C31-04"
    tags:
      - "repair"
      - "gottman"

  - id: "fc-psy-w31-003"
    concept: "Tha thứ vs Hòa giải"
    front: "Phân biệt Tha thứ (Forgiveness) và Hòa giải (Reconciliation)."
    back: "Tha thứ là thay đổi nội tâm, buông bỏ oán giận (có thể diễn ra đơn phương). Hòa giải là khôi phục mối quan hệ, cần sự nỗ lực của cả hai."
    source_lesson: "Psychology/notes/04-love-relationships/week-31-conflict-repair.md"
    version: "1.0.0"
    claim_ids:
      - "C31-05"
    tags:
      - "forgiveness"

  - id: "fc-psy-w31-004"
    concept: "Effective Apology"
    front: "Các thành tố của một lời xin lỗi hiệu quả?"
    back: "Thừa nhận hành vi, nhận trách nhiệm, bày tỏ hối tiếc chân thành, và đưa ra hành động sửa đổi."
    source_lesson: "Psychology/notes/04-love-relationships/week-31-conflict-repair.md"
    version: "1.0.0"
    claim_ids:
      - "C31-05"
    tags:
      - "apology"

  - id: "fc-psy-w31-005"
    concept: "Conflict Styles"
    front: "Kể tên 5 phong cách giải quyết xung đột theo mô hình Thomas-Kilmann."
    back: "Avoiding, Accommodating, Competing, Compromising, Collaborating."
    source_lesson: "Psychology/notes/04-love-relationships/week-31-conflict-repair.md"
    version: "1.0.0"
    claim_ids:
      - "C31-06"
    tags:
      - "conflict"

  - id: "fc-psy-w31-006"
    concept: "Condoning"
    front: "Sự bào chữa (condoning) khác với tha thứ như thế nào?"
    back: "Condoning là biện minh hoặc cho rằng hành vi sai trái đó là hợp lý hoặc không đáng kể, phủ nhận nỗi đau. Tha thứ thừa nhận nỗi đau nhưng chọn buông bỏ."
    source_lesson: "Psychology/notes/04-love-relationships/week-31-conflict-repair.md"
    version: "1.0.0"
    claim_ids:
      - "C31-05"
    tags:
      - "forgiveness"
      - "condoning"

  - id: "fc-psy-w31-007"
    concept: "Defensiveness"
    front: "Defensiveness trong mô hình Gottman biểu hiện như thế nào?"
    back: "Đổ lỗi ngược lại đối phương, không nhận trách nhiệm về phần lỗi của mình trong vấn đề."
    source_lesson: "Psychology/notes/04-love-relationships/week-31-conflict-repair.md"
    version: "1.0.0"
    claim_ids:
      - "C31-03"
    tags:
      - "four-horsemen"
      - "defensiveness"

  - id: "fc-psy-w31-008"
    concept: "Research Limitations"
    front: "Hạn chế phổ biến trong các nghiên cứu ban đầu về hôn nhân của Gottman là gì?"
    back: "Mẫu nghiên cứu chủ yếu là các cặp đôi dị tính, da trắng, phương Tây (WEIRD), nên cần cẩn trọng khi khái quát hóa."
    source_lesson: "Psychology/notes/04-love-relationships/week-31-conflict-repair.md"
    version: "1.0.0"
    claim_ids:
      - "C31-07"
    tags:
      - "research-methods"
      - "limitations"
