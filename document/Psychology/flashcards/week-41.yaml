deck_id: "deck-psy-w41"
subject: "Psychology"
lesson_id: "week-41-personality-disorders"
version: "1.0.0"
description: "Bộ thẻ ôn tập Tuần 41: Rối loạn Nhân cách: Dải Liên tục, Bối cảnh và Chống Kỳ thị"

cards:
  - id: "fc-psy-w41-001"
    concept: "Khái niệm Rối loạn Nhân cách theo DSM-5-TR"
    front: "Tiêu chuẩn chẩn đoán chung cốt lõi của Rối loạn Nhân cách theo DSM-5-TR là gì?"
    back: "Khuôn mẫu trải nghiệm nội tâm và hành vi kéo dài, cứng nhắc, lệch lạc khỏi kỳ vọng văn hóa trong ít nhất 2/4 lĩnh vực (Nhận thức, Cảm xúc, Chức năng liên cá nhân, Kiểm soát xung động), khởi phát từ thanh thiếu niên và gây suy giảm chức năng nghiêm trọng."
    source_lesson: "Psychology/notes/05-development-mental-health/week-41-personality-disorders.md"
    version: "1.0.0"
    claim_ids:
      - "C41-01"
    tags:
      - "personality-disorders"
      - "dsm-5-tr"
      - "criteria"

  - id: "fc-psy-w41-002"
    concept: "Ba Cụm Rối loạn Nhân cách (Clusters A, B, C)"
    front: "Ba cụm (Clusters) rối loạn nhân cách trong DSM-5-TR bao gồm những nhóm nào và đặc trưng khái quát ra sao?"
    back: "Cụm A (Lập dị/kỳ quặc: Paranoid, Schizoid, Schizotypal); Cụm B (Kịch tính/bốc đồng/biến động cảm xúc: Antisocial, Borderline, Histrionic, Narcissistic); Cụm C (Lo âu/sợ hãi: Avoidant, Dependent, OCPD)."
    source_lesson: "Psychology/notes/05-development-mental-health/week-41-personality-disorders.md"
    version: "1.0.0"
    claim_ids:
      - "C41-01"
    tags:
      - "clusters"
      - "cluster-a"
      - "cluster-b"
      - "cluster-c"

  - id: "fc-psy-w41-003"
    concept: "Mô hình Thứ nguyên Thay thế AMPD (DSM-5 Section III)"
    front: "Mô hình AMPD đánh giá rối loạn nhân cách dựa trên hai trục tiêu chí cốt lõi nào?"
    back: "Tiêu chí A: Mức độ suy giảm chức năng nhân cách ở miền Bản thân (Bản sắc, Tự định hướng) và Liên cá nhân (Thấu cảm, Thân mật). Tiêu chí B: 5 miền nét bệnh lý thứ nguyên (Khí sắc tiêu cực, Tách biệt, Đối kháng, Vô ức chế, Loạn thần)."
    source_lesson: "Psychology/notes/05-development-mental-health/week-41-personality-disorders.md"
    version: "1.0.0"
    claim_ids:
      - "C41-02"
    tags:
      - "ampd"
      - "dimensional-model"
      - "dsm-5-section-iii"

  - id: "fc-psy-w41-004"
    concept: "Ưu thế của Tiếp cận Dải liên tục (Continuum) trong Nhân cách"
    front: "Vì sao tiếp cận Dải liên tục (Continuum) được đánh giá là ưu việt hơn phân loại danh mục nhị phân truyền thống?"
    back: "Nó loại bỏ các ngưỡng cắt chẩn đoán tùy tiện, giải quyết vấn đề trùng lặp bệnh lý quá cao (comorbidity), và mô tả chính xác bức tranh tâm lý cá nhân hóa phản ánh đúng bản chất đa chiều của con người."
    source_lesson: "Psychology/notes/05-development-mental-health/week-41-personality-disorders.md"
    version: "1.0.0"
    claim_ids:
      - "C41-02"
    tags:
      - "continuum"
      - "dimensional"
      - "widiger-trull"

  - id: "fc-psy-w41-005"
    concept: "Thuyết Sinh học Xã hội của Marsha Linehan về BPD"
    front: "Thuyết Sinh học Xã hội (Biosocial Theory) giải thích nguồn gốc của Rối loạn Nhân cách Ranh giới (BPD) như thế nào?"
    back: "BPD là kết quả tương tác giữa tính dễ tổn thương cảm xúc bẩm sinh (hệ thần kinh phản ứng nhạy bén, biên độ cảm xúc lớn, chậm cân bằng lại) và môi trường sống vô hiệu hóa (nơi cảm xúc chân thật bị gia đình/xã hội bác bỏ, trừng phạt)."
    source_lesson: "Psychology/notes/05-development-mental-health/week-41-personality-disorders.md"
    version: "1.0.0"
    claim_ids:
      - "C41-03"
    tags:
      - "bpd"
      - "biosocial-theory"
      - "marsha-linehan"

  - id: "fc-psy-w41-006"
    concept: "Liệu pháp Hành vi Biện chứng (DBT) và Can thiệp BPD"
    front: "DBT là gì và tại sao được xem là tiêu chuẩn vàng trong can thiệp BPD?"
    back: "Liệu pháp Hành vi Biện chứng do Marsha Linehan sáng lập, kết hợp sự chấp nhận (Mindfulness/Chánh niệm) và thay đổi (Điều hòa cảm xúc, Hiệu quả liên cá nhân, Chịu đựng nghịch cảnh); có bằng chứng RCT mạnh mẽ nhất giúp giảm tự hại và ổn định tâm lý."
    source_lesson: "Psychology/notes/05-development-mental-health/week-41-personality-disorders.md"
    version: "1.0.0"
    claim_ids:
      - "C41-03"
    tags:
      - "dbt"
      - "bpd-treatment"
      - "mindfulness"

  - id: "fc-psy-w41-007"
    concept: "Phân biệt Hai Kiểu hình Ái kỷ (Grandiose vs Vulnerable)"
    front: "Hai kiểu hình lâm sàng khác biệt của Rối loạn Nhân cách Ái kỷ (NPD) là gì?"
    back: "Ái kỷ Phô trương (Grandiose: tự cao tự đại, kiêu ngạo, khao khát quyền lực, khai thác người khác) và Ái kỷ Dễ tổn thương (Vulnerable: tự ti, lo âu, cảm giác bất an sâu sắc, cực kỳ nhạy cảm với chỉ trích và mang nặng mặc cảm xấu hổ bên trong)."
    source_lesson: "Psychology/notes/05-development-mental-health/week-41-personality-disorders.md"
    version: "1.0.0"
    claim_ids:
      - "C41-04"
    tags:
      - "narcissism"
      - "npd"
      - "grandiose"
      - "vulnerable"

  - id: "fc-psy-w41-008"
    concept: "Nguyên tắc Person-First & Chống Kỳ thị trong Nhân cách"
    front: "Nguyên tắc Đạo đức và Ngôn ngữ Ưu tiên Con người (Person-first language) yêu cầu điều gì khi tiếp cận rối loạn nhân cách?"
    back: "Tách biệt bản sắc con người khỏi căn bệnh ('người đang trải nghiệm triệu chứng...' thay vì 'kẻ borderline/kẻ ái kỷ'); tuyệt đối không dùng chẩn đoán tâm thần làm vũ khí lăng mạ hay tẩy chay người khác trong đời sống."
    source_lesson: "Psychology/notes/05-development-mental-health/week-41-personality-disorders.md"
    version: "1.0.0"
    claim_ids:
      - "C41-05"
    tags:
      - "person-first"
      - "anti-stigma"
      - "ethics"
