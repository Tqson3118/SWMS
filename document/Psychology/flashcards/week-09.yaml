description: "Bộ thẻ Flashcard chuẩn hóa ôn tập ngắt quãng (Spaced Repetition - R5 Compliant) Tuần 09: Cảm xúc — Chức năng, Nhận diện và Điều hòa"

cards:
  - id: "fc-psy-w09-001"
    concept: "Phân biệt Cảm xúc và Tâm trạng"
    front: "Phân biệt Cảm xúc (Emotion) và Tâm trạng (Mood) theo thời lượng, cường độ và nguyên nhân kích hoạt?"
    back: "Cảm xúc là phản ứng cấp tính, dữ dội, xuất hiện nhanh sau một kích thích cụ thể, kéo dài ngắn (vài giây/phút). Tâm trạng có cường độ nhẹ hơn, kéo dài nhiều giờ/ngày, tính khuếch tán và thường không gắn liền với một nguyên nhân kích hoạt rõ rệt."
    source_lesson: "Psychology/notes/02-understanding-self/week-09-emotion.md"
    version: "1.0.0"
    claim_ids:
      - "C09-01"
    tags:
      - "emotion"
      - "mood"
      - "definition"

  - id: "fc-psy-w09-002"
    concept: "So sánh Thuyết James-Lange và Cannon-Bard"
    front: "Trình tự xuất hiện của kích hoạt sinh lý và trải nghiệm cảm xúc trong Thuyết James-Lange khác Thuyết Cannon-Bard như thế nào?"
    back: "James-Lange: Kích thích gây ra biến đổi sinh lý cơ thể trước, nhận thức về biến đổi này chính là cảm xúc ('sợ vì run'). Cannon-Bard: Kích thích qua đồi thị kích hoạt đồng thời và độc lập cả phản ứng sinh lý lẫn trải nghiệm cảm xúc chủ quan."
    source_lesson: "Psychology/notes/02-understanding-self/week-09-emotion.md"
    version: "1.0.0"
    claim_ids:
      - "C09-02"
    tags:
      - "james-lange"
      - "cannon-bard"
      - "theories-of-emotion"

  - id: "fc-psy-w09-003"
    concept: "Thuyết Hai Yếu Tố Schachter-Singer và Gán nhầm Kích hoạt"
    front: "Thuyết Hai Yếu Tố của Schachter-Singer giải thích cảm xúc ra sao và Hiện tượng Gán nhầm Kích hoạt sinh lý là gì?"
    back: "Cảm xúc = Kích hoạt sinh lý chung + Gán nhãn nhận thức dựa trên bối cảnh. Hiện tượng gán nhầm kích hoạt: khi cơ thể bị kích thích sinh lý bởi yếu tố môi trường (như sợ hãi trên cầu treo), cá nhân có thể dán nhãn nhầm thành sự rung động hấp dẫn tình cảm."
    source_lesson: "Psychology/notes/02-understanding-self/week-09-emotion.md"
    version: "1.0.0"
    claim_ids:
      - "C09-03"
    tags:
      - "schachter-singer"
      - "two-factor-theory"
      - "misattribution-of-arousal"

  - id: "fc-psy-w09-004"
    concept: "Thuyết Đánh giá Nhận thức Trung gian Lazarus"
    front: "Thuyết của Richard Lazarus định vị vai trò của Đánh giá nhận thức (Appraisal) trong cảm xúc như thế nào?"
    back: "Đánh giá nhận thức diễn ra trước và quyết định phản ứng cảm xúc lẫn sinh lý. Gồm đánh giá sơ cấp (xác định sự việc là mối đe dọa, tổn thất hay thách thức) và đánh giá thứ cấp (cân nhắc nguồn lực và khả năng ứng phó của bản thân)."
    source_lesson: "Psychology/notes/02-understanding-self/week-09-emotion.md"
    version: "1.0.0"
    claim_ids:
      - "C09-04"
    tags:
      - "lazarus"
      - "cognitive-appraisal"
      - "primary-secondary"

  - id: "fc-psy-w09-005"
    concept: "Hai Lộ trình Thần kinh Xử lý Sợ hãi của LeDoux"
    front: "Phân biệt Lộ trình Thấp (Low Road) và Lộ trình Cao (High Road) của hạch hạnh nhân trong cơ chế sợ hãi theo LeDoux?"
    back: "Lộ trình thấp: Đồi thị -> Hạch hạnh nhân, cực nhanh (~12ms), tín hiệu thô, kích hoạt phản xạ sinh tồn tức thời. Lộ trình cao: Đồi thị -> Vỏ não cảm giác -> Vỏ não trước trán -> Hạch hạnh nhân, chậm hơn (~30-40ms), phân tích chi tiết bối cảnh và điều hòa/ức chế nỗi sợ nếu là báo động giả."
    source_lesson: "Psychology/notes/02-understanding-self/week-09-emotion.md"
    version: "1.0.0"
    claim_ids:
      - "C09-05"
    tags:
      - "neuroscience"
      - "amygdala"
      - "ledoux"
      - "fear-pathways"

  - id: "fc-psy-w09-006"
    concept: "Tính Phổ quát Biểu cảm Nét mặt và Quy tắc Văn hóa"
    front: "Nghiên cứu của Paul Ekman chứng minh điều gì về biểu cảm nét mặt và Quy tắc thể hiện văn hóa chi phối điều gì?"
    back: "Có ít nhất 6 cảm xúc cơ bản (vui, buồn, sợ, giận, ghê tởm, ngạc nhiên) có biểu cảm nét mặt phổ quát sinh học bẩm sinh ở mọi nền văn hóa. Quy tắc thể hiện văn hóa (Display rules) quy định chuẩn mực về thời điểm, hoàn cảnh và mức độ được phép bộc lộ cảm xúc ra ngoài."
    source_lesson: "Psychology/notes/02-understanding-self/week-09-emotion.md"
    version: "1.0.0"
    claim_ids:
      - "C09-06"
    tags:
      - "ekman"
      - "facial-expressions"
      - "universal-emotions"
      - "display-rules"

  - id: "fc-psy-w09-007"
    concept: "Giả thuyết Phản hồi từ Khuôn mặt (Facial Feedback)"
    front: "Giả thuyết Phản hồi Khuôn mặt (Strack et al., 1988) phát biểu cơ chế tương tác hai chiều giữa nét mặt và cảm xúc ra sao?"
    back: "Sự co giãn của các nhóm cơ mặt có thể gửi tín hiệu cảm giác hướng tâm phản hồi ngược lại não bộ, trực tiếp điều chỉnh hoặc khuếch đại cường độ trải nghiệm cảm xúc (ngậm bút kích hoạt cơ cười làm tăng cảm nhận vui vẻ)."
    source_lesson: "Psychology/notes/02-understanding-self/week-09-emotion.md"
    version: "1.0.0"
    claim_ids:
      - "C09-07"
    tags:
      - "facial-feedback"
      - "strack"
      - "embodied-emotion"

  - id: "fc-psy-w09-008"
    concept: "Mô hình Điều hòa Cảm xúc James Gross"
    front: "So sánh Đánh giá lại nhận thức (Cognitive Reappraisal) và Đè nén biểu cảm (Expressive Suppression) theo James Gross?"
    back: "Đánh giá lại: can thiệp sớm, tái định hình ý nghĩa, giảm kích hoạt hạch hạnh nhân qua kiểm soát trước trán, không gây tải tim mạch giao cảm cấp tính và bảo toàn trí nhớ. Đè nén: can thiệp muộn, ức chế cơ mặt, tăng kích hoạt tim mạch giao cảm (co mạch, tăng huyết áp tức thời), suy giảm trí nhớ do tốn tài nguyên nhận thức."
    source_lesson: "Psychology/notes/02-understanding-self/week-09-emotion.md"
    version: "1.0.0"
    claim_ids:
      - "C09-08"
    tags:
      - "emotion-regulation"
      - "james-gross"
      - "reappraisal"
      - "suppression"
