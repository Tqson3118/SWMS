deck_id: "deck-psy-w47"
subject: "Psychology"
lesson_id: "week-47-personal-development-plan"
version: "1.0.0"
description: "Bộ thẻ ôn tập Tuần 47: Kế hoạch phát triển cá nhân dựa trên bằng chứng"

cards:
  - id: "fc-psy-w47-001"
    concept: "Nghịch lý của sự mơ mộng tích cực (Gabriele Oettingen)"
    front: "Tại sao việc chỉ hình dung tích cực về thành công (Positive fantasies) lại làm giảm hiệu suất hành động thực tế?"
    back: "Việc mơ mộng làm giảm huyết áp tâm thu (năng lượng sinh lý sụt giảm), đánh lừa não bộ rằng mục tiêu đã đạt được, triệt tiêu động lực vượt qua rào cản thực tế."
    source_lesson: "Psychology/notes/06-integration/week-47-personal-development-plan.md"
    version: "1.0.0"
    claim_ids:
      - "C47-01"
    tags:
      - "positive-fantasies"
      - "mental-contrasting"
      - "motivation"

  - id: "fc-psy-w47-002"
    concept: "Cơ chế Đối chiếu Tinh thần (Mental Contrasting)"
    front: "Quy trình cốt lõi của Đối chiếu Tinh thần (Mental Contrasting) là gì?"
    back: "Kết nối hình dung kết quả mong muốn (Outcome) ngay lập tức với việc nhận diện trung thực chướng ngại nội tâm thực tế (Obstacle), kích hoạt nhận thức về sự cần thiết phải hành động."
    source_lesson: "Psychology/notes/06-integration/week-47-personal-development-plan.md"
    version: "1.0.0"
    claim_ids:
      - "C47-01"
    tags:
      - "mental-contrasting"
      - "oettingen"
      - "goal-pursuit"

  - id: "fc-psy-w47-003"
    concept: "Cấu trúc Ý định Thực thi 'Nếu - Thì' (Peter Gollwitzer)"
    front: "Cấu trúc chuẩn của một Ý định Thực thi (Implementation Intentions) khác gì mục tiêu thông thường?"
    back: "Cấu trúc Nếu - Thì: 'NẾU xuất hiện tình huống X, THÌ tôi sẽ thực hiện hành động Y', giúp chuyển quyền kiểm soát hành vi sang dấu hiệu bối cảnh kích hoạt tự động."
    source_lesson: "Psychology/notes/06-integration/week-47-personal-development-plan.md"
    version: "1.0.0"
    claim_ids:
      - "C47-02"
    tags:
      - "implementation-intentions"
      - "gollwitzer"
      - "if-then-plans"

  - id: "fc-psy-w47-004"
    concept: "Quy mô hiệu ứng của Kế hoạch Nếu - Thì (Gollwitzer & Sheeran, 2006)"
    front: "Phân tích gộp trên 94 nghiên cứu chứng minh tác động của kế hoạch Nếu - Thì ra sao?"
    back: "Quy mô hiệu ứng lớn (d = 0.65), tăng gấp đôi xác suất hoàn thành mục tiêu thông qua việc tăng cường khả năng nhận diện dấu hiệu và tự động hóa phản hồi hành vi."
    source_lesson: "Psychology/notes/06-integration/week-47-personal-development-plan.md"
    version: "1.0.0"
    claim_ids:
      - "C47-02"
    tags:
      - "meta-analysis"
      - "effect-size"
      - "automaticity"

  - id: "fc-psy-w47-005"
    concept: "Giao thức can thiệp WOOP 4 bước (Gabriele Oettingen)"
    front: "Bốn bước chuẩn hóa trong quy trình can thiệp WOOP là gì?"
    back: "1. Wish (Ước muốn ý nghĩa, khả thi); 2. Outcome (Hình dung kết quả tuyệt vời nhất); 3. Obstacle (Nhận diện chướng ngại nội tâm cốt lõi); 4. Plan (Lập kế hoạch Nếu - Thì)."
    source_lesson: "Psychology/notes/06-integration/week-47-personal-development-plan.md"
    version: "1.0.0"
    claim_ids:
      - "C47-03"
    tags:
      - "woop"
      - "intervention"
      - "self-regulation"

  - id: "fc-psy-w47-006"
    concept: "Vòng lặp tự điều hòa TOTE (Carver & Scheier, 1998)"
    front: "Mô hình vòng lặp TOTE giải thích cơ chế tự điều hòa hành vi như thế nào?"
    back: "Não bộ vận hành như bộ điều nhiệt: Test (so sánh hiện tại với tiêu chuẩn) -> Operate (hành động thu hẹp khoảng cách) -> Test (kiểm tra lại) -> Exit (hoàn thành)."
    source_lesson: "Psychology/notes/06-integration/week-47-personal-development-plan.md"
    version: "1.0.0"
    claim_ids:
      - "C47-04"
    tags:
      - "tote-loop"
      - "carver-scheier"
      - "feedback-loop"

  - id: "fc-psy-w47-007"
    concept: "Hội chứng Hy vọng Hão huyền & Hiệu ứng What-the-hell"
    front: "Cạm bẫy tâm lý nào khiến hầu hết các kế hoạch thay đổi thói quen bị sụp đổ?"
    back: "Kỳ vọng thay đổi quá nhanh và phi thực tế (False Hope Syndrome); khi lỡ phạm một lỗi nhỏ thì buông xuôi cực đoan (What-the-hell effect) và tự sỉ vả bản thân."
    source_lesson: "Psychology/notes/06-integration/week-47-personal-development-plan.md"
    version: "1.0.0"
    claim_ids:
      - "C47-04"
    tags:
      - "false-hope-syndrome"
      - "what-the-hell-effect"
      - "relapse"

  - id: "fc-psy-w47-008"
    concept: "Ba trụ cột Tự trắc ẩn trong mục tiêu (Kristin Neff)"
    front: "Ba thành tố của Tự trắc ẩn giúp bảo tồn ý chí khi gặp thất bại là gì?"
    back: "1. Tử tế với bản thân (thay vì tự phán xét hà khắc); 2. Nhận thức tính nhân loại chung (ai cũng vấp ngã); 3. Chánh niệm (nhìn nhận khách quan, không bi kịch hóa)."
    source_lesson: "Psychology/notes/06-integration/week-47-personal-development-plan.md"
    version: "1.0.0"
    claim_ids:
      - "C47-05"
    tags:
      - "self-compassion"
      - "kristin-neff"
      - "resilience"
