cards:
- id: fc-psy-w20-001
  concept: Huyền thoại Mehrabian (Quy tắc 7-38-55)
  front: Quy tắc 7-38-55 của Albert Mehrabian (1971) bị hiểu lầm như thế nào trong đời sống đại chúng?
  back: Bị hiểu lầm thành quy luật phổ quát cho mọi giao tiếp; thực chất nghiên cứu chỉ đo thái độ yêu/ghét đối với một từ ngữ đơn lẻ khi biểu cảm và lời nói mâu thuẫn trong phòng lab.
  source_lesson: Psychology/notes/03-understanding-others/week-20-nonverbal-communication-limits.md#31-giải-mã-huyền-thoại-mehrabian-quy-tắc-7-38-55
  version: 1.0.0
  tags:
  - w20
  - mehrabian-myth
- id: fc-psy-w20-002
  concept: Hành vi cơ sở (Baseline Behavior)
  front: Vì sao khái niệm 'hành vi cơ sở' (baseline) là điều kiện tiên quyết trong quan sát phi ngôn ngữ?
  back: Vì không có cử chỉ đơn lẻ nào mang nghĩa cố định; ta chỉ có thể phát hiện sự gia tăng căng thẳng khi quan sát độ lệch so với trạng thái tự nhiên, thoải mái của chính cá nhân đó.
  source_lesson: Psychology/notes/03-understanding-others/week-20-nonverbal-communication-limits.md#32-khái-niệm-hành-vi-cơ-sở-baseline-behavior
  version: 1.0.0
  tags:
  - w20
  - baseline-behavior
- id: fc-psy-w20-003
  concept: Biểu cảm khuôn mặt & Ngữ cảnh
  front: Báo cáo đồng thuận Barrett et al. (2019) kết luận điều gì về mối liên hệ giữa khuôn mặt và cảm xúc?
  back: Khuôn mặt không ánh xạ 1-1 với cảm xúc nội tâm; cách biểu lộ cảm xúc rất đa dạng và ngữ cảnh xã hội quyết định phần lớn ý nghĩa của biểu cảm.
  source_lesson: Psychology/notes/03-understanding-others/week-20-nonverbal-communication-limits.md#41-báo-cáo-đồng-thuận-về-biểu-cảm-khuôn-mặt-barrett-et-al-2019
  version: 1.0.0
  tags:
  - w20
  - facial-expressions
- id: fc-psy-w20-004
  concept: Độ chính xác phát hiện nói dối
  front: Meta-analysis của Bond & DePaulo (2006) chỉ ra tỷ lệ phát hiện nói dối trung bình của con người là bao nhiêu?
  back: Chỉ đạt khoảng 54%, xấp xỉ mức ngẫu nhiên của việc tung đồng xu (50%); ngay cả các chuyên gia điều tra cũng không đạt tỷ lệ cao vượt trội.
  source_lesson: Psychology/notes/03-understanding-others/week-20-nonverbal-communication-limits.md#33-con-người-có-phát-hiện-được-nói-dối-qua-cử-chỉ-không
  version: 1.0.0
  tags:
  - w20
  - deception-accuracy
- id: fc-psy-w20-005
  concept: Hướng nhìn mắt và Lời nói dối
  front: Thí nghiệm của Wiseman et al. (2012) kết luận thế nào về quan niệm 'nhìn mắt đoán nói dối'?
  back: Bác bỏ hoàn toàn tuyên bố của NLP; không có bất kỳ tương quan thực nghiệm nào giữa hướng nhìn chuyển động của mắt và việc bịa đặt dối trá.
  source_lesson: Psychology/notes/03-understanding-others/week-20-nonverbal-communication-limits.md#34-bảng-so-sánh-các-ngộ-nhận-về-ngôn-ngữ-cơ-thể
  version: 1.0.0
  tags:
  - w20
  - eye-movement-myth
- id: fc-psy-w20-006
  concept: Thiên kiến Chân thật (Truth Bias)
  front: Thiên kiến Chân thật (Truth Bias) là gì và có ý nghĩa tiến hóa nào?
  back: Là xu hướng mặc định tin rằng người khác đang nói thật; giúp con người tiết kiệm năng lượng nhận thức và duy trì sự hợp tác xã hội ổn định.
  source_lesson: Psychology/notes/03-understanding-others/week-20-nonverbal-communication-limits.md#42-tại-sao-con-người-thất-bại-trong-phát-hiện-dối-trá-bond--depaulo-2006
  version: 1.0.0
  tags:
  - w20
  - truth-bias
- id: fc-psy-w20-007
  concept: Kỹ thuật tăng tải nhận thức
  front: Phương pháp khoa học hiệu quả để kiểm tra sự thật trong lời khai theo Vrij et al. (2019) là gì?
  back: Tăng tải nhận thức (yêu cầu kể lại sự kiện theo trình tự đảo ngược) kết hợp đối chiếu tính nhất quán giữa lời nói và dữ kiện thực tế khách quan.
  source_lesson: Psychology/notes/03-understanding-others/week-20-nonverbal-communication-limits.md#43-kỹ-thuật-đánh-giá-tính-chân-thực-khoa-học-vrij-et-al-2019
  version: 1.0.0
  tags:
  - w20
  - cognitive-load-interview
- id: fc-psy-w20-008
  concept: Phân biệt Căng thẳng và Dối trá
  front: Vì sao các biểu hiện như toát mồ hôi, giọng run không thể coi là bằng chứng kết tội dối trá?
  back: Vì chúng chỉ phản ánh phản ứng kích hoạt của hệ giao cảm trước căng thẳng (stress); người nói thật bị nghi oan hoàn toàn có thể run rẩy và toát mồ hôi.
  source_lesson: Psychology/notes/03-understanding-others/week-20-nonverbal-communication-limits.md#32-khái-niệm-hành-vi-cơ-sở-baseline-behavior
  version: 1.0.0
  tags:
  - w20
  - stress-vs-deception
