cards:
  - id: "fc-psy-w11-001"
    concept: "Định nghĩa Tính cách, Giả thuyết Từ vựng Allport và Phân tích Nhân tố Cattell"
    front: "Giả thuyết Từ vựng (Gordon Allport) phát biểu điều gì về sự phản ánh tính cách trong ngôn ngữ, và Raymond Cattell đã rút gọn vốn từ vựng đó ra sao?"
    back: "Allport giả định những khác biệt cá nhân quan trọng nhất đều được mã hóa tự nhiên vào ngôn ngữ tự nhiên. Raymond Cattell đã ứng dụng phân tích nhân tố (Factor Analysis) rút gọn hàng ngàn từ vựng thành 16 nhân tố tính cách cốt lõi (16PF), chuyển dịch từ tiếp cận loại hình nhị phân sang tiếp cận đặc điểm liên tục."
    source_lesson: "Psychology/notes/02-understanding-self/week-11-personality-big-five.md"
    version: "1.0.0"
    claim_ids:
      - "C11-01"
    tags:
      - "personality"
      - "lexical-hypothesis"
      - "allport"
      - "cattell"
      - "trait-approach"

  - id: "fc-psy-w11-002"
    concept: "Mô hình Năm Yếu tố (Big Five / OCEAN) và Tính Phổ quát Xuyên Văn hóa"
    front: "Liệt kê 5 chiều kích cốt lõi của Mô hình Big Five (OCEAN) và bằng chứng thực nghiệm của McCrae & Costa chứng minh điều gì?"
    back: "5 chiều kích: Openness (Cởi mở), Conscientiousness (Tận tâm), Extraversion (Hướng ngoại), Agreeableness (Dễ chịu), và Neuroticism (Bất ổn cảm xúc). Nghiên cứu thực nghiệm dịch thuật chéo tại hơn 50 quốc gia của McCrae & Costa (1997) chứng minh 5 yếu tố này có tính phổ quát sinh học xuyên văn hóa."
    source_lesson: "Psychology/notes/02-understanding-self/week-11-personality-big-five.md"
    version: "1.0.0"
    claim_ids:
      - "C11-02"
    tags:
      - "big-five"
      - "ocean"
      - "mccrae-costa"
      - "universality"

  - id: "fc-psy-w11-003"
    concept: "Cơ sở Di truyền Hành vi qua Nghiên cứu Sinh đôi Minnesota"
    front: "Nghiên cứu sinh đôi Minnesota (Bouchard et al., 1990) ước tính hệ số di truyền của tính cách là bao nhiêu và môi trường nào đóng vai trò lớn hơn?"
    back: "Khoảng 40% đến 50% phương sai trong các đặc điểm Big Five chịu ảnh hưởng của các yếu tố di truyền (các cặp sinh đôi cùng trứng nuôi cách ly giống nhau r ≈ .50). Phần phương sai còn lại chịu ảnh hưởng chủ yếu của môi trường không chia sẻ (non-shared environment) thay vì môi trường chia sẻ gia đình."
    source_lesson: "Psychology/notes/02-understanding-self/week-11-personality-big-five.md"
    version: "1.0.0"
    claim_ids:
      - "C11-03"
    tags:
      - "behavioral-genetics"
      - "twin-study"
      - "heritability"
      - "bouchard"

  - id: "fc-psy-w11-004"
    concept: "Tranh luận Con người - Tình huống Mischel và Thuyết Tương tác luận"
    front: "Walter Mischel đã thách thức quan điểm tính cách bằng hệ số tương quan nào, và Thuyết Tương tác luận giải quyết tranh luận này ra sao?"
    back: "Mischel (1968) chỉ ra tương quan giữa đặc điểm tính cách và hành vi trong tình huống cụ thể hiếm khi vượt r ≈ .30. Thuyết Tương tác luận giải quyết: Hành vi = f(Con người, Tình huống). Tình huống mạnh (quy chuẩn nghiêm ngặt) che mờ tính cách; tình huống yếu (tự do) cho phép tính cách bộc lộ rõ nhất."
    source_lesson: "Psychology/notes/02-understanding-self/week-11-personality-big-five.md"
    version: "1.0.0"
    claim_ids:
      - "C11-04"
    tags:
      - "person-situation"
      - "mischel"
      - "interactionism"
      - "strong-weak-situations"

  - id: "fc-psy-w11-005"
    concept: "Trắc nghiệm MMPI-2 và Các Thang đo Tính Trung thực"
    front: "Bản kiểm kê đa pha Minnesota (MMPI-2) sử dụng phương pháp xây dựng nào và ba thang đo tính trung thực L, F, K có chức năng gì?"
    back: "MMPI-2 xây dựng theo phương pháp tiêu chí thực nghiệm (Empirical Criterion Keying). Ba thang đo tính trung thực: Thang L (Lie - phát hiện cố tình tô hồng đạo đức), Thang F (Infrequency - phát hiện trả lời bừa hoặc giả vờ ốm), Thang K (Correction - hiệu chỉnh phòng vệ tâm lý)."
    source_lesson: "Psychology/notes/02-understanding-self/week-11-personality-big-five.md"
    version: "1.0.0"
    claim_ids:
      - "C11-05"
    tags:
      - "mmpi-2"
      - "validity-scales"
      - "empirical-criterion-keying"
      - "assessment"

  - id: "fc-psy-w11-006"
    concept: "Ba Khiếm khuyết Tâm trắc học của Trắc nghiệm MBTI"
    front: "Nêu rõ ba khiếm khuyết tâm trắc học nghiêm trọng khiến trắc nghiệm MBTI bị cộng đồng khoa học chỉ trích?"
    back: "1. Ép phân phối chuẩn liên tục vào hai nhóm nhị phân giả tạo (cắt đôi ở giữa khiến hai người gần nhau bị dán nhãn đối lập); 2. Độ tin cậy kiểm tra lại kém (khoảng 50% người thi đổi nhóm phân loại sau 5 tuần - Pittenger, 1993); 3. Thiếu độ giá trị dự báo đối với hiệu suất làm việc so với Big Five."
    source_lesson: "Psychology/notes/02-understanding-self/week-11-personality-big-five.md"
    version: "1.0.0"
    claim_ids:
      - "C11-06"
    tags:
      - "mbti-critique"
      - "psychometrics"
      - "reliability"
      - "validity"

  - id: "fc-psy-w11-007"
    concept: "Giới hạn Khoa học của Trắc nghiệm Phóng chiếu (Rorschach, TAT)"
    front: "Giả thuyết phóng chiếu dựa trên cơ chế nào và các phân tích thực nghiệm chỉ ra những hạn chế tâm trắc học gì của Rorschach và TAT?"
    back: "Dựa trên giả định rằng khi đối diện kích thích mơ hồ, cá nhân phóng chiếu xung đột vô thức vào đó. Hạn chế: độ tin cậy giữa các người chấm thấp, dễ chịu ảnh hưởng bởi thiên kiến của người đánh giá, và độ giá trị chẩn đoán hạn chế ngoài việc hỗ trợ phát hiện tư duy loạn thần nặng."
    source_lesson: "Psychology/notes/02-understanding-self/week-11-personality-big-five.md"
    version: "1.0.0"
    claim_ids:
      - "C11-07"
    tags:
      - "projective-tests"
      - "rorschach"
      - "tat"
      - "lilienfeld"

  - id: "fc-psy-w11-008"
    concept: "Nguyên lý Trưởng thành của Tính cách theo Vòng đời (Roberts et al.)"
    front: "Nguyên lý Trưởng thành (Maturity Principle) của Roberts et al. (2006) bác bỏ quan niệm tính cách bất biến sau tuổi 30 như thế nào?"
    back: "Phân tích gộp 92 nghiên cứu theo chiều dọc chứng minh tính cách tiếp tục biến đổi theo hướng thích nghi tích cực trong suốt vòng đời: con người trung bình tăng dần tính Tận tâm (Conscientiousness), tăng tính Dễ chịu (Agreeableness), và giảm tính Bất ổn cảm xúc (Neuroticism)."
    source_lesson: "Psychology/notes/02-understanding-self/week-11-personality-big-five.md"
    version: "1.0.0"
    claim_ids:
      - "C11-08"
    tags:
      - "maturity-principle"
      - "personality-development"
      - "roberts"
      - "lifespan"
