cards:
  - id: "fc-psy-w26-001"
    concept: "Sự Hấp dẫn Liên cá nhân (Interpersonal Attraction)"
    front: "Sự hấp dẫn liên cá nhân (Interpersonal Attraction) được định nghĩa khoa học là gì và có vai trò như thế nào trong hình thành mối quan hệ?"
    back: "Là lực hút tâm lý hoặc cảm xúc tích cực thúc đẩy mong muốn tiếp cận, tương tác và thiết lập mối liên kết giữa hai cá nhân. Nó đóng vai trò là cửa ngõ lọc ban đầu, định hướng xem ai sẽ bước vào quỹ đạo xã hội của một người trước khi các quá trình thân mật và cam kết phát triển."
    source_lesson: "Psychology/notes/04-love-relationships/week-26-attraction-mate-selection.md"
    version: "1.0.0"
    claim_ids:
      - "C26-01"
    tags:
      - "attraction"
      - "social-psychology"
      - "foundations"

  - id: "fc-psy-w26-002"
    concept: "Hiệu ứng Khoảng cách Vật lý (Proximity Effect)"
    front: "Hiệu ứng khoảng cách vật lý (Proximity Effect) tác động thế nào đến việc hình thành các mối quan hệ ban đầu?"
    back: "Khoảng cách địa lý gần là một trong những yếu tố dự báo mạnh nhất cho sự nảy nở tình bạn và tình cảm lãng mạn. Nó làm giảm chi phí tiếp cận và tăng tối đa xác suất tương tác tình cờ giữa các cá nhân trong đời sống hàng ngày."
    source_lesson: "Psychology/notes/04-love-relationships/week-26-attraction-mate-selection.md"
    version: "1.0.0"
    claim_ids:
      - "C26-02"
    tags:
      - "proximity"
      - "environment"
      - "interaction"

  - id: "fc-psy-w26-003"
    concept: "Khoảng cách Chức năng (Functional Distance)"
    front: "Khái niệm 'Khoảng cách chức năng' (Functional Distance) trong nghiên cứu Westgate của Festinger và cộng sự (1950) khác gì với khoảng cách địa lý đơn thuần?"
    back: "Khoảng cách chức năng phản ánh mức độ thiết kế kiến trúc và không gian buộc mọi người phải va chạm tiếp xúc với nhau hàng ngày (như phòng ở cạnh cầu thang, hộp thư, lối đi chung). Nghiên cứu chỉ ra cơ hội gặp gỡ tình cờ do thiết kế không gian quyết định xác suất kết bạn cao hơn cự ly đo bằng mét tuyến tính."
    source_lesson: "Psychology/notes/04-love-relationships/week-26-attraction-mate-selection.md"
    version: "1.0.0"
    claim_ids:
      - "C26-02"
    tags:
      - "festinger"
      - "westgate"
      - "architecture"

  - id: "fc-psy-w26-004"
    concept: "Hiệu ứng Tiếp xúc Thường xuyên (Mere Exposure Effect)"
    front: "Robert Zajonc (1968) đã khám phá ra quy luật tâm lý nào qua Hiệu ứng Tiếp xúc Thường xuyên (Mere Exposure Effect)?"
    back: "Việc tiếp xúc lặp đi lặp lại nhiều lần với một kích thích trung tính là đủ để làm gia tăng mức độ ưa thích và thiện cảm đối với kích thích đó. Não bộ tự động xử lý các kích thích quen thuộc một cách trôi chảy hơn (perceptual fluency) và xem sự quen thuộc là chỉ báo của sự an toàn sinh học."
    source_lesson: "Psychology/notes/04-love-relationships/week-26-attraction-mate-selection.md"
    version: "1.0.0"
    claim_ids:
      - "C26-02"
    tags:
      - "zajonc"
      - "mere-exposure"
      - "cognition"

  - id: "fc-psy-w26-005"
    concept: "Giới hạn của Hiệu ứng Tiếp xúc Thường xuyên"
    front: "Điều kiện biên bắt buộc nào quyết định Hiệu ứng Tiếp xúc Thường xuyên có làm tăng thiện cảm hay ngược lại?"
    back: "Kích thích ban đầu bắt buộc phải mang tính trung tính hoặc tích cực nhẹ. Nếu ấn tượng ban đầu đối với một người là tiêu cực, phản cảm hoặc đe dọa, việc tiếp xúc lặp đi lặp lại thường xuyên chỉ làm gia tăng sự căm ghét, khó chịu và xung đột (hostility)."
    source_lesson: "Psychology/notes/04-love-relationships/week-26-attraction-mate-selection.md"
    version: "1.0.0"
    claim_ids:
      - "C26-02"
    tags:
      - "mere-exposure"
      - "boundary-conditions"
      - "hostility"

  - id: "fc-psy-w26-006"
    concept: "Quy luật Hấp dẫn do Tương đồng (Similarity-Attraction Effect)"
    front: "Thực nghiệm 'Người lạ lý tưởng' của Donn Byrne (1971) đã xác lập nguyên lý khoa học nào về sự tương đồng?"
    back: "Mức độ hấp dẫn liên cá nhân tương quan tuyến tính thuận với tỷ lệ phần trăm các quan điểm và giá trị sống tương đồng. Càng chia sẻ nhiều niềm tin chung về đạo đức, tôn giáo, chính trị và lối sống, con người càng cảm thấy bị thu hút và tin tưởng đối phương hơn."
    source_lesson: "Psychology/notes/04-love-relationships/week-26-attraction-mate-selection.md"
    version: "1.0.0"
    claim_ids:
      - "C26-03"
    tags:
      - "similarity"
      - "byrne"
      - "law-of-attraction"

  - id: "fc-psy-w26-007"
    concept: "Củng cố Thế giới quan (Consensual Validation)"
    front: "Tại sao sự tương đồng về quan điểm sống lại mang lại sức hút tâm lý mạnh mẽ theo cơ chế Consensual Validation?"
    back: "Khi đối tác đồng thuận với các niềm tin và giá trị của ta, họ đóng vai trò như chiếc gương xác nhận rằng nhận thức của ta về thế giới là đúng đắn, thông minh và có cơ sở. Sự xác nhận này củng cố lòng tự trắc ẩn và mang lại cảm giác an toàn tâm lý sâu sắc."
    source_lesson: "Psychology/notes/04-love-relationships/week-26-attraction-mate-selection.md"
    version: "1.0.0"
    claim_ids:
      - "C26-03"
    tags:
      - "validation"
      - "self-esteem"
      - "similarity"

  - id: "fc-psy-w26-008"
    concept: "Hiện tượng Kết đôi Tương đồng (Assortative Mating)"
    front: "Hiện tượng Kết đôi Tương đồng (Assortative Mating) và Giả thuyết Tương đương Ngoại hình (Matching Hypothesis) mô tả điều gì trong thực tế kết hôn?"
    back: "Con người có xu hướng kết đôi phi ngẫu nhiên với những cá nhân có đặc tính tương đương bản thân về tầng lớp kinh tế - xã hội (SES), trình độ học vấn, trí tuệ và mức độ hấp dẫn thể chất. Sự cân bằng tương đương này giúp giảm thiểu sự bất an về vị thế và xung đột nguồn lực trong hôn nhân."
    source_lesson: "Psychology/notes/04-love-relationships/week-26-attraction-mate-selection.md"
    version: "1.0.0"
    claim_ids:
      - "C26-03"
      - "C26-04"
    tags:
      - "assortative-mating"
      - "matching-hypothesis"
      - "marriage"

  - id: "fc-psy-w26-009"
    concept: "Hiệu ứng Hào quang (Halo Effect) trong Ngoại hình"
    front: "Nghiên cứu 'What is beautiful is good' của Dion, Berscheid, & Walster (1972) chứng minh thiên lệch nhận thức nào?"
    back: "Người tham gia tự động gán các phẩm chất nhân cách tích cực (thông minh, chân thành, tốt bụng, thành đạt, hạnh phúc) cho những người có diện mạo ưa nhìn. Đây là định kiến vô thức coi vẻ đẹp thể chất là chỉ dấu tổng thể cho nhân cách tốt đẹp."
    source_lesson: "Psychology/notes/04-love-relationships/week-26-attraction-mate-selection.md"
    version: "1.0.0"
    claim_ids:
      - "C26-04"
    tags:
      - "halo-effect"
      - "physical-attractiveness"
      - "bias"

  - id: "fc-psy-w26-010"
    concept: "Chỉ dấu Tiến hóa Sinh học của Vẻ đẹp Ngoại hình"
    front: "Dưới góc độ tâm lý học tiến hóa, tính đối xứng gương mặt (facial symmetry) và tính trung bình (averageness) chỉ báo điều gì?"
    back: "Chúng là các tín hiệu sinh học trung thực (honest signals) chỉ báo sự phát triển phôi thai ổn định, hệ thống miễn dịch khỏe mạnh và khả năng chống chọi bệnh tật tốt. Tổ tiên loài người tiến hóa để cảm thấy hấp dẫn trước những đặc điểm này nhằm tối ưu hóa sự sống còn của thế hệ sau."
    source_lesson: "Psychology/notes/04-love-relationships/week-26-attraction-mate-selection.md"
    version: "1.0.0"
    claim_ids:
      - "C26-04"
    tags:
      - "evolutionary-psychology"
      - "symmetry"
      - "health-cues"

  - id: "fc-psy-w26-011"
    concept: "Thuyết Lợi - Hại về Sự Hấp dẫn (Gain-Loss Theory)"
    front: "Theo Thuyết Lợi - Hại của Aronson & Linder (1965), kiểu phản hồi nào từ người khác tạo ra sức hút thiện cảm lớn nhất?"
    back: "Chúng ta thích nhất một người ban đầu tỏ ra dè dặt, khắt khe hoặc có đánh giá trung tính nhưng dần dần bị thuyết phục và chuyển sang công nhận, khen ngợi ta (Gain). Cảm giác 'chinh phục' được sự tán thưởng từ người khó tính mang lại sự củng cố tâm lý mạnh hơn nhiều so với người luôn đồng ý từ đầu."
    source_lesson: "Psychology/notes/04-love-relationships/week-26-attraction-mate-selection.md"
    version: "1.0.0"
    claim_ids:
      - "C26-01"
    tags:
      - "aronson"
      - "gain-loss"
      - "reciprocal-liking"

  - id: "fc-psy-w26-012"
    concept: "Gán nhầm Kích hoạt Sinh lý (Misattribution of Arousal)"
    front: "Thực nghiệm cầu treo Capilano của Dutton & Aron (1974) chứng minh cơ chế gán nhầm kích hoạt sinh lý như thế nào?"
    back: "Trạng thái kích hoạt sinh lý cao (tim đập nhanh, thở dốc, adrenaline tăng do sợ hãi độ cao trên cầu treo) bị não bộ vô thức gán nhãn thành cảm giác rung động lãng mạn trước người phụ nữ phỏng vấn. Điều này chứng minh cảm xúc tình cảm chịu tác động nặng nề bởi cách nhận thức giải thích trạng thái cơ thể."
    source_lesson: "Psychology/notes/04-love-relationships/week-26-attraction-mate-selection.md"
    version: "1.0.0"
    claim_ids:
      - "C26-01"
    tags:
      - "misattribution"
      - "arousal"
      - "dutton-aron"

  - id: "fc-psy-w26-013"
    concept: "Thuyết Đầu tư của Cha mẹ (Parental Investment Theory)"
    front: "Luận điểm cốt lõi của Robert Trivers (1972) về nguyên nhân khiến một giới tính trở nên kén chọn bạn đời hơn là gì?"
    back: "Giới tính nào phải đầu tư nhiều chi phí sinh học bắt buộc hơn cho việc sinh sản và nuôi dưỡng con cái (mang thai 9 tháng, cho con bú) sẽ phải kén chọn bạn đời kỹ càng hơn để đảm bảo con sống sót. Giới tính đầu tư sinh học ít hơn sẽ phải cạnh tranh gay gắt để tiếp cận đối tác."
    source_lesson: "Psychology/notes/04-love-relationships/week-26-attraction-mate-selection.md"
    version: "1.0.0"
    claim_ids:
      - "C26-05"
    tags:
      - "trivers"
      - "parental-investment"
      - "evolution"

  - id: "fc-psy-w26-014"
    concept: "Khác biệt Giới tính trong Tiêu chí Chọn Bạn đời (David Buss 1989)"
    front: "Khảo sát trên 10.047 đối tượng tại 37 nền văn hóa của David Buss phát hiện ra hai xu hướng phổ quát nào?"
    back: "Nam giới ở cả 37 nền văn hóa đều ưu tiên bạn đời trẻ tuổi và có ngoại hình hấp dẫn (dấu hiệu sức khỏe sinh sản). Nữ giới ở cả 37 nền văn hóa đều ưu tiên bạn đời có tiềm lực tài chính, địa vị xã hội và tham vọng (dấu hiệu khả năng chu cấp nguồn lực)."
    source_lesson: "Psychology/notes/04-love-relationships/week-26-attraction-mate-selection.md"
    version: "1.0.0"
    claim_ids:
      - "C26-05"
    tags:
      - "david-buss"
      - "mate-preferences"
      - "cross-cultural"

  - id: "fc-psy-w26-015"
    concept: "Thuyết Vai trò Xã hội về Chọn Bạn đời (Eagly & Wood 1999)"
    front: "Alice Eagly và Wendy Wood đã phản biện các kết luận của David Buss về tiêu chí chọn bạn đời như thế nào?"
    back: "Họ chứng minh sự khác biệt giới trong tiêu chí chọn bạn đời phản ánh sự phân công lao động xã hội và bất bình đẳng cơ hội kinh tế trong lịch sử. Khi phân tích theo Chỉ số Bình đẳng Giới (GGI) của Liên Hợp Quốc, ở các quốc gia bình đẳng giới cao, khoảng cách tiêu chí giữa nam và nữ thu hẹp lại rõ rệt."
    source_lesson: "Psychology/notes/04-love-relationships/week-26-attraction-mate-selection.md"
    version: "1.0.0"
    claim_ids:
      - "C26-05"
    tags:
      - "social-role-theory"
      - "eagly-wood"
      - "gender-equality"

  - id: "fc-psy-w26-016"
    concept: "Tiêu chuẩn Khai báo vs Hành vi Thực tế trong Hẹn hò"
    front: "Thực nghiệm Hẹn hò Tốc độ của Eastwick & Finkel (2008) đã phát hiện ra nghịch lý gì giữa lý thuyết và thực tế?"
    back: "Dù trước buổi hẹn nam tuyên bố thích ngoại hình và nữ tuyên bố thích tài chính, nhưng khi tương tác trực tiếp 4 phút mặt đối mặt, cả hai giới đều bị lôi cuốn bởi cùng các yếu tố: sự duyên dáng, tương tác sinh động và năng lượng ấm áp. Tiêu chuẩn khai báo trên giấy không dự đoán được hành vi chọn lựa trong đời thực."
    source_lesson: "Psychology/notes/04-love-relationships/week-26-attraction-mate-selection.md"
    version: "1.0.0"
    claim_ids:
      - "C26-05"
    tags:
      - "speed-dating"
      - "eastwick-finkel"
      - "behavior-vs-attitude"

  - id: "fc-psy-w26-017"
    concept: "Ngụy niệm 'Trái dấu Hút nhau' (Opposites Attract)"
    front: "Tại sao quan niệm 'trái dấu hút nhau' trong tình yêu lại là một hiểu lầm phổ biến nguy hại?"
    back: "Nghiên cứu chứng minh con người chỉ có thể bổ trợ nhau ở một số phân công kỹ năng vi mô thực tế, nhưng bắt buộc phải tương đồng về hệ giá trị sống và nhân sinh quan. Mối quan hệ dựa trên sự đối lập về giá trị cốt lõi luôn nhanh chóng biến sự hấp dẫn ban đầu thành xung đột tàn phá và đổ vỡ."
    source_lesson: "Psychology/notes/04-love-relationships/week-26-attraction-mate-selection.md"
    version: "1.0.0"
    claim_ids:
      - "C26-01"
      - "C26-03"
    tags:
      - "pop-psychology"
      - "debunking"
      - "myths"

  - id: "fc-psy-w26-018"
    concept: "Rủi ro Sức hút trong Môi trường Quyền lực Chênh lệch"
    front: "Tại sao rung động lãng mạn trong bối cảnh công sở có sự chênh lệch quyền lực lớn cần được đánh giá thận trọng?"
    back: "Vì cảm xúc rung động dễ bị chi phối bởi Hiệu ứng Hào quang từ chức vụ lãnh đạo (Halo effect) và sự kích hoạt nhầm lẫn từ áp lực công việc. Nếu chưa kiểm chứng sự tương đồng về giá trị đời thực ngoài môi trường làm việc, việc bước vào quan hệ tiềm ẩn rủi ro lạm dụng quyền lực và đổ vỡ lớn."
    source_lesson: "Psychology/notes/04-love-relationships/week-26-attraction-mate-selection.md"
    version: "1.0.0"
    claim_ids:
      - "C26-01"
    tags:
      - "workplace-romance"
      - "power-dynamics"
      - "application"
