deck_id: "deck-psy-w42"
subject: "Psychology"
lesson_id: "week-42-evidence-based-therapies"
version: "1.0.0"
description: "Bộ thẻ ôn tập Tuần 42: Các Liệu pháp Tâm lý Dựa trên Bằng chứng & Điều hướng Hệ thống Sức khỏe Tâm thần"

cards:
  - id: "fc-psy-w42-001"
    concept: "Ba Trụ Cột của Thực Hành Dựa Trên Bằng Chứng (EBPP)"
    front: "Ba trụ cột cấu thành Thực hành Dựa trên Bằng chứng trong Tâm lý học (EBPP theo APA, 2006) là gì?"
    back: "(1) Bằng chứng nghiên cứu thực nghiệm tốt nhất hiện có; (2) Chuyên môn và sự nhạy bén lâm sàng của nhà trị liệu; và (3) Đặc điểm, bối cảnh văn hóa, giá trị và sở thích của thân chủ."
    source_lesson: "Psychology/notes/05-development-mental-health/week-42-evidence-based-therapies.md"
    version: "1.0.0"
    claim_ids:
      - "C42-01"
    tags:
      - "ebpp"
      - "apa"
      - "evidence-based"
      - "ethics"

  - id: "fc-psy-w42-002"
    concept: "Dấu Hiệu Nhận Diện Giả Khoa Học (Pseudoscience) trong Trị Liệu"
    front: "Những dấu hiệu cảnh báo then chốt giúp nhận diện các phương pháp can thiệp giả khoa học trong tâm lý học là gì?"
    back: "Dựa vào các giai thoại/lời chứng thực cá nhân thay vì dữ liệu thống kê, cam kết chữa khỏi 100% thần tốc, lý thuyết mơ hồ không thể kiểm chứng tính sai (unfalsifiable), và né tránh bình duyệt khoa học độc lập."
    source_lesson: "Psychology/notes/05-development-mental-health/week-42-evidence-based-therapies.md"
    version: "1.0.0"
    claim_ids:
      - "C42-01"
    tags:
      - "pseudoscience"
      - "critical-thinking"
      - "lilienfeld"

  - id: "fc-psy-w42-003"
    concept: "Mô Hình Nhận Thức trong Liệu Pháp Hành Vi Nhận Thức (CBT)"
    front: "Nguyên lý cốt lõi của Mô hình Nhận thức do Aaron Beck sáng lập là gì?"
    back: "Không phải bản thân sự kiện bên ngoài quyết định cảm xúc và hành vi, mà chính cách cá nhân nhận thức, diễn giải và gán ý nghĩa cho sự kiện đó thông qua suy nghĩ tự động và niềm tin cốt lõi mới định hình phản ứng."
    source_lesson: "Psychology/notes/05-development-mental-health/week-42-evidence-based-therapies.md"
    version: "1.0.0"
    claim_ids:
      - "C42-02"
    tags:
      - "cbt"
      - "beck"
      - "cognitive-model"

  - id: "fc-psy-w42-004"
    concept: "Kỹ Thuật Tái Cấu Trúc Nhận Thức (Cognitive Restructuring)"
    front: "Kỹ thuật Tái cấu trúc nhận thức trong CBT vận hành như thế nào?"
    back: "Thân chủ nhận diện các suy nghĩ tự động tiêu cực méo mó, sử dụng câu hỏi Socrates để thu thập bằng chứng thực tế khách quan ủng hộ và phản bác, từ đó xây dựng suy nghĩ thay thế cân bằng, thực tế hơn."
    source_lesson: "Psychology/notes/05-development-mental-health/week-42-evidence-based-therapies.md"
    version: "1.0.0"
    claim_ids:
      - "C42-02"
    tags:
      - "cbt"
      - "cognitive-restructuring"
      - "socratic"

  - id: "fc-psy-w42-005"
    concept: "Khác Biệt Cốt Lõi Giữa CBT và Các Liệu Pháp Làn Sóng Thứ Ba (ACT/DBT)"
    front: "Điểm chuyển dịch mô hình then chốt giữa Các Liệu pháp Làn sóng Thứ ba (như ACT) so với CBT truyền thống là gì?"
    back: "CBT truyền thống tập trung tranh luận và thay đổi NỘI DUNG của suy nghĩ tiêu cực; ACT tập trung thay đổi MỐI QUAN HỆ của thân chủ với suy nghĩ/cảm xúc thông qua sự chấp nhận, chánh niệm và tháo gỡ nhận thức."
    source_lesson: "Psychology/notes/05-development-mental-health/week-42-evidence-based-therapies.md"
    version: "1.0.0"
    claim_ids:
      - "C42-03"
    tags:
      - "third-wave"
      - "act",
      - "dbt"
      - "hayes"

  - id: "fc-psy-w42-006"
    concept: "Kỹ Thuật Tháo Gỡ Nhận Thức (Cognitive Defusion) trong ACT"
    front: "Tháo gỡ nhận thức (Cognitive Defusion) là gì và mang lại lợi ích gì cho thân chủ?"
    back: "Là kỹ thuật giúp thân chủ lùi lại quan sát dòng suy nghĩ như những ngôn từ và hiện tượng tâm trí thoáng qua, tách biệt bản ngã khỏi suy nghĩ để giảm bớt sự kiểm soát tiêu cực của suy nghĩ lên hành vi."
    source_lesson: "Psychology/notes/05-development-mental-health/week-42-evidence-based-therapies.md"
    version: "1.0.0"
    claim_ids:
      - "C42-03"
    tags:
      - "act"
      - "cognitive-defusion"
      - "mindfulness"

  - id: "fc-psy-w42-007"
    concept: "Các Yếu Tố Chung & Liên Minh Trị Liệu (Therapeutic Alliance)"
    front: "Ba thành tố của Liên minh Trị liệu (Edward Bordin) và vai trò của nó trong kết quả điều trị là gì?"
    back: "Gồm (1) Mối gắn kết tình cảm tin cậy (Bond), (2) Đồng thuận về Mục tiêu (Goals), và (3) Đồng thuận về Nhiệm vụ (Tasks); đóng góp hơn 30-40% vào sự thành công điều trị, vượt trội so với sự khác biệt kỹ thuật thuần túy."
    source_lesson: "Psychology/notes/05-development-mental-health/week-42-evidence-based-therapies.md"
    version: "1.0.0"
    claim_ids:
      - "C42-04"
    tags:
      - "common-factors"
      - "therapeutic-alliance"
      - "wampold"
      - "norcross"

  - id: "fc-psy-w42-008"
    concept: "Phân Định Ranh Giới Chuyên Môn & Cờ Đỏ An Toàn trong Sức Khỏe Tâm Thần"
    front: "Làm thế nào để phân biệt vai trò Bác sĩ Tâm thần và Nhà Tâm lý Lâm sàng, và đâu là cờ đỏ vi phạm đạo đức?"
    back: "Bác sĩ Tâm thần (MD) chẩn đoán y khoa và kê đơn thuốc; Nhà Tâm lý Lâm sàng đánh giá trắc nghiệm và trị liệu tâm lý. Cờ đỏ: hứa chữa khỏi 100% thần tốc, quan hệ tình cảm/tiền bạc vụ lợi, giả danh bác sĩ kê thuốc trái phép."
    source_lesson: "Psychology/notes/05-development-mental-health/week-42-evidence-based-therapies.md"
    version: "1.0.0"
    claim_ids:
      - "C42-05"
    tags:
      - "psychiatrist"
      - "clinical-psychologist"
      - "ethics"
      - "red-flags"
