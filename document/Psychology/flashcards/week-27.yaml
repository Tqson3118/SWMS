cards:
  - id: "fc-psy-w27-001"
    concept: "Thuyết Tam giác Tình yêu (Triangular Theory of Love)"
    front: "Ba thành tố nền tảng cấu thành Thuyết Tam giác Tình yêu của Robert Sternberg (1986) là gì?"
    back: "Gồm ba đỉnh: (1) Đam mê (Passion - động lực thể xác, kích hoạt sinh lý và tình dục); (2) Thân mật (Intimacy - gắn kết cảm xúc, ấm áp, tin cậy và chia sẻ nội tâm); và (3) Cam kết (Commitment - quyết định nhận thức có ý thức duy trì mối quan hệ lâu dài)."
    source_lesson: "Psychology/notes/04-love-relationships/week-27-love-intimacy.md"
    version: "1.0.0"
    claim_ids:
      - "C27-02"
    tags:
      - "sternberg"
      - "triangular-theory"
      - "foundations"

  - id: "fc-psy-w27-002"
    concept: "Thành tố Đam mê (Passion)"
    front: "Bản chất tâm lý và động học theo thời gian của thành tố Đam mê (Passion) trong mô hình Sternberg là gì?"
    back: "Là trạng thái kích hoạt sinh lý mạnh mẽ, khát khao hòa nhập thể xác và lãng mạn, vận hành tương tự cơ chế nghiện hóa học thần kinh (dopamine/phenylethylamine). Đam mê bùng phát rất nhanh nhưng cũng là thành tố dễ bị thích nghi cảm giác (sensory habituation) và hạ nhiệt nhanh nhất sau 12–24 tháng."
    source_lesson: "Psychology/notes/04-love-relationships/week-27-love-intimacy.md"
    version: "1.0.0"
    claim_ids:
      - "C27-02"
    tags:
      - "passion"
      - "neurobiology"
      - "habituation"

  - id: "fc-psy-w27-003"
    concept: "Thành tố Thân mật (Intimacy)"
    front: "Thành tố Thân mật (Intimacy) được xây dựng dựa trên những trải nghiệm tâm lý nào?"
    back: "Là cảm giác gắn bó cảm xúc sâu sắc, tin tưởng, tôn trọng, an tâm chia sẻ những bí mật sâu kín nhất và cảm nhận được sự đồng điệu tâm hồn. Thân mật phát triển từ tốn qua thời gian thông qua các tương tác đáp ứng thấu cảm (PPR) và có tính ổn định cao."
    source_lesson: "Psychology/notes/04-love-relationships/week-27-love-intimacy.md"
    version: "1.0.0"
    claim_ids:
      - "C27-02"
      - "C27-03"
    tags:
      - "intimacy"
      - "emotional-connection"
      - "trust"

  - id: "fc-psy-w27-004"
    concept: "Thành tố Cam kết (Commitment)"
    front: "Thành tố Cam kết (Commitment) bao gồm hai giai đoạn quyết định nhận thức nào?"
    back: "Bao gồm: (1) Quyết định ngắn hạn — thừa nhận và xác định rằng mình yêu một người; và (2) Cam kết dài hạn — lời hứa và sự nỗ lực có ý thức nhằm duy trì mối quan hệ bền vững bất chấp những biến cố đời sống, khó khăn tài chính hay sự suy giảm cảm xúc ban đầu."
    source_lesson: "Psychology/notes/04-love-relationships/week-27-love-intimacy.md"
    version: "1.0.0"
    claim_ids:
      - "C27-02"
      - "C27-04"
    tags:
      - "commitment"
      - "cognitive-decision"
      - "long-term"

  - id: "fc-psy-w27-005"
    concept: "Tình yêu Si mê / Say đắm (Infatuated Love)"
    front: "Tình yêu Si mê (Infatuated Love) trong mô hình Sternberg có cấu trúc ra sao và rủi ro thực tế là gì?"
    back: "Chỉ có duy nhất Đam mê mà thiếu cả Thân mật lẫn Cam kết ('tiếng sét ái tình'). Đối tượng bị ám ảnh và cuốn hút mãnh liệt bởi thể xác nhưng chưa thực sự hiểu nhân cách của nhau; mối quan hệ này cực kỳ mong manh và dễ sụp đổ khi đối mặt với thực tế đời thường."
    source_lesson: "Psychology/notes/04-love-relationships/week-27-love-intimacy.md"
    version: "1.0.0"
    claim_ids:
      - "C27-02"
    tags:
      - "infatuation"
      - "passion-only"
      - "crush"

  - id: "fc-psy-w27-006"
    concept: "Tình yêu Rỗng (Empty Love)"
    front: "Tình yêu Rỗng (Empty Love) được định nghĩa thế nào và thường xuất hiện trong những hoàn cảnh nào?"
    back: "Chỉ có duy nhất Cam kết mà hoàn toàn mất đi Đam mê và Thân mật. Thường xuất hiện ở các cuộc hôn nhân lâu năm đã nguội lạnh cảm xúc, hai người chỉ sống chung như người xa lạ vì nghĩa vụ con cái hoặc danh phận xã hội; hoặc là giai đoạn khởi đầu của hôn nhân sắp đặt truyền thống."
    source_lesson: "Psychology/notes/04-love-relationships/week-27-love-intimacy.md"
    version: "1.0.0"
    claim_ids:
      - "C27-02"
    tags:
      - "empty-love"
      - "commitment-only"
      - "marriage"

  - id: "fc-psy-w27-007"
    concept: "Tình yêu Bạn đồng hành (Companionate Love)"
    front: "Tại sao Tình yêu Bạn đồng hành (Companionate Love) được xem là hình thái tiến hóa tự nhiên và bền vững của hôn nhân?"
    back: "Được cấu thành từ Thân mật cao kết hợp Cam kết cao, trong khi Đam mê thể xác đã hạ nhiệt. Đây là tình bạn tri kỷ sâu sắc và sự gắn bó thủy chung, được nâng đỡ bởi hệ thống oxytocin và endorphin mang lại sự bình yên, tin tưởng và an toàn suốt cuộc đời."
    source_lesson: "Psychology/notes/04-love-relationships/week-27-love-intimacy.md"
    version: "1.0.0"
    claim_ids:
      - "C27-02"
    tags:
      - "companionate-love"
      - "intimacy-commitment"
      - "long-term-marriage"

  - id: "fc-psy-w27-008"
    concept: "Tình yêu Khờ dại (Fatuous Love)"
    front: "Cấu trúc của Tình yêu Khờ dại (Fatuous Love) là gì và vì sao nó thường dẫn đến đổ vỡ nhanh chóng?"
    back: "Kết hợp giữa Đam mê và Cam kết nhưng thiếu đi Thân mật. Điển hình là các cuộc 'hôn nhân vội vã' — cặp đôi say đắm thể xác rồi vội vã đính hôn sau vài tuần quen biết khi chưa kịp thấu hiểu nhân cách, giá trị sống của nhau. Khi đam mê nguội lạnh, mối quan hệ không có nền móng cảm xúc để đứng vững."
    source_lesson: "Psychology/notes/04-love-relationships/week-27-love-intimacy.md"
    version: "1.0.0"
    claim_ids:
      - "C27-02"
    tags:
      - "fatuous-love"
      - "rushed-marriage"
      - "risk"

  - id: "fc-psy-w27-009"
    concept: "Tình yêu Trọn vẹn (Consummate Love)"
    front: "Thách thức lớn nhất đối với Tình yêu Trọn vẹn (Consummate Love) trong thực tế là gì?"
    back: "Hội tụ đầy đủ cả 3 đỉnh: Đam mê, Thân mật và Cam kết. Thách thức lớn nhất không phải là đạt được nó mà là duy trì nó qua năm tháng, vì đỉnh Đam mê luôn có xu hướng nguội lạnh nếu cặp đôi không chủ động vun đắp và tái tạo trải nghiệm mới lạ cùng nhau."
    source_lesson: "Psychology/notes/04-love-relationships/week-27-love-intimacy.md"
    version: "1.0.0"
    claim_ids:
      - "C27-02"
    tags:
      - "consummate-love"
      - "ideal"
      - "relationship-maintenance"

  - id: "fc-psy-w27-010"
    concept: "Mô hình Quá trình Thân mật (Reis & Shaver 1988)"
    front: "Chuỗi tương tác 3 mắt xích bắt buộc trong Mô hình Quá trình Thân mật của Reis & Shaver là gì?"
    back: "Gồm: (1) Người A chủ động Tự bộc lộ (Self-disclosure) những cảm xúc/tổn thương sâu kín; (2) Người B lắng nghe và phản hồi thấu cảm; và (3) Người A cảm nhận được Tính đáp ứng từ đối tác (Perceived Partner Responsiveness - PPR) gồm Thấu hiểu, Công nhận và Chăm sóc."
    source_lesson: "Psychology/notes/04-love-relationships/week-27-love-intimacy.md"
    version: "1.0.0"
    claim_ids:
      - "C27-03"
    tags:
      - "reis-shaver"
      - "intimacy-model"
      - "process"

  - id: "fc-psy-w27-011"
    concept: "Tự bộc lộ và Điểm yếu (Self-Disclosure & Vulnerability)"
    front: "Tại sao hành vi Tự bộc lộ (Self-Disclosure) lại là điều kiện tiên quyết bắt buộc để phát triển sự thân mật?"
    back: "Nếu chỉ dừng lại ở các cuộc trò chuyện xã giao bề nổi, não bộ không thể thiết lập niềm tin sâu sắc. Việc dám bộc lộ những nỗi sợ hãi, khuyết điểm hoặc tổn thương quá khứ (vulnerability) cho đối phương cơ hội thể hiện sự bảo bọc và chấp nhận, từ đó tạo ra sợi dây liên kết cảm xúc độc nhất."
    source_lesson: "Psychology/notes/04-love-relationships/week-27-love-intimacy.md"
    version: "1.0.0"
    claim_ids:
      - "C27-03"
    tags:
      - "self-disclosure"
      - "vulnerability"
      - "trust"

  - id: "fc-psy-w27-012"
    concept: "Tính đáp ứng Nhận thức từ Đối tác (PPR)"
    front: "Ba thành tố cấu thành Tính đáp ứng nhận thức từ đối tác (PPR) theo Reis & Shaver là gì?"
    back: "Gồm: (1) Thấu hiểu (Understanding) — đối tác hiểu đúng bản chất vấn đề và cảm xúc của mình; (2) Công nhận (Validation) — đối tác tôn trọng và xác nhận cảm xúc đó là chính đáng; và (3) Chăm sóc (Caring) — đối tác thể hiện sự ấm áp, yêu thương và sẵn sàng bảo bọc mình."
    source_lesson: "Psychology/notes/04-love-relationships/week-27-love-intimacy.md"
    version: "1.0.0"
    claim_ids:
      - "C27-03"
    tags:
      - "ppr"
      - "understanding"
      - "validation"
      - "caring"

  - id: "fc-psy-w27-013"
    concept: "Hậu quả của việc Phủ nhận Cảm xúc (Invalidation)"
    front: "Tại sao phản hồi đưa ra lời khuyên logic vội vã ('Có thế mà cũng khóc') lại phá hủy sự thân mật?"
    back: "Nó vi phạm thành tố Validation và Caring. Người bộc lộ cảm thấy nỗi đau của mình bị coi thường, bị phán xét là yếu đuối hoặc sai trái. Hậu quả là họ kích hoạt cơ chế phòng vệ rút lui cảm xúc (emotional withdrawal), đóng kín nội tâm và không bao giờ dám chia sẻ thật lòng nữa."
    source_lesson: "Psychology/notes/04-love-relationships/week-27-love-intimacy.md"
    version: "1.0.0"
    claim_ids:
      - "C27-03"
    tags:
      - "invalidation"
      - "communication-failure"
      - "emotional-withdrawal"

  - id: "fc-psy-w27-014"
    concept: "Mô hình Đầu tư của Caryl Rusbult (1980, 1983)"
    front: "Phương trình xác định mức độ Cam kết (Commitment) trong Mô hình Đầu tư của Rusbult gồm những yếu tố nào?"
    back: "Cam kết = (Mức độ Thỏa mãn - Chất lượng Phương án Thay thế) + Quy mô Đầu tư. Trong đó Cam kết là cấu trúc nhận thức tổng hợp thúc đẩy các hành vi gìn giữ quan hệ như tha thứ, hy sinh vì nhau và khước từ cám dỗ từ bên ngoài."
    source_lesson: "Psychology/notes/04-love-relationships/week-27-love-intimacy.md"
    version: "1.0.0"
    claim_ids:
      - "C27-04"
    tags:
      - "rusbult"
      - "investment-model"
      - "commitment"

  - id: "fc-psy-w27-015"
    concept: "Đầu tư Nội tại vs Đầu tư Ngoại tại (Intrinsic vs Extrinsic)"
    front: "Phân biệt Đầu tư Nội tại và Đầu tư Ngoại tại trong Mô hình Đầu tư của Rusbult?"
    back: "Đầu tư nội tại (Intrinsic) là các nguồn lực tinh thần trực tiếp: thời gian, năng lượng cảm xúc, sự chăm sóc và những tâm sự riêng tư. Đầu tư ngoại tại (Extrinsic) là các tài sản hữu hình gắn liền với quan hệ: tài sản chung, nhà cửa, con cái, và mạng lưới quan hệ họ hàng/bạn bè chung."
    source_lesson: "Psychology/notes/04-love-relationships/week-27-love-intimacy.md"
    version: "1.0.0"
    claim_ids:
      - "C27-04"
    tags:
      - "investments"
      - "intrinsic"
      - "extrinsic"

  - id: "fc-psy-w27-016"
    concept: "Bẫy Chi phí Chìm trong Quan hệ Độc hại (Sunk Cost Fallacy)"
    front: "Mô hình Đầu tư của Rusbult giải thích thế nào về việc một người mắc kẹt trong mối quan hệ lạm dụng không thể dứt ra?"
    back: "Khi một người đã bỏ ra quy mô đầu tư ngoại tại quá lớn (con cái, phụ thuộc tài chính hoàn toàn) kết hợp với việc bị cô lập xã hội khiến họ nhận thức chất lượng phương án thay thế bằng không, họ bị trói chặt vào cam kết đau khổ do chiếc bẫy chi phí chìm, không dám rời bỏ dù sự thỏa mãn là số âm."
    source_lesson: "Psychology/notes/04-love-relationships/week-27-love-intimacy.md"
    version: "1.0.0"
    claim_ids:
      - "C27-04"
    tags:
      - "sunk-cost"
      - "toxic-relationships"
      - "application"

  - id: "fc-psy-w27-017"
    concept: "Sinh học Thần kinh: Dopamine vs Oxytocin trong Tình yêu"
    front: "Sự khác biệt về cơ sở sinh học thần kinh giữa Passionate Love và Companionate Love là gì?"
    back: "Passionate Love kích hoạt vùng trần bụng (VTA) và mạng lưới dopamine tạo hưng phấn, thèm khát và ám ảnh tương tự nghiện chất. Companionate Love kích hoạt các thụ thể oxytocin, vasopressin và endorphin ở vùng hạ đồi, mang lại cảm giác an thần, giảm huyết áp, hạ cortisol và gắn kết an toàn."
    source_lesson: "Psychology/notes/04-love-relationships/week-27-love-intimacy.md"
    version: "1.0.0"
    claim_ids:
      - "C27-01"
      - "C27-02"
    tags:
      - "neurobiology"
      - "dopamine"
      - "oxytocin"
      - "fmri"

  - id: "fc-psy-w27-018"
    concept: "Ngụy niệm 'Đọc Suy nghĩ' trong Tình yêu (Mind-Reading Fallacy)"
    front: "Tại sao quan niệm 'yêu thật lòng thì tự khắc phải hiểu không cần nói ra' lại là ngụy niệm nguy hại?"
    back: "Vì không một ai có khả năng thần giao cách cảm. Mô hình Reis & Shaver chứng minh Tự bộc lộ là mắt xích khởi đầu bắt buộc. Kỳ vọng đối phương tự đoán được nhu cầu của mình chỉ gây ra thất vọng, giận dỗi thầm lặng và chặn đứng cơ hội để bạn đời thực hành Tính đáp ứng (PPR)."
    source_lesson: "Psychology/notes/04-love-relationships/week-27-love-intimacy.md"
    version: "1.0.0"
    claim_ids:
      - "C27-01"
      - "C27-03"
    tags:
      - "mind-reading"
      - "pop-psychology"
      - "communication"
