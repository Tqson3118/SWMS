cards:
  - id: "fc-psy-w14-001"
    concept: "Định nghĩa thói quen và hai đặc điểm tự động hóa (Wood & Neal, 2007; Wood & Rünger, 2016)"
    front: "Thói quen (habit) được định nghĩa thế nào và có hai đặc điểm tự động hóa nào?"
    back: "Thói quen là hành vi hình thành nhờ lặp lại trong bối cảnh ổn định, được cue bối cảnh kích hoạt tự động. Hai đặc điểm tự động hóa: (1) kích hoạt bởi cue lặp lại, không cần kiểm soát chủ ý; (2) ít nhạy với thay đổi mục tiêu ngắn hạn — thói quen vẫn chạy kể cả khi mục tiêu đã đổi. Hệ thói quen song song và giao thoa với hệ hướng đích (habit-goal interface)."
    source_lesson: "Psychology/notes/02-understanding-self/week-14-habits-self-control.md"
    version: "1.0.0"
    claim_ids:
      - "C14-01"
    tags:
      - "habit"
      - "automaticity"
      - "habit-goal-interface"
      - "wood-neal"

  - id: "fc-psy-w14-002"
    concept: "Thời gian hình thành thói quen (Lally et al., 2010)"
    front: "Nghiên cứu thực địa của Lally và cộng sự (2010) cho biết thời gian hình thành thói quen như thế nào?"
    back: "96 người thực hiện một hành vi hằng ngày trong cùng bối cảnh suốt 12 tuần: median thời gian đạt 95% mức tiệm cận tự động hóa là 66 ngày, dao động 18–254 ngày; bỏ lỡ một ngày không ảnh hưởng đáng kể. Không có hằng số phổ quát; khái quát hóa phải thận trọng (mẫu nhỏ, tự báo cáo, bối cảnh Anh)."
    source_lesson: "Psychology/notes/02-understanding-self/week-14-habits-self-control.md"
    version: "1.0.0"
    claim_ids:
      - "C14-02"
    tags:
      - "habit-formation"
      - "lally"
      - "66-days"
      - "real-world"

  - id: "fc-psy-w14-003"
    concept: "Phân tích gộp SRHI (Gardner, de Bruijn & Lally, 2011)"
    front: "Phân tích gộp SRHI trong dinh dưỡng/vận động cho thấy thói quen liên hệ với hành vi ra sao?"
    back: "126 bài sàng lọc, 22 bài (21 datasets) đạt chuẩn: tương quan thói quen–hành vi trung bình–khá mạnh (r+ ≈ .44–.46); 8 phép kiểm cho thấy thói quen điều tiết quan hệ ý định–hành vi (thói quen mạnh thì ý định dự báo hành vi kém hơn). Là tổng hợp tương quan — không chứng minh nhân quả."
    source_lesson: "Psychology/notes/02-understanding-self/week-14-habits-self-control.md"
    version: "1.0.0"
    claim_ids:
      - "C14-03"
    tags:
      - "srhi"
      - "meta-analysis"
      - "habit-behaviour"
      - "moderation"

  - id: "fc-psy-w14-004"
    concept: "Kế hoạch triển khai nếu–thì (Gollwitzer & Sheeran, 2006; Milne et al., 2002)"
    front: "Implementation intentions là gì, bằng chứng gộp nói gì, và nghiên cứu minh họa cho số liệu nào?"
    back: "Kế hoạch 'nếu tình huống X thì làm Y' chỉ định trước cue và phản ứng. Phân tích gộp 94 kiểm chứng độc lập: d = .65 (trung bình–khá lớn) đối với mức đạt mục tiêu. Milne et al. (2002, N = 248, RCT): nhóm có kế hoạch nếu–thì tập luyện 91% so với 35% (chỉ động lực) và 38% (kiểm soát)."
    source_lesson: "Psychology/notes/02-understanding-self/week-14-habits-self-control.md"
    version: "1.0.0"
    claim_ids:
      - "C14-04"
    tags:
      - "implementation-intentions"
      - "if-then-plans"
      - "gollwitzer"
      - "meta-analysis"

  - id: "fc-psy-w14-005"
    concept: "Ego depletion và RRR đa phòng lab 2016"
    front: "Mô hình ego depletion nói gì và RRR 2016 tái lập ra sao?"
    back: "Mô hình gốc (Baumeister et al., 1998): các hành vi tự chủ dùng chung nguồn lực hữu hạn, cạn dần theo sử dụng. RRR 2016 (23 phòng lab, N = 2.141, giao thức đăng ký trước): d = 0.04, 95% CI [−0.07, 0.15] — CI chứa 0, tương thích hiệu ứng null. Mô hình [Tranh luận], đang được xem xét lại; không dùng làm quy luật cho kế hoạch cá nhân."
    source_lesson: "Psychology/notes/02-understanding-self/week-14-habits-self-control.md"
    version: "1.0.0"
    claim_ids:
      - "C14-05"
    tags:
      - "ego-depletion"
      - "replication-crisis"
      - "rrr"
      - "contested"

  - id: "fc-psy-w14-006"
    concept: "Năm họ chiến lược tự kiểm soát (Duckworth, Gendler & Gross, 2016)"
    front: "Năm họ chiến lược trong mô hình quá trình của tự kiểm soát là gì và vì sao chiến lược tình huống nên hiệu quả hơn?"
    back: "5 họ theo thứ tự thời gian: chọn tình huống (situation selection), sửa đổi tình huống (situation modification), phân bổ chú ý (attentional deployment), thay đổi nhận thức (cognitive change), điều chế phản ứng (response modulation). Chiến lược tình huống can thiệp sớm hơn trước khi xung động hình thành đầy đủ; tác giả ghi nhận cơ sở thực nghiệm cho tính vượt trội còn chưa hoàn chỉnh."
    source_lesson: "Psychology/notes/02-understanding-self/week-14-habits-self-control.md"
    version: "1.0.0"
    claim_ids:
      - "C14-06"
    tags:
      - "self-control"
      - "situational-strategies"
      - "process-model"
      - "duckworth-gross"

  - id: "fc-psy-w14-007"
    concept: "Người tự kiểm soát cao dựa vào thói quen (Galla & Duckworth, 2015)"
    front: "Theo Galla & Duckworth (2015), người có tự kiểm soát cao ít phải gồng cưỡng lại cám dỗ vì lý do gì?"
    back: "Vì họ có thói quen tốt (ăn lành mạnh, tập luyện, ngủ đều) làm các hành vi tích cực chạy tự động. 6 nghiên cứu, tổng N = 2.274: thói quen trung gian quan hệ giữa tự kiểm soát và kết quả tích cực. Khác biệt nằm ở hệ thói quen được thiết kế, không ở 'gồng giỏi hơn'."
    source_lesson: "Psychology/notes/02-understanding-self/week-14-habits-self-control.md"
    version: "1.0.0"
    claim_ids:
      - "C14-07"
    tags:
      - "self-control"
      - "habits"
      - "mediation"
      - "galla-duckworth"

  - id: "fc-psy-w14-008"
    concept: "Backbone giáo trình: điều kiện hóa tác động và coping (OpenStax 6.3, 14.4)"
    front: "OpenStax Psychology 2e nói gì về điều kiện hóa tác động (6.3) và coping (14.4) liên quan tuần này?"
    back: "6.3: 'In operant conditioning, organisms learn to associate a behavior and its consequence' — hậu quả đi kèm hành vi củng cố hoặc làm giảm hành vi. 14.4: coping là các nỗ lực tâm lý và hành vi đối phó vấn đề liên quan stress; người cảm nhận kiểm soát cao hơn dễ quản lý sức khỏe và duy trì hành vi tốt cho sức khỏe."
    source_lesson: "Psychology/notes/02-understanding-self/week-14-habits-self-control.md"
    version: "1.0.0"
    claim_ids:
      - "C14-08"
    tags:
      - "operant-conditioning"
      - "openstax"
      - "coping"
      - "perceived-control"

  - id: "fc-psy-w14-009"
    concept: "Huyền thoại '21 ngày hình thành thói quen' (đối tượng phản biện)"
    front: "Huyền thoại '21 ngày' bắt nguồn từ đâu và bằng chứng thực tế nói gì?"
    back: "Bắt nguồn từ sách tự trợ Psycho-Cybernetics (Maxwell Maltz, 1960): bệnh nhân cần khoảng 21 ngày để quen diện mạo mới sau phẫu thuật thẩm mỹ — nói về thích nghi hình ảnh bản thân, không phải thói quen hành vi. Dữ liệu thực địa (Lally et al., 2010): median 66 ngày, dao động 18–254. Blog UCL (Gardner, 2012) đối chiếu trực tiếp: '21 days is a myth'."
    source_lesson: "Psychology/notes/02-understanding-self/week-14-habits-self-control.md"
    version: "1.0.0"
    claim_ids:
      - "C14-09"
      - "C14-02"
    tags:
      - "21-day-myth"
      - "pop-psychology"
      - "debunked"
      - "maltz"
