lesson_id: week-22-conformity-obedience
version: 1.0.0
description: Bộ thẻ ghi nhớ Tuần 22 về Đồng thuận, Tuân phục và Động lực nhóm.
cards:
- id: fc-psy-w22-001
  concept: Ảnh hưởng Chuẩn mực vs Thông tin
  front: Phân biệt động cơ giữa ảnh hưởng xã hội chuẩn mực (normative) và thông tin (informational)?
  back: Chuẩn mực xuất phát từ nhu cầu được hòa nhập và sợ bị cô lập xã hội; Thông tin xuất phát từ nhu cầu nhận thức đúng đắn khi tình huống mơ hồ và tin nhóm có dữ kiện tốt hơn.
  source_lesson: Psychology/notes/03-understanding-others/week-22-conformity-obedience.md#31-đồng-thuận-conformity-tại-sao-ta-làm-theo-đám-đông
  version: 1.0.0
  tags:
  - w22
  - social-influence-types
- id: fc-psy-w22-002
  concept: Thí nghiệm Solomon Asch (1956)
  front: Điểm mấu chốt phá vỡ sự đồng thuận mù quáng trong thí nghiệm Asch là gì?
  back: Chỉ cần có DUY NHẤT một người phản biện (dissenter) đưa ra đáp án khác nhóm, tỷ lệ đồng thuận sai trái của người tham gia giảm ngay lập tức 80%.
  source_lesson: Psychology/notes/03-understanding-others/week-22-conformity-obedience.md#32-thí-nghiệm-đo-chiều-dài-đoạn-thẳng-của-solomon-asch-1956
  version: 1.0.0
  tags:
  - w22
  - asch-conformity
- id: fc-psy-w22-003
  concept: Thí nghiệm Stanley Milgram (1974)
  front: Thí nghiệm sốc điện Milgram báo cáo tỷ lệ tuân phục thẩm quyền tối đa (450V) là bao nhiêu?
  back: 65% người tham gia bình thường tiếp tục nhấn nút sốc điện tới mức tối đa 450V dưới sự thúc ép bình thản của thẩm quyền khoa học.
  source_lesson: Psychology/notes/03-understanding-others/week-22-conformity-obedience.md#33-tuân-phục-thẩm-quyền-thí-nghiệm-sốc-điện-của-stanley-milgram-1963-1974
  version: 1.0.0
  tags:
  - w22
  - milgram-obedience
- id: fc-psy-w22-004
  concept: Yếu tố điều tiết tuân phục Milgram
  front: Biến thể nào trong thí nghiệm Milgram làm sụp đổ mức tuân phục xuống chỉ còn 10%?
  back: Sự hiện diện của những người đồng hành phản kháng (Rebellious Peers) kiên quyết từ chối tiếp tục thực hiện mệnh lệnh.
  source_lesson: Psychology/notes/03-understanding-others/week-22-conformity-obedience.md#41-các-biến-thể-của-thí-nghiệm-milgram--yếu-tố-điều-tiết
  version: 1.0.0
  tags:
  - w22
  - obedience-moderators
- id: fc-psy-w22-005
  concept: Mô hình SIDE về Phi cá nhân hóa
  front: Mô hình SIDE (Postmes & Spears, 1998) giải thích hiện tượng ẩn danh trong đám đông ra sao?
  back: Ẩn danh không làm mất lý trí mà làm lu mờ bản sắc cá nhân và chuyển dịch sang tuân thủ mãnh liệt chuẩn mực nổi trội của nhóm (tích cực hoặc tiêu cực).
  source_lesson: Psychology/notes/03-understanding-others/week-22-conformity-obedience.md#42-hiện-tượng-phi-cá-nhân-hóa-deindividuation--side-model
  version: 1.0.0
  tags:
  - w22
  - deindividuation-side
- id: fc-psy-w22-006
  concept: Tư duy tập thể (Groupthink)
  front: Tư duy tập thể (Irving Janis, 1982) là gì và gây hại thế nào?
  back: Là hiện tượng suy thoái nhận thức trong các nhóm gắn kết cao, nơi áp lực duy trì sự hòa khí và đồng thuận đè bẹp sự đánh giá phản biện thực tế.
  source_lesson: Psychology/notes/03-understanding-others/week-22-conformity-obedience.md#43-tư-duy-tập-thể-groupthink---irving-janis-1982
  version: 1.0.0
  tags:
  - w22
  - groupthink
- id: fc-psy-w22-007
  concept: Biện pháp phòng ngừa Groupthink
  front: Cách khắc phục Groupthink hiệu quả nhất trong các cuộc họp ra quyết định là gì?
  back: Người lãnh đạo không bộc lộ quan điểm trước, chỉ định người phản biện chính thức (Devil's Advocate), và khuyến khích kênh góp ý ẩn danh độc lập.
  source_lesson: Psychology/notes/03-understanding-others/week-22-conformity-obedience.md#43-tư-duy-tập-thể-groupthink---irving-janis-1982
  version: 1.0.0
  tags:
  - w22
  - groupthink-prevention
- id: fc-psy-w22-008
  concept: Tái lập của Jerry Burger (2009)
  front: Tái lập hiện đại của Burger (2009) khẳng định điều gì về sự tuân phục?
  back: Mức độ tuân phục thẩm quyền của con người ngày nay vẫn ổn định tương đương thập niên 1960; sự phát triển của giáo dục không tự động làm giảm tính dễ bị ảnh hưởng bởi quyền lực.
  source_lesson: Psychology/notes/03-understanding-others/week-22-conformity-obedience.md#33-tuân-phục-thẩm-quyền-thí-nghiệm-sốc-điện-của-stanley-milgram-1963-1974
  version: 1.0.0
  tags:
  - w22
  - burger-replication
