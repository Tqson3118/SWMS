deck_id: "deck-psy-w02"
subject: "Psychology"
lesson_id: "week-02-research-methods"
version: "1.0.0"
description: "Bộ thẻ Flashcard chuẩn hóa ôn tập ngắt quãng (Spaced Repetition - R5 Compliant) Tuần 02: Phương pháp Nghiên cứu — Giả thuyết, Biến số, Chọn mẫu, Đo lường và Đạo đức"

cards:
  - id: "fc-psy-w02-001"
    concept: "Tính khả bác theo Karl Popper"
    front: "Tiêu chuẩn tính khả bác (falsifiability) của Karl Popper quy định điều gì đối với một giả thuyết khoa học thực nghiệm?"
    back: "Một giả thuyết khoa học bắt buộc phải có khả năng bị chứng minh là sai thông qua quan sát hoặc thực nghiệm thực tế nếu nó thực sự sai; những khẳng định được cấu trúc khép kín để không thể bị bác bỏ trong bất kỳ tình huống nào đều nằm ngoài phạm vi khoa học thực nghiệm."
    source_lesson: "Psychology/notes/01-scientific-foundations/week-02-research-methods.md"
    version: "1.0.0"
    claim_ids:
      - "C02-01"
    tags:
      - "philosophy-of-science"
      - "popper"
      - "falsifiability"

  - id: "fc-psy-w02-002"
    concept: "Định nghĩa thao tác"
    front: "Định nghĩa thao tác (operational definition) là gì và vì sao nó là điều kiện tiên quyết để các nhà nghiên cứu độc lập có thể tái lập thí nghiệm?"
    back: "Định nghĩa thao tác là bản mô tả chính xác các hành động, quy trình và công cụ cụ thể được dùng để đo lường hoặc thao túng một biến số trừu tượng. Nó giúp chuẩn hóa cách đo lường để các phòng thí nghiệm độc lập khác có thể thực hiện lại chính xác quy trình nhằm kiểm chứng và tái lập kết quả."
    source_lesson: "Psychology/notes/01-scientific-foundations/week-02-research-methods.md"
    version: "1.0.0"
    claim_ids:
      - "C02-02"
    tags:
      - "methodology"
      - "measurement"
      - "operational-definition"

  - id: "fc-psy-w02-003"
    concept: "So sánh thiết kế nghiên cứu mô tả"
    front: "Ưu thế cốt lõi và giới hạn phương pháp luận lớn nhất của ba thiết kế mô tả: Nghiên cứu trường hợp, Quan sát tự nhiên, và Khảo sát là gì?"
    back: "Nghiên cứu trường hợp mang lại dữ liệu lâm sàng rất chi tiết nhưng khó khái quát hóa; Quan sát tự nhiên có độ giá trị sinh thái cao nhưng khó kiểm soát biến ngoại lai; Khảo sát thu thập dữ liệu lớn nhanh chóng nhưng dễ bị méo mó bởi thiên lệch tự báo cáo và mong muốn xã hội."
    source_lesson: "Psychology/notes/01-scientific-foundations/week-02-research-methods.md"
    version: "1.0.0"
    claim_ids:
      - "C02-03"
    tags:
      - "research-designs"
      - "case-study"
      - "naturalistic-observation"
      - "survey"

  - id: "fc-psy-w02-004"
    concept: "Nghiên cứu cắt ngang vs Theo chiều dọc"
    front: "Sự khác biệt cốt lõi và nguy cơ phương pháp luận chính giữa nghiên cứu cắt ngang (cross-sectional) và nghiên cứu theo chiều dọc (longitudinal) là gì?"
    back: "Nghiên cứu cắt ngang so sánh các nhóm tuổi khác nhau tại cùng một thời điểm, dễ nhầm lẫn quy luật phát triển với hiệu ứng thế hệ (cohort effect); Nghiên cứu theo chiều dọc theo dõi cùng một nhóm người qua nhiều mốc thời gian, chi phí cao và đối mặt với nguy cơ rụng mẫu (attrition)."
    source_lesson: "Psychology/notes/01-scientific-foundations/week-02-research-methods.md"
    version: "1.0.0"
    claim_ids:
      - "C02-04"
    tags:
      - "temporal-design"
      - "cross-sectional"
      - "longitudinal"
      - "cohort-effect"

  - id: "fc-psy-w02-005"
    concept: "Cấu trúc thiết kế thực nghiệm và quan hệ nhân quả"
    front: "Cấu trúc logic của một thiết kế thực nghiệm gồm những thành tố nào và tại sao thực nghiệm đối chứng là thiết kế mạnh mẽ nhất để suy luận quan hệ nhân quả?"
    back: "Thực nghiệm gồm Biến độc lập (IV - được thao túng), Biến phụ thuộc (DV - được đo lường), Nhóm thực nghiệm và Nhóm đối chứng. Thực nghiệm cho phép suy luận nhân quả mạnh nhất vì nhà nghiên cứu chủ động thao túng biến độc lập và phân bổ ngẫu nhiên; giá trị này phụ thuộc vào việc các giả định thiết kế được đảm bảo."
    source_lesson: "Psychology/notes/01-scientific-foundations/week-02-research-methods.md"
    version: "1.0.0"
    claim_ids:
      - "C02-05"
    tags:
      - "experiment"
      - "causation"
      - "independent-variable"
      - "dependent-variable"

  - id: "fc-psy-w02-006"
    concept: "Phân bổ ngẫu nhiên vs Chọn mẫu ngẫu nhiên"
    front: "Phân biệt mục đích phương pháp luận của Chọn mẫu ngẫu nhiên (Random Sampling) và Phân bổ ngẫu nhiên (Random Assignment)?"
    back: "Chọn mẫu ngẫu nhiên tuyển đối tượng từ quần thể vào nghiên cứu để hỗ trợ tính đại diện và khái quát hóa khi khung mẫu và tỷ lệ đáp ứng phù hợp; Phân bổ ngẫu nhiên chia các đối tượng vào nhóm thực nghiệm hoặc đối chứng để các đặc tính cá nhân và biến gây nhiễu có xu hướng cân bằng ở mức kỳ vọng, nhưng một mẫu cụ thể vẫn có thể lệch."
    source_lesson: "Psychology/notes/01-scientific-foundations/week-02-research-methods.md"
    version: "1.0.0"
    claim_ids:
      - "C02-06"
    tags:
      - "sampling"
      - "random-assignment"
      - "confounding-variables"

  - id: "fc-psy-w02-007"
    concept: "Thiết kế mù đơn và mù đôi"
    front: "Mục đích của thiết kế mù đơn (single-blind) và mù đôi (double-blind) trong thực nghiệm tâm lý học là gì?"
    back: "Mù đơn có thể giảm ảnh hưởng kỳ vọng của người tham gia (hiệu ứng giả dược / placebo effect); mù đôi có thể giảm đồng thời kỳ vọng của người tham gia và thiên lệch kỳ vọng của người làm thí nghiệm trong phạm vi thiết kế, nhưng không tự động loại bỏ mọi thiên lệch."
    source_lesson: "Psychology/notes/01-scientific-foundations/week-02-research-methods.md"
    version: "1.0.0"
    claim_ids:
      - "C02-07"
    tags:
      - "blinding"
      - "double-blind"
      - "placebo"
      - "experimenter-bias"

  - id: "fc-psy-w02-008"
    concept: "Đạo đức nghiên cứu: IRB, Informed Consent và Debriefing"
    front: "Quy chuẩn đạo đức nghiên cứu tâm lý học quy định như thế nào về vai trò của IRB, văn bản Informed Consent và kỹ thuật Debriefing?"
    back: "Theo chuẩn mực quốc tế hiện hành, nghiên cứu trên người thường phải được một hội đồng đạo đức độc lập thẩm duyệt; người tham gia được yêu cầu Informed Consent và có quyền rút lui; nếu dùng yếu tố đánh lạc hướng (deception) vì lý do phương pháp luận, cần tiến hành Debriefing giải thích đầy đủ sau khi kết thúc phiên thí nghiệm."
    source_lesson: "Psychology/notes/01-scientific-foundations/week-02-research-methods.md"
    version: "1.0.0"
    claim_ids:
      - "C02-08"
    tags:
      - "ethics"
      - "irb"
      - "informed-consent"
      - "debriefing"

  - id: "fc-psy-w02-009"
    concept: "Báo cáo Belmont và ba nguyên tắc đạo đức cốt lõi"
    front: "Báo cáo Belmont (1979) ra đời sau sự kiện lịch sử nào và xác lập ba nguyên tắc đạo đức cốt lõi nào cho nghiên cứu trên con người?"
    back: "Báo cáo Belmont ra đời sau vụ bê bối Nghiên cứu Giang mai Tuskegee. Ba nguyên tắc cốt lõi gồm: Tôn trọng con người (Respect for persons - quyền tự chủ và bảo vệ người có quyền tự chủ hạn chế), Lòng hướng thiện (Beneficence - cân nhắc lợi ích và rủi ro), và Công bằng (Justice - phân bổ công bằng gánh nặng và lợi ích). Tuskegee là một bối cảnh lịch sử góp phần thúc đẩy cải cách đạo đức; không nên gọi đó là nguyên nhân duy nhất của Belmont."
    source_lesson: "Psychology/notes/01-scientific-foundations/week-02-research-methods.md"
    version: "1.0.0"
    claim_ids:
      - "C02-09"
    tags:
      - "ethics"
      - "belmont-report"
      - "tuskegee"

