deck_id: "deck-psy-w48"
subject: "Psychology"
lesson_id: "week-48-final-exam-portfolio"
version: "1.0.0"
description: "Bộ thẻ ôn tập Tuần 48: Capstone tích hợp toàn khóa & đạo đức ứng dụng tâm lý học"

cards:
  - id: "fc-psy-w48-001"
    concept: "Mô hình Sinh học - Tâm lý - Xã hội (Biopsychosocial Model)"
    front: "Mô hình Biopsychosocial giải thích hành vi và đời sống tinh thần của con người như thế nào?"
    back: "Là sản phẩm tương tác hữu cơ đa tầng giữa sinh học thần kinh (não bộ, gene, hormone), nhận thức - cảm xúc cá nhân, và bối cảnh môi trường văn hóa - xã hội."
    source_lesson: "Psychology/notes/06-integration/week-48-final-exam-portfolio.md"
    version: "1.0.0"
    claim_ids:
      - "C48-01"
    tags:
      - "biopsychosocial"
      - "capstone"
      - "integrative-psychology"

  - id: "fc-psy-w48-002"
    concept: "Sai lầm quy kết nguyên nhân đơn lẻ của Pop Psychology"
    front: "Tại sao việc giải thích hành vi con người bằng một nguyên nhân đơn lẻ lại bị coi là sai lầm phương pháp luận?"
    back: "Vì nó bỏ qua bản chất hệ thống phức hợp; một hành vi luôn chịu chi phối đồng thời bởi thể chất (cortisol, giấc ngủ), nhận thức (bản sắc, thiên kiến) và chuẩn mực xã hội."
    source_lesson: "Psychology/notes/06-integration/week-48-final-exam-portfolio.md"
    version: "1.0.0"
    claim_ids:
      - "C48-01"
    tags:
      - "pop-psychology"
      - "reductionism"
      - "scientific-thinking"

  - id: "fc-psy-w48-003"
    concept: "5 Nguyên tắc đạo đức phổ quát theo chuẩn APA (2017)"
    front: "Năm nguyên tắc đạo đức cốt lõi trong Bộ Quy tắc Đạo đức APA (2017) là gì?"
    back: "1. Lợi ích & Không gây hại; 2. Trung thực & Trách nhiệm; 3. Liêm chính khoa học; 4. Công bằng; 5. Tôn trọng phẩm giá và quyền tự quyết (Autonomy) của con người."
    source_lesson: "Psychology/notes/06-integration/week-48-final-exam-portfolio.md"
    version: "1.0.0"
    claim_ids:
      - "C48-02"
    tags:
      - "apa-ethics"
      - "beneficence"
      - "autonomy"

  - id: "fc-psy-w48-004"
    concept: "Lằn ranh đỏ chống thao túng tâm lý độc hại (Gaslighting)"
    front: "Ranh giới đạo đức tối thượng khi ứng dụng tri thức tâm lý học vào đời sống là gì?"
    back: "Tuyệt đối không dùng thuật ngữ tâm lý để gán nhãn, thao túng thực tại (Gaslighting), tước đoạt quyền tự quyết, hoặc tự ý điều trị lâm sàng khi vượt quá năng lực chuyên môn."
    source_lesson: "Psychology/notes/06-integration/week-48-final-exam-portfolio.md"
    version: "1.0.0"
    claim_ids:
      - "C48-02"
    tags:
      - "gaslighting"
      - "ethical-boundaries"
      - "nonmaleficence"

  - id: "fc-psy-w48-005"
    concept: "Khiêm tốn Nhận thức (Intellectual Humility - Mark Leary)"
    front: "Phẩm chất Khiêm tốn Nhận thức (Intellectual Humility) thể hiện ở thái độ nào?"
    back: "Nhận thức sâu sắc rằng niềm tin của mình có thể sai lầm (Fallibility), sẵn sàng lắng nghe và điều chỉnh quan điểm trước bằng chứng mới, và tách rời bản ngã khỏi quan điểm."
    source_lesson: "Psychology/notes/06-integration/week-48-final-exam-portfolio.md"
    version: "1.0.0"
    claim_ids:
      - "C48-03"
    tags:
      - "intellectual-humility"
      - "leary"
      - "epistemic-virtue"

  - id: "fc-psy-w48-006"
    concept: "Bài học từ Cuộc khủng hoảng tái lập (Replication Crisis)"
    front: "Khủng hoảng tái lập trong tâm lý học thực nghiệm dạy cho người học bài học gì?"
    back: "Khoa học là quá trình tự sửa sai liên tục; không bao giờ thần thánh hóa một nghiên cứu đơn lẻ giật gân mà luôn tìm kiếm phân tích gộp (Meta-analyses) và giữ sự hoài nghi lành mạnh."
    source_lesson: "Psychology/notes/06-integration/week-48-final-exam-portfolio.md"
    version: "1.0.0"
    claim_ids:
      - "C48-03"
    tags:
      - "replication-crisis"
      - "meta-analysis"
      - "open-science"

  - id: "fc-psy-w48-007"
    concept: "Học tập tự định hướng suốt đời (Malcolm Knowles, 1975)"
    front: "Đặc điểm của người học tự định hướng (Andragogy) ở người trưởng thành là gì?"
    back: "Chủ động chẩn đoán nhu cầu, tự xây dựng mục tiêu, chọn lọc nguồn lực khoa học có thẩm định, và tự đánh giá năng lực qua chu trình thực hành phản tư liên tục."
    source_lesson: "Psychology/notes/06-integration/week-48-final-exam-portfolio.md"
    version: "1.0.0"
    claim_ids:
      - "C48-04"
    tags:
      - "andragogy"
      - "self-directed-learning"
      - "knowles"

  - id: "fc-psy-w48-008"
    concept: "Hồ sơ Năng lực Học tập Capstone (John Zubizarreta)"
    front: "Giá trị thực tiễn của Hồ sơ Năng lực Học tập (Learning Portfolio) là gì?"
    back: "Chuyển hóa 48 tuần lý thuyết thành cẩm nang hành động thực tiễn sống động: bản đồ giá trị, giao thức điều hòa cảm xúc, kế hoạch Dunbar 5 người, WOOP 90 ngày và cam kết đạo đức."
    source_lesson: "Psychology/notes/06-integration/week-48-final-exam-portfolio.md"
    version: "1.0.0"
    claim_ids:
      - "C48-05"
    tags:
      - "learning-portfolio"
      - "reflective-practice"
      - "capstone"
