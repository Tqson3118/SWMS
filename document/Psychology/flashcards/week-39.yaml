deck_id: "deck-psy-w39"
subject: "Psychology"
lesson_id: "week-39-anxiety-depression-ocd"
version: "1.0.0"
description: "Bộ thẻ ôn tập Tuần 39: Lo âu, Trầm cảm và Rối loạn Ám ảnh Cưỡng chế (OCD)"

cards:
  - id: "fc-psy-w39-001"
    concept: "Phân biệt Lo âu Thích nghi vs Rối loạn Lo âu (GAD)"
    front: "Tiêu chuẩn then chốt phân biệt Lo âu Thích nghi bình thường với Rối loạn Lo âu Lan tỏa (GAD) theo DSM-5-TR là gì?"
    back: "GAD đặc trưng bởi sự lo lắng quá mức về nhiều chủ đề đời sống khác nhau, khó kiểm soát, kéo dài ít nhất 6 tháng và gây suy giảm đáng kể các chức năng xã hội, nghề nghiệp (Dysfunction)."
    source_lesson: "Psychology/notes/05-development-mental-health/week-39-anxiety-depression-ocd.md"
    version: "1.0.0"
    claim_ids:
      - "C39-01"
    tags:
      - "anxiety"
      - "gad"
      - "dsm-5-tr"

  - id: "fc-psy-w39-002"
    concept: "Tiêu chuẩn chẩn đoán MDD (DSM-5-TR)"
    front: "Để được chẩn đoán Rối loạn Trầm cảm Chủ yếu (MDD), DSM-5-TR yêu cầu những tiêu chuẩn thời gian và triệu chứng nào?"
    back: "Ít nhất 5 trong 9 triệu chứng kéo dài tối thiểu 2 tuần, trong đó bắt buộc phải có ít nhất 1 trong 2 triệu chứng cốt lõi: Khí sắc trầm uất (Depressed mood) hoặc Mất hứng thú/khả năng tận hưởng (Anhedonia)."
    source_lesson: "Psychology/notes/05-development-mental-health/week-39-anxiety-depression-ocd.md"
    version: "1.0.0"
    claim_ids:
      - "C39-02"
    tags:
      - "mdd"
      - "depression"
      - "diagnostic-criteria"

  - id: "fc-psy-w39-003"
    concept: "Tam giác nhận thức tiêu cực (Beck)"
    front: "Bộ ba nhận thức tiêu cực (Negative Cognitive Triad) của Aaron Beck (1979) trong trầm cảm bao gồm những gì?"
    back: "Lược đồ niềm tin méo mó tiêu cực về: (1) Bản thân (vô giá trị, khiếm khuyết); (2) Thế giới / Hoàn cảnh sống (khắc nghiệt, bất công, đòi hỏi quá mức); và (3) Tương lai (vô vọng, không có lối thoát)."
    source_lesson: "Psychology/notes/05-development-mental-health/week-39-anxiety-depression-ocd.md"
    version: "1.0.0"
    claim_ids:
      - "C39-03"
    tags:
      - "beck"
      - "cognitive-triad"
      - "cognitive-therapy"

  - id: "fc-psy-w39-004"
    concept: "Ám ảnh vs Cưỡng chế trong OCD"
    front: "Phân biệt Obsessions (Ám ảnh) và Compulsions (Cưỡng chế) trong cơ chế của OCD?"
    back: "Obsessions là các suy nghĩ, hình ảnh hoặc thôi thúc xâm nhập tái diễn ngoài ý muốn gây lo âu dữ dội. Compulsions là các hành vi thể chất hoặc tinh thần lặp đi lặp lại nhằm làm giảm lo âu do ám ảnh gây ra."
    source_lesson: "Psychology/notes/05-development-mental-health/week-39-anxiety-depression-ocd.md"
    version: "1.0.0"
    claim_ids:
      - "C39-04"
    tags:
      - "ocd"
      - "obsessions"
      - "compulsions"

  - id: "fc-psy-w39-005"
    concept: "Vòng xoắn củng cố âm trong OCD"
    front: "Hành vi cưỡng chế (Compulsion) duy trì và làm trầm trọng thêm OCD qua cơ chế hành vi nào?"
    back: "Qua cơ chế Củng cố âm (Negative reinforcement): Hành vi cưỡng chế làm giảm lo âu tạm thời, củng cố niềm tin sai lầm rằng mối đe dọa là có thật, khiến các cơn ám ảnh sau đó tái diễn với tần suất và cường độ mạnh hơn."
    source_lesson: "Psychology/notes/05-development-mental-health/week-39-anxiety-depression-ocd.md"
    version: "1.0.0"
    claim_ids:
      - "C39-04"
    tags:
      - "negative-reinforcement"
      - "ocd-cycle"
      - "operant-conditioning"

  - id: "fc-psy-w39-006"
    concept: "Hợp nhất Suy nghĩ - Hành động (Thought-Action Fusion)"
    front: "Cơ chế 'Hợp nhất suy nghĩ - hành động' (Thought-Action Fusion) trong OCD là gì?"
    back: "Niềm tin méo mó cho rằng chỉ cần nghĩ về một điều xấu xa là có tội ngang với việc làm nó, hoặc nghĩ về một tai họa sẽ làm gia tăng khả năng tai họa đó xảy ra ngoài đời thực."
    source_lesson: "Psychology/notes/05-development-mental-health/week-39-anxiety-depression-ocd.md"
    version: "1.0.0"
    claim_ids:
      - "C39-04"
    tags:
      - "thought-action-fusion"
      - "cognitive-distortion"
      - "ocd"

  - id: "fc-psy-w39-007"
    concept: "Liệu pháp ERP (Exposure and Response Prevention)"
    front: "Tại sao Liệu pháp Tiếp xúc và Ngăn ngừa Phản ứng (ERP) là tiêu chuẩn vàng thực nghiệm cho OCD?"
    back: "ERP hướng dẫn thân chủ đối diện có chủ đích với các kích thích gây ám ảnh (Exposure) đồng thời chủ động kiềm chế không thực hiện hành vi cưỡng chế (Response Prevention), giúp não bộ quen dần (habituate) và phá vỡ vòng lặp củng cố âm."
    source_lesson: "Psychology/notes/05-development-mental-health/week-39-anxiety-depression-ocd.md"
    version: "1.0.0"
    claim_ids:
      - "C39-05"
    tags:
      - "erp"
      - "gold-standard"
      - "cbt"
      - "treatment"

  - id: "fc-psy-w39-008"
    concept: "Ranh giới An toàn và Tìm kiếm Hỗ trợ Khẩn cấp"
    front: "Khi một người xuất hiện ý nghĩ tự hại hoặc tuyệt vọng sâu sắc, có cần đợi đủ ngưỡng 2 tuần của DSM-5-TR không?"
    back: "Tuyệt đối không! Ngưỡng chẩn đoán phân loại không phải là điều kiện để tìm kiếm sự trợ giúp. Bất kỳ khi nào có ý nghĩ tự hại hay nguy cơ khẩn cấp, cần kết nối ngay với chuyên gia y tế tâm thần hoặc đường dây nóng cứu trợ."
    source_lesson: "Psychology/notes/05-development-mental-health/week-39-anxiety-depression-ocd.md"
    version: "1.0.0"
    claim_ids:
      - "C39-05"
    tags:
      - "crisis-support"
      - "safety"
      - "ethics"
      - "clinical-boundaries"
