deck_id: "deck-psy-w06"
subject: "Psychology"
lesson_id: "week-06-attention-consciousness-sleep"
version: "1.0.0"
description: "Bộ thẻ Flashcard chuẩn hóa ôn tập ngắt quãng (Spaced Repetition - R5 Compliant) Tuần 06: Chú ý, Ý thức và Giấc ngủ"

cards:
  - id: "fc-psy-w06-001"
    concept: "Định nghĩa Ý thức và phổ trạng thái nhận thức"
    front: "Định nghĩa Ý thức (Consciousness) và mô tả phổ các trạng thái nhận thức của con người?"
    back: "Ý thức là sự nhận biết liên tục của cá nhân về kích thích nội tại (suy nghĩ, cảm xúc, cảm giác cơ thể) và kích thích ngoại tại (môi trường), biến thiên liên tục từ tỉnh táo cao độ, lơ đãng, ngủ mơ đến hôn mê sâu."
    source_lesson: "Psychology/notes/01-scientific-foundations/week-06-attention-consciousness-sleep.md"
    version: "1.0.0"
    claim_ids:
      - "C06-01"
    tags:
      - "consciousness"
      - "awareness"
      - "states-of-mind"

  - id: "fc-psy-w06-002"
    concept: "Đồng hồ sinh học chủ SCN và trục Melatonin"
    front: "Đồng hồ sinh học chủ SCN và hormone Melatonin điều phối nhịp sinh học ngày đêm (circadian rhythms) ra sao?"
    back: "SCN ở vùng dưới đồi nhận ánh sáng từ võng mạc. Ban ngày ánh sáng ức chế tuyến tùng; ban đêm SCN kích hoạt tuyến tùng tiết hormone Melatonin vào máu làm hạ nhiệt độ cơ thể và gây buồn ngủ."
    source_lesson: "Psychology/notes/01-scientific-foundations/week-06-attention-consciousness-sleep.md"
    version: "1.0.0"
    claim_ids:
      - "C06-02"
    tags:
      - "circadian-rhythm"
      - "scn"
      - "melatonin"

  - id: "fc-psy-w06-003"
    concept: "Nợ giấc ngủ và hiện tượng Vi giấc ngủ"
    front: "Tác hại nhận thức của Nợ giấc ngủ (Sleep debt) là gì và Vi giấc ngủ (Microsleeps) diễn ra như thế nào?"
    back: "Nợ giấc ngủ làm chậm phản xạ, suy giảm chú ý và trí nhớ làm việc. Vi giấc ngủ là cơn mất nhận thức ngắn ngủi 1–10 giây do não bộ tự động cúp cầu dao khi áp lực ngủ quá tải, gây nguy cơ tai nạn giao thông rất cao."
    source_lesson: "Psychology/notes/01-scientific-foundations/week-06-attention-consciousness-sleep.md"
    version: "1.0.0"
    claim_ids:
      - "C06-03"
    tags:
      - "sleep-debt"
      - "microsleeps"
      - "cognitive-deficit"

  - id: "fc-psy-w06-004"
    concept: "Các giai đoạn giấc ngủ NREM trên EEG"
    front: "Ba giai đoạn của giấc ngủ NREM có đặc điểm sóng não điện não đồ (EEG) và chức năng sinh học ra sao?"
    back: "N1: sóng theta, thiu ngủ; N2: sóng theta với Thoi ngủ (sleep spindles) và Phức hợp K (K-complexes) củng cố trí nhớ; N3: sóng chậm Delta (<4 Hz), ngủ sâu hồi phục thể chất, tiết hormone tăng trưởng và dọn độc tố não."
    source_lesson: "Psychology/notes/01-scientific-foundations/week-06-attention-consciousness-sleep.md"
    version: "1.0.0"
    claim_ids:
      - "C06-04"
    tags:
      - "nrem-sleep"
      - "sleep-spindles"
      - "delta-waves"

  - id: "fc-psy-w06-005"
    concept: "Giấc ngủ REM và hiện tượng liệt cơ Atonia"
    front: "Giấc ngủ REM có đặc điểm sinh lý gì nổi bật và đóng vai trò gì cho chức năng trí nhớ?"
    back: "Sóng não tần số nhanh tương tự lúc thức, mắt giật nhanh, liệt cơ vân hoàn toàn (muscle atonia) ngăn cơ thể hành động theo giấc mơ. REM đóng vai trò tối quan trọng củng cố trí nhớ cảm xúc, học kỹ năng và xử lý sáng tạo."
    source_lesson: "Psychology/notes/01-scientific-foundations/week-06-attention-consciousness-sleep.md"
    version: "1.0.0"
    claim_ids:
      - "C06-05"
    tags:
      - "rem-sleep"
      - "muscle-atonia"
      - "memory-consolidation"

  - id: "fc-psy-w06-006"
    concept: "Rối loạn giấc ngủ: Ngưng thở khi ngủ và Ngủ rũ"
    front: "Phân biệt cơ chế bệnh học của Chứng ngưng thở khi ngủ (Sleep Apnea) và Hội chứng ngủ rũ (Narcolepsy)?"
    back: "Ngưng thở khi ngủ do tắc nghẽn cơ đường thở gây tụt oxy máu và ngáy to; Ngủ rũ là cơn buồn ngủ ập đến bất ngờ kèm mất trương lực cơ (cataplexy) do tổn thương tự miễn nơ-ron tiết peptide Orexin/Hypocretin ở vùng dưới đồi."
    source_lesson: "Psychology/notes/01-scientific-foundations/week-06-attention-consciousness-sleep.md"
    version: "1.0.0"
    claim_ids:
      - "C06-06"
    tags:
      - "sleep-apnea"
      - "narcolepsy"
      - "orexin"

  - id: "fc-psy-w06-007"
    concept: "Chất tác động tâm thần và thụ thể synap"
    front: "Bốn nhóm chất tác động tâm thần chính can thiệp vào thụ thể synap thần kinh theo cơ chế nào?"
    back: "Depressants: chất chủ vận GABA gây ức chế thần kinh; Stimulants: tăng nồng độ Dopamine và Norepinephrine; Opioids: gắn đặc hiệu vào thụ thể Endorphin giảm đau; Hallucinogens: tác động lên thụ thể Serotonin (5-HT2A) làm biến đổi tri giác."
    source_lesson: "Psychology/notes/01-scientific-foundations/week-06-attention-consciousness-sleep.md"
    version: "1.0.0"
    claim_ids:
      - "C06-07"
    tags:
      - "psychoactive-drugs"
      - "gaba"
      - "stimulants"

  - id: "fc-psy-w06-008"
    concept: "Cơ sở khoa học của Thôi miên và Thiền Chánh niệm"
    front: "Thôi miên và Thiền chánh niệm làm thay đổi trạng thái ý thức dựa trên cơ chế khoa học thần kinh nào?"
    back: "Thôi miên là tập trung cao độ và tăng tính dễ bị ám thị (giải thích bằng Thuyết phân ly Hilgard); Thiền chánh niệm rèn luyện chú ý khoảnh khắc hiện tại không phán xét, được chứng minh làm dày vỏ não trước trán và giảm phản ứng hạch hạnh nhân."
    source_lesson: "Psychology/notes/01-scientific-foundations/week-06-attention-consciousness-sleep.md"
    version: "1.0.0"
    claim_ids:
      - "C06-08"
    tags:
      - "hypnosis"
      - "mindfulness"
      - "neuroplasticity"
