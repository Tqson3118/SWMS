learning_objectives:
- id: LO-W02-01
  bloom_level: Understand
  statement: Định nghĩa và phân biệt chu trình suy luận quy nạp — diễn dịch, tiêu
    chuẩn tính khả bác của Karl Popper, và vai trò cốt lõi của định nghĩa thao tác
    đối với khả năng tái lập.
- id: LO-W02-02
  bloom_level: Analyze
  statement: So sánh và phân tích ưu thế cùng giới hạn phương pháp luận của các thiết
    kế nghiên cứu mô tả và thiết kế thời gian (cắt ngang vs theo chiều dọc).
- id: LO-W02-03
  bloom_level: Apply
  statement: 'Nhận diện và thiết kế các thành tố của một nghiên cứu thực nghiệm chuẩn
    tắc: biến độc lập, biến phụ thuộc, phân bổ ngẫu nhiên và kỹ thuật kiểm soát thiên
    lệch (mù đơn, mù đôi).'
- id: LO-W02-04
  bloom_level: Evaluate
  statement: 'Đánh giá các vi phạm và tiêu chuẩn đạo đức nghiên cứu trên người: vai
    trò IRB, informed consent, deception, debriefing, và ba nguyên tắc Báo cáo Belmont.'
