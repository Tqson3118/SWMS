learning_objectives:
- id: LO-W35-01
  bloom_level: Understand
  statement: So sánh các giai đoạn phát triển nhận thức của Piaget và các giai đoạn phát triển tâm lý xã hội của Erikson.
- id: LO-W35-02
  bloom_level: Analyze
  statement: Giải thích sự phát triển bất đồng bộ của não bộ ở tuổi vị thành niên và mối liên hệ với hành vi tìm kiếm rủi ro.
- id: LO-W35-03
  bloom_level: Apply
  statement: Nhận diện các yếu tố duy trì tính mềm dẻo não bộ và sự phát triển trí tuệ kết tinh trong giai đoạn lão hóa.
- id: LO-W35-04
  bloom_level: Evaluate
  statement: Đánh giá giới hạn của các lý thuyết phát triển giai đoạn kinh điển và phản biện các huyền thoại pop psychology.
