learning_objectives:
- id: LO-W11-01
  bloom_level: Understand
  statement: Định nghĩa Tính cách; phân tích Giả thuyết từ vựng của Allport và phân
    tích nhân tố của Cattell; phân biệt tiếp cận theo loại hình và theo đặc điểm.
- id: LO-W11-02
  bloom_level: Analyze
  statement: Phân tích Mô hình Năm Yếu tố (Big Five/OCEAN) trên 5 chiều kích liên
    tục độc lập; dẫn chứng tính phổ quát xuyên văn hóa và cơ sở di truyền hành vi
    qua nghiên cứu sinh đôi Minnesota.
- id: LO-W11-03
  bloom_level: Evaluate
  statement: Giải thích Tranh luận Con người - Tình huống của Mischel và Thuyết Tương
    tác luận; phân biệt tình huống mạnh và tình huống yếu trong việc bộc lộ tính cách.
- id: LO-W11-04
  bloom_level: Apply
  statement: 'Đánh giá phê phán các công cụ đo lường tính cách: MMPI-2, MBTI và trắc
    nghiệm phóng chiếu; vận dụng Nguyên lý Trưởng thành của tính cách theo vòng đời.'
