learning_objectives:
- id: LO-W05-01
  bloom_level: Understand
  statement: Phân biệt rạch ròi giữa Cảm giác (sensation - thụ cảm và chuyển đổi tín
    hiệu) và Tri giác (perception - tổ chức và diễn giải ý nghĩa); nêu định nghĩa
    ngưỡng tuyệt đối và định luật Weber về ngưỡng sai biệt (JND).
- id: LO-W05-02
  bloom_level: Analyze
  statement: Phân tích Thuyết phát hiện tín hiệu trong môi trường có tạp âm và hiện
    tượng thích ứng cảm giác; so sánh xử lý từ dưới lên (Bottom-up) với xử lý từ trên
    xuống (Top-down) và hiện tượng mù không chú ý.
- id: LO-W05-03
  bloom_level: Apply
  statement: Mô tả cấu trúc giải phẫu và cơ chế thụ cảm thị giác (que vs nón, fovea,
    thuyết ba màu và thuyết quá trình đối lập), thính giác (màng đáy ốc tai), và Thuyết
    kiểm soát cổng đau trong xúc giác.
- id: LO-W05-04
  bloom_level: Evaluate
  statement: Đánh giá các nguyên tắc Gestalt về tổ chức tri giác (Hình - Nền, Gần
    gũi, Tương đồng, Tiếp diễn liên tục, Đóng kín) và giải thích căn nguyên trực giác
    bị đánh lừa bởi ảo giác và bối cảnh.
