learning_objectives:
- id: LO-W42-01
  bloom_level: Understand
  statement: Giải thích định nghĩa Thực hành Dựa trên Bằng chứng trong Tâm lý học (EBPP theo APA, 2006) với mô hình ba trụ cột tích hợp; phân biệt rõ can thiệp khoa học với các liệu pháp giả khoa học.
- id: LO-W42-02
  bloom_level: Analyze
  statement: So sánh cơ chế can thiệp giữa Liệu pháp Hành vi Nhận thức truyền thống (CBT - Beck) và Các Liệu pháp Làn sóng Thứ ba (ACT & DBT - Hayes); phân biệt Tái cấu trúc nhận thức với Tháo gỡ nhận thức.
- id: LO-W42-03
  bloom_level: Evaluate
  statement: Đánh giá vai trò khoa học của Các Yếu tố Chung (Common Factors) và Liên minh Trị liệu (Therapeutic Alliance - Wampold, Norcross) đối với kết quả can thiệp tâm lý.
- id: LO-W42-04
  bloom_level: Apply
  statement: Phân biệt ranh giới chức năng giữa Bác sĩ Tâm thần, Chuyên gia Tâm lý Lâm sàng và Chuyên viên Tham vấn; nhận diện các tín hiệu cảnh báo vi phạm đạo đức và áp dụng quy trình tìm kiếm hỗ trợ an toàn.
