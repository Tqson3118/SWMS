learning_objectives:
- id: LO-W36-01
  bloom_level: Understand
  statement: Mô tả phản ứng sinh lý thần kinh trước stress (hội chứng thích ứng chung GAS và trục HPA).
- id: LO-W36-02
  bloom_level: Analyze
  statement: Phân tích khái niệm tải trọng dị ứng tích tụ (allostatic load) và tác động của stress mãn tính lên não bộ và thể chất.
- id: LO-W36-03
  bloom_level: Apply
  statement: Phân biệt chiến lược ứng phó tập trung vào vấn đề và ứng phó tập trung vào cảm xúc (Lazarus & Folkman).
- id: LO-W36-04
  bloom_level: Evaluate
  statement: Đánh giá bản chất của khả năng phục hồi tâm lý (resilience) và phản biện các ngụy biện tích cực cưỡng ép về tăng trưởng sau sang chấn.
