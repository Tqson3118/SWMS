lesson: week-13-values-meaning
learning_objectives:
- id: LO-W13-01
  bloom_level: Understand
  statement: Định nghĩa giá trị sống theo lý thuyết giá trị cơ bản của Schwartz (trans-situational,
    thứ bậc ưu tiên, cấu trúc tròn 10 giá trị); tóm lược mối nối giáo trình giữa động
    lực và mức tự siêu việt (self-transcendence).
- id: LO-W13-02
  bloom_level: Analyze
  statement: Phân biệt khát vọng nội tại và ngoại tại theo Kasser & Ryan; giải thích
    kết quả phân tích gộp về tương quan giữa chủ nghĩa vật chất và wellbeing với đúng
    phạm vi tương quan.
- id: LO-W13-03
  bloom_level: Apply
  statement: Vận dụng khung ý nghĩa ba thành tố (coherence, purpose, significance/mattering)
    để nhận diện thành tố đang thiếu trong tình huống giả định; dự đoán hành vi dựa
    trên niềm tin về đam mê (fixed vs growth theory of interest).
- id: LO-W13-04
  bloom_level: Evaluate
  statement: 'Đánh giá giới hạn bằng chứng của các nghiên cứu giá trị/ý nghĩa: tính
    tương quan của dữ liệu dọc purpose–tử vong, giới hạn mẫu WEIRD, biến thiên văn
    hóa thứ bậc giá trị, và phản biện mô hình pop psychology (sơ đồ ikigai 4 vòng
    tròn).'
