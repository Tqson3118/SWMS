- id: LO-W26-01
  bloom_level: Understand
  statement: Trình bày 5 yếu tố tâm lý xã hội định hình sự hấp dẫn ban đầu (tiếp xúc,
    tương đồng, ngoại hình, tương hỗ).
- id: LO-W26-02
  bloom_level: Analyze
  statement: So sánh đối chiếu Thuyết Đầu tư của Cha mẹ (Buss) và Thuyết Vai trò Xã
    hội (Eagly & Wood).
- id: LO-W26-03
  bloom_level: Apply
  statement: Vận dụng các nguyên lý tâm lý học để phân tích tình huống hấp dẫn bối
    cảnh và kích hoạt sinh lý.
- id: LO-W26-04
  bloom_level: Evaluate
  statement: Đánh giá phản biện các ngụy niệm pop-psychology và khoảng cách giữa tiêu
    chuẩn khai báo với thực tế (Eastwick & Finkel).
