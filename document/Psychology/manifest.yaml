learning_objectives:
- id: LO-W01-01
  bloom_level: Remember
  statement: Định nghĩa tâm lý học như ngành nghiên cứu khoa học về mind và behavior,
    phân biệt mô tả khoa học với suy đoán đời thường.
- id: LO-W01-02
  bloom_level: Analyze
  statement: 'Trình bày và phân biệt bốn mục tiêu khoa học: describe, explain, predict
    và change/modify/control; nêu rằng dự đoán không đồng nghĩa chắc chắn.'
- id: LO-W01-03
  bloom_level: Analyze
  statement: So sánh các góc nhìn/trường phái lịch sử và đương đại — structuralism,
    functionalism, psychoanalytic, Gestalt, behaviorism, humanistic và cognitive —
    theo câu hỏi chúng nhấn mạnh và giới hạn của chúng.
- id: LO-W01-04
  bloom_level: Evaluate
  statement: 'Đánh giá giới hạn của một claim pop psychology: yêu cầu bằng chứng,
    bối cảnh, khả năng khái quát và phân biệt correlation với causation khi phù hợp.'
