- id: LO-W30-01
  bloom_level: Understand
  statement: Định nghĩa các loại ranh giới cá nhân và khái niệm đồng thuận (Consent)
    theo mô hình FRIES.
- id: LO-W30-02
  bloom_level: Apply
  statement: Áp dụng kỹ năng thiết lập ranh giới an toàn và tự khẳng định bản thân
    mà không dán nhãn tiêu cực.
- id: LO-W30-03
  bloom_level: Analyze
  statement: Phân biệt sự khác biệt giữa hỗ trợ quyền tự quyết (Autonomy support)
    và áp đặt kiểm soát (Control).
- id: LO-W30-04
  bloom_level: Evaluate
  statement: Đánh giá tầm quan trọng của ranh giới lành mạnh và nhận biết khi nào
    cần tìm kiếm hỗ trợ chuyên môn an toàn.
