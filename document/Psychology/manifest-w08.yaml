learning_objectives:
- id: LO-W08-01
  bloom_level: Understand
  statement: Mô tả ba giai đoạn vận hành của trí nhớ (mã hóa, lưu trữ, truy xuất)
    và hiệu ứng tự liên hệ; phân tích Mô hình Ba Kho Lưu trữ Atkinson-Shiffrin (trí
    nhớ cảm giác, trí nhớ ngắn hạn/làm việc 7±2, trí nhớ dài hạn).
- id: LO-W08-02
  bloom_level: Analyze
  statement: 'Lập bản đồ cấu trúc Trí nhớ dài hạn: phân biệt Trí nhớ tường minh (ngữ
    nghĩa, tình tiết) và Trí nhớ ẩn tàng (quy trình, phản xạ); phân biệt 3 dạng truy
    xuất (nhớ lại, nhận biết, học lại) theo đường cong quên Ebbinghaus.'
- id: LO-W08-03
  bloom_level: Evaluate
  statement: Giải thích cơ sở giải phẫu thần kinh của trí nhớ (hồi hải mã, hạch hạnh
    nhân, tiểu não, vỏ não trước trán) và ca lâm sàng H.M.; phân tích bản chất tái
    tạo của trí nhớ, hiệu ứng thông tin sai lệch của Loftus và 7 sai sót của Schacter.
- id: LO-W08-04
  bloom_level: Create
  statement: Vận dụng các chiến lược tăng cường trí nhớ dựa trên bằng chứng khoa học
    nhận thức (phân cụm, ôn nhẩm mở rộng, hiệu ứng giãn cách, hiệu ứng kiểm tra);
    tổng hợp kiến trúc sư phạm toàn diện của Chặng 1 (W01–W08).
