learning_objectives:
- id: LO-W40-01
  bloom_level: Understand
  statement: Phân biệt phản ứng căng thẳng cấp tính với PTSD theo DSM-5-TR; mô tả 4 cụm triệu chứng lâm sàng và cơ chế sinh học thần kinh của ký ức chấn thương.
- id: LO-W40-02
  bloom_level: Analyze
  statement: So sánh động học lâm sàng của Rối loạn Lưỡng cực I và II; bác bỏ định kiến Pop Psychology coi biến đổi khí sắc ngắn hạn trong ngày là rối loạn lưỡng cực.
- id: LO-W40-03
  bloom_level: Understand
  statement: Phân loại rạch ròi giữa Triệu chứng dương tính và âm tính trong Phổ Tâm thần Phân liệt; giải thích vai trò của mạng lưới dopamine và glutamate.
- id: LO-W40-04
  bloom_level: Evaluate
  statement: Đánh giá bằng chứng dịch tễ học thực nghiệm bác bỏ định kiến liên kết bệnh tâm thần nặng với bạo lực xã hội; vận dụng nguyên tắc Mô hình Phục hồi.
