- id: LO-W33-01
  bloom_level: Understand
  statement: Nhận diện các đặc trưng của mối quan hệ lành mạnh, các hình thái bạo lực và cơ chế gaslighting.
- id: LO-W33-02
  bloom_level: Apply
  statement: Thực hiện các biện pháp an toàn và nhận biết lộ trình tìm kiếm hỗ trợ chuyên nghiệp khi có dấu hiệu bạo lực.
- id: LO-W33-03
  bloom_level: Analyze
  statement: Phân tích sự khác biệt giữa bạo lực tình huống và khủng bố thân mật, cùng các biểu hiện kiểm soát cưỡng bách.
- id: LO-W33-04
  bloom_level: Evaluate
  statement: Đánh giá giới hạn của việc gán nhãn và phân biệt rạch ròi giữa quan hệ khó khăn với mối quan hệ nguy hiểm.
