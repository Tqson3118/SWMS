learning_objectives:
- id: LO-W19-01
  bloom_level: Understand
  statement: Định nghĩa và phân biệt đồng cảm cảm xúc (affective empathy) và đồng
    cảm nhận thức (cognitive empathy); giải thích Theory of Mind (ToM).
- id: LO-W19-02
  bloom_level: Analyze
  statement: Giải thích false-belief task (Wimmer & Perner, 1983) và ý nghĩa của nó
    đối với sự phát triển nhận thức xã hội.
- id: LO-W19-03
  bloom_level: Apply
  statement: Vận dụng perspective-taking để đề xuất các giả thuyết khách quan giải
    thích hành vi người khác trước khi kết luận.
- id: LO-W19-04
  bloom_level: Evaluate
  statement: 'Đánh giá giới hạn của empathy: kiệt sức do đồng cảm (empathic distress)
    và thiên lệch nội nhóm (in-group bias).'
