learning_objectives:
- id: LO-W48-01
  bloom_level: Understand
  statement: Tổng hợp cấu trúc đa tầng tích hợp của khoa học tâm lý học qua 48 tuần (từ sinh học thần kinh, nhận thức, động lực, xã hội, phát triển đến ứng dụng thực tiễn).
- id: LO-W48-02
  bloom_level: Apply
  statement: Vận dụng các nguyên tắc đạo đức chuẩn mực APA (2017) (Tôn trọng quyền tự quyết, Không gây hại, Trách nhiệm) để phản biện các hành vi thao túng tâm lý độc hại trong đời sống thường nhật.
- id: LO-W48-03
  bloom_level: Analyze
  statement: Phân tích đặc điểm và giá trị của sự Khiêm tốn Nhận thức (Intellectual Humility - Leary et al.) trong việc chống lại định kiến tự tin thái quá và giáo điều nhận thức.
- id: LO-W48-04
  bloom_level: Evaluate
  statement: Thiết lập lộ trình Học tập Suốt đời tự định hướng (Knowles) và hoàn thiện Hồ sơ Năng lực Cá nhân Capstone (Learning Portfolio - Zubizarreta) như một công cụ phản tư và tăng trưởng liên tục.
