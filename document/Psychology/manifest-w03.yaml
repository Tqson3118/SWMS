learning_objectives:
- id: LO-W03-01
  bloom_level: Understand
  statement: Định nghĩa và giải thích ý nghĩa toán học của hệ số tương quan Pearson
    (r), phân biệt chiều hướng và độ mạnh, khẳng định giá trị tương quan nghịch không
    đồng nghĩa với không có mối liên hệ.
- id: LO-W03-02
  bloom_level: Analyze
  statement: 'Phân tích bản chất ngụy biện khi đồng nhất tương quan với nhân quả;
    chỉ ra và giải thích cơ chế của hai trở ngại phương pháp luận cốt lõi: Vấn đề
    biến thứ ba và Vấn đề chiều hướng tác động.'
- id: LO-W03-03
  bloom_level: Analyze
  statement: Phân biệt và đánh giá mối quan hệ giữa Độ tin cậy và Độ giá trị; chứng
    minh vì sao độ tin cậy là điều kiện cần nhưng không đủ cho độ giá trị.
- id: LO-W03-04
  bloom_level: Evaluate
  statement: 'Đánh giá phản biện các công bố khoa học: hiểu đúng ý nghĩa của ngưỡng
    thống kê p < .05 và kích thước hiệu ứng theo khuyến nghị của ASA; nhận diện các
    cơ chế được đề xuất có thể góp phần vào khủng hoảng tái lập và các giải pháp của
    phong trào Khoa học Mở.'
