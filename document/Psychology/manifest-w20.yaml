- id: LO-W20-01
  bloom_level: Understand
  statement: Phân tích vai trò của bối cảnh, chuẩn mực văn hóa và hành vi cơ sở trong
    giải mã tín hiệu phi ngôn ngữ.
- id: LO-W20-02
  bloom_level: Evaluate
  statement: Đánh giá bằng chứng thực nghiệm về vi biểu cảm và chỉ rõ tỷ lệ phát hiện
    nói dối xấp xỉ mức ngẫu nhiên.
- id: LO-W20-03
  bloom_level: Apply
  statement: Thiết lập kỹ năng quan sát đa kênh kết hợp kiểm chứng thông tin thay
    vì vội vàng suy đoán tâm lý.
