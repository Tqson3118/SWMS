learning_objectives:
- id: LO-W09-01
  bloom_level: Understand
  statement: 'Định nghĩa Cảm xúc và phân biệt rõ ràng với Tâm trạng và Cảm giác thể
    chất; phân tích ba thành tố của cảm xúc: kích hoạt sinh lý, đánh giá nhận thức
    và biểu hiện hành vi.'
- id: LO-W09-02
  bloom_level: Analyze
  statement: So sánh và đối chiếu bốn lý thuyết cảm xúc kinh điển (James-Lange, Cannon-Bard,
    Hai yếu tố Schachter-Singer, Đánh giá nhận thức trung gian Lazarus); giải thích
    hiện tượng gán nhầm kích hoạt sinh lý qua thí nghiệm cầu treo Dutton & Aron.
- id: LO-W09-03
  bloom_level: Evaluate
  statement: 'Lập bản đồ cơ sở sinh học thần kinh của cảm xúc: phân tích vai trò của
    hạch hạnh nhân, hai lộ trình xử lý đe dọa của Joseph LeDoux (Lộ trình thấp vs
    Lộ trình cao), và vai trò điều hòa của vỏ não trước trán.'
- id: LO-W09-04
  bloom_level: Apply
  statement: Đánh giá tính phổ quát và đặc thù văn hóa của biểu cảm nét mặt (Paul
    Ekman và quy tắc thể hiện văn hóa); phân tích cơ chế Giả thuyết phản hồi khuôn
    mặt; vận dụng Mô hình Quá trình Điều hòa Cảm xúc của James Gross (Đánh giá lại
    nhận thức vs Đè nén biểu cảm).
