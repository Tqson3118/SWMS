learning_objectives:
- id: LO-W15-01
  bloom_level: Understand
  statement: Định nghĩa điểm mù thiên kiến và mô tả bằng chứng Pronin và cộng sự (2002);
    định nghĩa thiên kiến xác nhận (Nickerson, 1998); tóm lược thiên kiến quy kết
    phục vụ bản thân và sự biến thiên văn hóa theo Mezulis và cộng sự (2004).
- id: LO-W15-02
  bloom_level: Analyze
  statement: 'Phân tích hiệu ứng Dunning–Kruger ở hai tầng: mô tả hành vi (được báo
    cáo nhiều) và cơ chế (còn tranh luận giữa giải thích siêu nhận thức và giả thuyết
    thống kê).'
- id: LO-W15-03
  bloom_level: Apply
  statement: 'Nhận diện cơ chế tự bảo vệ trong tình huống giả định: bất hòa nhận thức
    (Festinger & Carlsmith, 1959), tự khẳng định giá trị (self-affirmation), self-handicapping;
    đề xuất cách giảm thiên kiến dựa trên bằng chứng huấn luyện của Morewedge và cộng
    sự (2015).'
- id: LO-W15-04
  bloom_level: Evaluate
  statement: Đánh giá tuyên bố pop psychology về thiên kiến ('bias = đần độn', 'biết
    bias là hết bias') bằng dữ liệu thực nghiệm; nêu giới hạn môi trường (lab/web)
    và phạm vi mẫu của các nghiên cứu debiasing; trình bày đúng tình trạng tranh luận
    của các cơ chế.
