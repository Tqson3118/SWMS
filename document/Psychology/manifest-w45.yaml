learning_objectives:
- id: LO-W45-01
  bloom_level: Understand
  statement: Phân tích cấu trúc 3 tầng đối thoại (Nội dung, Cảm xúc, Bản sắc) và cơ chế đánh giá mối đe dọa nhận thức gây bùng phát phản ứng tự vệ trong xung đột.
- id: LO-W45-02
  bloom_level: Apply
  statement: Vận dụng khung Giao tiếp Trắc ẩn 4 bước OFNR (Quan sát, Cảm xúc, Nhu cầu, Đề nghị) và quy trình hạ nhiệt sinh lý (Time-out 20 phút) để giải tỏa căng thẳng trong đối thoại.
- id: LO-W45-03
  bloom_level: Analyze
  statement: Phân biệt bản chất hành vi giữa Quyết đoán (Assertiveness), Hung hăng (Aggressiveness) và Phục tùng né tránh (Passivity) trong việc thiết lập ranh giới cá nhân lành mạnh.
- id: LO-W45-04
  bloom_level: Evaluate
  statement: Đánh giá sự khác biệt giữa Đặt mình vào góc nhìn nhận thức (Perspective-taking) và Đồng cảm cảm xúc (Empathy), bảo vệ nguyên tắc thấu hiểu đối phương mà không thỏa hiệp với hành vi độc hại.
