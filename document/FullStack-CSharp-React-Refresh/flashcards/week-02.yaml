- id: fc-fscr-w02-005
  concept: Empty number
  front: Vì sao check raw.trim() trước Number(raw)?
  back: Chuỗi rỗng convert thành 0. 0 có thể che missing input nên cần guard riêng.
  source_lesson: notes/module-1/week-02.md
