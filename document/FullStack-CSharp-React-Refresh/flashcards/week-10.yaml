description: JOIN, GROUP BY, subqueries và CTE
cards:
- id: fc-fscr-w10-001
  concept: Left join filter
  front: WHERE child.amount>0 sau LEFT JOIN làm gì với parent rỗng?
  back: Loại parent rỗng vì predicate không true. Null comparison UNKNOWN bị WHERE lọc.
  source_lesson: notes/module-3/week-10.md
  version: 1.0.0
  claim_ids:
  - W10-C01
  tags:
  - w10
  - fullstack
- id: fc-fscr-w10-002
  concept: Join multiplicity
  front: Category2 expenses JOIN trả2rows có phải SQL bug?
  back: Không, đúng one-to-many cardinality. Mỗi matched child có row output.
  source_lesson: notes/module-3/week-10.md
  version: 1.0.0
  claim_ids:
  - W10-C01
  tags:
  - w10
  - fullstack
- id: fc-fscr-w10-003
  concept: Count empty
  front: LEFT JOIN category rỗng muốn expense count0 dùng gì?
  back: COUNT(child.Id). Null child PK không được COUNT(column) đếm.
  source_lesson: notes/module-3/week-10.md
  version: 1.0.0
  claim_ids:
  - W10-C02
  tags:
  - w10
  - fullstack
- id: fc-fscr-w10-004
  concept: Group filter
  front: Lọc category total>=50000 nên dùng gì?
  back: HAVING SUM(amount)>=50000. HAVING lọc aggregate group.
  source_lesson: notes/module-3/week-10.md
  version: 1.0.0
  claim_ids:
  - W10-C02
  tags:
  - w10
  - fullstack
- id: fc-fscr-w10-005
  concept: CTE semantics
  front: CTE luôn materialize và cache query không?
  back: Không. CTE tổ chức query, optimizer quyết strategy.
  source_lesson: notes/module-3/week-10.md
  version: 1.0.0
  claim_ids:
  - W10-C03
  tags:
  - w10
  - fullstack
- id: fc-fscr-w10-006
  concept: Exists membership
  front: Chỉ cần category có expense nên EXISTS ích gì?
  back: Membership không nhân duplicate parent. EXISTS trả bool condition cho outer row.
  source_lesson: notes/module-3/week-10.md
