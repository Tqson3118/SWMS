- id: fc-fscr-w04-002
  concept: Promise all
  front: Một Promise reject trong Promise.all có tự hủy mọi request khác không?
  back: Không. Fail-fast không điều khiển cancellation operations khác.
  source_lesson: notes/module-1/week-04.md
