- id: fc-fscr-w04-005
  concept: Event order
  front: A sync, timer T, Promise.then P, B sync thường log gì?
  back: A B P T. Stack xong A/B rồi microtask P trước task T.
  source_lesson: notes/module-1/week-04.md
