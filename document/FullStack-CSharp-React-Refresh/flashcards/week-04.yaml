- id: fc-fscr-w04-004
  concept: Abort semantics
  front: Hủy POST phía browser chứng minh DB không ghi chưa?
  back: Chưa, server có thể đã commit. Client cancellation không có rollback guarantee.
  source_lesson: notes/module-1/week-04.md
