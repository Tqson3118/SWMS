- id: fc-fscr-w04-003
  concept: HTTP failure
  front: fetch trả HTTP404 thì cần làm gì?
  back: Check response.ok rồi throw/handle. HTTP response resolve nên check status.
  source_lesson: notes/module-1/week-04.md
