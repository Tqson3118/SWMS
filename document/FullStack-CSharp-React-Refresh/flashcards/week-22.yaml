subject: FullStack-CSharp-React-Refresh
lesson_id: week-22
version: 1.0.0
description: Docker Compose và persistence
cards:
- id: fc-fscr-w22-001
  concept: Stages
  front: Multi-stage build giúp gì?
  back: Chỉ copy runtime artifacts sang final image. Build tools không cần ở runtime layer.
  source_lesson: notes/module-6/week-22.md
  version: 1.0.0
  claim_ids:
  - W22-C01
  tags:
  - w22
  - fullstack
- id: fc-fscr-w22-002
  concept: Image secret
  front: COPY .env vào image có an toàn không?
  back: Không, secret có thể tồn tại layers. Image/layers có thể inspect/redistribute.
  source_lesson: notes/module-6/week-22.md
  version: 1.0.0
  claim_ids:
  - W22-C01
  tags:
  - w22
  - fullstack
- id: fc-fscr-w22-003
  concept: Service address
  front: API container nối SQL Compose bằng gì?
  back: db:1433. DNS service name resolve trong network.
  source_lesson: notes/module-6/week-22.md
  version: 1.0.0
  claim_ids:
  - W22-C02
  tags:
  - w22
  - fullstack
- id: fc-fscr-w22-004
  concept: Persistent data
  front: Named volume có phải backup đủ không?
  back: Không, cần bản backup/restore độc lập. Volume vẫn mất khi host/storage hỏng.
  source_lesson: notes/module-6/week-22.md
  version: 1.0.0
  claim_ids:
  - W22-C02
  tags:
  - w22
  - fullstack
- id: fc-fscr-w22-005
  concept: Ready dependency
  front: depends_on mặc định chứng minh DBready không?
  back: Không, cần healthcheck/condition hoặc retry. Started khác accepting SQL queries.
  source_lesson: notes/module-6/week-22.md
  version: 1.0.0
  claim_ids:
  - W22-C03
  tags:
  - w22
  - fullstack
- id: fc-fscr-w22-006
  concept: Migration rollout
  front: Production nhiều replicas nên migrate thế nào?
  back: Một job có review trước rollout. Điều phối schema change giảm race.
  source_lesson: notes/module-6/week-22.md
