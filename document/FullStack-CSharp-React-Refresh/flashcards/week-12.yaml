description: Transactions, concurrency và data correctness
cards:
- id: fc-fscr-w12-001
  concept: Atomicity
  front: 2writes nghiệp vụ cần all-or-nothing thì làm gì?
  back: Cùng transaction boundary. Transaction chung cho phép rollback unit.
  source_lesson: notes/module-3/week-12.md
  version: 1.0.0
