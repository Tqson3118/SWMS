- id: fc-fscr-w24-002
  concept: Auth deployment
  front: Production dùng dev user-jwts được không?
  back: Không, provider token validation thật. Devtool chỉ phục vụ Development lab.
  source_lesson: notes/module-6/week-24.md
  version: 1.0.0
