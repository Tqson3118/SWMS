  - fullstack
- id: fc-fscr-w24-003
  concept: Readiness
  front: DBdown nên phản ánh ở đâu cho API cần DB?
  back: Readiness và dependency metrics. Readiness báo khả năng xử lý dependency.
  source_lesson: notes/module-6/week-24.md
  version: 1.0.0
  claim_ids:
  - W24-C02
  tags:
  - w24
  - fullstack
- id: fc-fscr-w24-004
  concept: Logging privacy
  front: Production nên tránh log gì?
  back: Bearer token và finance note. Credential/personal data không cần diagnosis.
  source_lesson: notes/module-6/week-24.md
  version: 1.0.0
  claim_ids:
  - W24-C02
  tags:
  - w24
  - fullstack
- id: fc-fscr-w24-005
  concept: Restore proof
  front: Có backupfile đã đủ recovery gate chưa?
  back: Chưa, phải restore và kiểm dữ liệu. Restoretest xác nhận bảnbackup dùng được.
  source_lesson: notes/module-6/week-24.md
  version: 1.0.0
  claim_ids:
  - W24-C03
  tags:
  - w24
  - fullstack
- id: fc-fscr-w24-006
  concept: Schema rollback
  front: Rollback image có undo destructive SQL tự động không?
  back: Không, cần compatibility/recovery plan. Appartifact và DBstate là boundaries riêng.
