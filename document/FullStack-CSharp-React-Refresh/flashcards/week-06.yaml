- id: fc-fscr-w06-004
  concept: Read-only interface
  front: IReadOnlyList<T> bảo đảm source không đổi bởi bất kỳ ai không?
  back: Không. Interface hạn chế API caller, underlying có thể mutable.
  source_lesson: notes/module-2/week-06.md
