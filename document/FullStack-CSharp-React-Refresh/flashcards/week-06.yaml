- id: fc-fscr-w06-002
  concept: Foreach mutation
  front: Xóa List trong foreach nên đổi cách nào?
  back: RemoveAll hoặc strategy không mutate enumerator đang chạy. Tránh invalidating active enumerator.
  source_lesson: notes/module-2/week-06.md
