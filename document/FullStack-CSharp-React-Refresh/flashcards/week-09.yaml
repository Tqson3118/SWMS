  - fullstack
- id: fc-fscr-w09-003
  concept: Normalization
  front: CategoryName current lặp trong expenses nguy cơ gì?
  back: Update anomaly khi đổi tên không đồng bộ. Nhiều bản tên cần cập nhật gây inconsistency.
  source_lesson: notes/module-3/week-09.md
  version: 1.0.0
