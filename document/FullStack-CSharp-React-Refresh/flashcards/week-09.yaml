  - fullstack
- id: fc-fscr-w09-002
  concept: Data type
  front: Số tiền nguyên theo spec SQL nên lưu gì?
  back: bigint NOT NULL có CHECK. Numeric nguyên hỗ trợ SUM và domain guard.
  source_lesson: notes/module-3/week-09.md
  version: 1.0.0
