  tags:
  - w09
  - fullstack
- id: fc-fscr-w09-006
  concept: Lab FK test
  front: Temp demo đã đủ chứng minh FK SQL Server chưa?
  back: Chưa, phải kiểm persistent lab tables. SQL Server temp không enforce FK như bảng persistent.
