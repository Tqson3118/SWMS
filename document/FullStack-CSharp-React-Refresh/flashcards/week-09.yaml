cards:
- id: fc-fscr-w09-001
  concept: Owner FK
  front: CategoryId FK đơn lẻ bảo đảm cùng owner không?
  back: Không. Nó chỉ bảo tồn tồn tại; cần owner constraint/query.
  source_lesson: notes/module-3/week-09.md
