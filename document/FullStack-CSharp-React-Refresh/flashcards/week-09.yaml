  tags:
  - w09
  - fullstack
- id: fc-fscr-w09-004
  concept: Business unique
  front: UNIQUE(UserId,Name) cho categories nhằm gì?
  back: Cùng user không trùng tên, khác user có thể trùng. Uniqueness xét tổ hợp columns.
  source_lesson: notes/module-3/week-09.md
  version: 1.0.0
  claim_ids:
  - W09-C02
  tags:
  - w09
  - fullstack
- id: fc-fscr-w09-005
  concept: Check null
  front: CHECK(amount>0) có đủ cấm NULL không?
  back: Không, cần NOT NULL. SQL three-valued logic CHECK có thể chấp nhận UNKNOWN.
  source_lesson: notes/module-3/week-09.md
