  - fullstack
- id: fc-fscr-w19-002
  concept: 409 recovery
  front: PUT stale version nên làm gì ở UI?
  back: Giữ input và cho reload/compare. User cần quyết khi có concurrent edit.
  source_lesson: notes/module-5/week-19.md
  version: 1.0.0
  claim_ids:
  - W19-C01
  tags:
  - w19
  - fullstack
- id: fc-fscr-w19-003
  concept: SPA credential
  front: Public SPA nên chứa client secret không?
  back: Không, dùng code flow PKCE. Browser code không giữ secret an toàn.
  source_lesson: notes/module-5/week-19.md
  version: 1.0.0
  claim_ids:
  - W19-C02
  tags:
  - w19
  - fullstack
- id: fc-fscr-w19-004
  concept: Token kind
  front: API bearer nhận loại token nào?
  back: Access token đúng API audience. Access token dùng để gọi protected API.
  source_lesson: notes/module-5/week-19.md
  version: 1.0.0
  claim_ids:
  - W19-C02
  tags:
  - w19
  - fullstack
- id: fc-fscr-w19-005
  concept: Session cache
  front: Đổi Alice sang Bob cần gì?
  back: Clear/cancel data và key theo user. Ngăn dữ liệu session cũ hiển thị.
  source_lesson: notes/module-5/week-19.md
  version: 1.0.0
  claim_ids:
  - W19-C03
  tags:
  - w19
  - fullstack
- id: fc-fscr-w19-006
  concept: 401 versus403
  front: Token hết hạn thường trả gì?
  back: 401. Không còn authenticated hợp lệ.
  source_lesson: notes/module-5/week-19.md
