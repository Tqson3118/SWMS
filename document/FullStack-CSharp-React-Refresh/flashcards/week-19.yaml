cards:
- id: fc-fscr-w19-001
  concept: Input parsing
  front: Number('') có vấn đề gì cho amount?
  back: Ra0 và mất phân biệt input trống. Cần kiểm chuỗi rỗng trước parse.
  source_lesson: notes/module-5/week-19.md
  version: 1.0.0
