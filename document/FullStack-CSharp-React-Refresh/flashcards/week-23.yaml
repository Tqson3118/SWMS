- id: fc-fscr-w23-005
  concept: Fork security
  front: ForkPR chưa tin cậy nên được gì?
  back: Read-only verify, không deploy secrets. Untrusted code cần giới hạn credential.
  source_lesson: notes/module-6/week-23.md
