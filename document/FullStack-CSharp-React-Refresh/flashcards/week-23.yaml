- id: fc-fscr-w23-004
  concept: Isolation
  front: Integration test DB nên dùng gì?
  back: Database test riêng có seed/reset. Isolation giữ tests deterministic/an toàn.
  source_lesson: notes/module-6/week-23.md
  version: 1.0.0
