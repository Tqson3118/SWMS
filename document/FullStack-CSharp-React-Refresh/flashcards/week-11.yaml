description: Index, execution plan, pagination và N+1
cards:
- id: fc-fscr-w11-001
  concept: Index cost
  front: Thêm index có tradeoff gì?
  back: Read có thể nhanh hơn, write/storage tốn hơn. Index maintenance/storage đổi workload cost.
  source_lesson: notes/module-3/week-11.md
  version: 1.0.0
  claim_ids:
  - W11-C01
  tags:
  - w11
  - fullstack
- id: fc-fscr-w11-002
  concept: SARGable date
  front: Filter tháng nên thử form nào?
  back: SpentOn>=from AND SpentOn<to. Range trên column phù hợp index.
  source_lesson: notes/module-3/week-11.md
  version: 1.0.0
  claim_ids:
  - W11-C01
  tags:
  - w11
  - fullstack
- id: fc-fscr-w11-003
  concept: Plan evidence
  front: Index Seek đủ chứng minh query nhanh chưa?
  back: Chưa, xem reads/rows/lookup/timing. Seek có thể lấy nhiều rows và costly lookups.
  source_lesson: notes/module-3/week-11.md
  version: 1.0.0
  claim_ids:
  - W11-C02
  tags:
  - w11
  - fullstack
- id: fc-fscr-w11-004
  concept: Small scan
  front: Scan small table luôn cần sửa không?
  back: Không, có thể plan hợp lý. Optimizer có thể chọn scan rẻ cho small/manyrows.
  source_lesson: notes/module-3/week-11.md
  version: 1.0.0
  claim_ids:
  - W11-C02
  tags:
  - w11
  - fullstack
- id: fc-fscr-w11-005
  concept: Stable paging
  front: ORDER BY date có ties thì thêm gì?
  back: Unique Id tie-breaker. Unique secondary key ổn định fixed data.
  source_lesson: notes/module-3/week-11.md
  version: 1.0.0
  claim_ids:
  - W11-C03
  tags:
  - w11
  - fullstack
- id: fc-fscr-w11-006
  concept: N+1 fix
  front: List100rows rồi fetch category từngrow nên sửa gì?
  back: Projection/JOIN theo dữ liệu cần, đo query count. Giảm round trips và tải fields hợp lý.
  source_lesson: notes/module-3/week-11.md
