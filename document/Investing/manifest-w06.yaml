learning_objectives:
- id: LO-W06-01
  bloom_level: Understand
  statement: Định nghĩa phân tích kỹ thuật (technical analysis) và các công cụ mô tả cơ bản - nến OHLC,
    đường xu hướng (trendline), vùng hỗ trợ (support), vùng kháng cự (resistance), SMA, EMA, khối lượng
    (volume) - bằng tên Việt-Anh, nêu đúng cửa sổ N phiên và đơn vị (giá VND/cổ phần, khối lượng cổ phiếu),
    và giới hạn 'công cụ mô tả/giả thuyết làm việc, không phải dự báo chắc chắn'.
- id: LO-W06-02
  bloom_level: Apply
  statement: Tính SMA-N và EMA-N cho chuỗi giá đóng cửa giả định với hệ số làm mượt α = 2/(N+1), ghi rõ
    đơn vị, cửa sổ, giả định khởi tạo (seeding), so sánh mức phản ứng của SMA với EMA, và nhận diện vùng
    hỗ trợ/kháng cự cùng quy ước đảo vai trên dữ liệu giả định.
- id: LO-W06-03
  bloom_level: Analyze
  statement: Phân tích kịch bản giả định (giá thủng trendline/hỗ trợ đi kèm khối lượng tăng vọt) bằng
    cách tách dữ kiện - giả định - diễn giải, đánh dấu tín hiệu là 'cảnh báo/giả thuyết chờ kiểm chứng',
    và tính chênh lệch giữa kết quả trên giấy và kết quả giả định sau phí giao dịch và trượt giá (slippage).
- id: LO-W06-04
  bloom_level: Evaluate
  statement: Phản biện các khẳng định kiểu 'chỉ báo đúng 100%' hoặc '3/3 biểu đồ đều thắng' bằng cách
    chỉ ra look-ahead bias, data-snooping/cherry-pick, survivorship bias, chi phí giao dịch bị bỏ qua,
    và ghi đúng trạng thái 'chưa thể kết luận'.
