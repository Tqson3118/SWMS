learning_objectives:
- id: LO-W05-01
  bloom_level: Understand
  statement: Định nghĩa phân tích từ trên xuống (top-down), phân tích từ dưới lên (bottom-up), ba tầng
    phân tích vĩ mô - ngành - doanh nghiệp, và khung năm lực lượng cạnh tranh (Porter's Five Forces) bằng
    cách nêu đúng thứ tự các tầng, tên Việt-Anh của cả năm lực lượng, và giới hạn 'khung tổ chức câu hỏi,
    không phải dự báo hay quy tắc sinh lời'.
- id: LO-W05-02
  bloom_level: Apply
  statement: Áp dụng khung vào bộ dữ liệu giả định bằng cách phân loại từng động lực doanh thu/biên lợi
    nhuận vào tầng vĩ mô, tầng ngành hoặc tầng doanh nghiệp, lập bảng chấm định tính năm lực lượng kèm
    lý do trích từ dữ kiện giả định, và tính lại các tỷ số tầng doanh nghiệp (EPS, P/E, ROE, D/E) của
    W04 với đơn vị và kỳ tính đầy đủ.
- id: LO-W05-03
  bloom_level: Analyze
  statement: Phân tích một kịch bản giả định bằng cách tách dòng kết luận vĩ mô → ngành → doanh nghiệp
    thành các bước có dữ kiện và giả định riêng, đối chiếu kịch bản nghịch, và phân biệt kịch bản (scenario)
    với dự báo (forecast).
- id: LO-W05-04
  bloom_level: Evaluate
  statement: Phản biện các kết luận kiểu 'GDP tăng nên thị trường chắc chắn tăng' hoặc 'P/E thấp hơn mặt
    bằng chung là rẻ' bằng cách chỉ ra phép suy nhân quả thiếu bằng chứng, lỗi so sánh chéo ngành, sự
    tồn tại của ô NA, và ghi đúng trạng thái 'chưa thể kết luận'.
