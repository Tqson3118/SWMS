learning_objectives:
- id: LO-W18-01
  bloom_level: Understand
  statement: Giải thích bằng lời của mình IPS là gì, các cấu phần chính (mục tiêu, ràng buộc, phân bổ mục tiêu,
    tái cân bằng, lịch rà soát, điều kiện sửa đổi) và phân biệt risk capacity với risk tolerance/willingness.
- id: LO-W18-02
  bloom_level: Apply
  statement: 'Viết một IPS giả định bằng VND cho một hồ sơ minh họa: nêu mục tiêu đo được, chân trời, nhu cầu thanh
    khoản, các ràng buộc, phân bổ mục tiêu và ngưỡng tái cân bằng; tính số tiền cần mua/bán khi tỷ trọng lệch khỏi
    ngưỡng.'
- id: LO-W18-03
  bloom_level: Analyze
  statement: Phân biệt điểm phần trăm của tổng danh mục với phần trăm giá trị đang nắm giữ; tính đúng cả hai khi
    tái cân bằng và giải thích vì sao hai con số khác nhau.
- id: LO-W18-04
  bloom_level: Evaluate
  statement: Phân loại mỗi câu trong một phân tích IPS là fact, assumption, calculation, uncertainty hoặc pending;
    hoàn thành checklist không đưa ra khuyến nghị phân bổ, ticker hay khoản vay cá nhân.
