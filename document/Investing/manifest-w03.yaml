learning_objectives:
- id: LO-W03-01
  bloom_level: Understand
  statement: Giải thích phương trình kế toán Assets = Liabilities + Equity và bản chất ảnh chụp tại một
    thời điểm của Balance Sheet, dùng thuật ngữ Việt–Anh đúng ngữ cảnh.
- id: LO-W03-02
  bloom_level: Apply
  statement: Phân biệt nội dung Income Statement (doanh thu, chi phí, lợi nhuận theo thời kỳ) và Cash
    Flow Statement (ba nhóm dòng tiền operating, investing, financing), và phân loại một dòng tiền giả
    định vào đúng nhóm.
- id: LO-W03-03
  bloom_level: Analyze
  statement: Phân tích tình huống giả định lợi nhuận kế toán tăng nhưng dòng tiền hoạt động âm bằng cách
    so sánh dồn tích với tiền mặt và kiểm tra phải thu, tồn kho, nêu rõ giả định và dữ kiện còn thiếu.
- id: LO-W03-04
  bloom_level: Evaluate
  statement: Phản biện một kết luận chỉ dựa trên một con số lợi nhuận kế toán bằng cách nêu giới hạn nguyên
    tắc dồn tích, ước tính kế toán, vai trò thuyết minh và điều chưa thể kết luận.
