learning_objectives:
- id: LO-W08-01
  bloom_level: Understand
  statement: 'Định nghĩa phân bổ tài sản (asset allocation), đa dạng hóa (diversification), danh mục đầu
    tư (portfolio), tỷ trọng (weight), tái cân bằng (rebalancing), tương quan (correlation) và hiệp phương
    sai (covariance) bằng tên Việt-Anh, đúng vai theo nguồn đã mở: SEC mô tả phân bổ tài sản là quyết
    định cá nhân phụ thuộc thời hạn đầu tư (time horizon) và mức chấp nhận rủi ro (risk tolerance); đa
    dạng hóa là ''đừng bỏ trứng vào một giỏ'' theo mô tả SEC và OpenStax; tái cân bằng là đưa danh mục
    về tỷ trọng mục tiêu - đều không phải khuyến nghị tỷ trọng nào và không bảo đảm kết quả.'
- id: LO-W08-02
  bloom_level: Apply
  statement: 'Tính, trên dữ liệu giả định với kỳ tính thống nhất (%/năm): lợi nhuận kỳ vọng danh mục E(Rp)
    = w1×E(R1) + w2×E(R2) (trung bình trọng số); phương sai danh mục hai tài sản σp² = w1²σ1² + w2²σ2²
    + 2×w1×w2×cov12; tỷ số Sharpe = (Rp − Rf)/σp; số tiền tái cân bằng (VND) về tỷ trọng mục tiêu; và
    làm lại phép tính khi một đầu vào ước lượng đổi - ghi rõ đơn vị, kỳ tính và rằng mọi đầu vào là giả
    định khai báo.'
- id: LO-W08-03
  bloom_level: Analyze
  statement: 'Phân tích: vì sao σp bằng trung bình trọng số chỉ khi ρ = +1 và nhỏ hơn khi ρ < +1 (cơ chế
    bù trừ biến động); tách rủi ro phi hệ thống (unsystematic/firm-specific risk) - có thể giảm bằng đa
    dạng hóa - khỏi rủi ro hệ thống (systematic risk) - không thể đa dạng hóa; và đánh giá độ nhạy của
    kết quả ''tối ưu'' với lỗi ước lượng đầu vào E(R), σ, ρ.'
- id: LO-W08-04
  bloom_level: Evaluate
  statement: 'Phản biện các khẳng định kiểu ''danh mục 60/40 bảo đảm lợi nhuận'', ''MPT cho danh mục tối
    ưu hoàn hảo'', ''nắm giữ N mã là đủ an toàn'' bằng cách chỉ ra: mô hình tối ưu hóa theo giả định và
    đầu vào ước lượng (Markowitz), Sharpe là thước đo tương đối phải so với lựa chọn khác (OpenStax),
    không tồn tại con số mã ''chuẩn'' được mọi bên thống nhất (OpenStax), và ghi đúng trạng thái ''biết
    được'' và ''chưa thể kết luận''.'
