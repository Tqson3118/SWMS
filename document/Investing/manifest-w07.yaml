learning_objectives:
- id: LO-W07-01
  bloom_level: Understand
  statement: Định nghĩa quản trị rủi ro (risk management), ngân sách rủi ro (risk budget), quy mô vị thế (position
    sizing), lệnh dừng (stop order/stop-loss), giá dừng (stop price), lệnh dừng-giới hạn (stop-limit order) và tỷ
    lệ lợi nhuận/rủi ro (Risk/Reward Ratio - R:R) bằng tên Việt-Anh với đơn vị đúng (VND, VND/cổ phần, cổ phiếu,
    %), và nêu đúng vai của chúng là heuristic kiểm soát rủi ro theo kế hoạch - không phải bảo đảm giới hạn lỗ,
    không phải dự báo.
- id: LO-W07-02
  bloom_level: Apply
  statement: 'Tính trên dữ liệu giả định: ngân sách rủi ro = giá trị danh mục × % rủi ro (VND); số lượng vị thế
    = ngân sách rủi ro / rủi ro mỗi cổ phiếu (VND/cổ phần) kèm đệm phí/trượt giá và làm tròn xuống số nguyên cổ
    phiếu; tổng rủi ro danh mục theo kịch bản xấu đồng thời (VND); R:R (lần) và kỳ vọng expectancy (VND/cổ phần)
    từ bảng xác suất-kết quả giả định, ghi rõ xác suất là giả định của người tính.'
- id: LO-W07-03
  bloom_level: Analyze
  statement: 'Phân tích các kịch bản lỗ vượt kế hoạch (gap mở cửa dưới giá dừng, thanh khoản cạn làm khớp lệch hoặc
    khớp một phần - partial fill) và các đại lượng danh mục: mức sụt giảm tối đa (Maximum Drawdown - MDD, %), bất
    đối xứng phục hồi (mất x% cần lãi x/(1−x) %), và tác động của tương quan/tập trung khiến nhiều vị thế kích dừng
    cùng lúc.'
- id: LO-W07-04
  bloom_level: Evaluate
  statement: 'Phản biện các khẳng định kiểu ''stop loss bảo đảm lỗ tối đa'' hoặc ''quy tắc x% là tối ưu'' bằng cách
    chỉ ra: giá dừng là trigger không phải giá khớp bảo đảm (SEC), stop-limit có thể không khớp, chuẩn kích hoạt
    khác nhau giữa các đầu mối, sai lầm tự ý dời stop và gồng lỗ, và rủi ro cộng dồn danh mục; ghi đúng trạng thái
    ''biết được'' và ''chưa thể kết luận''.'
