learning_objectives:
- id: LO-W04-01
  bloom_level: Understand
  statement: Định nghĩa thu nhập trên mỗi cổ phần (EPS), hệ số giá–thu nhập (P/E), hệ số giá–giá trị sổ
    sách (P/B), tỷ suất sinh lời trên vốn chủ sở hữu (ROE), tỷ suất sinh lời trên tổng tài sản (ROA) và
    tỷ lệ nợ trên vốn chủ sở hữu (D/E), dùng thuật ngữ Việt–Anh đúng ngữ cảnh.
- id: LO-W04-02
  bloom_level: Apply
  statement: Tính EPS, P/E, P/B, ROE, ROA và D/E từ bộ số liệu giả định với đơn vị và kỳ tính đầy đủ,
    nêu rõ giả định bình quân đầu–cuối kỳ và xử lý nhất quán cổ phiếu ưu đãi.
- id: LO-W04-03
  bloom_level: Analyze
  statement: 'Phân tích tình huống giả định bằng cách tách ROE theo phương pháp DuPont thành ba thành
    phần: biên lợi nhuận ròng, vòng quay tài sản và đòn bẩy tài chính, chỉ ra thành phần nào tạo nên mức
    ROE cao.'
- id: LO-W04-04
  bloom_level: Evaluate
  statement: Phản biện một kết luận chỉ dựa trên một tỷ số bằng cách nêu vai trò so sánh cùng ngành, chu
    kỳ kinh doanh, ảnh hưởng của phương pháp kế toán, giới hạn khi mẫu số âm hoặc bằng 0, và điều chưa
    thể kết luận.
