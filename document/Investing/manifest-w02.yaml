learning_objectives:
- id: LO-W02-01
  bloom_level: Understand
  statement: Phân biệt cổ phiếu (equity) và trái phiếu (debt security) theo quyền lợi pháp lý, dòng tiền
    cam kết và thứ tự ưu tiên khi thanh lý, dùng thuật ngữ Việt–Anh đúng ngữ cảnh.
- id: LO-W02-02
  bloom_level: Apply
  statement: Mô tả cơ chế định giá, thanh khoản và đối tác của hàng hóa, forex và tài sản mã hóa (crypto
    asset) trong một tình huống giả định, nêu rõ đơn vị, kỳ hạn và giới hạn nguồn.
- id: LO-W02-03
  bloom_level: Analyze
  statement: So sánh hai sản phẩm giả định bằng khung rủi ro–lợi nhuận, phí, thanh khoản, rủi ro đối tác
    và khả năng mất vốn, không nhầm lợi suất quảng cáo với lợi nhuận ròng.
- id: LO-W02-04
  bloom_level: Evaluate
  statement: Phản biện một quyết định giải ngân giả định bằng cách tách lợi nhuận kỳ vọng khỏi lợi nhuận
    cam kết, đối chiếu khung thời gian với tính thanh khoản và nêu điều chưa thể kết luận.
