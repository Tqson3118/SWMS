deck_id: "deck-inv-w15"
subject: "Investing"
lesson_id: "week-15-behavioral-finance-herd-fomo-loss-aversion-anchoring"
version: "1.0.0"
description: "R5 deck W15 về heuristic, bias, observed behavior, psychological interpretation, herd/FOMO, loss aversion, anchoring và giới hạn nhân quả; giáo dục, không phải khuyến nghị đầu tư."

cards:
  - id: "fc-inv-w15-001"
    concept: "Bốn ngăn phân tích hành vi"
    front: "Heuristic, bias, observed behavior và psychological interpretation khác nhau thế nào?"
    back: "Heuristic là quy tắc rút gọn; bias là khuynh hướng lệch so với chuẩn cụ thể; observed behavior là hành động ghi nhận; psychological interpretation là giả thuyết về quá trình bên trong. Không dùng một hành vi để gán nhãn người học hoặc khẳng định động cơ."
    source_lesson: "Investing/notes/module-4/week-15-behavioral-finance-herd-fomo-loss-aversion-anchoring.md#5-heuristic-bias-behavior-và-interpretation-bốn-ngăn-tách-biệt"
    version: "1.0.0"
    claim_ids: ["W15-C01"]
    tags: ["heuristic", "bias", "behavior", "interpretation"]
  - id: "fc-inv-w15-002"
    concept: "Herding và nhân quả"
    front: "Nhiều lệnh mua cùng lúc với nhiều bài đăng chứng minh điều gì, và chưa chứng minh điều gì?"
    back: "Có thể mô tả hành vi đồng thời nếu dữ liệu có nguồn và thời điểm. Tín hiệu xã hội hoặc herding là diễn giải có điều kiện; dữ liệu đó chưa chứng minh bài đăng gây ra lệnh, mọi người bắt chước nhau hay kết quả tương lai."
    source_lesson: "Investing/notes/module-4/week-15-behavioral-finance-herd-fomo-loss-aversion-anchoring.md#6-herding-từ-tín-hiệu-xã-hội-đến-hành-vi-hội-tụ"
    version: "1.0.0"
    claim_ids: ["W15-C06", "W15-C07"]
    tags: ["herding", "social-signal", "causality"]
  - id: "fc-inv-w15-003"
    concept: "FOMO và đo lường"
    front: "Vì sao hành động mua ngay sau thông báo chưa đủ để kết luận FOMO?"
    back: "Đó là observed behavior. FOMO là psychological interpretation cần đo lường trong bối cảnh phù hợp; người đó có thể đã có kế hoạch, phản ứng với thông tin riêng hoặc chịu ràng buộc khác. Cần lý do ghi trước, đối chứng và diễn giải cạnh tranh."
    source_lesson: "Investing/notes/module-4/week-15-behavioral-finance-herd-fomo-loss-aversion-anchoring.md#7-fomo-cảm-xúc-tín-hiệu-và-giới-hạn-đo-lường"
    version: "1.0.0"
    claim_ids: ["W15-C03"]
    tags: ["fomo", "measurement", "limits"]
  - id: "fc-inv-w15-004"
    concept: "Reference point"
    front: "Reference point làm thay đổi cách diễn giải một giá trị hiện tại ra sao?"
    back: "Nó là mốc để mã hóa kết quả là lời/lỗ. Cùng một giá trị có thể được nhìn là lời hoặc lỗ khi mốc là giá mua, mục tiêu hay một mốc khác. Đây là mô hình có điều kiện, không phải bằng chứng mọi người phản ứng giống nhau."
    source_lesson: "Investing/notes/module-4/week-15-behavioral-finance-herd-fomo-loss-aversion-anchoring.md#8-loss-aversion-và-reference-point"
    version: "1.0.0"
    claim_ids: ["W15-C02"]
    tags: ["prospect-theory", "reference-point", "loss-aversion"]
  - id: "fc-inv-w15-005"
    concept: "Loss aversion boundary"
    front: "Loss aversion không cho phép kết luận gì về một người giữ vị thế lỗ?"
    back: "Mô hình cho phép đặt câu hỏi liệu tổn thất so với mốc có được cân nặng mạnh hơn lời tương đương trong một số nhiệm vụ hay không. Nó không chứng minh người đó luôn giữ vị thế lỗ, có động cơ duy nhất hoặc sẽ có kết quả xấu."
    source_lesson: "Investing/notes/module-4/week-15-behavioral-finance-herd-fomo-loss-aversion-anchoring.md#8-loss-aversion-và-reference-point"
    version: "1.0.0"
    claim_ids: ["W15-C02", "W15-C07"]
    tags: ["loss-aversion", "model", "no-label"]
  - id: "fc-inv-w15-006"
    concept: "Anchoring"
    front: "Khi nào giá cũ là potential anchor thay vì chỉ là dữ liệu bookkeeping?"
    back: "Giá vốn dùng để tính P&L là bookkeeping. Giá cũ là potential anchor khi nó kéo ước lượng hoặc nhãn ‘rẻ’ quá gần mình dù thông tin mới thay đổi đáng kể. Cần kiểm tra diễn giải cạnh tranh trước khi gọi là bias."
    source_lesson: "Investing/notes/module-4/week-15-behavioral-finance-herd-fomo-loss-aversion-anchoring.md#9-anchoring-mốc-ban-đầu-và-cập-nhật-thông-tin"
    version: "1.0.0"
    claim_ids: ["W15-C01"]
    tags: ["anchoring", "reference-point", "updating"]
  - id: "fc-inv-w15-007"
    concept: "Nhật ký quyết định"
    front: "Nhật ký W15 tối thiểu cần ghi những trường nào để không trộn fact với diễn giải?"
    back: "Ghi fact/source/time, rule, reference point, tối đa hai interpretation, alternative explanation, missing data, stop condition và limit. Mục tiêu là kiểm tra quy trình, không chẩn đoán người ra quyết định hay bảo đảm lợi nhuận."
    source_lesson: "Investing/notes/module-4/week-15-behavioral-finance-herd-fomo-loss-aversion-anchoring.md#10-hai-hypothetical-scenarios-và-nhật-ký-quyết-định"
    version: "1.0.0"
    claim_ids: ["W15-C06", "W15-C07"]
    tags: ["decision-log", "hypothetical", "process"]
  - id: "fc-inv-w15-008"
    concept: "Known và uncertain"
    front: "W15 phải ghi thế nào về động cơ cá nhân và quan hệ nhân quả?"
    back: "Known là phạm vi mô hình, dữ liệu và mô tả có locator. Uncertain là động cơ nội tại, mức độ FOMO/loss aversion, và nguyên nhân của một giao dịch nếu chưa có thiết kế phù hợp. Không chuyển tương quan hoặc kết quả đơn lẻ thành causal claim hay dự báo."
    source_lesson: "Investing/notes/module-4/week-15-behavioral-finance-herd-fomo-loss-aversion-anchoring.md#12-nguồn-trạng-thái-claim-và-giới-hạn"
    version: "1.0.0"
    claim_ids: ["W15-C07", "W15-C08"]
    tags: ["known", "uncertain", "causal-limits"]
