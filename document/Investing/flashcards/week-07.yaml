deck_id: "deck-inv-w07"
subject: "Investing"
lesson_id: "week-07-quan-tri-rui-ro-position-sizing-stop-loss"
version: "1.0.0"
description: "Bộ thẻ truy xuất kiến thức W07. Nội dung giáo dục, không phải khuyến nghị đầu tư. Quản trị rủi ro, position sizing và stop loss là heuristic kiểm soát rủi ro — không phải bảo đảm giới hạn lỗ."

cards:
  - id: "fc-inv-w07-001"
    version: "1.0.0"
    concept: "Định nghĩa rủi ro"
    front: "Investor.gov định nghĩa rủi ro (risk) thế nào và nêu những loại rủi ro nào bài W07 cần?"
    back: "Investor.gov 'What is Risk?': trong tài chính, risk là mức độ bất định và/hoặc mất tiền tiềm năng gắn với một quyết định đầu tư; rủi ro tăng thì nhà đầu tư đòi lợi nhuận cao hơn để bù. Bài W07 cần: volatility risk (giá dao động; ví dụ Hoa Kỳ: cổ phiếu công ty lớn mất tiền trung bình khoảng 1 trong 3 năm) và liquidity risk (không tìm được người mua/bán khi muốn). Chứng khoán sở hữu không được bảo hiểm tổn thất giá trị (SIPC chỉ bồi hoàn chứng khoán thất lạc khi firm phá sản). Con số '1 trong 3 năm' là dữ liệu lịch sử Hoa Kỳ, không áp cho thị trường Việt Nam."
    source_lesson: "Investing/notes/module-2/week-07-quan-tri-rui-ro-position-sizing-stop-loss.md"
    claim_ids: ["W07-C01"]
    tags: ["risk", "definition", "liquidity-risk", "volatility"]
  - id: "fc-inv-w07-002"
    version: "1.0.0"
    concept: "Ngân sách rủi ro"
    front: "Ngân sách rủi ro (risk budget) tính thế nào và quy tắc 1–2% mỗi lệnh phải đọc đúng vai ra sao?"
    back: "Ngân sách rủi ro (VND) = Giá trị danh mục (VND) × % rủi ro chấp nhận mỗi thương vụ. Ví dụ giả định: 100.000.000 VND × 1% = 1.000.000 VND. Đọc đúng vai: con số 1–2% là heuristic (quy ước thực hành truyền miệng) — KHÔNG có nguồn chính thống đã mở chứng minh mức % nào 'tối ưu'; điều có cơ sở là nguyên lý định lượng rủi ro bằng số tiền thay vì cảm tính. Ngân sách đo bằng VND, không phải %; ngân sách danh mục ≠ ngân sách một lệnh — nhiều lệnh mở cùng lúc cộng theo kịch bản xấu đồng thời."
    source_lesson: "Investing/notes/module-2/week-07-quan-tri-rui-ro-position-sizing-stop-loss.md"
    claim_ids: ["W07-C02"]
    tags: ["risk-budget", "heuristic", "not-a-guarantee"]
  - id: "fc-inv-w07-003"
    version: "1.0.0"
    concept: "Position sizing"
    front: "Công thức position sizing với đơn vị là gì và vì sao phải có đệm phí/trượt giá?"
    back: "Số lượng (cổ phiếu) = Ngân sách rủi ro (VND) / Rủi ro mỗi cổ phiếu (VND/cổ phần), với rủi ro mỗi cp = giá mua − giá dừng (+ đệm phí/trượt giá), làm tròn XUỐNG số nguyên. Ví dụ 4.2 (giả định): ngân sách 1.000.000 VND, mua 50.000, dừng 47.500 → naïve 400 cp (2.500 VND/cp); có đệm phí 0,15%/chiều + slippage khớp 47.250 → rủi ro 2.896 VND/cp → 345 cp, lỗ kế hoạch 999.120 VND ≤ ngân sách. Cách naïve với cùng ma sát thật: 400 × 2.896 = 1.158.400 VND — vượt ngân sách 15,84%. Công thức trả lời 'bao nhiêu', không trả lời 'mua gì'."
    source_lesson: "Investing/notes/module-2/week-07-quan-tri-rui-ro-position-sizing-stop-loss.md"
    claim_ids: ["W07-C02", "W07-C03"]
    tags: ["position-sizing", "formula", "units", "buffer"]
  - id: "fc-inv-w07-004"
    version: "1.0.0"
    concept: "Bốn ma sát khớp lệnh"
    front: "Bốn ma sát nào làm lỗ thực tế vượt kế hoạch và SEC nói gì về chúng?"
    back: "(1) Phí giao dịch (commission) mỗi chiều; (2) trượt giá (slippage) — SEC bulletin 'Understanding Order Types': giá khớp lệnh thị trường 'often deviates from the last-traded price or real time quote due to the demand for a stock and the prices of available liquidity'; (3) mất thanh khoản/khớp một phần — 'parts of a large market order may execute at different prices due to lack of liquidity'; Investor.gov định nghĩa liquidity risk là không tìm được thị trường khi muốn mua/bán; (4) gap — giá mở phiên sau nhảy qua khỏi giá dừng. Ví dụ 4.3 (giả định): gap mở 45.000 dưới dừng 47.500 → lỗ 1.774.335 VND ≈ 1,77% danh mục, vượt ngân sách 1% dù đã có đệm."
    source_lesson: "Investing/notes/module-2/week-07-quan-tri-rui-ro-position-sizing-stop-loss.md"
    claim_ids: ["W07-C03"]
    tags: ["slippage", "gap-risk", "liquidity", "partial-fill", "fees"]
  - id: "fc-inv-w07-005"
    version: "1.0.0"
    concept: "Stop order cơ chế"
    front: "Stop order hoạt động thế nào và giới hạn quan trọng nhất là gì?"
    back: "Investor.gov 'Types of Orders': stop order (stop-loss) là lệnh mua/bán khi giá chạm giá dừng (stop price); 'When the stop price is reached, a stop order becomes a market order' — biến thành lệnh thị trường. Sell stop đặt dưới giá hiện tại, mục đích chung là hạn chế lỗ hoặc bảo vệ lợi nhuận. Giới hạn 1: SEC — 'The stop price is not the guaranteed execution price for a stop order. The stop price is a trigger...' — giá dừng là ĐIỂM KÍCH HOẠT, giá khớp 'can deviate significantly from the stop price'. Giới hạn 2: biến động trong phiên có thể kích lệnh sớm, khớp 'substantially worse than the stock's closing price' (bulletin 15). Stop = heuristic kiểm soát thời điểm rời vị thế, KHÔNG bảo đảm mức lỗ tối đa."
    source_lesson: "Investing/notes/module-2/week-07-quan-tri-rui-ro-position-sizing-stop-loss.md"
    claim_ids: ["W07-C04"]
    tags: ["stop-loss", "stop-price", "trigger", "sec", "not-a-guarantee"]
  - id: "fc-inv-w07-006"
    version: "1.0.0"
    concept: "Stop-limit và trailing stop"
    front: "Stop-limit và trailing stop hoạt động thế nào, đổi lấy rủi ro gì?"
    back: "Stop-limit: chạm giá dừng thì trở thành LỆNH GIỚI HẠN — 'the investor can control the price', nhưng 'a stop-limit order may not be executed if the stock's price moves away from the specified limit price' — giá chạy qua mức giới hạn thì lệnh không khớp và vị thế VẪN MỞ (SEC ví dụ: stop $3,00 / limit $2,50). Trailing stop: mức dừng trượt theo giá theo hướng thuận; SEC ví dụ: mua $20, trailing $1, đỉnh $24 → bán tại $23, 'though the execution price may deviate from $23'. Cả hai chịu thêm: chuẩn kích hoạt khác nhau giữa các đầu mối (giá khớp gần nhất hoặc báo giá — phải hỏi firm), và 'may not be available through all brokerage firms'. Mô tả là tài liệu giáo dục SEC Hoa Kỳ; loại lệnh tại Việt Nam phải tra công bố chính thức."
    source_lesson: "Investing/notes/module-2/week-07-quan-tri-rui-ro-position-sizing-stop-loss.md"
    claim_ids: ["W07-C04"]
    tags: ["stop-limit", "trailing-stop", "execution", "limitations"]
  - id: "fc-inv-w07-007"
    version: "1.0.0"
    concept: "Tương quan và tập trung"
    front: "Tương quan (correlation) và tập trung (concentration) tác động thế nào tới ngân sách rủi ro danh mục?"
    back: "CFA 2026 (Portfolio Risk and Return: Part I): 'Correlations among individual assets along with risk and return are important determinants of portfolio risk'; khi số tài sản tăng, tương quan càng quan trọng; 'Combining assets with low correlations reduces portfolio risk'. Ứng dụng: ba lệnh '1%' không tạo danh mục 'an toàn 1%' — nếu ba vị thế cùng kích dừng trong kịch bản xấu đồng thời, tổng lỗ ~3% (ví dụ 4.6: 999.120 + 1.000.000 + 1.000.000 ≈ 2.999.120 VND); 'cùng ngành nên dừng cùng lúc' là giả thuyết rủi ro từ khẳng định tương quan của CFA, không có dữ liệu mã Việt Nam. Tập trung: vị thế 17,25% danh mục làm kết quả phụ thuộc một cổ phiếu; KHÔNG nguồn đã mở công bố ngưỡng tối đa nào → 'chưa thể kết luận'."
    source_lesson: "Investing/notes/module-2/week-07-quan-tri-rui-ro-position-sizing-stop-loss.md"
    claim_ids: ["W07-C05"]
    tags: ["correlation", "concentration", "portfolio-risk", "cfa"]
  - id: "fc-inv-w07-008"
    version: "1.0.0"
    concept: "R:R, expectancy, MDD và kỷ luật"
    front: "Risk/reward, expectancy, MDD tính thế nào và ba sai lầm tâm lý phổ biến khi thực thi là gì?"
    back: "R:R = lãi kỳ vọng mỗi cp / lỗ mỗi cp (lần) — chỉ là tỷ lệ hai khoảng giá tự chọn, KHÔNG chứa xác suất. Expectancy (calculation only): E = p_thắng × lãi − (1−p_thắng) × lỗ (VND/cp); p là GIẢ ĐỊNH khai báo. Ví dụ 4.4 (giả định): R:R giấy 2,0:1 → sau chi phí 1,64:1; E giấy +500 → sau chi phí +159 VND/cp với p = 40%, nhưng p = 30% thì E = −605 — E dương trên giấy không chứng minh chiến lược có lãi (W06: chọn lọc mẫu, EMH). MDD = (Đỉnh − Đáy)/Đỉnh; phục hồi cần x/(1−x): mất 20% cần +25%, mất 50% cần +100%. Ba sai lầm kỷ luật: (1) tự ý dời/hủy stop khi giá chạm ngưỡng vì hy vọng hồi — phá ngân sách đã đặt; (2) gấp thếp sau thua để 'gỡ'; (3) quên đệm phí/slippage và tổng rủi ro mở của danh mục."
    source_lesson: "Investing/notes/module-2/week-07-quan-tri-rui-ro-position-sizing-stop-loss.md"
    claim_ids: ["W07-C05", "W07-C06"]
    tags: ["risk-reward", "expectancy", "mdd", "psychology", "discipline", "safety"]
