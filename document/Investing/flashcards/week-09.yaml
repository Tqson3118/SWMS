deck_id: "deck-inv-w09"
subject: "Investing"
lesson_id: "week-09-dau-tu-gia-tri"
version: "1.0.0"
description: "Bộ thẻ truy xuất kiến thức W09 - Đầu tư giá trị: Graham và Buffett principles. Nội dung giáo dục, không phải khuyến nghị đầu tư."

cards:
  - id: "fc-inv-w09-001"
    concept: "Biên an toàn (Margin of Safety)"
    front: "Biên an toàn (Margin of Safety) trong đầu tư giá trị là gì và tồn tại để làm gì?"
    back: "Biên an toàn là khoảng chênh tỷ lệ giữa giá trị nội tại ước tính và giá mua: MoS = (giá trị ước tính - giá)/giá trị ước tính. Nó tồn tại làm đệm cho sai số ước lượng và các biến cố bất lợi, vì giá trị nội tại không thể tính chính xác. Nguyên tắc của Graham được Buffett nhấn mạnh trong thư 1992: nếu giá trị tính được chỉ nhỉnh hơn giá một chút thì không mua. Lưu ý: MoS là đệm giảm tác động của sai số, không phải bảo đảm không lỗ."
    source_lesson: "Investing/notes/module-2/week-09-dau-tu-gia-tri.md"
    version: "1.0.0"
    claim_ids: ["W09-C01"]
    tags: ["margin-of-safety", "value-investing", "module-2"]

  - id: "fc-inv-w09-002"
    concept: "Giá trị nội tại (Intrinsic Value)"
    front: "Giá trị nội tại (intrinsic value) được định nghĩa như thế nào và vì sao nó luôn là ước lượng chứ không phải con số duy nhất?"
    back: "Giá trị nội tại là giá trị hợp lý của doanh nghiệp, tính bằng toàn bộ dòng tiền tương lai (vào và ra) chiết khấu về hiện tại theo lãi suất phù hợp. Muốn tính chính xác cần tầm nhìn hoàn hảo về các dòng tiền đó - điều không ai có. Vì mọi mô hình đều dựa trên giả định tăng trưởng, chiết khấu và lợi nhuận chuẩn hóa, kết quả luôn là khoảng ước lượng phụ thuộc giả định, nên phải báo cáo kèm nhiều kịch bản thay vì một con số duy nhất."
    source_lesson: "Investing/notes/module-2/week-09-dau-tu-gia-tri.md"
    version: "1.0.0"
    claim_ids: ["W09-C06"]
    tags: ["intrinsic-value", "valuation", "module-2"]

  - id: "fc-inv-w09-003"
    concept: "Mr. Market"
    front: "Ẩn dụ Mr. Market của Graham nói về điều gì, và vai trò đúng của báo giá thị trường là gì?"
    back: "Mr. Market là đối tác thất thường: mỗi ngày chào một giá mua hoặc bán; hưng phấn thì giá rất cao, bi quan thì giá rất thấp, và ông ta không phiền nếu bị bỏ qua. Vai trò đúng: báo giá để phục vụ bạn, không phải để hướng dẫn bạn - dùng nó như điều kiện giao dịch khi giá chào lệch đủ xa khỏi giá trị đã ước tính, không dùng nó để phán đoán giá trị. Graham tổng kết: ngắn hạn thị trường là cỗ máy bỏ phiếu theo cảm xúc, dài hạn là cỗ máy cân phản ánh giá trị."
    source_lesson: "Investing/notes/module-2/week-09-dau-tu-gia-tri.md"
    version: "1.0.0"
    claim_ids: ["W09-C02"]
    tags: ["mr-market", "price-vs-value", "module-2"]

  - id: "fc-inv-w09-004"
    concept: "Con hào kinh tế (Economic Moat)"
    front: "Con hào kinh tế (economic moat) là gì và tiêu chuẩn độ bền được đặt ra là bao nhiêu năm?"
    back: "Con hào kinh tế là lợi thế cạnh tranh khó bị đối thủ vượt qua hoặc sao chép, bảo vệ lợi nhuận dài hạn của doanh nghiệp. Buffett mô tả tìm 'lâu đài kinh tế được bảo vệ bằng con hào không thể vượt qua'; ví dụ GEICO với lợi thế chi phí vận hành thấp nhờ kênh bán trực tiếp. Tiêu chuẩn độ bền: tìm doanh nghiệp gần như chắc chắn còn sức mạnh cạnh tranh khổng lồ sau 10-20 năm. Lưu ý: con hào có thể bị xói mòn theo thời gian, phải kiểm tra lại định kỳ bằng dữ liệu."
    source_lesson: "Investing/notes/module-2/week-09-dau-tu-gia-tri.md"
    version: "1.0.0"
    claim_ids: ["W09-C03"]
    tags: ["economic-moat", "competitive-advantage", "module-2"]

  - id: "fc-inv-w09-005"
    concept: "Vòng tròn năng lực (Circle of Competence)"
    front: "Vòng tròn năng lực (circle of competence) nói lên điều gì về phạm vi và ranh giới hiểu biết của nhà đầu tư?"
    back: "Nhà đầu tư không cần am hiểu mọi công ty, chỉ cần đánh giá đúng các công ty trong vòng tròn năng lực của mình. Kích thước vòng tròn không quan trọng bằng việc biết rõ ranh giới của nó. Cơ chế: ngoài phạm vi hiểu biết thì không thể chọn giả định hợp lý để ước lượng dòng tiền, nên mọi biên an toàn tính ra đều ảo. Hành vi đúng: doanh nghiệp ngoài vòng tròn thì trả lời 'không hiểu, không mua', và ghi rõ ranh giới này trước khi bắt đầu phân tích."
    source_lesson: "Investing/notes/module-2/week-09-dau-tu-gia-tri.md"
    version: "1.0.0"
    claim_ids: ["W09-C04"]
    tags: ["circle-of-competence", "discipline", "module-2"]

  - id: "fc-inv-w09-006"
    concept: "Bẫy giá trị (Value Trap) và cơ chế cigar-butt"
    front: "Vì sao mua 'cổ phiếu rất rẻ' vẫn có thể thành bẫy giá trị (value trap)? Hãy nêu cơ chế cigar-butt."
    back: "Buffett gọi kiểu mua này là cigar-butt: mua doanh nghiệp kém với giá rẻ, giống nhặt điếu xì gà còn một hơi cuối. Cơ chế thất bại: món 'hời' ban đầu thường không phải hời vì trong doanh nghiệp khó luôn có vấn đề mới xuất hiện, và lợi thế ban đầu bị bào mòn bởi mức sinh lời thấp kéo dài - thời gian là kẻ thù của doanh nghiệp tầm thường. Trong ví dụ bài học, lợi nhuận đỉnh chu kỳ làm giá bề ngoài 'rẻ' lật thành biên an toàn âm khi lợi nhuận được chuẩn hóa lại."
    source_lesson: "Investing/notes/module-2/week-09-dau-tu-gia-tri.md"
    version: "1.0.0"
    claim_ids: ["W09-C05"]
    tags: ["value-trap", "cigar-butt", "module-2"]

  - id: "fc-inv-w09-007"
    concept: "Độ nhạy của biên an toàn"
    front: "Trong mô hình minh họa V = eps/r, vì sao biên an toàn phải luôn kèm bảng giả định và kịch bản xấu?"
    back: "Vì MoS phụ thuộc cùng lúc giá và giả định. Trong ví dụ Công ty A (giá 12.000 VND/cp, eps 1.500 VND/cp): r = 10% cho V = 15.000 VND/cp và MoS 20%; chỉ cần r tăng lên 12% thì V rơi còn 12.500 VND/cp và MoS còn 4%; nếu lợi nhuận chuẩn hóa thật chỉ 900 VND/cp thì MoS âm 33,3% và cơ hội thành bẫy. Kết luận: MoS là thuộc tính của cặp (giá, giả định); phải tính thêm kịch bản xấu trước khi tin kịch bản cơ sở, và đệm quá mỏng thì hành vi đúng là không mua."
    source_lesson: "Investing/notes/module-2/week-09-dau-tu-gia-tri.md"
    version: "1.0.0"
    claim_ids: ["W09-C07", "W09-C01"]
    tags: ["margin-of-safety", "sensitivity", "module-2"]

  - id: "fc-inv-w09-008"
    concept: "Quy tắc bán của nhà đầu tư giá trị"
    front: "Theo bài học, nhà đầu tư giá trị xử lý quyết định bán như thế nào - bán vì biến động giá hay vì điều gì?"
    back: "Bán khi thị trường định giá doanh nghiệp cao vượt xa thực tế, hoặc khi cần vốn cho một cơ hội bị định giá thấp hơn và mình hiểu rõ hơn. Không bán chỉ vì giá đã tăng hoặc đã giữ lâu. Giữ miễn là mức sinh lời trên vốn của doanh nghiệp thỏa đáng, ban quản trị đủ năng lực và trung thực, và thị trường chưa định giá quá cao. Nguyên tắc xuyên suốt: quyết định bán gắn với giá trị và luận điểm đầu tư ban đầu, không gắn với biến động giá ngắn hạn hay ngưỡng cảm tính."
    source_lesson: "Investing/notes/module-2/week-09-dau-tu-gia-tri.md"
    version: "1.0.0"
    claim_ids: ["W09-C02"]
    tags: ["selling-rules", "price-vs-value", "module-2"]
