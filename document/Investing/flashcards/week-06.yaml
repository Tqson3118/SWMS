deck_id: "deck-investing-w06"
subject: "Investing"
lesson_id: "week-06-phan-tich-ky-thuat-co-ban"
version: "1.0.0"
description: "Bộ thẻ truy xuất kiến thức W06. Nội dung giáo dục, không phải khuyến nghị đầu tư. Phân tích kỹ thuật là công cụ mô tả/giả thuyết, không phải dự báo chắc chắn."

cards:
  - id: "fc-investing-w06-001"
    version: "1.0.0"
    concept: "Định nghĩa phân tích kỹ thuật"
    front: "Phân tích kỹ thuật (technical analysis) dùng đầu vào gì và khác phân tích cơ bản ở điểm nào?"
    back: "CFA 2026 (Equity Valuation: Concepts and Basic Tools): technical analysis dùng thông tin như giá cổ phiếu và khối lượng giao dịch làm cơ sở quyết định; fundamental analysis dùng thông tin về nền kinh tế, ngành, doanh nghiệp. Technical analysts dùng thông tin để dự đoán chuyển động giá, fundamental analysts để ước lượng giá trị rồi so với giá thị trường. Trong bài học: TA là công cụ mô tả và tạo giả thuyết làm việc — không phải máy dự báo, không thay thế W05."
    source_lesson: "Investing/notes/module-2/week-06-phan-tich-ky-thuat-co-ban.md"
    claim_ids: ["W06-C01"]
    tags: ["technical-analysis", "definition", "framework"]
  - id: "fc-investing-w06-002"
    version: "1.0.0"
    concept: "SMA"
    front: "SMA-N (đường trung bình động đơn giản) tính thế nào và có đơn vị, cửa sổ ra sao?"
    back: "SMA_N(t) = (P_t + P_(t-1) + ... + P_(t-N+1)) / N — trung bình cộng giá đóng cửa N phiên gần nhất. Đơn vị VND/cổ phần (cùng đơn vị giá), cửa sổ N phiên, mỗi phiên có một giá trị mới khi cửa sổ trượt. Số N là lựa chọn của người dùng; cách đọc 'quay về SMA' hay 'giao cắt là tín hiệu' là quy ước kỹ thuật chưa được nguồn đã mở chứng minh độ tin cậy."
    source_lesson: "Investing/notes/module-2/week-06-phan-tich-ky-thuat-co-ban.md"
    claim_ids: ["W06-C02"]
    tags: ["sma", "moving-average", "formula"]
  - id: "fc-investing-w06-003"
    version: "1.0.0"
    concept: "EMA"
    front: "EMA-N tính thế nào, cần giả định gì và vì sao phản ứng nhanh hơn SMA cùng cửa sổ?"
    back: "EMA_N(t) = α·P_t + (1−α)·EMA_N(t−1) với hệ số làm mượt α = 2/(N+1). Cần giả định khởi tạo (seeding) — bài học dùng EMA của phiên đầu = SMA_N của N phiên đầu. Phản ứng nhanh hơn vì phiên gần nhất có trọng số α và các phiên cũ giảm theo cấp số nhân — thuộc tính công thức, không phải 'ưu điểm dự đoán'. Ví dụ 4.2: phiên 10, EMA-5 10,84 gần giá 11,00 hơn SMA-5 10,78 (Công ty V giả định)."
    source_lesson: "Investing/notes/module-2/week-06-phan-tich-ky-thuat-co-ban.md"
    claim_ids: ["W06-C02"]
    tags: ["ema", "moving-average", "smoothing"]
  - id: "fc-investing-w06-004"
    version: "1.0.0"
    concept: "Hỗ trợ, kháng cự, đảo vai"
    front: "Support, resistance và role reversal được định nghĩa thế nào và điểm yếu phương pháp là gì?"
    back: "Hỗ trợ: vùng giá nơi áp lực mua kỳ vọng làm đà giảm chậm lại; kháng cự: nơi áp lực bán làm đà tăng chậm lại — định nghĩa dùng 'kỳ vọng', là diễn giải trên dữ liệu cũ. Đảo vai (role reversal): giá phá kháng cự rồi quay lại giữ vững → vùng cũ được coi là hỗ trợ mới (quy ước). Điểm yếu: vùng/đường do người vẽ chọn điểm neo, khung thời gian, tiêu chí 'phá'; hai người có thể vẽ khác nhau trên cùng dữ liệu — không nguồn đã mở chứng minh độ tin cậy thống kê."
    source_lesson: "Investing/notes/module-2/week-06-phan-tich-ky-thuat-co-ban.md"
    claim_ids: ["W06-C02"]
    tags: ["support", "resistance", "role-reversal", "subjectivity"]
  - id: "fc-investing-w06-005"
    version: "1.0.0"
    concept: "Khối lượng và RSI"
    front: "Khối lượng (volume) đóng vai trò gì và RSI 'quá mua'/phân kỳ âm phải đọc thế nào?"
    back: "Blume–Easley–O'Hara (1994, tóm tắt): volume có thể chứa thông tin mà không suy được từ thống kê giá một mình; quy ước: giá đi kèm volume cao hơn bình quân được coi là có tham gia rộng hơn — cú thủng kèm volume tăng vọt là cảnh báo mạnh hơn. RSI: thang 0–100, RSI = 100 − 100/(1+RS), RS = bình quân lãi/bình quân lỗ N phiên (mặc định 14); >70/<30 là quy ước 'quá mua/quá bán' — không phải định giá (không nhầm P/E). Phân kỳ âm (giá lập đỉnh cao hơn, RSI thấp hơn) là cảnh báo động lượng suy yếu — giả thuyết, không phải dự báo đảo chiều."
    source_lesson: "Investing/notes/module-2/week-06-phan-tich-ky-thuat-co-ban.md"
    claim_ids: ["W06-C02", "W06-C03"]
    tags: ["volume", "rsi", "divergence", "warning-signal"]
  - id: "fc-investing-w06-006"
    version: "1.0.0"
    concept: "Giới hạn dự báo"
    front: "Dạng yếu hiệu quả (weak-form efficiency) nói gì về dữ liệu giá/khối lượng quá khứ?"
    back: "CFA 2026 (Market Efficiency): ở dạng yếu, giá tài sản phản ánh đầy đủ mọi dữ liệu thị trường — toàn bộ thông tin giá và khối lượng quá khứ, chính là đầu vào của TA. Tổng kết: 'not possible to beat the market on a consistent basis' — không thể đánh bại thị trường nhất quán sau điều chỉnh rủi ro; và lịch sử active returns vô nghĩa nếu không hiểu vì sao nó sẽ tiếp diễn. EMH là giả thuyết có bằng chứng hai chiều (anomalies vừa ủng hộ vừa bác bỏ) — không suy 'TA vô dụng' cũng không suy 'TA chắc thắng'. Trạng thái đúng với biểu đồ đẹp: 'chưa thể kết luận'."
    source_lesson: "Investing/notes/module-2/week-06-phan-tich-ky-thuat-co-ban.md"
    claim_ids: ["W06-C03"]
    tags: ["weak-form", "emh", "limits", "no-causal-claim"]
  - id: "fc-investing-w06-007"
    version: "1.0.0"
    concept: "Ba lỗi nghiên cứu"
    front: "Look-ahead bias, data-snooping/cherry-pick và survivorship bias là gì?"
    back: "Look-ahead: dùng thông tin chưa có tại thời điểm quyết định (mô phỏng khớp lệnh bằng giá đóng cửa phiên tín hiệu; chọn tham số sau khi biết kết quả). Data-snooping/cherry-pick: chọn quy tắc/khoảng thời gian đẹp nhất sau khi nhìn dữ liệu — Sullivan–Timmermann–White (1999, JF 54(5)) định lượng bias này bằng White's Reality Check trên toàn bộ vũ khí quy tắc, 100 năm dữ liệu DJIA; bản làm việc LSE dp303: quy tắc tốt nhất trong mẫu không còn vượt trội ở 10 năm ngoài mẫu. Survivorship: chỉ giữ đối tượng còn tồn tại — Brown–Goetzmann–Ibbotson–Ross (1992, RFS 5(4)): cắt mẫu theo sống sót tạo 'appearance of predictability'. Ba lỗi thường cùng xuất hiện trong 'biểu đồ 3/3 đều thắng'."
    source_lesson: "Investing/notes/module-2/week-06-phan-tich-ky-thuat-co-ban.md"
    claim_ids: ["W06-C04"]
    tags: ["look-ahead-bias", "data-snooping", "survivorship-bias", "backtesting"]
  - id: "fc-investing-w06-008"
    version: "1.0.0"
    concept: "Phí, khớp lệnh, slippage"
    front: "SEC nói gì về giá khớp lệnh và trượt giá (slippage) làm sao tính vào kết quả tín hiệu?"
    back: "SEC Investor Bulletin 'Trading Basics': giá khớp lệnh thị trường KHÔNG bảo đảm — giá khớp gần nhất không nhất thiết là giá của bạn, và trong thị trường nhanh thường lệch khỏi báo giá; giá dừng (stop) là điểm kích hoạt, không phải giá khớp bảo đảm; lệnh giới hạn có thể không khớp. Slippage = chênh giữa giá kỳ vọng và giá khớp thực tế. Ví dụ 4.4 (giả định): tín hiệu 11,00 → khớp mua 11,05 (+0,45%), bán 11,30 → khớp 11,24 (−0,53%), phí 0,15%/chiều → trên giấy +2,73%, ròng ≈ +1,42%; chênh ≈ 1,31 điểm %. Quy tắc khớp lệnh/phí tại Việt Nam phải tra công bố chính thức trong nước."
    source_lesson: "Investing/notes/module-2/week-06-phan-tich-ky-thuat-co-ban.md"
    claim_ids: ["W06-C05", "W06-C06"]
    tags: ["slippage", "commission", "execution", "costs", "safety"]
