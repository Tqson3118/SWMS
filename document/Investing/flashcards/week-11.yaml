deck_id: "deck-inv-w11"
subject: "Investing"
lesson_id: "week-11-thi-truong-viet-nam"
version: "1.0.0"
description: "Bộ thẻ truy xuất kiến thức W11 - Tổng quan thị trường chứng khoán Việt Nam: HOSE, HNX, UPCoM và VN-Index. Nội dung giáo dục, không phải khuyến nghị đầu tư."

cards:
  - id: "fc-inv-w11-001"
    concept: "Bốn tầng của thị trường chứng khoán Việt Nam"
    front: "Hệ thống thị trường chứng khoán Việt Nam gồm bốn tầng với vai trò khác nhau — hãy nêu từng tầng, chủ thể tương ứng và vì sao không thể hoán đổi vai trò giữa các tầng?"
    back: "Bốn tầng: (1) Quản lý - Bộ Tài chính và UBCKNN, đặt luật chơi; (2) Tổ chức thị trường - SGDCK Việt Nam với hai công ty con HOSE và HNX, mở phiên và khớp lệnh; (3) Hạ tầng hậu cần - VSDC, ghi sổ sở hữu, bù trừ và thanh toán; (4) Thước đo - các chỉ số như VN-Index, VN30, chỉ là dữ liệu theo phương pháp luận. Không thể hoán đổi vì mỗi tầng có thẩm quyền và trách nhiệm khác nhau: sàn tổ chức phiên chứ không quản lý nhà nước; VSDC thanh toán chứ không khớp lệnh; chỉ số đo lường chứ không phải danh mục đầu tư."
    source_lesson: "Investing/notes/module-3/week-11-thi-truong-viet-nam.md"
    version: "1.0.0"
    claim_ids: ["W11-C01", "W11-C02", "W11-C04"]
    tags: ["market-structure", "vietnam", "module-3"]

  - id: "fc-inv-w11-002"
    concept: "Vai trò UBCKNN"
    front: "UBCKNN là gì, thuộc cơ quan nào và được thành lập từ khi nào? Vì sao UBCKNN khác hoàn toàn với sàn giao dịch?"
    back: "Ủy ban Chứng khoán Nhà nước là đơn vị thuộc Bộ Tài chính, thực hiện chức năng tham mưu giúp Bộ trưởng quản lý nhà nước về chứng khoán và thị trường chứng khoán, tổ chức thực thi pháp luật; thành lập ngày 28/11/1996 theo Nghị định số 75/CP. UBCKNN khác sàn giao dịch ở tầng chức năng: sàn (HOSE, HNX) tổ chức và vận hành phiên giao dịch, còn UBCKNN là cơ quan quản lý nhà nước - nơi thẩm định và phê duyệt các quy chế quan trọng như biên độ dao động giá. Khi cần quy định pháp lý, nguồn tra là văn bản Bộ Tài chính/UBCKNN, không phải bài đăng thị trường."
    source_lesson: "Investing/notes/module-3/week-11-thi-truong-viet-nam.md"
    version: "1.0.0"
    claim_ids: ["W11-C01"]
    tags: ["ubcknn", "regulator", "module-3"]

  - id: "fc-inv-w11-003"
    concept: "SGDCK Việt Nam và mô hình công ty mẹ - con"
    front: "SGDCK Việt Nam được thành lập theo văn bản nào, quan hệ sở hữu với HOSE và HNX thế nào, và nguyên tắc độc quyền tổ chức thị trường phát biểu ra sao?"
    back: "Theo Quyết định số 37/2020/QĐ-TTg của Thủ tướng Chính phủ, SGDCK Việt Nam được thành lập theo mô hình công ty mẹ - công ty con: là công ty TNHH MTV do Nhà nước nắm giữ 100% vốn điều lệ (vốn điều lệ 3.000 tỷ đồng), nắm giữ 100% vốn điều lệ của SGDCK Hà Nội (HNX) và SGDCK TP.HCM (HOSE). Nguyên tắc được nhắc trên trang chính thức của HNX: ngoài SGDCK Việt Nam và các công ty con, không tổ chức, cá nhân nào được phép tổ chức và vận hành thị trường giao dịch chứng khoán. Hệ quả: quy chế giao dịch được ban hành thống nhất trong hệ thống, và 'sàn' không phải là cơ quan quản lý nhà nước."
    source_lesson: "Investing/notes/module-3/week-11-thi-truong-viet-nam.md"
    version: "1.0.0"
    claim_ids: ["W11-C02"]
    tags: ["vnx", "hose", "hnx", "module-3"]

  - id: "fc-inv-w11-004"
    concept: "HNX và UPCoM"
    front: "HNX được thành lập từ đâu, vận hành những thị trường nào, và UPCoM là thị trường gì với đặc điểm quy tắc giá nổi bật nào?"
    back: "HNX thành lập theo Quyết định số 01/2009/QĐ-TTg trên cơ sở tổ chức lại Trung tâm Giao dịch Chứng khoán Hà Nội (khai trương 08/03/2005), chính thức ra mắt ngày 24/06/2009; vận hành thị trường cổ phiếu niêm yết, thị trường cổ phiếu công ty đại chúng chưa niêm yết (UPCoM), thị trường trái phiếu Chính phủ (kể cả đấu thầu) và chứng khoán phái sinh. UPCoM là thị trường giao dịch cổ phiếu của công ty đại chúng chưa niêm yết do HNX tổ chức - có quy chế riêng; biên độ dao động giá thông thường rộng hơn thị trường niêm yết (15% so với 7%/10%), nhưng chất lượng công bố thông tin của từng doanh nghiệp phải tự kiểm tra, không suy ra chung từ tên thị trường."
    source_lesson: "Investing/notes/module-3/week-11-thi-truong-viet-nam.md"
    version: "1.0.0"
    claim_ids: ["W11-C03"]
    tags: ["hnx", "upcom", "module-3"]

  - id: "fc-inv-w11-005"
    concept: "Biên độ dao động giá, giá trần và giá sàn"
    front: "Biên độ dao động giá được định nghĩa và quyết định thế nào theo khung hiện hành, mức thông thường của ba sàn là bao nhiêu, và công thức trần/sàn tính ra sao?"
    back: "Theo Thông tư 120/2020/TT-BTC (Điều 4, bản hợp nhất): biên độ dao động giá là giới hạn dao động giá trong ngày giao dịch tính theo phần trăm so với giá tham chiếu; SGDCK Việt Nam quyết định biên độ sau khi được UBCKNN chấp thuận, và UBCKNN có thể điều chỉnh khi cần ổn định thị trường. Mức thông thường hiện hành được ghi nhận: HOSE 7%, HNX 10%, UPCoM 15%; ngày đặc biệt (ngày giao dịch đầu tiên, trở lại sau tạm ngừng đủ 25 phiên, một số ngày không hưởng quyền) áp 20%/30%/40%. Công thức: giá trần = giá tham chiếu x (1 + biên độ); giá sàn = giá tham chiếu x (1 - biên độ). Biên độ giới hạn yết giá mỗi phiên, không phải bảo hiểm lỗ."
    source_lesson: "Investing/notes/module-3/week-11-thi-truong-viet-nam.md"
    version: "1.0.0"
    claim_ids: ["W11-C05", "W11-C06"]
    tags: ["price-limit", "hose", "hnx", "upcom", "module-3"]

  - id: "fc-inv-w11-006"
    concept: "VSDC và chu kỳ thanh toán T+2"
    front: "VSDC thực hiện những chức năng gì, thời gian thanh toán hiện hành cho cổ phiếu, chứng chỉ quỹ, chứng quyền có bảo đảm và trái phiếu doanh nghiệp niêm yết là bao nhiêu ngày, nguyên tắc DVP nghĩa là gì?"
    back: "VSDC (Tổng công ty Lưu ký và Bù trừ chứng khoán Việt Nam) thực hiện đăng ký, lưu ký, bù trừ, thanh toán, thực hiện quyền và các dịch vụ hậu cần khác. Sau khi giao dịch được xác lập tại sàn, dữ liệu chuyển sang VSDC để bù trừ; thanh toán theo kết quả bù trừ đa phương với thời gian T+2 đối với cổ phiếu, chứng chỉ quỹ, chứng quyền có bảo đảm, và T+1 đối với trái phiếu doanh nghiệp niêm yết cùng công cụ nợ. Nguyên tắc DVP (Delivery Versus Payment): chứng khoán chỉ được chuyển giao khi và chỉ khi tiền được thanh toán - loại bỏ rủi ro gốc cho cả hai bên. Lập kế hoạch dòng tiền phải tính chu kỳ này, không tính theo cảm giác khớp lệnh là xong."
    source_lesson: "Investing/notes/module-3/week-11-thi-truong-viet-nam.md"
    version: "1.0.0"
    claim_ids: ["W11-C04"]
    tags: ["vsdc", "settlement", "t-plus-2", "module-3"]

  - id: "fc-inv-w11-007"
    concept: "VN-Index và bộ chỉ số HOSE-Index (VN30)"
    front: "VN-Index khác bộ chỉ số HOSE-Index (VN30, VNAllshare...) như thế nào về phạm vi rổ và phương pháp tính? Nêu các quy tắc chính đã được HOSE công bố cho bộ chỉ số HOSE-Index."
    back: "VN-Index là chỉ số tổng hợp gắn với phiên đầu ngày 28/7/2000, khởi điểm 100 điểm, đo sự tăng trưởng giá trị vốn hóa cổ phiếu niêm yết HOSE so với thời điểm cơ sở. Bộ chỉ số HOSE-Index (VNAllshare, VN30, VNMidcap, VNSmallcap, VN100, chỉ số ngành) là bộ chỉ số đầu tư được theo công bố của HOSE: sàng lọc tư cách (niêm yết tối thiểu 6 tháng, không bị cảnh báo/kiểm soát/tạm ngừng 3 tháng), free-float cao hơn 10%, thanh khoản tối thiểu 0,05% tỷ suất quay vòng; tính theo vốn hóa điều chỉnh free-float; giới hạn tỷ trọng 10%; cơ cấu rổ bán niên vào tháng 1 và tháng 7. VN30 có ngày cơ sở 02/01/2009, giá trị cơ sở 313,34. Rổ và tỷ trọng thay đổi theo quy tắc - không cố định vĩnh viễn."
    source_lesson: "Investing/notes/module-3/week-11-thi-truong-viet-nam.md"
    version: "1.0.0"
    claim_ids: ["W11-C07", "W11-C08"]
    tags: ["vn-index", "vn30", "index-methodology", "module-3"]

  - id: "fc-inv-w11-008"
    concept: "Chỉ số không phải danh mục và quy trình kiểm chứng nguồn"
    front: "Trong ví dụ rổ giả định hai cổ phiếu, vì sao chỉ số tăng 42,86% trong khi danh mục chỉ nắm cổ phiếu nhỏ đứng nguyên, và hai bước kiểm chứng nguồn nào cần làm trước khi tin nhận định 'chỉ số tăng là mua gì cũng lời'?"
    back: "Cơ chế: chỉ số vốn hóa trao tỷ trọng theo vốn hóa - rổ giả định X (50 tỷ) và Y (20 tỷ), X tăng 60% khiến chỉ số +42,86% trong khi danh mục chỉ Y đứng 0%; ngược lại khi X giảm 10%, chỉ số -7,14% nhưng danh mục vẫn 0%. Kết quả danh mục phụ thuộc tỷ trọng sở hữu, không phụ thuộc lời nói về chỉ số. Hai bước kiểm chứng nguồn: (1) xác định rổ và phương pháp (chỉ số nào, gồm gì, tỷ trọng thế nào) từ công bố chính thức của HOSE; (2) xác nhận con số kèm ngày công bố, ghi URL và ngày truy cập, không dùng tin lan truyền làm bằng chứng."
    source_lesson: "Investing/notes/module-3/week-11-thi-truong-viet-nam.md"
    version: "1.0.0"
    claim_ids: ["W11-C09", "W11-C08"]
    tags: ["cap-weighted-index", "source-verification", "worked-example", "module-3"]
