deck_id: "deck-inv-w12"
subject: "Investing"
lesson_id: "week-12-tai-khoan-lenh-phi-thue-vn"
version: "1.0.0"
description: "Bộ thẻ truy xuất kiến thức W12 - tài khoản, loại lệnh, chi phí và thuế tại Việt Nam. Nội dung giáo dục, không phải khuyến nghị đầu tư."

cards:
  - id: "fc-inv-w12-001"
    concept: "Lệnh giới hạn LO"
    front: "LO kiểm soát giá như thế nào và đổi lại rủi ro thực hiện nào?"
    back: "LO là lệnh mua hoặc bán tại mức giá chỉ định hoặc tốt hơn: mua không cao hơn giá đặt, bán không thấp hơn giá đặt. Đổi lại, lệnh có thể không khớp hoặc chỉ khớp một phần nếu thị trường không chạm mức giá. LO không bảo đảm giá tốt nhất cả ngày, không miễn phí và phải tuân theo phiên, đơn vị lệnh, sửa/hủy của sàn. Hãy ghi rõ giá tối đa/tối thiểu trước khi gửi lệnh."
    source_lesson: "Investing/notes/module-3/week-12-tai-khoan-lenh-phi-thue-vn.md"
    version: "1.0.0"
    claim_ids: ["W12-C01"]
    tags: ["limit-order", "order-types", "module-3"]
  - id: "fc-inv-w12-002"
    concept: "ATO và ATC"
    front: "ATO và ATC khác nhau ở phiên nào, và phần chưa khớp được xử lý ra sao?"
    back: "ATO (At-the-Open) dùng trong khớp định kỳ xác định giá mở cửa; ATC (At-the-Close) dùng trong khớp định kỳ xác định giá đóng cửa. Đây không phải LO có giá cố định do người dùng nhập và cũng không bảo đảm một mức giá trước. Phần chưa khớp của ATO/ATC được hủy hoặc hết hạn theo quy tắc phiên tương ứng. Cần kiểm tra quy chế hiện hành của đúng sàn vì tên lệnh và chi tiết ưu tiên có thể thay đổi."
    source_lesson: "Investing/notes/module-3/week-12-tai-khoan-lenh-phi-thue-vn.md"
    version: "1.0.0"
    claim_ids: ["W12-C01"]
    tags: ["ato", "atc", "order-types", "module-3"]
  - id: "fc-inv-w12-003"
    concept: "Lệnh thị trường và slippage"
    front: "Vì sao lệnh thị trường trên sổ lệnh mỏng có thể tạo slippage lớn?"
    back: "Lệnh thị trường ưu tiên tốc độ khớp với các lệnh đối ứng đang có, không khóa một mức giá duy nhất. Nếu sổ lệnh mỏng, khối lượng lớn sẽ ăn lần lượt nhiều mức giá; giá bình quân thực tế có thể kém xa mức nhìn thấy đầu tiên. Vì vậy giá tốt nhất đang có chỉ là ảnh chụp tại thời điểm xử lý, không phải giá tốt nhất cả ngày. Kiểm tra độ sâu, spread và cân nhắc LO khi cần giới hạn giá."
    source_lesson: "Investing/notes/module-3/week-12-tai-khoan-lenh-phi-thue-vn.md"
    version: "1.0.0"
    claim_ids: ["W12-C01"]
    tags: ["market-order", "slippage", "liquidity", "module-3"]
  - id: "fc-inv-w12-004"
    concept: "Khung phí dịch vụ chứng khoán"
    front: "Thông tư 128/2018/TT-BTC liên quan thế nào đến phí môi giới và vì sao không thể dùng nó thay biểu phí công ty?"
    back: "Thông tư 128/2018/TT-BTC của Bộ Tài chính, hiệu lực 15/02/2019, quy định mức tối đa hoặc khung giá dịch vụ trong lĩnh vực chứng khoán; tài liệu được đối chiếu nêu giá dịch vụ môi giới cổ phiếu, chứng chỉ quỹ và chứng quyền tối đa 0,5% giá trị giao dịch. Tổ chức cung cấp dịch vụ quyết định mức cụ thể phù hợp pháp luật và phải công bố biểu phí. Vì vậy không được suy ra mọi khách hàng trả 0,5% hoặc 0%: hãy đọc biểu phí, mức tối thiểu và dịch vụ kèm theo tại ngày giao dịch."
    source_lesson: "Investing/notes/module-3/week-12-tai-khoan-lenh-phi-thue-vn.md"
    version: "1.0.0"
    claim_ids: ["W12-C02"]
    tags: ["fees", "brokerage", "regulation", "module-3"]
  - id: "fc-inv-w12-005"
    concept: "Thuế chuyển nhượng chứng khoán"
    front: "Trong khung bài học, thuế chuyển nhượng chứng khoán được tính trên cơ sở nào?"
    back: "Trong phạm vi cá nhân cư trú theo Điều 54 Nghị định 253/2026/NĐ-CP, chuyển nhượng chứng khoán thông thường dùng 0,1% trên giá chuyển nhượng từng lần; bán 20.000.000 VND cho ra 20.000 VND theo công thức nguồn. Ghi ngày hiệu lực 01/07/2026 và không suy rộng cho phái sinh, ESOP hoặc sản phẩm khác. Ví dụ TT111/2013 và TT92/2015 ở lesson vẫn là lịch sử/minh họa."
    source_lesson: "Investing/notes/module-3/week-12-tai-khoan-lenh-phi-thue-vn.md"
    version: "1.0.0"
    claim_ids: ["W12-C03"]
    tags: ["tax", "securities-transfer", "vietnam", "module-3"]
  - id: "fc-inv-w12-006"
    concept: "Thuế cổ tức tiền mặt"
    front: "Cổ tức tiền mặt khác thuế chuyển nhượng chứng khoán thế nào trong bài học?"
    back: "Trong phạm vi cá nhân cư trú và khoản chi trả bằng tiền, Điều 52 Nghị định 253/2026/NĐ-CP dùng thuế suất 5%; 10.000.000 VND tiền mặt cho ra 500.000 VND theo công thức nguồn. Cổ tức bằng cổ phiếu có thời điểm xử lý khác khi nhận và khi chuyển nhượng. Không suy rộng cho ESOP, phái sinh, sản phẩm hoặc tình trạng cư trú ngoài phạm vi bài. Nguồn có hiệu lực 01/07/2026; ví dụ TT111/2013/TT92/2015 vẫn được giữ như lịch sử/minh họa."
    source_lesson: "Investing/notes/module-3/week-12-tai-khoan-lenh-phi-thue-vn.md"
    version: "1.0.0"
    claim_ids: ["W12-C03"]
    tags: ["tax", "dividend", "capital-income", "module-3"]
  - id: "fc-inv-w12-007"
    concept: "Chi phí giao dịch toàn phần"
    front: "Một bảng chi phí giao dịch toàn phần cần tách những lớp nào?"
    back: "Tách ít nhất: phí dịch vụ theo biểu phí; khoản thuế theo loại thu nhập và phạm vi; spread; slippage; và chi phí vốn. Worked example lịch sử vẫn dùng 0,1% để luyện phép tính, còn current 2026 scope ở thẻ 009 dùng điều khoản Nghị định 253/2026. Nếu minimum fee 50.000 VND, sensitivity check của ví dụ lịch sử là 19.930.000 VND. Zero-fee không chứng minh chi phí ròng bằng 0."
    source_lesson: "Investing/notes/module-3/week-12-tai-khoan-lenh-phi-thue-vn.md"
    version: "1.0.0"
    claim_ids: ["W12-C02", "W12-C03", "W12-C04"]
    tags: ["transaction-cost", "worked-example", "spread", "module-3"]
  - id: "fc-inv-w12-008"
    concept: "Checklist trước lệnh và bảo mật"
    front: "Checklist tối thiểu trước một lệnh trực tuyến gồm những câu hỏi nào?"
    back: "Xác nhận mục tiêu, thời hạn, mã và sàn; kiểm tra sức mua/sức bán và trạng thái T+2; chọn loại lệnh theo mục tiêu kiểm soát giá hay tốc độ; đọc thanh khoản, spread và khả năng khớp một phần; mở biểu phí và ước lượng thuế; kiểm tra màn hình xác nhận; bật 2FA/Smart OTP và tuyệt đối không chia sẻ mật khẩu hoặc OTP. Tài khoản chỉ là quyền truy cập, không phải bảo hiểm vốn hay kết quả."
    source_lesson: "Investing/notes/module-3/week-12-tai-khoan-lenh-phi-thue-vn.md"
    version: "1.0.0"
    claim_ids: ["W12-C01", "W12-C02", "W12-C04"]
    tags: ["checklist", "security", "ekyc", "module-3"]

  - id: "fc-inv-w12-009"
    concept: "Phân biệt thuế hiện hành 2026 trong phạm vi cá nhân cư trú"
    front: "Cổ tức tiền mặt, cổ tức bằng cổ phiếu và bán chứng khoán thông thường khác nhau thế nào?"
    back: "Trong phạm vi cá nhân cư trú đã đọc: cổ tức/lợi tức đầu tư vốn bằng tiền dùng 5% theo Điều 52 Nghị định 253/2026/NĐ-CP; chuyển nhượng chứng khoán thông thường dùng 0,1% trên giá chuyển nhượng từng lần theo Điều 54; cổ tức bằng cổ phiếu chưa nộp thuế đầu tư vốn tại thời điểm nhận và phải xử lý các khoản tương ứng khi chuyển nhượng. Quy tắc này không mở rộng sang ESOP, phái sinh, sản phẩm hoặc tình trạng cư trú khác."
    source_lesson: "Investing/notes/module-3/week-12-tai-khoan-lenh-phi-thue-vn.md#44-current-2026-resident-individual-tax-scope"
    version: "1.0.0"
    claim_ids: ["W12-C05", "W12-C06", "W12-C07", "W12-C08"]
    tags: ["tax", "dividend", "securities-transfer", "resident-individual", "module-3"]
