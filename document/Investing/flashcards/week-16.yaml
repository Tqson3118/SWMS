deck_id: "deck-inv-w16"
subject: "Investing"
lesson_id: "week-16-crypto-digital-assets-blockchain-defi-risk-assessment"
version: "1.0.0"
description: "R5 deck W16 về blockchain, token, stablecoin, smart contract, DeFi, oracle, custody và risk assessment; giáo dục, không phải khuyến nghị đầu tư."

cards:
  - id: "fc-inv-w16-001"
    concept: "Technology product asset boundary"
    front: "Vì sao cần tách blockchain, token, product/service và speculative asset trong một claim?"
    back: "Blockchain là technology; token là đơn vị/quyền theo thiết kế; product/service là issuer, exchange, custodian hoặc protocol; speculative asset là cách một tài sản được định giá và mua bán vì kỳ vọng giá. Công nghệ không tự bảo đảm quyền pháp lý, giá trị hay thanh khoản."
    source_lesson: "Investing/notes/module-4/week-16-crypto-digital-assets-blockchain-defi-risk-assessment.md#5-blockchain-token-và-ranh-giới-giữa-công-nghệ-với-tài-sản"
    version: "1.0.0"
    claim_ids: ["W16-C01"]
    tags: ["blockchain", "token", "asset-boundary"]
  - id: "fc-inv-w16-002"
    concept: "Stablecoin design"
    front: "Checklist nào cần hỏi trước khi gọi một stablecoin an toàn hoặc redeemable?"
    back: "Hỏi issuer, mint/burn, reserve, kiểm tra reserve, cơ chế ổn định, quyền redeem, governance, dependencies và jurisdiction. Stable là mục tiêu thiết kế; không tự chứng minh bảo hiểm, giá cố định hoặc quyền redeem cho mọi người."
    source_lesson: "Investing/notes/module-4/week-16-crypto-digital-assets-blockchain-defi-risk-assessment.md#6-stablecoin-mục-tiêu-ổn-định-không-phải-bảo-hiểm"
    version: "1.0.0"
    claim_ids: ["W16-C02", "W16-C03"]
    tags: ["stablecoin", "reserves", "redemption"]
  - id: "fc-inv-w16-003"
    concept: "Smart contract boundary"
    front: "Smart contract tự động hóa điều gì và không tự bảo đảm điều gì?"
    back: "Smart contract là chương trình trên blockchain thực thi logic theo code khi điều kiện phù hợp. Nó không tự là hợp đồng pháp lý, không loại bỏ bug, không biết ý định người dùng và không bảo đảm kết quả kinh tế."
    source_lesson: "Investing/notes/module-4/week-16-crypto-digital-assets-blockchain-defi-risk-assessment.md#7-smart-contract-defi-và-governance-tự-động-không-có-nghĩa-là-an-toàn"
    version: "1.0.0"
    claim_ids: ["W16-C04"]
    tags: ["smart-contract", "code", "limits"]
  - id: "fc-inv-w16-004"
    concept: "DeFi governance"
    front: "Vì sao ‘DeFi hoàn toàn phi tập trung’ có thể là overclaim?"
    back: "DeFi dùng smart contract và token nhưng vẫn có thể phụ thuộc governance voters, developers, admin keys, validators, oracle operators, interfaces hoặc bridge. Mức độ phi tập trung là một thuộc tính cần kiểm tra, không phải nhãn nhị phân."
    source_lesson: "Investing/notes/module-4/week-16-crypto-digital-assets-blockchain-defi-risk-assessment.md#7-smart-contract-defi-và-governance-tự-động-không-có-nghĩa-là-an-toàn"
    version: "1.0.0"
    claim_ids: ["W16-C01"]
    tags: ["defi", "governance", "dependency"]
  - id: "fc-inv-w16-005"
    concept: "Oracle risk"
    front: "Ba tiêu chí nào giúp đánh giá oracle và failure mode cơ bản là gì?"
    back: "Đánh giá correctness, availability và incentive compatibility. Oracle đưa dữ liệu off-chain vào contract; dữ liệu sai, cũ hoặc không sẵn sàng có thể làm contract định giá hoặc thực thi sai. Nhiều node không tự chứng minh dữ liệu gốc đúng."
    source_lesson: "Investing/notes/module-4/week-16-crypto-digital-assets-blockchain-defi-risk-assessment.md#8-oracle-và-rủi-ro-dữ-liệu"
    version: "1.0.0"
    claim_ids: ["W16-C05"]
    tags: ["oracle", "data-risk", "defi"]
  - id: "fc-inv-w16-006"
    concept: "Custody and key loss"
    front: "Custodial và self-custody chuyển rủi ro kiểm soát tài sản theo hai hướng nào?"
    back: "Custodial service giữ quyền kiểm soát thay người dùng nên có service/counterparty/withdrawal risk. Self-custody giảm một số dependency nhưng chuyển trách nhiệm bảo vệ private key, seed phrase, thiết bị và signing vào người dùng; mất khóa hoặc ký nhầm có thể không đảo ngược."
    source_lesson: "Investing/notes/module-4/week-16-crypto-digital-assets-blockchain-defi-risk-assessment.md#9-bảy-lớp-rủi-ro-cần-đánh-giá-riêng"
    version: "1.0.0"
    claim_ids: ["W16-C06"]
    tags: ["custody", "private-key", "key-loss"]
  - id: "fc-inv-w16-007"
    concept: "Seven risk layers"
    front: "W16 yêu cầu tách những lớp rủi ro nào thay vì gom thành ‘crypto risk’?"
    back: "Tách volatility, liquidity, counterparty, custody/key loss, smart-contract/oracle/governance, legal/regulatory và scam/phishing. Mỗi lớp cần fact, unknown, source và câu hỏi xác minh riêng; không có lớp nào mặc định được loại bỏ bởi blockchain."
    source_lesson: "Investing/notes/module-4/week-16-crypto-digital-assets-blockchain-defi-risk-assessment.md#9-bảy-lớp-rủi-ro-cần-đánh-giá-riêng"
    version: "1.0.0"
    claim_ids: ["W16-C02", "W16-C03", "W16-C05", "W16-C06"]
    tags: ["risk-assessment", "liquidity", "counterparty"]
  - id: "fc-inv-w16-008"
    concept: "Known uncertain pending"
    front: "Một W16 risk assessment phải dùng known, uncertain và pending thế nào?"
    back: "Known là claim có locator trong nguồn đã mở hoặc fact của hypothetical. Uncertain là quyền token, reserve, custody, permissions, liquidity hoặc oracle quality chưa đủ evidence. Pending là claim pháp lý hoặc nguồn chưa mở/đọc được; không biến pending thành verified và không dùng nó để đưa suitability hay dự báo."
    source_lesson: "Investing/notes/module-4/week-16-crypto-digital-assets-blockchain-defi-risk-assessment.md#11-deepdive-ma-trận-provenance-và-kết-luận-knownuncertain"
    version: "1.0.0"
    claim_ids: ["W16-C03", "W16-C06"]
    tags: ["known", "uncertain", "pending", "provenance"]
