deck_id: "deck-inv-w14"
subject: "Investing"
lesson_id: "week-14-trai-phieu-quy-mo-etf-vn"
version: "1.0.0"
description: "R5 deck W14 về trái phiếu, quỹ mở, ETF, NAV, rủi ro, settlement và provenance; giáo dục, không phải khuyến nghị đầu tư."

cards:
  - id: "fc-inv-w14-001"
    concept: "Trái phiếu và nghĩa vụ nợ"
    front: "Trong một bài tập đọc tài liệu, cần đối chiếu thế nào để phân biệt trái phiếu doanh nghiệp với tiền gửi và chứng chỉ quỹ mở?"
    back: "Đây là checklist cần xác nhận trong prospectus/factsheet đã mở: ai là issuer/manager/custodian, nghĩa vụ hoặc quyền lợi nào được mô tả, cơ chế vào/ra là gì, và tài liệu ghi ngày hiệu lực/version nào. W14 chưa mở một product document nên không biến khung này thành fact của sản phẩm cụ thể."
    source_lesson: "Investing/notes/module-3/week-14-trai-phieu-quy-mo-etf-vn.md#5-trái-phiếu-loại-và-thứ-tự-ưu-tiên"
    version: "1.0.0"
    tags: ["bonds", "funds", "risk", "module-3"]
  - id: "fc-inv-w14-002"
    concept: "Rủi ro lãi suất và duration"
    front: "Khi lợi suất thị trường tăng, duration giúp giải thích biến động giá trái phiếu ra sao?"
    back: "FINRA mô tả duration theo năm là chỉ báo mức giá trái phiếu có thể biến động khi lãi suất thay đổi; Investor.gov giải thích lãi suất tăng thường làm giá trái phiếu giảm. Đây là khái niệm chung đã source-check, không phải dự báo giá hay sản phẩm Việt Nam."
    source_lesson: "Investing/notes/module-3/week-14-trai-phieu-quy-mo-etf-vn.md#6-bốn-rủi-ro-phải-tách-riêng"
    version: "1.0.0"
    tags: ["fixed-income", "duration", "interest-rate-risk"]
  - id: "fc-inv-w14-003"
    concept: "VSDC và chu kỳ thanh toán"
    front: "VSDC mô tả các chu kỳ thanh toán nào cho trái phiếu niêm yết, công cụ nợ và trái phiếu riêng lẻ?"
    back: "Trang Bù trừ và Thanh toán của VSDC đọc ngày 2026-09-16 nêu T+1 cho trái phiếu doanh nghiệp niêm yết, T+1 cho công cụ nợ và T+0 cho trái phiếu riêng lẻ theo từng giao dịch khi bên mua đủ tiền và bên bán đủ chứng khoán. Chu kỳ thanh toán không phải thời gian issuer trả coupon hay gốc."
    source_lesson: "Investing/notes/module-3/week-14-trai-phieu-quy-mo-etf-vn.md#5-trái-phiếu-loại-và-thứ-tự-ưu-tiên"
    version: "1.0.0"
    claim_ids: ["W14-C03"]
    tags: ["vsdc", "settlement", "bonds"]
  - id: "fc-inv-w14-004"
    concept: "Credit và liquidity risk"
    front: "Trong checklist đọc một hồ sơ trái phiếu, vì sao coupon cao chưa đủ để kết luận an toàn?"
    back: "Investor.gov xác định bond funds chịu credit, interest-rate và prepayment risk; coupon cao không đủ để kết luận an toàn. Mức coupon, issuer, bảo đảm và thanh khoản của từng sản phẩm vẫn phải đọc prospectus."
    source_lesson: "Investing/notes/module-3/week-14-trai-phieu-quy-mo-etf-vn.md#6-bốn-rủi-ro-phải-tách-riêng"
    version: "1.0.0"
    tags: ["credit-risk", "liquidity", "bonds"]
  - id: "fc-inv-w14-005"
    concept: "Coupon VND giả định"
    front: "Một mệnh giá giả định 100.000.000 VND với coupon 8% một năm tạo coupon bao nhiêu?"
    back: "Coupon = 100.000.000 x 8% = 8.000.000 VND trước phí và thuế. Đây là phép tính hypothetical, không phải số liệu của issuer hoặc sản phẩm thật và không chứng minh khả năng trả nợ."
    source_lesson: "Investing/notes/module-3/week-14-trai-phieu-quy-mo-etf-vn.md#10-worked-example-vnd-bốn-giai-đoạn"
    version: "1.0.0"
    claim_ids: ["W14-C05"]
    tags: ["calculation", "hypothetical", "vnd"]
  - id: "fc-inv-w14-006"
    concept: "Lợi nhuận ròng sau giả định"
    front: "Trong case W14, vì sao 107.600.000 VND nhận ròng và 100.150.000 VND chi ra cho lãi ròng 7.450.000 VND?"
    back: "Lãi ròng = tiền nhận ròng 107.600.000 - chi phí mua 100.150.000 = 7.450.000 VND; tỷ lệ trên chi phí mua = 7,439%. Phí 0,15% và 5% trên coupon chỉ là giả định minh họa, không phải mức hiện hành phổ quát. Trong sensitivity: giá mua 98.000.000 cho 9,631%; coupon nhận 4.000.000 cho 3,445%."
    source_lesson: "Investing/notes/module-3/week-14-trai-phieu-quy-mo-etf-vn.md#10-worked-example-vnd-bốn-giai-đoạn"
    version: "1.0.0"
    claim_ids: ["W14-C06"]
    tags: ["calculation", "fees", "tax", "sensitivity"]
  - id: "fc-inv-w14-007"
    concept: "ETF premium discount"
    front: "Trong một ví dụ hypothetical, ETF có NAV 20.000 VND và giá thị trường 19.600 VND cần được diễn giải thế nào?"
    back: "Investor.gov mô tả ETF giao dịch theo market price có thể premium/discount so với NAV; Investor.gov Index Funds mô tả tracking error là quỹ không bám hoàn hảo chỉ số. Các số 19.600 và 20.000 vẫn hypothetical; không suy ra bargain, phí hay chất lượng của sản phẩm cụ thể."
    source_lesson: "Investing/notes/module-3/week-14-trai-phieu-quy-mo-etf-vn.md#7-quỹ-mở-so-với-etf"
    version: "1.0.0"
    tags: ["etf", "nav", "market-price", "tracking-error"]
  - id: "fc-inv-w14-008"
    concept: "Provenance của tài liệu tài chính"
    front: "Một claim W14 về quy định hoặc prospectus cần provenance tối thiểu nào?"
    back: "Ghi URL, ngày truy cập, ngày hiệu lực hoặc phiên bản, điều/mục/trang, phạm vi đã đọc và giới hạn. Nếu nguồn hoặc prospectus không mở toàn văn, giữ pending/uncertain và không biến metadata thành kết luận pháp lý hay product fact hiện hành."
    source_lesson: "Investing/notes/module-3/week-14-trai-phieu-quy-mo-etf-vn.md#12-tài-liệu-ngày-hiệu-lực-và-giới-hạn-nguồn"
    version: "1.0.0"
    claim_ids: ["W14-C08"]
    tags: ["provenance", "regulation", "prospectus", "limits"]
