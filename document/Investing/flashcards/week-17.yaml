deck_id: "deck-inv-w17"
subject: "Investing"
lesson_id: "week-17-bat-dong-san-leverage-rental-yield"
version: "1.0.0"
description: "R5 deck W17 về leverage, LTV, DSCR, rental yield, NOI, cap rate và dòng tiền; giả định giáo dục, không phải khuyến nghị."

cards:
  - id: "fc-inv-w17-001"
    version: "1.0.0"
    concept: "Leverage boundary"
    front: "Leverage khuếch đại kết quả trên vốn tự có theo những chiều nào?"
    back: "Leverage dùng khoản vay cùng vốn tự có để kiểm soát tài sản lớn hơn vốn tiền mặt. Nếu thu nhập tài sản vượt chi phí vốn, kết quả trên equity có thể được khuếch đại; nếu vacancy, lãi suất, repairs hoặc giá trị đi theo hướng bất lợi, lỗ và áp lực trả nợ cũng tăng. Đây là cơ chế phân tích, không phải lời khuyên dùng nợ."
    source_lesson: "Investing/notes/module-4/week-17-bat-dong-san-leverage-rental-yield.md#4-deep-dive-bản-đồ-dòng-tiền-và-thuật-ngữ"
    tags: ["leverage", "equity", "risk"]
  - id: "fc-inv-w17-002"
    version: "1.0.0"
    concept: "LTV and DSCR"
    front: "LTV và DSCR nhìn vào hai câu hỏi khác nhau nào?"
    back: "LTV = khoản vay chia giá trị tài sản, nên nhìn cấu trúc vốn và độ nhạy của mẫu số giá trị. DSCR = NOI chia debt service theo định nghĩa kỳ đã nêu; Fannie Mae underwriting cũng dùng underwritten NCF / annual debt service trong phạm vi multifamily. Cả hai không tự bảo đảm phê duyệt vay, khả năng trả nợ hộ gia đình hay an toàn của tài sản."
    source_lesson: "Investing/notes/module-4/week-17-bat-dong-san-leverage-rental-yield.md#4-deep-dive-bản-đồ-dòng-tiền-và-thuật-ngữ"
    tags: ["ltv", "dscr", "debt"]
  - id: "fc-inv-w17-003"
    version: "1.0.0"
    concept: "Gross yield"
    front: "Vì sao gross rental yield không phải lợi nhuận ròng?"
    back: "Gross rental yield lấy tiền thuê 12 tháng theo assumption chia cho giá mua hoặc giá trị tham chiếu. Nó chưa trừ vacancy, bảo trì, phí quản lý, thuế, lãi vay, gốc, chi phí giao dịch hoặc sửa chữa vốn. Vì vậy phải hỏi kỳ tính, mẫu số và các khoản đã loại trừ trước khi so sánh với tỷ lệ khác."
    source_lesson: "Investing/notes/module-4/week-17-bat-dong-san-leverage-rental-yield.md#4-deep-dive-bản-đồ-dòng-tiền-và-thuật-ngữ"
    tags: ["gross-yield", "rent", "vacancy"]
  - id: "fc-inv-w17-004"
    version: "1.0.0"
    concept: "NOI and cap rate"
    front: "NOI và cap rate được tính và diễn giải thế nào?"
    back: "NOI là doanh thu thuê thực thu sau vacancy và operating costs, trước lãi vay, gốc và thuế thu nhập. Cap rate = NOI chia giá mua hoặc giá trị tài sản được nêu rõ. Cap rate đo thu nhập vận hành trên tài sản, không phải lãi suất vay và không phải return trên equity."
    source_lesson: "Investing/notes/module-4/week-17-bat-dong-san-leverage-rental-yield.md#giai-đoạn-2--doanh-thu-vacancy-operating-costs-gross-yield-và-noi"
    tags: ["noi", "cap-rate", "operating-costs"]
  - id: "fc-inv-w17-005"
    version: "1.0.0"
    concept: "Debt service calculation"
    front: "Trong ví dụ W17, debt service tháng đầu được tạo bởi những khoản nào?"
    back: "Khoản vay giả định là 1.800.000.000 VND, gốc đều trong 20 năm nên gốc tháng = 7.500.000 VND. Lãi tháng đầu ở 9%/năm = 13.500.000 VND. Debt service tháng đầu = 21.000.000 VND. Bài dùng 252.000.000 VND cho phép tính năm đầu giản lược và ghi rõ đây không phải lịch khấu hao đầy đủ của ngân hàng."
    source_lesson: "Investing/notes/module-4/week-17-bat-dong-san-leverage-rental-yield.md#giai-đoạn-3--debt-service-dscr-và-dòng-tiền-trước-sau-nợ"
    claim_ids: ["W17-C02"]
    tags: ["debt-service", "amortization", "interest"]
  - id: "fc-inv-w17-006"
    version: "1.0.0"
    concept: "Negative cash flow"
    front: "Vì sao NOI dương vẫn có thể đi cùng cash flow sau nợ âm?"
    back: "NOI chỉ phản ánh hoạt động cho thuê trước debt service. Trong base case, NOI là 164.100.000 VND nhưng debt service giản lược là 252.000.000 VND, nên cash flow trước thuế sau nợ = -87.900.000 VND/năm và DSCR = 0,65x. Gross yield không tự chứng minh tài sản tự trả được khoản vay."
    source_lesson: "Investing/notes/module-4/week-17-bat-dong-san-leverage-rental-yield.md#giai-đoạn-3--debt-service-dscr-và-dòng-tiền-trước-sau-nợ"
    claim_ids: ["W17-C02"]
    tags: ["cash-flow", "negative", "dscr"]
  - id: "fc-inv-w17-007"
    version: "1.0.0"
    concept: "Sensitivity"
    front: "Năm chiều sensitivity nào W17 yêu cầu kiểm tra?"
    back: "Kiểm tra vacancy, lãi suất, tiền thuê, thời gian trống và repairs; bài có cả vacancy 3/6 tháng, rate 12%, rent 22 triệu và repairs 120 triệu. Giữ các biến khác cố định, ghi đơn vị và rounding, rồi xem kết quả đổi thế nào. Sensitivity không dự báo kịch bản nào sẽ xảy ra và không thay thế thẩm định thực tế."
    source_lesson: "Investing/notes/module-4/week-17-bat-dong-san-leverage-rental-yield.md#7-sensitivity-liquidity-và-rủi-ro-leverage"
    claim_ids: ["W17-C03"]
    tags: ["sensitivity", "vacancy", "repairs"]
  - id: "fc-inv-w17-008"
    version: "1.0.0"
    concept: "Pending source boundary"
    front: "Xử lý tax, fees và điều kiện tín dụng pending thế nào?"
    back: "Không dùng mức thuế, phí, điều kiện pháp lý hoặc lãi suất sản phẩm cụ thể như verified nếu chưa mở và đọc nguồn authoritative. Gắn claim là pending, ghi locator và phạm vi cần kiểm tra; trong ví dụ, tax/fees = 0 chỉ là giả định loại trừ, không phải mức hiện hành. Vì vậy post-tax cash flow Việt Nam chưa được xác định hợp lệ trong W17."
    source_lesson: "Investing/notes/module-4/week-17-bat-dong-san-leverage-rental-yield.md#8-known-uncertain-và-pending"
    tags: ["pending", "tax", "fees", "sources"]
