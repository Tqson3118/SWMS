deck_id: "deck-investing-w02"
subject: "Investing"
lesson_id: "week-02-thi-truong-tai-chinh"
version: "1.0.0"
description: "Bộ thẻ truy xuất kiến thức W02. Nội dung giáo dục, không phải khuyến nghị đầu tư."

cards:
  - id: "fc-investing-w02-001"
    version: "1.0.0"
    concept: "Cổ phiếu"
    front: "Cổ phiếu (stock) xác lập quyền gì?"
    back: "Cổ phiếu là chứng khoán xác lập phần sở hữu trong công ty (equity); cổ phiếu phổ thông thường có quyền biểu quyết và có thể nhận cổ tức. Giá có thể giảm và có thể mất vốn."
    source_lesson: "Investing/notes/module-1/week-02-thi-truong-tai-chinh.md"
    claim_ids: ["W02-C01"]
    tags: ["equity", "asset-classes"]
  - id: "fc-investing-w02-002"
    version: "1.0.0"
    concept: "Trái phiếu"
    front: "Trái phiếu (bond) là gì và cam kết dòng tiền nào?"
    back: "Trái phiếu là chứng khoán nợ (debt security) giống một khoản cho vay: phát hành cam kết trả lãi định kỳ (coupon) và hoàn trả mệnh giá khi đáo hạn; vẫn có rủi ro tín dụng, lãi suất, lạm phát, thanh khoản và thu hồi sớm."
    source_lesson: "Investing/notes/module-1/week-02-thi-truong-tai-chinh.md"
    claim_ids: ["W02-C01"]
    tags: ["bond", "debt"]
  - id: "fc-investing-w02-003"
    version: "1.0.0"
    concept: "Thứ tự thanh lý"
    front: "Khi công ty phá sản và thanh lý tài sản, ai được trả trước?"
    back: "Chủ nợ trái phiếu được trả trước, sau đó đến cổ đông ưu đãi; cổ đông phổ thông nhận phần còn lại, có thể là không."
    source_lesson: "Investing/notes/module-1/week-02-thi-truong-tai-chinh.md"
    claim_ids: ["W02-C01"]
    tags: ["bankruptcy", "equity", "debt"]
  - id: "fc-investing-w02-004"
    version: "1.0.0"
    concept: "Hợp đồng tương lai"
    front: "Hợp đồng tương lai hàng hóa (commodity futures) hoạt động thế nào?"
    back: "Là thỏa thuận mua/bán một lượng hàng hóa xác định tại mức giá và ngày xác định trong tương lai; giao dịch tập trung tại sàn với xóa sổ trung tâm — công ty xóa sổ là một đối tác duy nhất bảo đảm hoàn tất giao dịch."
    source_lesson: "Investing/notes/module-1/week-02-thi-truong-tai-chinh.md"
    claim_ids: ["W02-C02"]
    tags: ["commodities", "futures"]
  - id: "fc-investing-w02-005"
    version: "1.0.0"
    concept: "Tài sản mã hóa"
    front: "Với tài sản mã hóa (crypto asset) cần nhớ điều gì?"
    back: "Được tạo/phát hành/chuyển giao qua blockchain; đặc điểm các loại khác nhau đáng kể nên rủi ro cũng khác nhau; token không mặc nhiên là cổ phần hay khoản nợ; ví lưu khóa riêng (private key) chứ không lưu trực tiếp tài sản."
    source_lesson: "Investing/notes/module-1/week-02-thi-truong-tai-chinh.md"
    claim_ids: ["W02-C02"]
    tags: ["crypto", "digital-assets"]
  - id: "fc-investing-w02-006"
    version: "1.0.0"
    concept: "Khung so sánh tài sản"
    front: "Khi so sánh sản phẩm đầu tư cần cân nhắc những nhóm tiêu chí nào?"
    back: "Năm nhóm: rủi ro–lợi nhuận (mọi đầu tư đều có rủi ro, có thể mất một phần hoặc toàn bộ), phí, đa dạng hóa, thanh khoản và dấu hiệu lừa đảo."
    source_lesson: "Investing/notes/module-1/week-02-thi-truong-tai-chinh.md"
    claim_ids: ["W02-C03"]
    tags: ["framework", "risk"]
  - id: "fc-investing-w02-007"
    version: "1.0.0"
    concept: "Rủi ro thanh khoản"
    front: "Rủi ro thanh khoản (liquidity risk) là gì và nguy hiểm nhất khi nào?"
    back: "Là rủi ro không tìm được thị trường mua/bán chứng khoán khi muốn, khiến không thể chốt vị thế đúng lúc; nguy hiểm nhất khi cần tiền trong thời gian ngắn và buộc phải bán ở mức giá bất lợi."
    source_lesson: "Investing/notes/module-1/week-02-thi-truong-tai-chinh.md"
    claim_ids: ["W02-C03", "W02-C04"]
    tags: ["liquidity", "risk"]
  - id: "fc-investing-w02-008"
    version: "1.0.0"
    concept: "Kỳ vọng vs cam kết"
    front: "Lợi nhuận kỳ vọng khác lợi nhuận cam kết thế nào?"
    back: "Lợi nhuận kỳ vọng là trung bình có trọng số của các kịch bản, không bảo đảm kết quả thực tế; trái phiếu cam kết coupon nhưng có thể vỡ nợ; kết quả thực tế của tài sản rủi ro chỉ là một kịch bản, không phải con số kỳ vọng."
    source_lesson: "Investing/notes/module-1/week-02-thi-truong-tai-chinh.md"
    claim_ids: ["W02-C03", "W02-C04"]
    tags: ["expected-return", "safety"]
