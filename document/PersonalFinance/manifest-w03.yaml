learning_objectives:
- id: LO-PF-W03-01
  bloom_level: Apply
  statement: Thiết lập mục tiêu tài chính cá nhân thỏa mãn đầy đủ 5 tiêu chí của bản diễn giải SMART của
    khóa; chuyển hóa mục tiêu thành dòng tiền phân bổ định kỳ vào bảng dự toán ngân sách hàng tháng.
- id: LO-PF-W03-02
  bloom_level: Analyze
  statement: Phân bổ tiền khả dụng vào ba nhóm trong bài tập tham khảo 50/30/20 được đối chiếu tài liệu
    CFPB; phân loại theo hoàn cảnh và điều chỉnh tỷ lệ khi nghĩa vụ/an toàn yêu cầu.
- id: LO-PF-W03-03
  bloom_level: Analyze
  statement: So sánh cơ chế vận hành, ưu nhược điểm giữa phương pháp Ngân sách 0-đồng (ZBB) và Hệ thống
    6 Chiếc Lọ (Jars System); bác bỏ định kiến sai lầm coi ZBB là tiêu cạn kiệt tài khoản về 0 đồng.
- id: LO-PF-W03-04
  bloom_level: Evaluate
  statement: Phân tích trường hợp Ngân sách không khả thi / Ngân sách sinh tồn khi chi phí thiết yếu vượt
    quá giới hạn lý thuyết; lập phương án cân đối theo giả định case, không áp đặt tỷ lệ quỹ đệm.
- id: LO-PF-W03-05
  bloom_level: Apply
  statement: Điều chỉnh hạn mức ngân sách linh hoạt khi phát sinh biến động thu chi đột xuất bằng Nguyên
    tắc hoán đổi chi tiêu (The Trade-Off Rule) ưu tiên an toàn/nghĩa vụ, rà soát Wants và điều chỉnh Savings/quỹ
    đệm khi cần.
