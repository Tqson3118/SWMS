learning_objectives:
- id: LO-W01-01
  bloom_level: Understand
  statement: Định nghĩa và phân biệt tính duy lý giới hạn với giả định Homo Economicus; giải thích Hệ
    thống 1 và 2.
- id: LO-W01-02
  bloom_level: Analyze
  statement: Phân tích hàm giá trị/điểm tham chiếu và mô tả mất mát định tính trong Prospect Theory1979;
    không yêu cầu hệ số1992 chưa có body.
- id: LO-W01-03
  bloom_level: Analyze
  statement: Bóc tách biểu hiện của Ảo tưởng kiểm soát và Ngụy biện chi phí chìm; áp dụng nguyên lý chi
    phí cơ hội.
- id: LO-W01-04
  bloom_level: Apply
  statement: Thảo luận mental accounting và tính thay thế trong case giả định; tính các phương án theo
    giả định, không bảo đảm phá bỏ thiên kiến.
- id: LO-W01-05
  bloom_level: Evaluate
  statement: Đánh giá rủi ro tư duy bầy đàn, cạm bẫy BNPL và mua sắm bù đắp cảm xúc; áp dụng quy tắc làm
    nguội 48 giờ.
