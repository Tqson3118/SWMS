deck_id: deck-pf-w11
subject: PersonalFinance
lesson_id: week-11-retirement-and-social-insurance
version: 1.1.0
description: 'Bộ thẻ Flashcard chuẩn hóa ôn tập ngắt quãng Tuần 11: Chế độ Hưu trí
  và Bảo hiểm Xã hội (Luật BHXH 41/2024/QH15)'
cards:
- id: fc-pf-w11-001
  concept: Căn cứ pháp luật BHXH mới nhất
  front: Văn bản luật BHXH đang áp dụng thay thế cho Luật BHXH 2014 là văn bản nào,
    có hiệu lực từ ngày nào?
  back: Luật Bảo hiểm xã hội số 41/2024/QH15, được Quốc hội thông qua ngày 29/06/2024
    và chính thức có hiệu lực thi hành từ ngày 01/07/2025.
  source_lesson: PersonalFinance/notes/module-4/week-11-retirement-and-social-insurance.md
  version: 1.0.0
  tags:
  - law-41-2024
  - social-security
  - module-3
- id: fc-pf-w11-002
  concept: Điều kiện thời gian đóng BHXH tối thiểu
  front: Theo Điều 64 Luật BHXH 41/2024/QH15, thời gian đóng BHXH tối thiểu để được
    hưởng lương hưu hàng tháng đã giảm xuống bao nhiêu năm?
  back: Giảm từ 20 năm xuống còn ĐỦ 15 NĂM đóng BHXH (khi người lao động đạt độ tuổi
    nghỉ hưu theo quy định), mở ra cơ hội nhận lương hưu cho người tham gia muộn.
  source_lesson: PersonalFinance/notes/module-4/week-11-retirement-and-social-insurance.md
  version: 1.0.0
  tags:
  - article-64
  - eligibility
  - module-3
- id: fc-pf-w11-003
  concept: Lộ trình tuổi nghỉ hưu theo BLLĐ 2019
  front: Độ tuổi nghỉ hưu trong điều kiện bình thường của lao động nam và lao động
    nữ đạt mức cố định tối đa là bao nhiêu và vào năm nào?
  back: 'Lao động nam: Đạt 62 tuổi vào năm 2028 (mỗi năm tăng 3 tháng). Lao động nữ:
    Đạt 60 tuổi vào năm 2035 (mỗi năm tăng 4 tháng).'
  source_lesson: PersonalFinance/notes/module-4/week-11-retirement-and-social-insurance.md
  version: 1.0.0
  tags:
  - retirement-age
  - labor-code-2019
  - module-3
- id: fc-pf-w11-004
  concept: Công thức tỷ lệ hưởng lương hưu lao động nữ
  front: Theo Điều 66 Luật BHXH 41/2024, tỷ lệ hưởng lương hưu của lao động nữ được
    tính như thế nào?
  back: Đóng đủ 15 năm hưởng 45%; sau đó mỗi năm đóng thêm cộng 2%; tỷ lệ hưởng tối
    đa bằng 75% (đạt được khi đóng đủ 30 năm).
  source_lesson: PersonalFinance/notes/module-4/week-11-retirement-and-social-insurance.md
  version: 1.0.0
  tags:
  - female-pension
  - article-66
  - module-3
- id: fc-pf-w11-005
  concept: Công thức tỷ lệ hưởng lương hưu lao động nam
  front: Theo Điều 66 Luật BHXH 41/2024, tỷ lệ hưởng lương hưu của lao động nam được
    tính như thế nào?
  back: Đóng đủ 20 năm hưởng 45%; sau đó mỗi năm đóng thêm cộng 2%; tối đa 75% (đạt
    được khi đóng đủ 35 năm). Đóng từ 15 đến dưới 20 năm hưởng 40% cho 15 năm đầu,
    mỗi năm tiếp cộng 1%.
  source_lesson: PersonalFinance/notes/module-4/week-11-retirement-and-social-insurance.md
  version: 1.0.0
  tags:
  - male-pension
  - article-66
  - module-3
- id: fc-pf-w11-006
  concept: Quyền lợi BHYT hưu trí trọn đời
  front: Người hưởng lương hưu hàng tháng được quỹ BHXH bảo đảm quyền lợi khám chữa
    bệnh BHYT như thế nào?
  back: Được cấp thẻ BHYT miễn phí trọn đời (quỹ BHXH đóng) với mức hưởng thanh toán
    chi phí khám chữa bệnh đúng tuyến lên tới 95% (người bệnh chỉ đồng chi trả 5%).
  source_lesson: PersonalFinance/notes/module-4/week-11-retirement-and-social-insurance.md
  version: 1.0.0
  tags:
  - bhyt-pension
  - healthcare-perks
  - module-3
- id: fc-pf-w11-007
  concept: Điều chỉnh lương hưu định kỳ
  front: Theo Điều 67 Luật BHXH 41/2024, lương hưu được Nhà nước điều chỉnh dựa trên
    những tiêu chí nào?
  back: Được điều chỉnh định kỳ trên cơ sở mức tăng của chỉ số giá tiêu dùng CPI và
    tăng trưởng kinh tế phù hợp với ngân sách nhà nước và quỹ BHXH để bảo toàn sức
    mua.
  source_lesson: PersonalFinance/notes/module-4/week-11-retirement-and-social-insurance.md
  version: 1.0.0
  tags:
  - pension-adjustment
  - article-67
  - module-3
- id: fc-pf-w11-008
  concept: Mức đóng quỹ Hưu trí - Tử tuất bắt buộc
  front: Tỷ lệ trích đóng vào Quỹ Hưu trí và Tử tuất của người lao động và người sử
    dụng lao động là bao nhiêu?
  back: Người lao động đóng 8%; Người sử dụng lao động đóng 14% trên mức tiền lương
    tháng đóng bảo hiểm xã hội (tổng cộng 22% vào quỹ hưu trí - tử tuất).
  source_lesson: PersonalFinance/notes/module-4/week-11-retirement-and-social-insurance.md
  version: 1.0.0
  tags:
  - contribution-rate
  - pension-fund
  - module-3
- id: fc-pf-w11-009
  concept: Trợ cấp một lần khi nghỉ hưu (Điều 68)
  front: Người lao động có thời gian đóng BHXH cao hơn số năm tương ứng với tỷ lệ
    hưởng 75% được hưởng quyền lợi gì?
  back: 'Được hưởng trợ cấp một lần khi nghỉ hưu: mỗi năm đóng thừa được tính bằng
    0.5 lần mức bình quân tiền lương tháng đóng BHXH cho các năm trước tuổi nghỉ hưu
    (hoặc 2 lần nếu đóng sau tuổi nghỉ hưu).'
  source_lesson: PersonalFinance/notes/module-4/week-11-retirement-and-social-insurance.md
  version: 1.0.0
  tags:
  - lump-sum-allowance
  - article-68
  - module-3
- id: fc-pf-w11-010
  concept: "Đánh giá lựa chọn BHXH"
  front: "Có thể kết luận mọi lựa chọn rút một lần đều là ngụy biện chi phí chìm không?"
  back: "Không. Phải phân tích lý do, nghĩa vụ pháp lý, quyền lợi tích lũy và phương án tương lai. Không gán thiên kiến chỉ từ hành vi rút hoặc tiếp tục."
  source_lesson: PersonalFinance/notes/module-4/week-11-retirement-and-social-insurance.md#sai-lầm-cognitive-biases
  version: 1.1.0
  tags: [w11, revised-content, review-required]
- id: fc-pf-w11-011
  concept: BHXH Tự nguyện (Voluntary Social Insurance)
  front: Ai được tham gia BHXH tự nguyện và mức đóng hàng tháng được quy định như
    thế nào; từ 01/07/2025 có thêm quyền lợi thai sản nào?
  back: Công dân Việt Nam từ đủ 15 tuổi không thuộc diện BHXH bắt buộc; mức đóng bằng
    22% mức thu nhập tháng do cá nhân tự chọn (trong khung sàn chuẩn nghèo nông thôn
    đến trần quy định). Từ 01/07/2025, nếu có ít nhất 06 tháng đóng trong 12 tháng
    trước khi sinh, người tham gia đủ điều kiện được trợ cấp thai sản 2.000.000 đồng
    cho mỗi con theo Điều 4 khoản 3, Điều 94 khoản 1 và Điều 95 Luật BHXH 41/2024;
    đây là trợ cấp riêng, không phải chế độ thai sản bắt buộc theo tiền lương.
  source_lesson: PersonalFinance/notes/module-4/week-11-retirement-and-social-insurance.md
  version: 1.0.0
  tags:
  - voluntary-insurance
  - informal-sector
  - module-3
- id: fc-pf-w11-012
  concept: Chế độ Hưu trí Bổ sung Tự nguyện
  front: Hưu trí bổ sung tự nguyện (Voluntary Supplementary Pension) là gì trong hệ
    thống an sinh đa tầng?
  back: Là chính sách bảo hiểm hưu trí theo nguyên tắc thị trường do các công ty quản
    lý quỹ vận hành, giúp người lao động và doanh nghiệp tích lũy thêm thu nhập ngoài
    lương hưu BHXH.
  source_lesson: PersonalFinance/notes/module-4/week-11-retirement-and-social-insurance.md
  version: 1.0.0
  tags:
  - supplementary-pension
  - pillar-3
  - module-3
- id: fc-pf-w11-013
  concept: Mức bình quân tiền lương tháng đóng BHXH khu vực tư nhân
  front: Theo Điều 72 Luật BHXH 41/2024, tiền lương làm căn cứ tính lương hưu của
    lao động khối doanh nghiệp ngoài nhà nước tính ra sao?
  back: Tính bình quân tiền lương tháng đóng BHXH của TOÀN BỘ thời gian đóng, có điều
    chỉnh tiền lương các năm cũ theo hệ số trượt giá CPI do Bộ LĐ-TB&XH công bố hàng
    năm.
  source_lesson: PersonalFinance/notes/module-4/week-11-retirement-and-social-insurance.md
  version: 1.0.0
  tags:
  - wage-average
  - article-72
  - module-3
- id: fc-pf-w11-014
  concept: "Giới hạn quy tắc 4%"
  front: "Quy tắc 4% có bảo đảm kế hoạch hưu trí cá nhân ở Việt Nam không?"
  back: "Không. W07 trình bày mô hình rút năm đầu 4% tài sản ban đầu rồi điều chỉnh theo lạm phát như heuristic lịch sử, không phải bảo đảm cho mọi thị trường/thời hạn."
  source_lesson: PersonalFinance/notes/module-3/week-07-compound-interest-fire.md#3-fire-financial-independence-retire-early
  version: 1.1.0
  tags: [w11, revised-content, review-required]
- id: fc-pf-w11-015
  concept: "Phối hợp nguồn hưu trí"
  front: "Worksheet yêu cầu phối hợp BHXH với kế hoạch cá nhân thế nào?"
  back: "Ước tính lương hưu theo điều kiện được dạy, đối chiếu chi tiêu mục tiêu và khoảng trống tài chính, rồi lập kịch bản tiết kiệm bổ sung. Không coi một mô hình ba tầng là chuẩn chung của mọi quốc gia."
  source_lesson: PersonalFinance/notes/module-4/week-11-retirement-and-social-insurance.md#sai-lầm-cognitive-biases
  version: 1.1.0
  tags: [w11, revised-content, review-required]
