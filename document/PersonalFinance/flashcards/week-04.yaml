description: 'Bộ thẻ Flashcard chuẩn hóa ôn tập ngắt quãng Tuần 04: Quỹ khẩn cấp và
  Quản trị thanh khoản'
cards:
- id: fc-pf-w04-001
  concept: Quỹ khẩn cấp (Emergency Fund)
  front: Quỹ khẩn cấp là gì và mục đích cốt lõi trong an toàn tài chính cá nhân là
    gì?
  back: Là khoản tiền được dự trữ riêng biệt và có khả năng truy cập phù hợp, dùng
    cho các biến cố bất ngờ (mất việc, tai nạn, ốm đau). Khoản dự phòng có thể giúp
    giảm nhu cầu vay hoặc bán tài sản trong lúc chịu áp lực; không bảo đảm loại bỏ
    mọi rủi ro hay thay thế đánh giá hoàn cảnh cá nhân.
  source_lesson: PersonalFinance/notes/module-2/week-04-quy-khan-cap.md
  version: 1.0.0
  claim_ids:
    - "M2-C01"
  tags:
  - emergency-fund
  - foundations
  - module-2
- id: fc-pf-w04-002
  concept: Khung minh họa về quy mô quỹ khẩn cấp
  front: Trong các kịch bản minh họa của bài, mốc tham khảo cho người có thu nhập ổn định và người
    làm tự do (freelancer) được diễn đạt theo khoảng tháng chi phí nào?
  back: 'Đây là giả định lập kế hoạch minh họa, không phải ngưỡng bắt buộc hay mức sàn đã được nguồn chính thức xác nhận: có thể dùng 3–6 hoặc 6–12 tháng để kiểm tra kịch bản tùy dòng tiền, người phụ thuộc, bảo hiểm và nguồn hỗ trợ.'
  source_lesson: PersonalFinance/notes/module-2/week-04-quy-khan-cap.md
  version: 1.0.0
  claim_ids:
    - "M2-C02"
  tags:
  - emergency-fund
  - planning
  - module-2
- id: fc-pf-w04-003
  concept: Chi phí thiết yếu (Essential Expenses)
  front: Khoản mục nào được tính vào chi phí thiết yếu để xác định quy mô quỹ khẩn
    cấp?
  back: 'Gồm các khoản thiết yếu được bài liệt kê: tiền thuê nhà/trả góp, điện nước/internet,
    thực phẩm, bảo hiểm, đi lại, trả nợ tối thiểu và thuốc men/chăm sóc thiết yếu; không
    tự gắn nhãn Tầng 1/Tầng 2 hay coi mọi khoản ngoài danh sách là xa xỉ.'
  source_lesson: PersonalFinance/notes/module-2/week-04-quy-khan-cap.md
  version: 1.0.0
  claim_ids:
    - "M2-C01"
  tags:
  - budgeting
  - emergency-fund
  - module-2
- id: fc-pf-w04-004
  concept: Địa điểm lưu giữ quỹ khẩn cấp
  front: Khi chọn nơi giữ quỹ khẩn cấp, cần kiểm tra những điều kiện sản phẩm nào để
    cân bằng khả năng truy cập và an toàn?
  back: 'Giữ ở nơi an toàn và truy cập phù hợp, sau khi kiểm tra điều kiện đúng sản phẩm. Tài khoản ngân hàng, công cụ ngắn hạn và ví điện tử có thể có quyền rút, giới hạn, phí và cơ chế bảo vệ khác nhau; không mặc định ví điện tử tương đương tiền gửi được bảo hiểm.'
  source_lesson: PersonalFinance/notes/module-2/week-04-quy-khan-cap.md
  version: 1.0.0
  claim_ids:
    - "M2-C01"
  tags:
  - liquidity
  - savings
  - module-2
- id: fc-pf-w04-005
  concept: Bẫy tâm lý tiêu nhầm quỹ khẩn cấp
  front: Làm thế nào để tránh việc rút tiền từ quỹ khẩn cấp cho các mục đích chi tiêu
    không cấp bách?
  back: 'Ghi rõ tiêu chí trước khi rút: khoản chi có bất ngờ không, có thực sự khẩn cấp
    không, và có cần thiết cho sức khỏe hoặc sinh hoạt thiết yếu không. Ghi lại giả
    định, số tiền và kế hoạch bổ sung trong worksheet; không bắt buộc phải dùng một
    loại tài khoản hay tính năng ngân hàng cụ thể.'
  source_lesson: PersonalFinance/notes/module-2/week-04-quy-khan-cap.md
  version: 1.0.0
  claim_ids:
    - "M2-C01"
    - "M2-C13"
  tags:
  - behavioral-finance
  - emergency-fund
  - module-2
- id: fc-pf-w04-006
  concept: Cơ chế tái nạp quỹ khẩn cấp
  front: Sau khi đã phải sử dụng một phần quỹ khẩn cấp, thứ tự ưu tiên dòng tiền tiếp
    theo nên như thế nào?
  back: Sau khi dùng quỹ, rà soát lại mục tiêu và lập kế hoạch bổ sung theo dòng tiền; tạm ưu tiên tái nạp trước chi tiêu tùy ý có thể là một lựa chọn, không phải thứ tự bắt buộc cho mọi hoàn cảnh.
  source_lesson: PersonalFinance/notes/module-2/week-04-quy-khan-cap.md
  version: 1.0.0
  claim_ids:
    - "M2-C01"
  tags:
  - cashflow
  - recovery
  - module-2
- id: fc-pf-w04-007
  concept: Chi phí cơ hội khi giữ quỹ khẩn cấp
  front: Khi cân nhắc giữ quỹ khẩn cấp ở nơi an toàn, cần xem xét chi phí cơ hội cùng
    những yếu tố nào?
  back: Cần cân nhắc phương án tốt nhất bị bỏ qua cùng thanh khoản, rủi ro, phí, thuế
    và dòng tiền. Không suy ra rằng tiền vượt một mốc cố định phải tự động chuyển vào
    cổ phiếu hay bất động sản.
  source_lesson: PersonalFinance/notes/module-2/week-04-quy-khan-cap.md
  version: 1.0.0
  claim_ids:
    - "M2-C14"
  tags:
  - opportunity-cost
  - liquidity
  - module-2
- id: fc-pf-w04-008
  concept: Quỹ khẩn cấp và rủi ro dựa vào nợ
  front: Vì sao một khoản quỹ khẩn cấp có thể giúp giảm việc phải dựa vào nợ khi có
    cú sốc tài chính?
  back: Quỹ dành cho khoản chi bất ngờ có thể giúp giảm nhu cầu dùng thẻ hoặc vay,
    vốn có thể phát sinh lãi và phí. Mức dự phòng và lựa chọn cụ thể vẫn phụ thuộc
    dòng tiền, hoàn cảnh và điều khoản của từng sản phẩm.
  source_lesson: PersonalFinance/notes/module-2/week-04-quy-khan-cap.md
  version: 1.0.0
  claim_ids:
    - "M2-C01"
  tags:
  - debt
  - emergency-fund
  - module-2
- id: fc-pf-w04-009
  concept: Kiểm tra điều kiện rút của nơi giữ quỹ
  front: Khi chọn nơi giữ phần quỹ chưa cần dùng ngay, cần kiểm tra những điều kiện
    nào trước khi sử dụng?
  back: Kiểm tra quyền truy cập, kỳ hạn, quyền rút sớm, lãi, phí và các điều kiện
    khác của đúng sản phẩm. Đây là bước đánh giá theo hoàn cảnh, không phải công thức
    chung hay phương pháp bắt buộc.
  source_lesson: PersonalFinance/notes/module-2/week-04-quy-khan-cap.md
  version: 1.0.0
  claim_ids:
    - "M2-C01"
  tags:
  - liquidity
  - product-conditions
  - module-2
- id: fc-pf-w04-010
  concept: Phân biệt quỹ khẩn cấp và mục tiêu tích lũy khác
  front: Quỹ khẩn cấp khác mục tiêu tiết kiệm hoặc đầu tư dài hạn ở điểm nào?
  back: Quỹ khẩn cấp dành cho chi phí bất ngờ và nhu cầu thanh khoản; mục tiêu dài hạn
    được lên kế hoạch theo thời hạn khác. Khi so sánh, cần xét phương án tốt nhất bị bỏ
    qua, rủi ro, phí và dòng tiền; không mặc định quỹ phải chuyển sang tài sản biến động.
  source_lesson: PersonalFinance/notes/module-2/week-04-quy-khan-cap.md
  version: 1.0.0
  claim_ids:
    - "M2-C14"
  tags:
  - strategy
  - allocation
  - module-2
- id: fc-pf-w04-011
  concept: Ví dụ về lúc cân nhắc dùng quỹ khẩn cấp
  front: Những ví dụ nào có thể khiến bạn cân nhắc dùng quỹ khẩn cấp, sau khi áp dụng
    tiêu chí phù hợp với hoàn cảnh của mình?
  back: Ví dụ gồm mất việc đột ngột, tai nạn hoặc bệnh tật cần chi phí y tế, xe hỏng
    cần sửa để đi làm, hoặc hỏng hóc nghiêm trọng đồ gia dụng thiết yếu. Đây là ví dụ
    minh họa, không phải danh sách đóng hay quy tắc pháp lý; hãy đặt và rà soát tiêu
    chí bất ngờ, cần thiết và cấp bách theo hoàn cảnh của bạn.
  source_lesson: PersonalFinance/notes/module-2/week-04-quy-khan-cap.md
  version: 1.0.0
  claim_ids:
    - "M2-C01"
  tags:
  - risk-management
  - rules
  - module-2
- id: fc-pf-w04-012
  concept: Chi phí cơ hội khi giữ quỹ khẩn cấp
  front: Chi phí cơ hội khi giữ quỹ khẩn cấp ở nơi an toàn và dễ truy cập là gì?
  back: Giữ quỹ ở nơi an toàn có thể bỏ qua lợi ích của phương án tốt nhất kế tiếp; đó là
    chi phí cơ hội cần cân nhắc cùng thanh khoản, rủi ro, phí, thuế và dòng tiền. Quỹ có thể giúp
    giảm áp lực phải bán tài sản biến động khi gặp cú sốc, nhưng không bảo đảm sẽ không bao
    giờ phải bán hoặc bán đúng một mức giá nào.
  source_lesson: PersonalFinance/notes/module-2/week-04-quy-khan-cap.md
  version: 1.0.0
  claim_ids:
    - "M2-C14"
  tags:
  - opportunity-cost
  - planning
  - module-2
- id: fc-pf-w04-013
  concept: Khoản trả nợ tối thiểu trong chi phí thiết yếu
  front: Khi tính chi phí thiết yếu để lập mục tiêu quỹ, khoản trả nợ tối thiểu được
    xử lý thế nào?
  back: Khoản trả nợ tối thiểu có thể được đưa vào chi phí thiết yếu của worksheet;
    hãy ghi rõ giả định và hoàn cảnh của mình thay vì áp dụng một mức quỹ hoặc thứ tự
    trả nợ chung cho mọi người.
  source_lesson: PersonalFinance/notes/module-2/week-04-quy-khan-cap.md
  version: 1.0.0
  claim_ids:
    - "M2-C01"
  tags:
  - budgeting
  - emergency-fund
  - module-2
- id: fc-pf-w04-014
  concept: Rà soát quy mô quỹ khẩn cấp định kỳ
  front: Khi nào cần tính toán lại quy mô số tiền của quỹ khẩn cấp?
  back: Khi thu nhập, chi phí thiết yếu, người phụ thuộc, công việc hoặc nguồn dự phòng
    thay đổi đáng kể, hãy rà soát lại giả định và mục tiêu. Cũng nên kiểm tra định kỳ
    để cập nhật kế hoạch theo hoàn cảnh thực tế.
  source_lesson: PersonalFinance/notes/module-2/week-04-quy-khan-cap.md
  version: 1.0.0
  claim_ids:
    - "M2-C01"
  tags:
  - review
  - planning
  - module-2
- id: fc-pf-w04-015
  concept: Tự động hóa tích lũy quỹ khẩn cấp
  front: Tự động hóa tích lũy quỹ khẩn cấp có thể thực hiện như thế nào?
  back: Có thể cài đặt chuyển tự động vào thời điểm phù hợp với dòng tiền; số tiền và ngày chuyển nên được điều chỉnh theo thu nhập, hóa đơn và mục tiêu.
  source_lesson: PersonalFinance/notes/module-2/week-04-quy-khan-cap.md
  version: 1.0.0
  claim_ids:
    - "M2-C01"
  tags:
  - automation
  - habits
  - module-2

- id: fc-pf-w04-016
  concept: Thiên kiến hiện tại (Present Bias)
  front: Thiên kiến hiện tại trong bài W04 mô tả xu hướng nào khi cân nhắc tiết kiệm cho quỹ khẩn cấp?
  back: Ưu tiên thỏa mãn ngay lập tức hơn lợi ích tiết kiệm cho tương lai; W04 dùng khái niệm này để nhận diện trì hoãn tiết kiệm, không chẩn đoán hay khẳng định hiệu quả can thiệp cho từng người.
  source_lesson: PersonalFinance/notes/module-2/week-04-quy-khan-cap.md
  version: 1.0.0
  claim_ids:
    - "M2-C12"
  tags:
    - behavioral-finance
    - present-bias
    - module-2

- id: fc-pf-w04-017
  concept: Hiệu ứng tâm lý tài khoản (Mental Accounting)
  front: Mental Accounting trong bài W04 giải thích cách nào con người có thể phân loại tiền?
  back: Con người có thể phân loại và đánh giá tiền theo các “tài khoản” tinh thần khác nhau; W04 dùng đây như lời nhắc kiểm tra tiêu chí rút quỹ, không khẳng định quỹ sẽ bị rút hay hành vi xảy ra với mọi người.
  source_lesson: PersonalFinance/notes/module-2/week-04-quy-khan-cap.md
  version: 1.0.0
  claim_ids:
    - "M2-C13"
  tags:
    - behavioral-finance
    - mental-accounting
    - module-2
