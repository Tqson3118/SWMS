deck_id: deck-pf-w10
subject: PersonalFinance
lesson_id: week-10-life-stage-planning
version: 1.0.0
description: 'Bộ thẻ Flashcard chuẩn hóa ôn tập ngắt quãng Tuần 10: Hoạch định Tài
  chính theo Vòng đời và Phân bổ Tài sản'
cards:
- id: fc-pf-w10-001
  concept: Mô hình Vòng đời Tài chính (Financial Lifecycle)
  front: Ba giai đoạn tài chính chính trong cuộc đời một con người gồm những giai
    đoạn nào?
  back: 1. Giai đoạn Tích lũy tài sản (20-45 tuổi); 2. Giai đoạn Bảo toàn và Củng
    cố tài sản (45-60 tuổi); 3. Giai đoạn Phân phối và Chuyển giao di sản (Sau 60
    tuổi).
  source_lesson: PersonalFinance/notes/module-4/week-10-life-stage-planning.md
  version: 1.0.0
  tags:
  - lifecycle
  - stages
  - module-3
- id: fc-pf-w10-002
  concept: Bản chất quy tắc 100 trừ tuổi
  front: Quy tắc '100 trừ tuổi' trong phân bổ tài sản là gì và tại sao chỉ được xem
    là Heuristic có điều kiện?
  back: 'Quy tắc gợi ý: Tỷ lệ cổ phiếu = (100 - Tuổi)%. Đây là đường tắt tư duy tham
    khảo cổ điển, KHÔNG áp dụng máy móc vì cần xét năng lực chịu rủi ro, quy mô tài
    sản và các mục tiêu cụ thể.'
  source_lesson: PersonalFinance/notes/module-4/week-10-life-stage-planning.md
  version: 1.0.0
  tags:
  - rule-100-minus-age
  - heuristic
  - module-3
- id: fc-pf-w10-003
  concept: Suitability Checklist cho quy tắc 100 trừ tuổi
  front: Những điều kiện nào cho thấy người học phù hợp hoặc không phù hợp để áp dụng
    quy tắc '100 trừ tuổi'?
  back: 'Phù hợp: Thu nhập ổn định, tâm lý vững, chân trời đầu tư chuẩn. Không phù
    hợp: Thu nhập bấp bênh, đang nợ nhiều, tâm lý hoảng loạn khi thị trường giảm,
    hoặc tuổi cao nhưng tài sản rất lớn.'
  source_lesson: PersonalFinance/notes/module-4/week-10-life-stage-planning.md
  version: 1.0.0
  tags:
  - suitability-checklist
  - risk-assessment
  - module-3
- id: fc-pf-w10-004
  concept: Khái niệm Đường bay Tài sản (Glide Path)
  front: Chiến lược Glide Path trong các quỹ hưu trí niên hạn mục tiêu (Target-Date
    Funds) vận hành ra sao?
  back: Tự động điều chỉnh tỷ trọng tài sản từ rủi ro cao (nhiều cổ phiếu) khi còn
    trẻ sang phòng thủ an toàn (nhiều trái phiếu và tiền mặt) một cách mượt mà khi
    người học tiến dần đến tuổi nghỉ hưu.
  source_lesson: PersonalFinance/notes/module-4/week-10-life-stage-planning.md
  version: 1.0.0
  tags:
  - glide-path
  - target-date
  - module-3
- id: fc-pf-w10-005
  concept: Vốn con người (Human Capital) vs Vốn tài chính (Financial Capital)
  front: Mối quan hệ chuyển hóa giữa Vốn con người và Vốn tài chính theo thời gian
    là gì?
  back: Khi còn trẻ, vốn con người (khả năng kiếm thu nhập tương lai) ở mức cao nhất
    trong khi vốn tài chính thấp; theo năm tháng, vốn con người được chuyển hóa thành
    vốn tài chính thông qua tiết kiệm và đầu tư.
  source_lesson: PersonalFinance/notes/module-4/week-10-life-stage-planning.md
  version: 1.0.0
  tags:
  - human-capital
  - financial-capital
  - module-3
- id: fc-pf-w10-006
  concept: Giai đoạn Tích lũy (Tuổi 20–35)
  front: Ưu tiên tài chính số 1 của người trẻ trong giai đoạn khởi nghiệp và lập nghiệp
    là gì?
  back: Đầu tư nâng cao kỹ năng chuyên môn gia tăng thu nhập, xây dựng kỷ luật ngân
    sách, kiểm soát nợ xấu và duy trì tỷ trọng đầu tư cổ phiếu/chứng chỉ quỹ cao để
    tận dụng chân trời dài.
  source_lesson: PersonalFinance/notes/module-4/week-10-life-stage-planning.md
  version: 1.0.0
  tags:
  - accumulation
  - early-career
  - module-3
- id: fc-pf-w10-007
  concept: Giai đoạn Xây dựng Gia đình (Tuổi 30–45)
  front: Thách thức tài chính lớn nhất trong giai đoạn kết hôn và nuôi con nhỏ là
    gì?
  back: 'Gánh nặng chi phí kép: mua nhà trả góp, chi phí nuôi dạy con cái, chi phí
    chăm sóc sức khỏe gia tăng; đòi hỏi phải trang bị đầy đủ bảo hiểm nhân thọ trụ
    cột và cân bằng dòng tiền trả nợ.'
  source_lesson: PersonalFinance/notes/module-4/week-10-life-stage-planning.md
  version: 1.0.0
  tags:
  - family-planning
  - cashflow-pressure
  - module-3
- id: fc-pf-w10-008
  concept: Giai đoạn Tiền Hưu trí (Tuổi 45–60)
  front: Chiến lược bảo toàn danh mục tài sản cần thay đổi như thế nào trong giai
    đoạn tiền hưu trí?
  back: Giảm bớt đòn bẩy tài chính về 0, chuyển dần tỷ trọng từ cổ phiếu biến động
    mạnh sang trái phiếu và tài sản tạo dòng tiền ổn định để bảo vệ thành quả trước
    nguy cơ suy thoái thị trường.
  source_lesson: PersonalFinance/notes/module-4/week-10-life-stage-planning.md
  version: 1.0.0
  tags:
  - pre-retirement
  - wealth-preservation
  - module-3
- id: fc-pf-w10-009
  concept: Giai đoạn Nghỉ hưu (Sau 60 tuổi)
  front: Mục tiêu quản trị tài sản cốt lõi khi bước vào tuổi hưu trí là gì?
  back: Bảo đảm dòng tiền chi tiêu hàng tháng không bị gián đoạn, bảo toàn sức mua
    chống lạm phát và dự phòng chi phí y tế dài hạn (Long-term Care) mà không làm
    cạn kiệt vốn gốc quá sớm.
  source_lesson: PersonalFinance/notes/module-4/week-10-life-stage-planning.md
  version: 1.0.0
  tags:
  - retirement
  - decumulation
  - module-3
- id: fc-pf-w10-010
  concept: Khảo sát Đánh giá Mức độ Chấp nhận Rủi ro
  front: Phân biệt Năng lực chịu rủi ro (Risk Capacity) và Khẩu vị rủi ro (Risk Tolerance)?
  back: Risk Capacity là khả năng tài chính thực tế để gánh chịu thua lỗ (đo bằng
    tài sản ròng, thời gian); Risk Tolerance là cảm xúc tâm lý cá nhân trước sự biến
    động (khả năng ngủ ngon khi thị trường giảm).
  source_lesson: PersonalFinance/notes/module-4/week-10-life-stage-planning.md
  version: 1.0.0
  tags:
  - risk-capacity
  - risk-tolerance
  - module-3
- id: fc-pf-w10-011
  concept: Rủi ro Thứ tự Lợi nhuận (Sequence of Returns Risk)
  front: Tại sao việc thị trường giảm điểm mạnh trong những năm đầu nghỉ hưu lại đặc
    biệt nguy hiểm?
  back: Vì người về hưu phải bán tài sản ở vùng giá đáy để rút tiền sinh hoạt hàng
    ngày, khiến quy mô vốn gốc bị suy giảm vĩnh viễn và không còn cơ hội phục hồi
    theo thị trường sau đó.
  source_lesson: PersonalFinance/notes/module-4/week-10-life-stage-planning.md
  version: 1.0.0
  tags:
  - sequence-risk
  - retirement-hazard
  - module-3
- id: fc-pf-w10-012
  concept: Kế hoạch Mua nhà vs Thuê nhà theo vòng đời
  front: Yếu tố quyết định nên mua nhà trả góp hay tiếp tục thuê nhà ở độ tuổi dưới
    30 là gì?
  back: Mức độ ổn định công việc và nơi định cư dài hạn, tỷ lệ trả nợ trên thu nhập,
    và chi phí cơ hội của khoản vốn đặt cọc nếu được đem đi đầu tư sinh lời cao hơn
    lãi suất vay.
  source_lesson: PersonalFinance/notes/module-4/week-10-life-stage-planning.md
  version: 1.0.0
  tags:
  - rent-vs-buy
  - housing
  - module-3
- id: fc-pf-w10-013
  concept: Quỹ Giáo dục tương lai cho con cái
  front: Cách thức lập kế hoạch tích lũy chi phí đại học cho con từ khi con mới sinh
    ra?
  back: Xác định mục tiêu học phí ước tính (kèm lạm phát giáo dục ~8%/năm), trích
    dòng tiền định kỳ DCA vào quỹ mở cổ phiếu trong 10-15 năm đầu, và chuyển về tiền
    gửi an toàn 3 năm trước ngày nhập học.
  source_lesson: PersonalFinance/notes/module-4/week-10-life-stage-planning.md
  version: 1.0.0
  tags:
  - education-fund
  - college-planning
  - module-3
- id: fc-pf-w10-014
  concept: Kế hoạch Chuyển giao Di sản (Estate Planning)
  front: Mục tiêu của việc lập di chúc và kế hoạch tài chính thừa kế từ sớm là gì?
  back: Bảo đảm tài sản được phân chia đúng ý nguyện, tránh tranh chấp nội bộ gia
    đình, và tối ưu hóa các thủ tục pháp lý, nghĩa vụ tài chính liên quan đến thừa
    kế.
  source_lesson: PersonalFinance/notes/module-4/week-10-life-stage-planning.md
  version: 1.0.0
  tags:
  - estate-planning
  - legacy
  - module-3
- id: fc-pf-w10-015
  concept: Tái cân bằng danh mục theo tuổi tác
  front: Tần suất và tiêu chí tái cân bằng tỷ trọng tài sản danh mục vòng đời nên
    thực hiện ra sao?
  back: Định kỳ 6 tháng hoặc 1 năm một lần, hoặc khi một lớp tài sản biến động lệch
    quá ngưỡng ±5% so với tỷ trọng mục tiêu, kết hợp điều chỉnh tỷ trọng hàng năm
    phù hợp với tuổi mới.
  source_lesson: PersonalFinance/notes/module-4/week-10-life-stage-planning.md
  version: 1.0.0
  tags:
  - rebalancing
  - lifecycle
  - module-3
