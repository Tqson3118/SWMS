  Cá nhân và Tối ưu Nghĩa vụ Thuế tại Việt Nam'
cards:
- id: fc-pf-w09-001
  concept: Phân biệt Thu nhập chịu thuế và Thu nhập tính thuế
  front: Công thức tính Thu nhập tính thuế (TNTT) từ tiền lương, tiền công tại Việt
    Nam là gì?
  back: Thu nhập tính thuế (TNTT) từ tiền lương, tiền công = tổng thu nhập chịu thuế
    trong kỳ - các khoản được trừ theo luật, gồm bảo hiểm đủ điều kiện, giảm trừ gia
    cảnh, đóng góp từ thiện/nhân đạo và các khoản giảm trừ khác đủ điều kiện; sau đó
    áp dụng biểu thuế lũy tiến từng phần. Không coi mọi khoản chi cá nhân là khoản
    giảm trừ.
  source_lesson: PersonalFinance/notes/module-3/week-09-personal-income-tax-vn.md
  version: 1.0.0
  claim_ids:
  - M3-C16
  tags:
  - pit
  - tax-formula
  - module-3
- id: fc-pf-w09-002
  concept: Mức giảm trừ gia cảnh hiện hành
  front: Mức giảm trừ gia cảnh cho bản thân người nộp thuế và người phụ thuộc theo
    kỳ tính thuế năm 2026 là bao nhiêu?
  back: 'Kỳ tính thuế năm 2026: bản thân người nộp thuế 15.500.000 đ/tháng (186 triệu/năm); mỗi người phụ thuộc 6.200.000 đ/tháng (74,4 triệu/năm), theo Nghị quyết 110/2025/UBTVQH15. Mức 11 triệu/4,4 triệu theo Nghị quyết 954/2020/UBTVQH14 chỉ là lịch sử đến hết năm 2025.'
  source_lesson: PersonalFinance/notes/module-3/week-09-personal-income-tax-vn.md
  version: 1.0.0
  claim_ids:
  - M3-C08
  tags:
  - tax-deductions
  - regulations
  - module-3
- id: fc-pf-w09-003
  concept: Biểu thuế lũy tiến từng phần
  front: Biểu thuế thu nhập cá nhân từ tiền lương, tiền công của cá nhân cư trú trong
    kỳ tính thuế năm 2026 gồm mấy bậc và mức thuế suất cao nhất là bao nhiêu?
  back: 'Gồm 5 bậc: 5% đến 10 triệu; 10% trên 10–30 triệu; 20% trên 30–60 triệu; 30% trên 60–100 triệu; 35% trên 100 triệu đồng/tháng. Biểu 7 bậc là quy định lịch sử trước kỳ tính thuế 2026.'
  source_lesson: PersonalFinance/notes/module-3/week-09-personal-income-tax-vn.md
  version: 1.0.0
  claim_ids:
  - M3-C07
  tags:
  - tax-brackets
  - progressive-tax
  - module-3
- id: fc-pf-w09-004
  concept: Các khoản bảo hiểm trừ trước thuế
  front: Tỷ lệ đóng bảo hiểm bắt buộc được khấu trừ trực tiếp khỏi thu nhập chịu thuế
    của người lao động là bao nhiêu?
  back: 'Khi người lao động thuộc đủ cả ba diện và tiền lương nằm trong căn cứ đóng tương ứng,
    có thể minh họa 8% BHXH + 1.5% BHYT + 1% BHTN. Đây không phải tỷ lệ áp dụng cho mọi
    hợp đồng; từng khoản có căn cứ và trần riêng theo luật.'
  source_lesson: PersonalFinance/notes/module-3/week-09-personal-income-tax-vn.md
  version: 1.0.0
  claim_ids:
  - M3-C17
  tags:
  - social-insurance
  - tax-deductible
  - module-3
- id: fc-pf-w09-005
  concept: Trần đóng bảo hiểm bắt buộc theo Lương cơ sở
  front: Trong 01/01/2026–30/06/2026, theo Luật BHXH 41/2024/QH15 và Nghị định
    73/2024/NĐ-CP, trần đóng BHXH và BHYT (20 lần mức tham chiếu/lương cơ sở
    2.340.000 đ) là bao nhiêu tiền?
  back: Trần tiền lương làm căn cứ đóng BHXH/BHYT là 46.800.000 đ/tháng; tại trần,
    mức khấu trừ BHXH+BHYT tối đa của người lao động là 4.446.000 đ/tháng.
    Đây là ví dụ cho 01/01/2026–30/06/2026 theo Luật 41 có hiệu lực từ 01/07/2025;
    giai đoạn 07/2024–06/2025 cần căn cứ Luật 58 riêng. BHTN có trần riêng theo
    lương tối thiểu vùng; từ 01/07/2026 xem thẻ fc-pf-w09-016.
  source_lesson: PersonalFinance/notes/module-3/week-09-personal-income-tax-vn.md
  version: 1.0.0
  claim_ids:
  - M3-C18
  tags:
  - salary-cap
  - insurance-calc
  - module-3
- id: fc-pf-w09-016
  concept: Trần đóng BHXH và BHYT từ 01/07/2026
  front: Từ 01/07/2026, trần tiền lương làm căn cứ đóng BHXH và BHYT là bao nhiêu?
  back: 50.600.000 đ/tháng, bằng 20 lần mức lương cơ sở 2.530.000 đ/tháng. Mức này
    áp dụng từ 01/07/2026 theo Luật 41 và Nghị định 161/2026/NĐ-CP; giai đoạn
    01/01–30/06/2026 dùng trần 46.800.000 đ/tháng trên thẻ fc-pf-w09-005.
    Đây là trần BHXH/BHYT, không phải trần BHTN; BHTN có trần riêng theo lương
    tối thiểu vùng và quy tắc tham gia hiện hành.
  source_lesson: PersonalFinance/notes/module-3/week-09-personal-income-tax-vn.md
  version: 1.0.0
  claim_ids:
  - M3-C18
  tags:
  - salary-cap
  - effective-date
  - module-3
- id: fc-pf-w09-017
  concept: Thuế cho thuê bất động sản năm 2026
  front: Năm 2026, cá nhân cho thuê bất động sản không kinh doanh lưu trú có doanh thu 1,2 tỷ đồng thì phần GTGT và TNCN được tính thế nào?
  back: 'GTGT = 5% trên toàn doanh thu 1,2 tỷ đồng (60 triệu đồng); TNCN = 5% trên phần vượt 1 tỷ đồng (200 triệu đồng, tức 10 triệu đồng TNCN). Công thức này theo Nghị định 141/2026/NĐ-CP có hiệu lực từ 01/01/2026; không áp dụng cho kinh doanh lưu trú, và cho thuê tài sản khác có nhóm tỷ lệ riêng.'
  source_lesson: PersonalFinance/notes/module-3/week-09-personal-income-tax-vn.md
  version: 1.0.0
  claim_ids:
  - M3-C10
  tags:
  - rental-tax
  - 2026-rules
  - module-3
- id: fc-pf-w09-006
  concept: Điều kiện đăng ký Người phụ thuộc
  front: Những đối tượng nào được coi là người phụ thuộc hợp lệ để giảm trừ gia cảnh
    trong kỳ tính thuế năm 2026?
  back: 'Các nhóm phải đáp ứng điều kiện tương ứng theo luật và hồ sơ: con; vợ/chồng; cha, mẹ;
    hoặc cá nhân khác không nơi nương tựa mà người nộp thuế trực tiếp nuôi dưỡng. Với nhóm
    thuộc điều kiện thu nhập, mức bình quân tháng trong năm từ tất cả nguồn không vượt 3.000.000
    đồng theo Điều 3 Thông tư 87/2026/TT-BTC; mốc 1.000.000 đồng là lịch sử. Mức giảm trừ
    hiện hành là 6.200.000 đ/tháng/người phụ thuộc.'
  source_lesson: PersonalFinance/notes/module-3/week-09-personal-income-tax-vn.md
  version: 1.0.0
  claim_ids:
  - M3-C08
  - M3-C15
  tags:
  - dependents
  - eligibility
  - module-3
- id: fc-pf-w09-007
  concept: Thuế TNCN từ chuyển nhượng chứng khoán
  front: Đối với chuyển nhượng cổ phiếu niêm yết thông thường, thuế suất TNCN theo từng
    lần chuyển nhượng là bao nhiêu?
  back: Áp dụng thuế suất 0.1% trên giá chuyển nhượng từng lần theo Điều 54 Nghị định
    253/2026/NĐ-CP, thường được khấu trừ qua tổ chức trung gian. Chứng khoán phái sinh
    được hướng dẫn riêng; không suy rộng công thức này cho mọi công cụ.
  source_lesson: PersonalFinance/notes/module-3/week-09-personal-income-tax-vn.md
  version: 1.0.0
  claim_ids:
  - M3-C09
  tags:
  - stock-tax
  - flat-rate
  - module-3
- id: fc-pf-w09-008
  concept: Thuế TNCN từ cổ tức tiền mặt
  front: Thuế suất thuế TNCN đối với cổ tức bằng tiền mặt nhận được từ công ty cổ
    phần là bao nhiêu?
  back: Trong phạm vi cổ tức bằng tiền, áp dụng thuế suất 5% trên khoản thu nhập đầu tư vốn
    theo Điều 52 Nghị định 253/2026/NĐ-CP; tổ chức trả thu nhập khấu trừ trước khi chi trả.
    Cổ tức bằng cổ phiếu có quy tắc thời điểm tính riêng khi chuyển nhượng.
  source_lesson: PersonalFinance/notes/module-3/week-09-personal-income-tax-vn.md
  version: 1.0.0
  claim_ids:
  - M3-C09
  tags:
  - dividend-tax
  - investment-income
  - module-3
- id: fc-pf-w09-009
  concept: Thuế TNCN từ chuyển nhượng bất động sản
  front: Thuế suất thuế TNCN khi bán bất động sản tại Việt Nam được tính như thế nào?
  back: Đối với cá nhân cư trú, thuế TNCN từ chuyển nhượng bất động sản = 2% x giá
    chuyển nhượng. Giá hợp đồng là điểm xuất phát; nếu hợp đồng bỏ trống hoặc ghi
    thấp hơn giá đất, hệ số điều chỉnh, hoặc giá tính lệ phí trước bạ nhà theo trường
    hợp luật định thì dùng giá xác định theo quy định tương ứng. Quy tắc này áp dụng
    từ 01/07/2026.
  source_lesson: PersonalFinance/notes/module-3/week-09-personal-income-tax-vn.md
  version: 1.0.0
  claim_ids:
  - M3-C20
  tags:
  - real-estate-tax
  - property
  - module-3
- id: fc-pf-w09-010
  concept: Miễn thuế khi bán bất động sản duy nhất
  front: Điều kiện để được miễn thuế TNCN 2% khi chuyển nhượng bất động sản là gì?
  back: "Miễn thuế chỉ khi đồng thời đáp ứng điều kiện luật định: tại thời điểm chuyển nhượng cá nhân chỉ có duy nhất một nhà ở hoặc một thửa đất ở tại Việt Nam, có quyền sở hữu/quyền sử dụng tối thiểu 183 ngày theo quy tắc ngày cấp Giấy chứng nhận, và chuyển nhượng toàn bộ. Không áp dụng cho nhà/công trình hình thành trong tương lai; cá nhân tự kê khai và chịu trách nhiệm. Nghị định 253/2026/NĐ-CP có hiệu lực từ 01/07/2026."
  source_lesson: PersonalFinance/notes/module-3/week-09-personal-income-tax-vn.md
  version: 1.0.0
  claim_ids:
  - M3-C21
  tags:
  - tax-exemption
  - single-property
  - module-3
- id: fc-pf-w09-011
  concept: Quyết toán thuế TNCN cuối năm
  front: Trường hợp nào người lao động bắt buộc phải trực tiếp tự đi quyết toán thuế
    TNCN với cơ quan thuế?
  back: Theo Điều 51 Nghị định 253/2026/NĐ-CP, cá nhân có nhiều nơi trả thu nhập phải xét điều kiện ủy quyền, số thuế phải nộp thêm/đã nộp thừa và yêu cầu hoàn hoặc bù trừ; cá nhân có yêu cầu giảm trừ theo Điều 49 hoặc giảm thuế theo Điều 40 phải tự quyết toán. Theo khoản 5 điểm c Điều 10 Nghị định 252/2026/NĐ-CP, hạn hồ sơ trực tiếp là ngày cuối cùng của tháng thứ tư kể từ khi kết thúc năm dương lịch; nhiều nguồn thu tự nó chưa đủ để kết luận.
  source_lesson: PersonalFinance/notes/module-3/week-09-personal-income-tax-vn.md
  version: 1.0.0
  claim_ids:
  - M3-C13
  tags:
  - tax-finalization
  - annual-filing
  - module-3
- id: fc-pf-w09-012
  concept: Hoàn thuế TNCN (Tax Refund)
  front: Số thuế TNCN nộp thừa phát sinh khi nào và quyền lợi của người nộp thuế là
    gì?
  back: Khi số thuế phải nộp nhỏ hơn số đã nộp, cá nhân có thể yêu cầu hoàn thuế hoặc
    bù trừ vào kỳ sau theo hồ sơ, thủ tục quản lý thuế. Nếu không yêu cầu hoàn hoặc
    bù trừ thì thuộc trường hợp không phải quyết toán đối với phần đó. Chưa kết luận
    về một quy trình hoàn tự động sau các thay đổi quản lý thuế tháng 07/2026.
  source_lesson: PersonalFinance/notes/module-3/week-09-personal-income-tax-vn.md
  version: 1.0.0
  claim_ids:
  - M3-C22
  tags:
  - tax-refund
  - rights
  - module-3
- id: fc-pf-w09-013
  concept: Khoản thu nhập miễn thuế phổ biến
  front: Kể tên các khoản thu nhập được miễn thuế TNCN phổ biến nhất đối với cá nhân?
  back: "Ví dụ miễn thuế phải nêu đúng nhóm và điều kiện: lãi tiền gửi tại tổ chức tín dụng; lãi trái phiếu Chính phủ hoặc trái phiếu chính quyền địa phương; lãi hợp đồng bảo hiểm nhân thọ; và tiền bồi thường theo nhóm bảo hiểm, tai nạn lao động, bồi thường Nhà nước hoặc nhóm khác theo luật. Chuyển nhượng, thừa kế hoặc quà tặng bất động sản chỉ miễn trong các quan hệ được liệt kê: vợ/chồng; cha mẹ đẻ/con đẻ; cha mẹ nuôi/con nuôi; cha mẹ chồng/con dâu; cha mẹ vợ/con rể; ông bà nội/cháu nội; ông bà ngoại/cháu ngoại; anh chị em ruột, cùng điều kiện hồ sơ. “Thân thích trực hệ” không phải mô tả đầy đủ."
  source_lesson: PersonalFinance/notes/module-3/week-09-personal-income-tax-vn.md
  version: 1.0.0
  claim_ids:
  - M3-C23
  tags:
  - tax-free
  - exemptions
  - module-3
- id: fc-pf-w09-014
  concept: Tối ưu hóa thuế hợp pháp (Tax Optimization)
  front: Sự khác biệt giữa Tối ưu thuế hợp pháp (Tax Avoidance) và Trốn thuế bất hợp
    pháp (Tax Evasion)?
  back: Tối ưu thuế hợp pháp là dùng đúng khoản miễn, giảm, khấu trừ, thời điểm và
    thủ tục pháp luật cho phép, với hồ sơ trung thực. Trốn thuế là hành vi được Luật
    Quản lý thuế liệt kê, như không ghi nhận doanh thu, không lập hoặc kê khai hóa đơn,
    dùng hóa đơn/chứng từ không hợp pháp, hoặc làm sai lệch bản chất giao dịch để giảm
    nghĩa vụ thuế. Hậu quả có thể là truy thu và xử phạt hành chính; chỉ khi đạt ngưỡng
    truy cứu theo pháp luật hình sự mới xử lý hình sự.
  source_lesson: PersonalFinance/notes/module-3/week-09-personal-income-tax-vn.md
  version: 1.0.0
  claim_ids:
  - M3-C24
  tags:
  - tax-planning
  - ethics
  - module-3
- id: fc-pf-w09-015
  concept: Thuế TNCN đối với thu nhập vãng lai
  front: Trong kỳ tính thuế năm 2026, khoản thu nhập vãng lai từ mức nào mỗi lần chi
    trả bị khấu trừ 10% tại nguồn?
  back: Tổ chức chi trả khấu trừ 10% tại nguồn khi chi tiền lương, tiền công, tiền thù lao hoặc khoản chi khác từ 5.000.000 đ/lần trở lên cho cá nhân cư trú không ký HĐLĐ hoặc ký HĐLĐ dưới 03 tháng theo Điều 50 Nghị định 253/2026/NĐ-CP. Mốc 2.000.000 đ/lần theo Thông tư 111/2013/TT-BTC là lịch sử; việc quyết toán còn phụ thuộc điều kiện và hồ sơ của cá nhân.
  source_lesson: PersonalFinance/notes/module-3/week-09-personal-income-tax-vn.md
  version: 1.0.0
  claim_ids:
  - M3-C14
  tags:
  - withholding-tax
  - freelance
  - module-3
