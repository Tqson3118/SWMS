deck_id: deck-pf-w06
subject: PersonalFinance
lesson_id: week-06-quan-ly-no
version: 1.0.0
description: 'Bộ thẻ Flashcard chuẩn hóa ôn tập ngắt quãng Tuần 06: Quản lý Nợ, Đòn
  bẩy và Chiến lược Trả nợ'
cards:
- id: fc-pf-w06-001
  concept: Phân biệt Nợ tốt và Nợ xấu
  front: Thế nào là Nợ tốt (Good Debt) và Nợ xấu (Bad Debt) trong tài chính cá nhân?
  back: Trong khung phân tích của bài, một khoản nợ có thể được xem là phù hợp hơn
    khi tài sản hoặc mục đích vay hỗ trợ dòng tiền tương lai và chi phí vốn nằm
    trong khả năng chịu đựng; khoản nợ phục vụ tiêu dùng mất giá hoặc có chi phí
    cao có thể gây áp lực hơn. Đây là cách đọc theo bối cảnh, không phải nhãn
    tốt/xấu áp dụng tự động cho mọi hợp đồng.
  source_lesson: PersonalFinance/notes/module-2/week-06-quan-ly-no.md
  version: 1.0.0
  tags:
  - debt-types
  - foundations
  - module-2
- id: fc-pf-w06-002
  concept: Tỷ lệ DTI (Debt-to-Income)
  front: Chỉ số DTI là gì và vì sao không có một ngưỡng an toàn chung cho mọi khoản vay?
  back: DTI = Tổng số tiền trả nợ hàng tháng / thu nhập hàng tháng theo quy ước của
    nguồn hoặc sản phẩm; CFPB thường minh họa bằng thu nhập gộp. Các mốc 36% và 43%
    trong bài chỉ là sàng lọc giáo dục, không phải ngưỡng pháp lý hay bảo đảm an toàn.
  source_lesson: PersonalFinance/notes/module-2/week-06-quan-ly-no.md
  version: 1.0.0
  tags:
  - dti
  - risk-metric
  - module-2
- id: fc-pf-w06-003
  concept: Phương pháp Tuyết lở (Debt Avalanche)
  front: Trong mô hình ngân sách và hợp đồng cố định đã nêu, cơ chế và lợi thế toán học
    được minh họa của phương pháp Debt Avalanche là gì?
  back: Tập trung trả dồn tiền trả hết khoản nợ có lãi suất cao nhất trước (bất kể
    dư nợ lớn hay nhỏ), trong khi duy trì trả mức tối thiểu cho các khoản khác. Giúp
    hướng tới giảm tổng tiền lãi trong mô hình đã nêu; kết quả thực tế còn phụ
    thuộc số dư, lãi suất, phí, quy tắc phân bổ và ngân sách.
  source_lesson: PersonalFinance/notes/module-2/week-06-quan-ly-no.md
  version: 1.0.0
  tags:
  - avalanche
  - math-optimal
  - module-2
- id: fc-pf-w06-004
  concept: Phương pháp Hòn tuyết lăn (Debt Snowball)
  front: Trong mô hình và bối cảnh người học đang xét, cơ chế hành vi có thể hỗ trợ
    của phương pháp Debt Snowball là gì?
  back: Tập trung trả hết khoản nợ có số dư nhỏ nhất trước tiên. Việc hoàn tất một
    khoản sớm có thể tạo cảm giác tiến bộ và hỗ trợ động lực duy trì kế hoạch trong
    một số bối cảnh, nhưng không bảo đảm lợi ích tâm lý hay kết quả hành vi cho mọi người.
  source_lesson: PersonalFinance/notes/module-2/week-06-quan-ly-no.md
  version: 1.0.0
  tags:
  - snowball
  - behavioral-finance
  - module-2
- id: fc-pf-w06-005
  concept: Bẫy thanh toán tối thiểu thẻ tín dụng
  front: Điều gì xảy ra khi người dùng thẻ tín dụng chỉ thanh toán số tiền tối thiểu
    (Minimum Payment) mỗi tháng?
  back: Trong mô hình minh họa của bài, lãi tính trên dư nợ đầu kỳ và khoản tối thiểu
    co lại theo dư nợ, với giả định 3%/tháng, không giao dịch mới và không phí phụ.
    Mức thanh toán nhỏ có thể kéo dài thời gian tất toán; hợp đồng thực tế phải được
    kiểm tra riêng.
  source_lesson: PersonalFinance/notes/module-2/week-06-quan-ly-no.md
  version: 1.0.0
  tags:
  - credit-card
  - interest-trap
  - module-2
- id: fc-pf-w06-006
  concept: Lãi suất danh nghĩa vs Lãi suất thực tế trên dư nợ giảm dần
  front: Phân biệt cách tính lãi trên dư nợ gốc ban đầu (Flat rate) và lãi trên dư
    nợ giảm dần (Reducing balance)?
  back: Lãi phẳng tính trên gốc ban đầu nên không thể so trực tiếp với lãi trên dư nợ
    giảm dần. Trong ví dụ 24 triệu/24 tháng của bài, dòng tiền phẳng 1,2% có IRR
    tháng 2,132279% và EIR khoảng 28,811987% (phí loại trừ); luôn nêu rõ kỳ hạn,
    thời điểm trả và phí khi quy đổi.
  source_lesson: PersonalFinance/notes/module-2/week-06-quan-ly-no.md
  version: 1.0.0
  tags:
  - interest-calculation
  - flat-vs-reducing
  - module-2
- id: fc-pf-w06-007
  concept: Điểm tín dụng CIC tại Việt Nam
  front: Trung tâm Thông tin Tín dụng Quốc gia (CIC) chấm điểm lịch sử tín dụng dựa
    trên yếu tố nào?
  back: Không nên suy ra một danh sách hay công thức chấm điểm độc quyền từ bài học.
    Người học nên đọc báo cáo tín dụng của chính mình, kiểm tra lịch sử thanh toán,
    dư nợ và các hồ sơ hiển thị, rồi hỏi CIC hoặc tổ chức cung cấp báo cáo về cách
    sửa sai; không tự suy luận thuật toán chấm điểm hay bảo đảm kết quả xét duyệt.
  source_lesson: PersonalFinance/notes/module-2/week-06-quan-ly-no.md
  version: 1.0.0
  tags:
  - cic
  - credit-score
  - module-2
- id: fc-pf-w06-008
  concept: Tái cấu trúc nợ (Debt Restructuring)
  front: Khi nào người đi vay nên xem xét đàm phán tái cấu trúc nợ hoặc đảo nợ sang
    ngân hàng khác?
  back: Khi có đề nghị hoặc điều kiện mới có vẻ phù hợp hơn, chỉ xem xét sau khi đã
    tính toán toàn bộ phí phạt trả nợ trước hạn, phí thẩm định mới, kỳ hạn, lịch trả
    và tổng chi phí của cả hai phương án.
  source_lesson: PersonalFinance/notes/module-2/week-06-quan-ly-no.md
  version: 1.0.0
  tags:
  - refinance
  - negotiation
  - module-2
- id: fc-pf-w06-009
  concept: Phí phạt trả trước hạn (Prepayment Penalty)
  front: Khi đọc hợp đồng vay, cần kiểm tra điều khoản phí phạt trả nợ trước hạn và
    thời hạn áp dụng như thế nào?
  back: Một số hợp đồng có thể quy định phí trả trước hạn trong một thời hạn cụ thể
    để bù chi phí hoặc theo điều kiện sản phẩm. Mức phí, thời hạn, cách tính và
    ngoại lệ phải đọc đúng hợp đồng; không suy ra mốc 3-5 năm hay tỷ lệ chung.
  source_lesson: PersonalFinance/notes/module-2/week-06-quan-ly-no.md
  version: 1.0.0
  tags:
  - prepayment-penalty
  - banking-terms
  - module-2
- id: fc-pf-w06-010
  concept: Đòn bẩy tài chính trong bất động sản
  front: Nguyên tắc an toàn đòn bẩy khi vay mua nhà an cư là gì?
  back: Bài dùng DTI, dòng tiền sau chi phí, stress test và quỹ dự phòng như các câu
    hỏi kiểm tra bối cảnh. Không có một tỷ lệ vốn tự có, DTI hay số tháng dự phòng
    an toàn chung cho mọi người; điều kiện sản phẩm và hoàn cảnh phải được kiểm tra.
  source_lesson: PersonalFinance/notes/module-2/week-06-quan-ly-no.md
  version: 1.0.0
  tags:
  - mortgage
  - leverage
  - module-2
- id: fc-pf-w06-011
  concept: Tín dụng đen và Vay qua App
  front: Cơ chế lãi suất và thủ đoạn đòi nợ của tín dụng đen/app trực tuyến biến tướng
    là gì?
  back: Với app hoặc bên cho vay không rõ tư cách, cần kiểm tra giấy phép, tổng chi
    phí, quyền truy cập dữ liệu và kênh khiếu nại trước khi cung cấp thông tin. Bài
    không đưa ra một mức lãi hay thủ đoạn chung cho mọi trường hợp; hãy dùng nguồn
    chính thức và tránh cam kết không rõ điều kiện.
  source_lesson: PersonalFinance/notes/module-2/week-06-quan-ly-no.md
  version: 1.0.0
  tags:
  - loan-shark
  - financial-safety
  - module-2
- id: fc-pf-w06-012
  concept: Thời gian ân hạn gốc (Grace Period)
  front: Ân hạn nợ gốc nghĩa là gì và người vay cần lưu ý điều gì trong giai đoạn
    này?
  back: Một số hợp đồng cho phép tạm hoãn trả gốc trong thời hạn ghi rõ, nhưng lãi,
    phí và cách tính trong giai đoạn đó phụ thuộc hợp đồng. Cần kiểm tra thời hạn,
    số tiền và lịch trả sau ân hạn để lập ngân sách; không mặc định 1-2 năm hay
    rằng khoản trả sẽ luôn tăng vọt.
  source_lesson: PersonalFinance/notes/module-2/week-06-quan-ly-no.md
  version: 1.0.0
  tags:
  - grace-period
  - cashflow
  - module-2
- id: fc-pf-w06-013
  concept: Bảo lãnh vay vốn và rủi ro liên đới
  front: Hệ quả pháp lý khi đứng ra ký tên bảo lãnh khoản vay cho bạn bè hoặc người
    thân là gì?
  back: Nghĩa vụ của người bảo lãnh phụ thuộc vào văn bản bảo lãnh, phạm vi cam kết
    và quy định áp dụng. Không mặc nhiên kết luận phải trả toàn bộ khoản vay hoặc bị
    ghi nhận nợ xấu; cần đọc hợp đồng và hỏi tổ chức tín dụng/CIC về cách báo cáo.
  source_lesson: PersonalFinance/notes/module-2/week-06-quan-ly-no.md
  version: 1.0.0
  tags:
  - guarantor
  - legal-risk
  - module-2
- id: fc-pf-w06-014
  concept: Quy tắc đóng băng thẻ tín dụng
  front: Biện pháp kiểm soát hành vi đối với người có xu hướng quẹt thẻ tín dụng bốc
    đồng là gì?
  back: Có thể cân nhắc xóa thông tin thẻ khỏi ứng dụng, đặt giới hạn hoặc khóa chiều
    chi tiêu nếu phù hợp, sau khi kiểm tra phí, nghĩa vụ hợp đồng và các khoản thanh
    toán tự động. Đây là lựa chọn kiểm soát chi tiêu có điều kiện; không mặc định
    phải hủy thẻ, chỉ dùng tiền mặt hoặc bỏ qua nghĩa vụ pháp lý/tài chính.
  source_lesson: PersonalFinance/notes/module-2/week-06-quan-ly-no.md
  version: 1.0.0
  tags:
  - spending-control
  - behavioral-finance
  - module-2
- id: fc-pf-w06-015
  concept: Tác động của lạm phát lên người đi vay
  front: Lạm phát cao có lợi hay có hại cho người vay nợ lãi suất cố định dài hạn?
  back: Lạm phát có thể làm giảm giá trị thực của khoản nợ danh nghĩa cố định, nhưng
    tác động ròng còn phụ thuộc thu nhập thực tế, giá cả, chi phí sinh hoạt, lãi suất
    có thay đổi hay không và dòng tiền trả nợ. Cần kiểm tra ngân sách và dòng tiền
    ròng thay vì mặc định lạm phát luôn có lợi cho người vay.
  source_lesson: PersonalFinance/notes/module-2/week-06-quan-ly-no.md
  version: 1.0.0
  tags:
  - inflation
  - debt-dynamics
  - module-2
