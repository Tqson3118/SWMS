description: 'Bộ thẻ Flashcard chuẩn hóa ôn tập ngắt quãng Tuần 12: Kế hoạch Tài chính Cá nhân Tổng
  thể và Phân tích Sai lệch Ngân sách'
cards:
- id: fc-pf-w12-001
  concept: Kế hoạch Tài chính Cá nhân 6 Phân hệ (PFP Architecture)
  front: Kể tên 6 phân hệ cốt lõi tạo nên một bản Kế hoạch Tài chính Cá nhân tổng thể thống nhất?
  back: 1. Mục tiêu SMART; 2. Ngân sách & Phân bổ dòng tiền; 3. Quỹ khẩn cấp & Quản trị rủi ro; 4.
    Quản lý nợ; 5. Tiết kiệm & Đầu tư; 6. Bảo hiểm & Dự phòng hưu trí.
  claim_ids:
  - W12-C101
  source_lesson: PersonalFinance/notes/module-4/week-12-personal-financial-plan.md
  version: 1.0.0
  tags:
  - pfp-architecture
  - framework
  - module-4
- id: fc-pf-w12-002
  concept: Bản chất văn bản sống của PFP
  front: Tại sao nói bản kế hoạch tài chính cá nhân là 'văn bản sống' (Living Document)?
  back: Vì PFP không bao giờ cố định; nó phải được cập nhật, rà soát và hiệu chỉnh định kỳ khi thu
    nhập, chi phí, hoàn cảnh gia đình hoặc các biến số kinh tế vĩ mô thay đổi.
  claim_ids:
  - W12-C101
  source_lesson: PersonalFinance/notes/module-4/week-12-personal-financial-plan.md
  version: 1.0.0
  tags:
  - living-document
  - mindset
  - module-4
- id: fc-pf-w12-003
  concept: Phân tích Sai lệch Ngân sách (Budget Variance Analysis)
  front: Phân tích sai lệch ngân sách là gì và mục đích quản trị của nó là gì?
  back: Là việc so sánh số liệu chi tiêu/thu nhập thực tế (Actual) với ngân sách dự toán (Budgeted),
    xác định nguyên nhân chênh lệch để điều chỉnh hành vi hoặc hiệu chỉnh kế hoạch kịp thời.
  claim_ids:
  - W12-C113
  - W12-C112
  source_lesson: PersonalFinance/notes/module-4/week-12-personal-financial-plan.md
  version: 1.0.0
  tags:
  - variance-analysis
  - budget-control
  - module-4
- id: fc-pf-w12-004
  concept: Sai lệch Có lợi vs Sai lệch Bất lợi
  front: Định nghĩa Sai lệch Có lợi (Favorable Variance) và Sai lệch Bất lợi (Unfavorable Variance)
    trong phân tích chi tiêu?
  back: 'Favorable (F): Thực tế tốt hơn dự toán (chi tiêu ít hơn hoặc thu nhập cao hơn kế hoạch);
    Unfavorable (U): Thực tế xấu hơn dự toán (chi tiêu vượt trần hoặc thu nhập bị sụt giảm).'
  claim_ids:
  - W12-C113
  source_lesson: PersonalFinance/notes/module-4/week-12-personal-financial-plan.md
  version: 1.0.0
  tags:
  - favorable
  - unfavorable
  - module-4
- id: fc-pf-w12-005
  concept: Ngụy biện nhân quả trong Phân tích sai lệch
  front: Tại sao việc theo dõi và phân tích sai lệch ngân sách KHÔNG tự động làm tăng thu nhập của
    người học?
  back: Rà soát ngân sách chỉ là công cụ kiểm soát chi phí và tối ưu nguồn lực sẵn có; nó không tự
    tạo ra thu nhập. Muốn tăng thu nhập cần một hành động riêng như phát triển kỹ năng, tăng năng
    suất hoặc tìm nguồn thu phù hợp.
  claim_ids:
  - W12-C112
  - W12-C105
  source_lesson: PersonalFinance/notes/module-4/week-12-personal-financial-plan.md
  version: 1.0.0
  tags:
  - causality-bias
  - budgeting
  - module-4
- id: fc-pf-w12-006
  concept: Thứ tự phân bổ dòng tiền thặng dư trong khung minh họa
  front: Trong khung minh họa của bài, thứ tự ưu tiên khi phân bổ dòng tiền tiết kiệm hàng tháng
    là gì?
  back: 'Trong khung minh họa của bài: 1. Quỹ khẩn cấp tối thiểu (1 tháng) -> 2. Trả hết nợ lãi cao
    (thẻ tín dụng) -> 3. Hoàn tất quỹ khẩn cấp theo khung minh họa (3-6 tháng) -> 4. Đầu tư dài hạn
    & Hưu trí -> 5. Trả nợ thế chấp trước hạn. Trường hợp khẩn cấp thực tế cần được đánh giá riêng
    và có kế hoạch bổ sung quỹ.'
  claim_ids:
  - W12-C102
  source_lesson: PersonalFinance/notes/module-4/week-12-personal-financial-plan.md
  version: 1.0.0
  tags:
  - cashflow-priority
  - order-of-operations
  - module-4
- id: fc-pf-w12-007
  concept: Ngân sách 0-đồng (Zero-Based Budgeting - ZBB)
  front: Khái niệm Ngân sách 0-đồng có ý nghĩa gì trong việc kiểm soát thu chi?
  back: 'Toàn bộ thu nhập được phân bổ nhiệm vụ cụ thể cho từng hạng mục (chi tiêu, tiết kiệm, đầu
    tư, trả nợ) sao cho: Thu nhập - Tổng phân bổ = 0; không có đồng tiền nào trôi nổi vô định.'
  claim_ids:
  - W12-C106
  source_lesson: PersonalFinance/notes/module-4/week-12-personal-financial-plan.md
  version: 1.0.0
  tags:
  - zbb
  - cashflow-discipline
  - module-4
- id: fc-pf-w12-008
  concept: Stress Test Kế hoạch Tài chính
  front: Mục đích của việc thực hiện bài kiểm tra căng thẳng (Stress Test) đối với kế hoạch tài chính
    cá nhân là gì?
  back: Giả định một số kịch bản bất lợi phù hợp với kế hoạch (ví dụ mất việc, thu nhập giảm hoặc
    viện phí đột xuất) để kiểm tra xem cấu trúc tài chính có chịu được cú sốc hay không; không cần
    giả định đây là toàn bộ rủi ro có thể xảy ra.
  claim_ids:
  - W12-C107
  source_lesson: PersonalFinance/notes/module-4/week-12-personal-financial-plan.md
  version: 1.0.0
  tags:
  - stress-test
  - resilience
  - module-4
- id: fc-pf-w12-009
  concept: Bài toán Đặt cọc Mua nhà 800 triệu
  front: Trong kịch bản minh họa lãi 0%, tại sao mục tiêu tích lũy 800 triệu tiền cọc nhà trong 5
    năm với mức tiết kiệm 6.8 triệu/tháng bị coi là không khả thi?
  back: Trong kịch bản lãi 0%, 6.8 triệu * 60 tháng = 408 triệu, thiếu hụt tới 392 triệu so với mục
    tiêu 800 triệu; cần tăng thu nhập, kéo dài thời gian hoặc chọn một giả định lợi suất phù hợp,
    không xem đây là dự báo chắc chắn.
  claim_ids:
  - W12-C108
  source_lesson: PersonalFinance/notes/module-4/week-12-personal-financial-plan.md
  version: 1.0.0
  tags:
  - feasibility-math
  - mortgage-goal
  - module-4
- id: fc-pf-w12-010
  concept: Bảng giả định kinh tế trong kế hoạch tài chính
  front: Tại sao một bản PFP dài hạn bắt buộc phải công khai các giả định kinh tế vĩ mô?
  back: Vì các phép tính lãi kép và giá trị tài sản phụ thuộc vào giả định về tỷ lệ lạm phát (ví
    dụ 4%/năm), lãi suất gửi tiết kiệm, mức tăng lương hàng năm và lợi suất đầu tư kỳ vọng.
  claim_ids:
  - W12-C108
  source_lesson: PersonalFinance/notes/module-4/week-12-personal-financial-plan.md
  version: 1.0.0
  tags:
  - economic-assumptions
  - projections
  - module-4
- id: fc-pf-w12-011
  concept: Quy trình Rà soát Định kỳ 3 Cấp độ
  front: Nêu tần suất và nội dung của quy trình rà soát tài chính cá nhân 3 cấp độ?
  back: 'Hàng tháng: So sánh thực tế vs dự toán ngân sách (Variance); Hàng quý: Kiểm tra tiến độ
    mục tiêu và tái cân bằng danh mục; Hàng năm: Đánh giá lại toàn bộ 6 phân hệ PFP và giả định.'
  claim_ids:
  - W12-C103
  source_lesson: PersonalFinance/notes/module-4/week-12-personal-financial-plan.md
  version: 1.0.0
  tags:
  - review-cadence
  - governance
  - module-4
- id: fc-pf-w12-012
  concept: Cơ chế Tự động hóa Tài chính (Financial Automation)
  front: Cách thức thiết lập 'Bộ máy tài chính tự vận hành' (Automated Financial System)?
  back: 'Hệ thống có thể tự động trích lương ngay ngày nhận tiền: 1 phần chuyển vào tiết kiệm/đầu
    tư, 1 phần trích nợ tự động, 1 phần thanh toán hóa đơn cố định, phần còn lại chi tiêu sinh hoạt.'
  claim_ids:
  - W12-C109
  source_lesson: PersonalFinance/notes/module-4/week-12-personal-financial-plan.md
  version: 1.0.0
  tags:
  - automation
  - habits
  - module-4
- id: fc-pf-w12-013
  concept: Mục tiêu SMART trong tài chính cá nhân
  front: Phát biểu mục tiêu 'Tôi muốn giàu có' vi phạm những tiêu chí nào của chuẩn SMART?
  back: Thiếu tính Cụ thể (S - bao nhiêu tiền), thiếu Đo lường (M - đơn vị VND), thiếu Khả thi (A
    - cách thực hiện), và thiếu Kỳ hạn xác định (T - khi nào đạt được).
  claim_ids:
  - W12-C114
  source_lesson: PersonalFinance/notes/module-4/week-12-personal-financial-plan.md
  version: 1.0.0
  tags:
  - smart-goals
  - planning
  - module-4
- id: fc-pf-w12-014
  concept: Quy tắc 48–72 giờ chống chi tiêu bốc đồng
  front: Quy tắc 48–72 giờ đối với các khoản mua sắm tùy ý Tầng 3 hoạt động ra sao?
  back: Có thể cân nhắc trì hoãn quyết định mua trong 48–72 giờ để cảm xúc hạ nhiệt và đánh giá lại
    nhu cầu thực tế; đây là các khung tự quản lý tùy bối cảnh, không phải nghĩa vụ áp dụng cho mọi
    giao dịch.
  claim_ids:
  - W12-C110
  source_lesson: PersonalFinance/notes/module-4/week-12-personal-financial-plan.md
  version: 1.0.0
  tags:
  - spending-pause
  - emotional-control
  - module-4
- id: fc-pf-w12-015
  concept: Đo lường Tài sản Ròng (Net Worth Tracking)
  front: Công thức tính Tài sản Ròng và vai trò của nó trong việc đánh giá tiến bộ tài chính dài
    hạn?
  back: Tài sản Ròng = Tổng Tài sản sở hữu (nhà, đất, xe, tiền gửi, cổ phiếu) - Tổng Nợ phải trả
    (vay mua nhà, nợ thẻ, nợ tiêu dùng). Đây là một chỉ báo hữu ích để theo dõi tiến bộ dài hạn,
    nhưng không phải thước đo duy nhất hay luôn trung thực nhất về sức khỏe tài chính.
  claim_ids:
  - W12-C111
  source_lesson: PersonalFinance/notes/module-4/week-12-personal-financial-plan.md
  version: 1.0.0
  tags:
  - net-worth
  - kpi
  - module-4
