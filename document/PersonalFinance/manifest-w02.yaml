learning_objectives:
- id: LO-PF-W02-01
  bloom_level: Analyze
  statement: 'Phân loại chính xác các dòng thu nhập của một cá nhân thành 3 nhóm chức năng: Thu nhập chủ
    động (Active Income), Thu nhập thụ động (Passive Income), và Thu nhập danh mục / Lãi vốn (Portfolio
    Income).'
- id: LO-PF-W02-02
  bloom_level: Analyze
  statement: 'Phân loại các khoản chi tiêu hàng tháng theo Cấu trúc 3 tầng: Tầng 1 Cố định bắt buộc, Tầng
    2 Biến đổi thiết yếu, và Tầng 3 Tùy ý linh hoạt.'
- id: LO-PF-W02-03
  bloom_level: Apply
  statement: Tính dòng tiền ròng và tỷ lệ tiền mặt giữ lại trên dữ liệu thực nhận sau thuế; phân biệt
    dòng tiền với tiêu dùng và thay đổi tài sản ròng.
- id: LO-PF-W02-04
  bloom_level: Evaluate
  statement: Nhận diện khoản chi định kỳ và xây dựng phương án điều chỉnh minh họa theo khả năng; tính
    tác động, không coi20% là chuẩn bắt buộc hay kết quả được bảo đảm.
