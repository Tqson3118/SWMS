learning_objectives:
- id: LO-W03-01
  bloom_level: Understand
  statement: Phân biệt được Tư duy cố định (Fixed Mindset) và Tư duy phát triển (Growth Mindset) theo Carol Dweck,
    đồng thời nhận diện được các giới hạn nghiên cứu (nghiên cứu meta-analysis của Sisk et al., 2018) và bẫy "Tư
    duy phát triển giả tạo" (False Growth Mindset).
- id: LO-W03-02
  bloom_level: Understand
  statement: 'Trình bày được 3 thành phần cốt lõi của Lòng tự trắc ẩn theo Kristin Neff: Lòng tốt với bản thân (Self-Kindness),
    Tính nhân loại chung (Common Humanity), và Chánh niệm (Mindfulness); phân biệt với Tự trọng (Self-Esteem), Tự
    thương hại (Self-Pity) và Tự buông thả (Self-Indulgence).'
- id: LO-W03-03
  bloom_level: Apply
  statement: Phân tích một tình huống thất bại giả định, nhận diện độc thoại nội tâm chỉ trích (Inner Critic) và
    chuyển đổi thành thông điệp tự trắc ẩn kết hợp kế hoạch điều chỉnh hành động cụ thể.
- id: LO-W03-04
  bloom_level: Evaluate
  statement: Đánh giá tương tác giữa niềm tin năng lực và các rào cản hệ thống khách quan, tránh rơi vào cái bẫy
    quy kết mọi thất bại xã hội thành "do thiếu tư duy tích cực".
