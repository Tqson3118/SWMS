    ngược.
- id: LO-W08-04
  bloom_level: Evaluate
  statement: Nhận diện chênh lệch quyền lực hoặc nguy cơ mất an toàn và chọn ưu tiên bảo vệ ranh giới thay vì cố
    ép một thỏa thuận win-win.
