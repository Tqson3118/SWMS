learning_objectives:
- id: LO-W11-01
  bloom_level: Understand
  statement: Liệt kê và phân biệt được các dấu hiệu quan hệ lành mạnh (Green flags) với các dấu hiệu cảnh báo nguy
    cơ (Red flags) qua mô tả hành vi cụ thể.
- id: LO-W11-02
  bloom_level: Analyze
  statement: Phân tích dữ kiện về kiểm soát, nguy cơ và dấu hiệu sửa chữa trong case, không suy ra chẩn đoán hoặc
    ý định; phân biệt dấu hiệu mơ hồ với hành vi nghiêm trọng cần ưu tiên an toàn.
- id: LO-W11-03
  bloom_level: Apply
  statement: Áp dụng **Quy tắc Quyết định An toàn (Safety Decision Rules)** để lập kế hoạch bảo vệ bản thân khi
    nhận diện nguy cơ cao mà không đối đầu nguy hiểm trong tình huống giả định.
- id: LO-W11-04
  bloom_level: Evaluate
  statement: Đánh giá được sự nguy hiểm của lời khuyên "phải đối đầu trực tiếp để làm rõ trắng đen" trong các mối
    quan hệ có yếu tố đe dọa bạo lực hoặc thao túng tâm lý sâu.
