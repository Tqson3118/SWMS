learning_objectives:
- id: LO-W05-01
  bloom_level: Understand
  statement: Trình bày được ba thành phần cốt lõi của active listening và phân biệt lắng nghe với các phản hồi thay
    thế như lời khuyên hay trấn an.
- id: LO-W05-02
  bloom_level: Apply
  statement: Với một tình huống giả định, nhận diện được paraphrase nội dung, paraphrase cảm xúc, câu hỏi làm rõ
    và gọi tên chúng chính xác.
- id: LO-W05-03
  bloom_level: Apply
  statement: Soạn được một phản hồi lắng nghe hoàn chỉnh (kiểm tra hiểu + xin phép trước khi góp ý), có điều kiện
    dừng và không áp đặt.
- id: LO-W05-04
  bloom_level: Evaluate
  statement: 'Đánh giá được các giới hạn và bằng chứng của active listening: điều gì được ủng hộ, điều gì còn tranh
    luận, và khi nào cần chuyển hướng hỗ trợ.'
