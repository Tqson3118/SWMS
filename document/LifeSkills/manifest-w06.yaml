learning_objectives:
- id: LO-W06-01
  bloom_level: Understand
  statement: Trình bày được bốn thành phần OFNR (Observation – Feeling – Need – Request) và phân biệt với cách dùng
    thông tục.
- id: LO-W06-02
  bloom_level: Apply
  statement: Với một câu phán xét, viết được phiên bản NVC (bốn thành phần) và giải thích sự khác biệt.
- id: LO-W06-03
  bloom_level: Apply
  statement: Soạn một yêu cầu NVC đảm bảo người nghe có quyền từ chối, có thể đảo ngược, và đủ cụ thể để người nghe
    biết phải làm gì.
- id: LO-W06-04
  bloom_level: Evaluate
  statement: Nêu được ít nhất hai giới hạn bằng chứng của NVC (nghiên cứu còn hạn chế, cần thận trọng khi có rủi
    ro trả đũa/cưỡng ép và không thay thế hỗ trợ trong bạo lực) và khi nào cần chuyển hướng hỗ trợ.
