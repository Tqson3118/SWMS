version: 1.1.0
description: 'Bộ thẻ Flashcard chuẩn hóa ôn tập ngắt quãng Tuần 07: Giao tiếp Quyết
  đoán và Bản lĩnh Cá nhân'
cards:
- id: fc-ls-w07-001
  concept: Bản chất của Giao tiếp Quyết đoán (Assertiveness)
  front: Giao tiếp quyết đoán khác biệt căn bản như thế nào so với giao tiếp hung
    hăng?
  back: Quyết đoán là bày tỏ ý kiến, nhu cầu và quyền lợi của mình rõ ràng, trực tiếp
    và tôn trọng quyền lợi của người khác; người kia vẫn có thể từ chối. Hung hăng
    là áp đặt hoặc xâm phạm quyền lợi của người khác. Đây là khung giao tiếp, không
    bảo đảm kết quả Win-Win.
  source_lesson: LifeSkills/notes/module-2/week-07-assertiveness.md
  version: 1.0.0
  tags:
  - assertiveness
  - communication-styles
  - module-2
- id: fc-ls-w07-002
  concept: Bốn phong cách giao tiếp
  front: Trong bài tập của khóa học, bốn nhãn giao tiếp dùng để luyện phân biệt là
    gì?
  back: Thụ động, hung hăng, hung hăng thụ động, quyết đoán. Đây là cách phân nhóm
    phục vụ bài tập, không phải chẩn đoán hay thước đo tính cách cố định.
  source_lesson: LifeSkills/notes/module-2/week-07-assertiveness.md
  version: 1.1.0
  tags:
  - communication-grid
  - styles
  - module-2
- id: fc-ls-w07-003
  concept: Dấu hiệu của phong cách Hung hăng thụ động
  front: Có thể mô tả hành vi nào trong ví dụ passive-aggressive, và giới hạn suy
    luận là gì?
  back: Đồng ý rồi cố tình trì hoãn hoặc nói mỉa mai trong tình huống giả định; một
    lần quên việc, thở dài hay nói chưa rõ không đủ suy ra ác ý hoặc gán nhãn con
    người.
  source_lesson: LifeSkills/notes/module-2/week-07-assertiveness.md
  version: 1.1.0
  tags:
  - passive-aggressive
  - workplace
  - module-2
- id: fc-ls-w07-004
  concept: Kỹ thuật DESC
  front: Bốn bước của kỹ thuật DESC để giải quyết sự không hài lòng một cách quyết
    đoán là gì?
  back: D (Describe - Mô tả sự việc khách quan); E (Express - Bày tỏ cảm xúc và góc
    nhìn); S (Specify - Đề xuất giải pháp/yêu cầu cụ thể); C (Consequences - Nêu rõ
    hệ quả tích cực khi thực hiện).
  source_lesson: LifeSkills/notes/module-2/week-07-assertiveness.md
  version: 1.0.0
  tags:
  - desc-technique
  - conflict-management
  - module-2
- id: fc-ls-w07-005
  concept: Kỹ thuật Đĩa hát vỡ (Broken Record)
  front: Kỹ thuật Broken Record áp dụng trong tình huống nào và cách thực hiện ra
    sao?
  back: 'Áp dụng khi đối phương liên tục nài nỉ hoặc đánh trống lảng. Thực hiện: Bình
    tĩnh lặp lại thông điệp/lời từ chối cốt lõi với cùng tông giọng mà không tranh
    cãi hay thay đổi nội dung.'
  source_lesson: LifeSkills/notes/module-2/week-07-assertiveness.md
  version: 1.0.0
  tags:
  - broken-record
  - persistence
  - module-2
- id: fc-ls-w07-006
  concept: Kỹ thuật Bịt sương mù (Fogging)
  front: Kỹ thuật Fogging giúp ứng phó với những lời chỉ trích tiêu cực vô lý như
    thế nào?
  back: 'Đồng ý với phần sự thật hợp lý trong lời chỉ trích hoặc đồng ý về mặt khả
    năng xảy ra, nhưng không nhận lấy sự nhục mạ cá nhân: ''Đúng là dự án này bị trễ
    hạn, và chúng tôi đang tập trung khắc phục''.'
  source_lesson: LifeSkills/notes/module-2/week-07-assertiveness.md
  version: 1.0.0
  tags:
  - fogging
  - handling-criticism
  - module-2
- id: fc-ls-w07-007
  concept: Kỹ thuật Truy vấn tiêu cực (Negative Inquiry)
  front: Mục đích của kỹ thuật Negative Inquiry khi nhận phản hồi chỉ trích mơ hồ
    là gì?
  back: 'Chủ động đặt câu hỏi để làm rõ sự thật đằng sau lời chỉ trích nhằm bóc tách
    dữ kiện: ''Bạn có thể chỉ rõ điểm nào trong bài thuyết trình mà bạn thấy chưa
    thuyết phục không?''.'
  source_lesson: LifeSkills/notes/module-2/week-07-assertiveness.md
  version: 1.0.0
  tags:
  - negative-inquiry
  - feedback
  - module-2
- id: fc-ls-w07-008
  concept: Nguyên tắc 'Thông điệp Tôi' (I-Statements)
  front: Tại sao nên dùng câu bắt đầu bằng 'Tôi' thay vì 'Bạn' khi góp ý?
  back: Câu bắt đầu bằng 'Bạn' ('Bạn luôn đi trễ') dễ quy chụp và có thể mời gọi phòng
    thủ. Câu 'Tôi' ('Tôi cảm thấy lo lắng khi cuộc họp bị trễ') tập trung vào trải
    nghiệm của người nói nhưng vẫn cần dữ kiện cụ thể.
  source_lesson: LifeSkills/notes/module-2/week-07-assertiveness.md
  version: 1.0.0
  tags:
  - i-statements
  - feedback
  - module-2
- id: fc-ls-w07-009
  concept: Ngôn ngữ cơ thể quyết đoán
  front: Một tư thế quyết đoán (Assertive Posture) bao gồm các đặc điểm ngoại hình
    nào?
  back: Có thể giữ tư thế ổn định, vai thả lỏng, giọng rõ và tốc độ có kiểm soát;
    ánh mắt và khoảng cách cần điều chỉnh theo văn hóa, khuyết tật, bối cảnh và cảm
    giác an toàn, không có một tư thế đúng cho mọi người.
  source_lesson: LifeSkills/notes/module-2/week-07-assertiveness.md
  version: 1.0.0
  tags:
  - body-language
  - confidence
  - module-2
- id: fc-ls-w07-010
  concept: Tuyên ngôn Nhân quyền Cá nhân
  front: Theo tâm lý học quyết đoán, những quyền cơ bản nào mỗi cá nhân luôn có trong
    giao tiếp?
  back: Trong khung giao tiếp, một người có thể nói 'Tôi không biết', đổi ý, thừa
    nhận sai lầm và từ chối mà không bịa cớ; các lựa chọn giao tiếp này không tự động
    thay thế nghĩa vụ hợp đồng, pháp lý hoặc an toàn.
  source_lesson: LifeSkills/notes/module-2/week-07-assertiveness.md
  version: 1.0.0
  tags:
  - assertive-rights
  - mindset
  - module-2
- id: fc-ls-w07-011
  concept: Xử lý tình huống bị chèn ép trong đàm phán
  front: Khi bị đối phương lấn lướt và ngắt lời liên tục trong cuộc họp, người quyết
    đoán sẽ làm gì?
  back: 'Giữ bình tĩnh, giơ tay nhẹ nhàng và nói với giọng vững vàng: ''Xin lỗi, tôi
    chưa nói xong phần của mình. Hãy để tôi hoàn thành ý này rồi sẽ lắng nghe ý kiến
    của bạn''.'
  source_lesson: LifeSkills/notes/module-2/week-07-assertiveness.md
  version: 1.0.0
  tags:
  - handling-interruptions
  - meetings
  - module-2
- id: fc-ls-w07-012
  concept: Từ chối đề nghị từ cấp trên một cách chuyên nghiệp
  front: Làm thế nào để từ chối nhận thêm việc ngoài khả năng từ sếp một cách quyết
    đoán?
  back: 'Trình bày khối lượng công việc hiện tại và đề nghị cấp trên quyết định thứ
    tự ưu tiên: ''Nếu nhận dự án mới này, dự án A hoặc B sẽ phải lùi hạn. Anh/chị
    muốn tôi ưu tiên dự án nào trước?''.'
  source_lesson: LifeSkills/notes/module-2/week-07-assertiveness.md
  version: 1.0.0
  tags:
  - workplace-negotiation
  - prioritization
  - module-2
- id: fc-ls-w07-013
  concept: Bẫy cảm giác 'Mình quá đáng' sau khi quyết đoán
  front: Sau khi nêu giới hạn, cảm giác mình quá đáng có đủ chứng minh mình đã cư
    xử sai không?
  back: Không. Quan sát lời nói, bối cảnh, nghĩa vụ và phản hồi cụ thể. Có thể khó
    chịu khi đổi cách giao tiếp, nhưng bài này không suy ra cơ chế não bộ hay chẩn
    đoán từ cảm giác đó.
  source_lesson: LifeSkills/notes/module-2/week-07-assertiveness.md
  version: 1.1.0
  tags:
  - cognitive-dissonance
  - reframing
  - module-2
- id: fc-ls-w07-014
  concept: Quyết đoán không đồng nghĩa với luôn đạt được mục đích
  front: Mục tiêu luyện quyết đoán hướng vào hành động của mình hay kết quả người
    khác?
  back: Luyện cách nói, lựa chọn và giới hạn trong khả năng của mình; không thể bảo
    đảm phản ứng của người khác hoặc kiểm soát hoàn toàn hành vi trong mọi hoàn cảnh.
  source_lesson: LifeSkills/notes/module-2/week-07-assertiveness.md
  version: 1.1.0
  tags:
  - locus-of-control
  - self-respect
  - module-2
- id: fc-ls-w07-015
  concept: Kỹ thuật Thỏa hiệp khả thi (Workable Compromise)
  front: Khi cả hai bên đều quyết đoán giữ quyền lợi chính đáng nhưng xung đột mục
    tiêu, giải pháp là gì?
  back: Tìm kiếm một sự thỏa hiệp có thể thực thi mà không làm tổn hại đến giá trị
    cốt lõi hay lòng tự trọng của cả hai bên.
  source_lesson: LifeSkills/notes/module-2/week-07-assertiveness.md
  version: 1.0.0
  tags:
  - compromise
  - negotiation
  - module-2
