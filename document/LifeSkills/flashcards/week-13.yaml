deck_id: deck-ls-w13
subject: LifeSkills
lesson_id: week-13-time-management
version: 1.2.0
description: 'Ôn tập W13: ưu tiên, nhịp làm, năng lượng và giới hạn của heuristic.'
cards:
- id: fc-ls-w13-001
  concept: Ma trận Eisenhower
  front: Ma trận Eisenhower dùng hai trục nào?
  back: 'Khẩn cấp và quan trọng: Q1 làm ngay hoặc chia mốc, Q2 lên lịch, Q3 ủy quyền/gom, Q4 cắt hoặc giới hạn; nhãn cần xét theo bối cảnh.'
  source_lesson: LifeSkills/notes/module-4/week-13-time-management.md
  version: 1.2.0
  tags: [eisenhower, prioritization, module-4]
- id: fc-ls-w13-002
  concept: Góc phần tư thành công (Quadrant 2)
  front: Vì sao Q2 (quan trọng nhưng không khẩn) đáng được lên lịch?
  back: Q2 gồm học kỹ năng, sức khỏe, quan hệ và kế hoạch dài hạn. Nếu luôn bỏ qua, một số việc có thể trở thành Q1; đây là lý do lập lịch, không phải bảo đảm mọi việc sẽ tránh khủng hoảng.
  source_lesson: LifeSkills/notes/module-4/week-13-time-management.md
  version: 1.2.0
  tags: [quadrant-2, strategic-focus, module-4]
- id: fc-ls-w13-003
  concept: Định luật Parkinson như heuristic
  front: Parkinson được dùng trong bài như thế nào?
  back: Mệnh đề “công việc có xu hướng giãn theo thời gian được cấp” là quan sát/heuristic lịch sử, không phải định luật tâm lý phổ quát. Có thể thử deadline nội bộ ngắn vừa phải, nhưng không ép deadline nguy hiểm hoặc bỏ qua chất lượng, nghỉ và trách nhiệm.
  source_lesson: LifeSkills/notes/module-4/week-13-time-management.md
  version: 1.2.0
  tags: [parkinsons-law, deadlines, module-4]
- id: fc-ls-w13-004
  concept: Kỹ thuật Pomodoro
  front: Cấu trúc Pomodoro thường dùng là gì và giới hạn nào cần nhớ?
  back: 25 phút làm và 5 phút nghỉ, sau vài vòng nghỉ dài hơn. Đây là nhịp thử nghiệm, không phải quy luật sinh học; nhiệm vụ cần dòng chảy có thể hợp block dài hơn.
  source_lesson: LifeSkills/notes/module-4/week-13-time-management.md
  version: 1.2.0
  tags: [pomodoro, focus, module-4]
- id: fc-ls-w13-005
  concept: Phân bổ khối thời gian (Time Blocking)
  front: Time Blocking khác to-do list ở điểm nào?
  back: 'To-do list nêu việc; time blocking đặt việc vào khoảng giờ cụ thể và chừa buffer. Ví dụ: 7:30–9:00 viết 600 từ, 15 phút cuối làm buffer, dừng đúng giờ để review; lịch vẫn phải điều chỉnh khi hoàn cảnh đổi.'
  source_lesson: LifeSkills/notes/module-4/week-13-time-management.md
  version: 1.2.0
  tags: [time-blocking, calendar-management, module-4]
- id: fc-ls-w13-006
  concept: Chi phí chuyển đổi ngữ cảnh
  front: Vì sao bài không dùng con số 40% cho attention residue?
  back: Chuyển đổi có thể làm tăng chi phí quay lại và lỗi, nhưng mức ảnh hưởng phụ thuộc nhiệm vụ và người. Không có phần trăm phổ quát được xác minh; giảm ngắt quãng rồi quan sát đầu ra.
  source_lesson: LifeSkills/notes/module-4/week-13-time-management.md
  version: 1.2.0
  tags: [context-switching, attention-residue, module-4]
- id: fc-ls-w13-007
  concept: Quản lý năng lượng
  front: Vì sao quản lý năng lượng bổ sung cho quản lý thời gian?
  back: 24 giờ là giới hạn lịch, còn khả năng chú ý và sức bền thay đổi theo ngủ, nghỉ, sức khỏe và hoàn cảnh. Xếp việc khó lúc mình tỉnh hơn có thể hữu ích; năng lượng không vô hạn và không bảo đảm năng suất tăng nhiều lần.
  source_lesson: LifeSkills/notes/module-4/week-13-time-management.md
  version: 1.2.0
  tags: [energy-management, recovery, module-4]
- id: fc-ls-w13-008
  concept: Nhịp sinh học và chronotype
  front: Chronotype nên ảnh hưởng việc xếp lịch ra sao?
  back: Chronotype là xu hướng thời điểm tỉnh táo khác nhau. Dùng nhật ký quan sát để thử đặt việc khó vào lúc phù hợp; không kê đơn “chim sớm/cú đêm” hay giờ cố định cho mọi người.
  source_lesson: LifeSkills/notes/module-4/week-13-time-management.md
  version: 1.2.0
  tags: [chronotypes, circadian-rhythm, module-4]
- id: fc-ls-w13-009
  concept: Quy tắc 2 phút của GTD
  front: Quy tắc 2 phút trong GTD quy định điều gì?
  back: Nếu việc thật sự hoàn tất trong khoảng hai phút và làm ngay không phá ưu tiên, xử lý ngay; nếu không, ghi lại, phân loại hoặc lên lịch. Đây là heuristic, không phải lệnh chen mọi việc vào hiện tại.
  source_lesson: LifeSkills/notes/module-4/week-13-time-management.md
  version: 1.2.0
  tags: [two-minute-rule, gtd, module-4]
- id: fc-ls-w13-010
  concept: Eat That Frog
  front: Eat That Frog nhắc điều gì khi bắt đầu ngày?
  back: Chọn một việc quan trọng và khó để bắt đầu, có thể chia thành bước nhỏ. Đây là lời nhắc ưu tiên, không phải yêu cầu làm lúc sáng, ép ý chí hay bỏ qua ăn ngủ và hoàn cảnh.
  source_lesson: LifeSkills/notes/module-4/week-13-time-management.md
  version: 1.2.0
  tags: [eat-that-frog, priorities, module-4]
- id: fc-ls-w13-011
  concept: Batching tác vụ
  front: Batching vận hành ra sao?
  back: Gom email, tin nhắn hoặc giấy tờ tương đồng vào một phiên để giảm chuyển đổi. Chọn phiên theo deadline và nghĩa vụ phản hồi; không phải mọi việc đều phải đợi cuối ngày.
  source_lesson: LifeSkills/notes/module-4/week-13-time-management.md
  version: 1.2.0
  tags: [batch-processing, efficiency, module-4]
- id: fc-ls-w13-012
  concept: Pareto 80/20
  front: Dùng Pareto 80/20 trong công việc cá nhân thế nào cho đúng?
  back: Dùng như câu hỏi tìm đầu vào có thể đóng góp không cân xứng trong một bối cảnh, rồi kiểm tra bằng dữ liệu nhiệm vụ. Tỷ lệ 80/20 không phải định luật hay bảo đảm kết quả.
  source_lesson: LifeSkills/notes/module-4/week-13-time-management.md
  version: 1.2.0
  tags: [pareto-principle, leverage, module-4]
- id: fc-ls-w13-013
  concept: Productive procrastination
  front: Productive Procrastination là gì?
  back: Là lấp ngày bằng việc vặt có vẻ hữu ích để né việc cốt lõi khó chịu. Dấu hiệu là việc phụ tăng nhưng đầu ra chính đứng yên; đặt một đầu ra nhỏ trước khi xử lý việc phụ.
  source_lesson: LifeSkills/notes/module-4/week-13-time-management.md
  version: 1.2.0
  tags: [productive-procrastination, avoidance, module-4]
- id: fc-ls-w13-014
  concept: Thiết kế môi trường
  front: Hai cách giảm xao nhãng khi làm Deep Work là gì?
  back: Để điện thoại ngoài tầm với, tắt thông báo, chặn trang gây phân tán hoặc báo trước thời điểm phản hồi. Chọn cách phù hợp quyền kiểm soát môi trường và trách nhiệm của bạn.
  source_lesson: LifeSkills/notes/module-4/week-13-time-management.md
  version: 1.2.0
  tags: [deep-work, environment-design, module-4]
- id: fc-ls-w13-015
  concept: Shutdown ritual
  front: Shutdown ritual nên gồm gì và không nên hứa gì?
  back: Ghi việc đã xong, chuyển việc còn lại thành bước tiếp theo và xem lịch ngày mai; câu “shutdown complete” chỉ là tín hiệu cá nhân. Không hứa nó chắc chắn giải phóng Zeigarnik hay bảo đảm nghỉ ngơi.
  source_lesson: LifeSkills/notes/module-4/week-13-time-management.md
  version: 1.2.0
  tags: [shutdown-ritual, zeigarnik-effect, module-4]

