deck_id: "deck-ls-w03"
subject: "LifeSkills"
lesson_id: "week-03-mindset-self-compassion"
version: "1.0.0"
description: "Thẻ truy hồi chủ động cho Growth Mindset (Carol Dweck), False Growth Mindset và Lòng tự trắc ẩn 3 thành phần (Kristin Neff)."

cards:
  - id: "fc-ls-w03-001"
    concept: "Tư duy phát triển (Growth Mindset)"
    front: "Điểm khác biệt cốt lõi giữa Tư duy cố định (Fixed Mindset) và Tư duy phát triển (Growth Mindset) là gì?"
    back: "Fixed Mindset tin rằng trí tuệ và tài năng là tĩnh và cố định bẩm sinh. Growth Mindset tin rằng các năng lực có thể được trau dồi qua thời gian, nỗ lực có phương pháp, chiến lược hiệu quả và học hỏi từ phản hồi."
    source_lesson: "LifeSkills/notes/module-1/week-03-mindset-self-compassion.md#31-tư-duy-cố-định-vs-tư-duy-phát-triển-carol-dweck"
    version: "1.0.0"
    claim_ids: ["W03-C01"]
    tags: ["growth-mindset", "dweck", "learning", "module-1"]

  - id: "fc-ls-w03-002"
    concept: "Tư duy phát triển giả tạo (False Growth Mindset)"
    front: "Thế nào là 'False Growth Mindset' và tại sao chỉ ca ngợi nỗ lực suông lại gây phản tác dụng?"
    back: "Là việc chỉ khen ngợi nỗ lực bề ngoài mà không hướng dẫn người học đánh giá lại chiến lược, công cụ hay tìm kiếm sự hỗ trợ mới. Nỗ lực không hiệu quả là lý do kiểm tra phương pháp và nguồn lực; không phải bằng chứng rằng mọi người sẽ kiệt sức."
    source_lesson: "LifeSkills/notes/module-1/week-03-mindset-self-compassion.md#41-bẫy-tư-duy-phát-triển-giả-tạo-false-growth-mindset"
    version: "1.0.0"
    claim_ids: ["W03-C01"]
    tags: ["false-growth-mindset", "pedagogy", "limitations", "module-1"]

  - id: "fc-ls-w03-003"
    concept: "Ba thành phần của Lòng tự trắc ẩn (Kristin Neff)"
    front: "Ba thành phần cốt lõi của Lòng tự trắc ẩn (Self-Compassion) theo Kristin Neff là gì?"
    back: "1. Lòng tốt với bản thân (Self-Kindness vs. Self-Judgment); 2. Tính nhân loại chung (Common Humanity vs. Isolation); 3. Chánh niệm nhận biết cân bằng (Mindfulness vs. Over-Identification)."
    source_lesson: "LifeSkills/notes/module-1/week-03-mindset-self-compassion.md#32-ba-thành-phần-của-lòng-tự-trắc-ẩn-kristin-neff"
    version: "1.0.0"
    claim_ids: ["W03-C02"]
    tags: ["self-compassion", "kristin-neff", "resilience", "module-1"]

  - id: "fc-ls-w03-004"
    concept: "Lòng tự trắc ẩn vs. Lòng tự trọng"
    front: "Lòng tự trắc ẩn (Self-Compassion) khác với Lòng tự trọng (Self-Esteem) như thế nào khi đối diện thất bại?"
    back: "Self-Esteem có thể gắn với thành tích, phản hồi hoặc so sánh tùy bối cảnh và không phải lúc nào cũng mong manh. Self-Compassion nhấn mạnh đối xử tử tế với bản thân khi thất bại; nghiên cứu Neff & Vonk báo cáo các liên hệ tương quan trong mẫu cụ thể, không phải bảo đảm hoặc luôn vượt trội."
    source_lesson: "LifeSkills/notes/module-1/week-03-mindset-self-compassion.md#42-so-sánh-lòng-tự-trắc-ẩn-self-compassion-với-các-khái-niệm-tương-cận"
    version: "1.0.0"
    claim_ids: ["W03-C02"]
    tags: ["self-esteem", "comparison", "psychology", "module-1"]

  - id: "fc-ls-w03-005"
    concept: "Từ 'CHƯA' (The Power of Yet)"
    front: "Vai trò của từ 'CHƯA (YET)' trong việc định hình lại độc thoại nội tâm là gì?"
    back: "Biến một phán xét tuyệt đối mang tính cố định ('Tôi không làm được việc này') thành một trạng thái đang trong quá trình phát triển ('Tôi CHƯA làm được việc này lúc này'), mở ra không gian cho học hỏi và chiến lược mới."
    source_lesson: "LifeSkills/notes/module-1/week-03-mindset-self-compassion.md#7-action-steps--self-practice"
    version: "1.0.0"
    claim_ids: ["W03-C01"]
    tags: ["power-of-yet", "self-talk", "habits", "module-1"]

