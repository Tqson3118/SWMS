lesson_id: week-15-networking-social-skills
version: 1.0.0
description: 'Bộ thẻ Flashcard chuẩn hóa ôn tập ngắt quãng Tuần 15: Kỹ năng Kết nối Xã hội và Xây dựng Mạng lưới Giá trị'
cards:
- id: fc-ls-w15-001
  concept: Bản chất của Mạng lưới quan hệ chân thành
  front: Networking lành mạnh khác biệt như thế nào so với việc lợi dụng quan hệ thực dụng?
  back: Networking chân thành là quá trình xây dựng mối quan hệ tin cậy lẫn nhau dựa trên việc trao giá trị trước, thay vì thái độ thực dụng chỉ tiếp cận khi cần nhờ vả hoặc thu thập danh thiếp.
  source_lesson: LifeSkills/notes/module-4/week-15-networking-social-skills.md
  version: 1.0.0
  tags:
  - networking-foundations
  - giver-mindset
  - module-4
- id: fc-ls-w15-002
  concept: Sức mạnh của liên kết yếu (The Strength of Weak Ties)
  front: Theo Granovetter, liên kết yếu có thể làm gì trong cấu trúc mạng lưới?
  back: Granovetter mô tả liên kết yếu có thể bắc cầu sang nhóm thông tin khác và hỗ trợ khuếch tán thông tin/cơ hội di động. Bài báo không chứng minh rằng mọi người nhận phần lớn cơ hội việc làm từ liên kết yếu hoặc rằng chúng luôn tốt hơn liên kết mạnh.
  source_lesson: LifeSkills/notes/module-4/week-15-networking-social-skills.md
  version: 1.0.0
  tags:
  - weak-ties
  - granovetter-study
  - module-4
- id: fc-ls-w15-003
  concept: Tư duy Người trao đi (Givers vs Takers - Adam Grant)
  front: “Giver có chiến lược” là nhãn thực hành nào trong networking?
  back: “Giver có chiến lược” là nhãn thực hành cho người giúp đỡ với ranh giới và sự tự nguyện. Đây không phải bằng chứng rằng họ luôn đạt đỉnh cao hay có kết quả nghề nghiệp cao nhất; hãy xét bối cảnh và chi phí.
  source_lesson: LifeSkills/notes/module-4/week-15-networking-social-skills.md
  version: 1.0.0
  tags:
  - give-and-take
  - adam-grant
  - module-4
- id: fc-ls-w15-004
  concept: Quy tắc 5 phút giúp đỡ (5-Minute Favor)
  front: Một hỗ trợ nhỏ tự nguyện (5-minute favor) có thể được thực hành thế nào?
  back: 'Một thực hành tự nguyện: đề nghị hỗ trợ nhỏ, như giới thiệu hai người khi cả hai đồng ý hoặc gửi tài liệu hữu ích. “5 phút” là ví dụ về quy mô, không phải định luật hay lời hứa kết quả.'
  source_lesson: LifeSkills/notes/module-4/week-15-networking-social-skills.md
  version: 1.0.0
  tags:
  - five-minute-favor
  - generosity
  - module-4
- id: fc-ls-w15-005
  concept: Nghệ thuật Small Talk mở đầu
  front: Mục đích thực sự của Small Talk trong một sự kiện giao lưu là gì?
  back: Không phải để thể hiện sự thông thái, mà là tạo sự thoải mái an toàn ban đầu và dò tìm các điểm chung (Common ground) trước khi bước vào các chủ đề sâu hơn.
  source_lesson: LifeSkills/notes/module-4/week-15-networking-social-skills.md
  version: 1.0.0
  tags:
  - small-talk
  - rapport
  - module-4
- id: fc-ls-w15-006
  concept: Kỹ thuật Đặt câu hỏi mở để chuyển sâu
  front: Cách chuyển từ câu hỏi xã giao khô cứng ('Bạn làm nghề gì?') sang câu hỏi kết nối có chiều sâu?
  back: 'Hỏi về đam mê và trải nghiệm: ''Điều gì trong công việc khiến bạn hào hứng nhất dạo gần đây?'' hoặc ''Cơ duyên nào đưa bạn đến với lĩnh vực này?''.'
  source_lesson: LifeSkills/notes/module-4/week-15-networking-social-skills.md
  version: 1.0.0
  tags:
  - open-questions
  - deep-talk
  - module-4
- id: fc-ls-w15-007
  concept: Kỹ năng Lắng nghe có mục đích trong giao lưu
  front: Khi lắng nghe, nên ghi nhớ điều gì và tôn trọng giới hạn nào?
  back: Tên của họ và điều họ tự chọn chia sẻ; không biến cuộc trò chuyện thành việc thu thập “thách thức lớn nhất” hay sở thích riêng tư. Chỉ ghi nhớ điều phù hợp để follow-up tôn trọng.
  source_lesson: LifeSkills/notes/module-4/week-15-networking-social-skills.md
  version: 1.0.0
  tags:
  - active-listening
  - memory
  - module-4
- id: fc-ls-w15-008
  concept: Nguyên tắc Follow-up trong vòng 24–48 giờ
  front: Một gợi ý follow-up trong vòng 24–48 giờ có thể giúp ích gì?
  back: Follow-up sớm, chẳng hạn trong 24–48 giờ, có thể giữ lại bối cảnh cuộc gặp. Đây là gợi ý thực hành; không có cơ sở ở đây cho con số 80% hay thời hạn bắt buộc. Tin nhắn nên ngắn, nhắc điểm chung và cho phép không trả lời.
  source_lesson: LifeSkills/notes/module-4/week-15-networking-social-skills.md
  version: 1.0.0
  tags:
  - follow-up
  - relationship-building
  - module-4
- id: fc-ls-w15-009
  concept: Cấu trúc tin nhắn Follow-up hiệu quả
  front: Một mẫu follow-up tùy chọn có thể gồm ba phần nào?
  back: 1. Nhắc lại bối cảnh gặp gỡ và chủ đề thú vị hai bên đã nói; 2. Đính kèm một giá trị (liên kết bài báo, tài liệu đã hứa chia sẻ); 3. Lời chúc và đề xuất giữ liên lạc nhẹ nhàng không đòi hỏi.
  source_lesson: LifeSkills/notes/module-4/week-15-networking-social-skills.md
  version: 1.0.0
  tags:
  - email-template
  - communication
  - module-4
- id: fc-ls-w15-010
  concept: Duy trì mạng lưới 'ngủ đông' (Dormant Ties)
  front: Dormant Ties là gì và cách kích hoạt lại mối quan hệ cũ mà không gây cảm giác vụ lợi?
  back: 'Là những người từng thân thiết nhưng lâu năm không liên lạc. Kích hoạt lại bằng tin nhắn chân thành: ''Hôm nay tình cờ đọc bài viết này nhớ đến dự án xưa của hai đứa, dạo này cậu thế nào?'' mà KHÔNG kèm lời nhờ vả.'
  source_lesson: LifeSkills/notes/module-4/week-15-networking-social-skills.md
  version: 1.0.0
  tags:
  - dormant-ties
  - reconnecting
  - module-4
- id: fc-ls-w15-011
  concept: Nhịp độ kết nối phù hợp với người hướng nội
  front: Người hướng nội có thể chọn cách nào để kết nối vừa sức?
  back: Có thể chọn một cuộc trò chuyện 1–1 hoặc vài cuộc trò chuyện ngắn ở nhịp độ phù hợp. Đây là lựa chọn bối cảnh, không phải “lợi thế” cố định hay mục tiêu số lượng 2–3 người.
  source_lesson: LifeSkills/notes/module-4/week-15-networking-social-skills.md
  version: 1.0.0
  tags:
  - introvert-advantages
  - deep-connection
  - module-4
- id: fc-ls-w15-012
  concept: Trở thành Người kết nối (Superconnector)
  front: Thế nào là một 'Superconnector' và làm sao để đóng vai trò này?
  back: Là vai trò thực hành nhận ra hai người có thể phù hợp và chỉ giới thiệu sau khi hỏi ý kiến, tôn trọng quyền từ chối. Không có tiêu chí hoa hồng hay bảo đảm hợp tác.
  source_lesson: LifeSkills/notes/module-4/week-15-networking-social-skills.md
  version: 1.0.0
  tags:
  - superconnector
  - ecosystem
  - module-4
- id: fc-ls-w15-013
  concept: Bẫy chỉ chơi với nhóm cùng ngành (Echo Chamber)
  front: Giao lưu ngoài ngành có thể bổ sung điều gì và cần giới hạn gì?
  back: Gặp người ngoài ngành có thể thêm góc nhìn và giảm sự đồng nhất của mạng lưới; không bảo đảm tạo ra đột phá. Hãy chọn tương tác phù hợp mục tiêu và tôn trọng thời gian.
  source_lesson: LifeSkills/notes/module-4/week-15-networking-social-skills.md
  version: 1.0.0
  tags:
  - diversity
  - creative-thinking
  - module-4
- id: fc-ls-w15-014
  concept: Quy tắc tôn trọng thời gian của người cố vấn (Mentors)
  front: Một cách hỏi người cố vấn tôn trọng thời gian là gì?
  back: Đặt câu hỏi cực kỳ cụ thể đã qua nghiên cứu kỹ ('Tôi đang phân vân giữa giải pháp A và B vì lý do C, anh thấy góc nhìn nào hợp lý hơn?'), không hỏi câu chung chung mơ hồ 'Làm sao để thành công?'.
  source_lesson: LifeSkills/notes/module-4/week-15-networking-social-skills.md
  version: 1.0.0
  tags:
  - mentorship
  - respecting-time
  - module-4
- id: fc-ls-w15-015
  concept: Xây dựng thương hiệu cá nhân qua sự nhất quán
  front: Có thể thực hành sự nhất quán và chính trực qua hành vi nào?
  back: 'Sự nhất quán và chính trực có thể được thực hành bằng giữ lời, hoàn thành cam kết nhỏ, nói rõ giới hạn và đối xử tử tế kể cả khi không có lợi ích trực tiếp. Đây là chuẩn mực tác giả, không phải bảo đảm thương hiệu hay thành công.'
  source_lesson: LifeSkills/notes/module-4/week-15-networking-social-skills.md
  version: 1.0.0
  tags:
  - reputation
  - integrity
  - module-4
