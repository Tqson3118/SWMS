deck_id: deck-ls-w05
subject: LifeSkills
lesson_id: week-05-active-listening
version: 1.0.0
description: 'Bộ thẻ Flashcard chuẩn hóa ôn tập ngắt quãng Tuần 05: Lắng nghe Tích cực và Thấu cảm'
cards:
- id: fc-ls-w05-001
  concept: Bản chất của Lắng nghe Tích cực (Active Listening)
  front: Lắng nghe tích cực khác gì so với việc chỉ nghe thụ động các từ ngữ của đối phương?
  back: Lắng nghe tích cực là tập hợp hành vi hướng sự chú ý vào nội dung và cảm xúc được nói ra, rồi phản hồi để
    kiểm tra cách hiểu trước khi phản bác hay cho lời khuyên. Cách này không bảo đảm bạn đã hiểu đúng; người nói
    cần có cơ hội sửa.
  source_lesson: LifeSkills/notes/module-2/week-05-active-listening.md
  version: 1.0.0
  tags:
  - active-listening
  - communication
  - module-2
  claim_ids:
  - W05-C01
- id: fc-ls-w05-002
  concept: Ba tầng lắng nghe
  front: Ba chế độ chú ý do bài học dùng để tự quan sát là gì, và giới hạn của bản đồ này?
  back: Chú ý vào câu trả lời của mình; vào lời/giọng người nói; hoặc thêm bối cảnh và tín hiệu cơ thể rồi kiểm
    tra lại. Đây là heuristic luyện tập, không phải taxonomy khoa học, thứ bậc hay khả năng đọc cảm xúc ngầm.
  source_lesson: LifeSkills/notes/module-2/week-05-active-listening.md
  version: 1.0.0
  tags:
  - levels-of-listening
  - attention
  - module-2
  claim_ids:
  - W05-C04
- id: fc-ls-w05-003
  concept: Kỹ thuật tóm lược (Summarizing)
  front: Mục đích và cách thực hành kỹ thuật tóm lược trong một cuộc hội thoại phức tạp là gì?
  back: 'Tóm tắt các điểm then chốt bằng lời của mình để đối phương thấy họ đã được nghe trọn vẹn: ''Để chắc chắn
    mình hiểu đúng, những điểm cốt lõi bạn đang quan tâm gồm A, B và C, đúng không?''.'
  source_lesson: LifeSkills/notes/module-2/week-05-active-listening.md
  version: 1.0.0
  tags:
  - summarizing
  - clarity
  - module-2
  claim_ids:
  - W05-C01
- id: fc-ls-w05-004
  concept: Kỹ thuật diễn giải lại (Paraphrasing)
  front: Paraphrasing trong lắng nghe tích cực là gì và cần tránh điều gì khi sử dụng?
  back: Là diễn đạt lại ý kiến của đối phương bằng ngôn ngữ của mình để kiểm tra mức độ hiểu. Cần tránh suy diễn
    thêm ý đồ xấu hoặc chèn định kiến cá nhân vào lời diễn giải.
  source_lesson: LifeSkills/notes/module-2/week-05-active-listening.md
  version: 1.0.0
  tags:
  - paraphrasing
  - understanding
  - module-2
  claim_ids:
  - W05-C02
- id: fc-ls-w05-005
  concept: Phản chiếu cảm xúc (Emotional Reflection)
  front: Kỹ thuật phản chiếu cảm xúc (Reflecting feelings) hoạt động như thế nào?
  back: 'Đưa ra một phỏng đoán có thể sửa về trạng thái cảm xúc người nói, thay vì khẳng định bạn biết chắc: ''Có
    vẻ như sự việc đó khiến bạn cảm thấy thất vọng và bế tắc?''.'
  source_lesson: LifeSkills/notes/module-2/week-05-active-listening.md
  version: 1.0.0
  tags:
  - emotional-reflection
  - empathy
  - module-2
  claim_ids:
  - W05-C01
- id: fc-ls-w05-006
  concept: Bẫy đưa lời khuyên sớm (Fix-it Trap)
  front: Bài tập tránh góp ý sớm yêu cầu làm gì, và vì sao không suy ra động cơ người nghe?
  back: Hỏi người nói muốn được nghe hay nhận góp ý trước. Góp ý khi chưa hỏi có thể bị tiếp nhận là coi nhẹ cảm
    xúc, nhưng không suy ra rằng mọi người góp ý đều muốn giải tỏa bất an hoặc gây hại.
  source_lesson: LifeSkills/notes/module-2/week-05-active-listening.md
  version: 1.0.0
  tags:
  - fix-it-trap
  - empathy-blocks
  - module-2
  claim_ids:
  - W05-C04
- id: fc-ls-w05-007
  concept: Ngôn ngữ phi ngôn ngữ trong lắng nghe
  front: Các tín hiệu cơ thể nào có thể biểu lộ sự chú ý khi lắng nghe, và giới hạn của chúng là gì?
  back: Có thể dùng giao tiếp mắt vừa phải, gật đầu nhẹ, hướng thân người về phía người nói và giữ tư thế cởi mở
    nếu phù hợp văn hóa/cá nhân; đây là tín hiệu chú ý, không phải bằng chứng chắc chắn về sự chân thành hay hiểu
    đúng.
  source_lesson: LifeSkills/notes/module-2/week-05-active-listening.md
  version: 1.0.0
  tags:
  - nonverbal
  - presence
  - module-2
  claim_ids:
  - W05-C02
- id: fc-ls-w05-008
  concept: Sức mạnh của khoảng lặng (Silence)
  front: Khoảng lặng có thể được dùng thế nào khi luyện lắng nghe?
  back: Thử để người nói có thời gian nghĩ thêm, rồi hỏi họ muốn tiếp tục hay dừng. Im lặng không tự tạo an toàn
    hoặc khiến họ chia sẻ sâu hơn; ý nghĩa phụ thuộc người và bối cảnh.
  source_lesson: LifeSkills/notes/module-2/week-05-active-listening.md
  version: 1.0.0
  tags:
  - silence
  - deep-listening
  - module-2
  claim_ids:
  - W05-C04
- id: fc-ls-w05-009
  concept: Câu hỏi mở vs Câu hỏi đóng
  front: Khi nào dùng câu hỏi mở hoặc đóng trong bài tập lắng nghe?
  back: Câu hỏi mở có thể mời người nói diễn đạt thêm; câu hỏi đóng hữu ích để xác nhận một dữ kiện hoặc xin phép.
    Không có loại nào luôn tốt hơn, và người nói có quyền không trả lời.
  source_lesson: LifeSkills/notes/module-2/week-05-active-listening.md
  version: 1.0.0
  tags:
  - questioning
  - open-ended
  - module-2
  claim_ids:
  - W05-C04
- id: fc-ls-w05-010
  concept: Tác hại của việc ngắt lời (Interrupting)
  front: Ngắt lời có thể được tiếp nhận thế nào và cần kiểm tra điều gì?
  back: Ngắt lời lặp lại có thể khiến người nói thấy ít được nghe; hỏi lại và xin phép trước khi chuyển lượt. Không
    suy ra chắc chắn ý định coi thường từ một hành vi; có thể cần ngắt để làm rõ hoặc giữ an toàn.
  source_lesson: LifeSkills/notes/module-2/week-05-active-listening.md
  version: 1.0.0
  tags:
  - communication-pitfalls
  - respect
  - module-2
  claim_ids:
  - W05-C04
- id: fc-ls-w05-011
  concept: Rào cản lắng nghe do định kiến nhận thức
  front: Làm thế nào để nhận diện và khắc phục rào cản thiên kiến xác nhận khi đang lắng nghe quan điểm trái chiều?
  back: 'Tự nhắc nhở bản thân: ''Mục tiêu lúc này là hiểu góc nhìn của họ, không phải để thắng thua'', và chủ động
    tìm kiếm các thông tin chưa từng được bản thân cân nhắc.'
  source_lesson: LifeSkills/notes/module-2/week-05-active-listening.md
  version: 1.0.0
  tags:
  - cognitive-bias
  - mindful-listening
  - module-2
  claim_ids:
  - W05-C04
- id: fc-ls-w05-012
  concept: Lắng nghe xác thực (Validation)
  front: Xác thực cảm xúc (Validation) có đồng nghĩa với việc đồng ý với hành vi của đối phương không?
  back: Không. Xác thực cảm xúc là thừa nhận tính chân thực của cảm xúc mà họ trải qua ('Mình hiểu vì sao bạn thấy
    giận'), không nhất thiết phải tán thành hành vi sai trái của họ.
  source_lesson: LifeSkills/notes/module-2/week-05-active-listening.md
  version: 1.0.0
  tags:
  - validation
  - empathy
  - module-2
  claim_ids:
  - W05-C01
- id: fc-ls-w05-013
  concept: Chuyển hướng và tiếp tục câu chuyện (bài luyện shift/support response)
  front: Hiện tượng Shift-response (kéo sự chú ý về mình) biểu hiện ra sao và cách tránh?
  back: 'Biểu hiện: Vừa nghe bạn kể chuyện liền cướp lời ''Chuyện của bạn nhằm nhò gì, hồi xưa tôi còn bị tệ hơn...''.
    Tránh bằng Support-response: Tập trung hỏi sâu vào câu chuyện của bạn.'
  source_lesson: LifeSkills/notes/module-2/week-05-active-listening.md
  version: 1.0.0
  tags:
  - shift-response
  - support-response
  - module-2
  claim_ids:
  - W05-C04
- id: fc-ls-w05-014
  concept: Lắng nghe trong trạng thái kích hoạt cảm xúc
  front: Khi quá tải trong hội thoại khó, bài tập gợi ý lựa chọn an toàn nào?
  back: Có thể xin tạm dừng, mô tả điều mình quan sát và cân nhắc hỗ trợ phù hợp. Không phải chịu công kích để chứng
    minh biết nghe; hít thở hay ghi chú là lựa chọn thử, không bảo đảm hết giận hoặc đọc đúng ý người kia.
  source_lesson: LifeSkills/notes/module-2/week-05-active-listening.md
  version: 1.0.0
  tags:
  - emotional-regulation
  - difficult-conversations
  - module-2
  claim_ids:
  - W05-C04
- id: fc-ls-w05-015
  concept: Đánh giá mức độ hiệu quả của buổi lắng nghe
  front: Dấu hiệu nào có thể giúp đánh giá một cuộc hội thoại lắng nghe tích cực mà không biến thành tiêu chuẩn
    tuyệt đối?
  back: Dấu hiệu hữu ích là người nói có thể xác nhận hoặc sửa cách bạn hiểu, và có thể nói rõ họ muốn được nghe,
    được hỏi thêm hay cùng nghĩ bước tiếp theo. Không có một phản ứng cơ thể hay kết quả duy nhất nào là 'tiêu chuẩn
    vàng' cho mọi cuộc hội thoại.
  source_lesson: LifeSkills/notes/module-2/week-05-active-listening.md
  version: 1.0.0
  tags:
  - evaluation
  - connection
  - module-2
  claim_ids:
  - W05-C04
