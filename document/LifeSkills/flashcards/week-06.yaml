description: 'Bộ thẻ Flashcard chuẩn hóa ôn tập ngắt quãng Tuần 06: Giao tiếp Phi bạo lực (NVC - Nonviolent Communication)'
cards:
- id: fc-ls-w06-001
  concept: Mô hình 4 bước NVC (OFNR)
  front: Bốn bước cấu thành mô hình Giao tiếp Phi bạo lực của Marshall Rosenberg là gì?
  back: 1. Quan sát không phán xét (Observation); 2. Bộc lộ cảm xúc chân thật (Feeling); 3. Xác định nhu cầu phổ
    quát cốt lõi (Need); 4. Đưa ra yêu cầu cụ thể, tích cực và khả thi (Request).
  source_lesson: LifeSkills/notes/module-2/week-06-nonviolent-communication.md
  version: 1.0.0
  tags:
  - nvc
  - ofnr-framework
  - module-2
  claim_ids:
  - W06-C01
- id: fc-ls-w06-002
  concept: Quan sát vs Đánh giá (Observation vs Evaluation)
  front: Tại sao NVC nhấn mạnh việc tách quan sát thực tế khỏi sự đánh giá/gán nhãn?
  back: Trong khung NVC, tách mô tả hành vi cụ thể khỏi đánh giá giúp giảm nguy cơ người nghe nghe thấy lời gán
    nhãn và phản ứng phòng vệ. Quan sát thuần túy (dữ kiện có thể cùng kiểm tra, như camera ghi lại) tạo nền cho
    đối thoại; đây là nguyên tắc thực hành, không phải cơ chế bảo đảm.
  source_lesson: LifeSkills/notes/module-2/week-06-nonviolent-communication.md
  version: 1.0.0
  tags:
  - observation
  - evaluation
  - module-2
  claim_ids:
  - W06-C01
- id: fc-ls-w06-003
  concept: Cảm xúc thật vs Nhận định giả cảm xúc
  front: Sự khác biệt giữa cảm xúc thực sự (Feeling) và nhận định giả cảm xúc (Faux Feeling) là gì?
  back: Cảm xúc thực thể hiện trạng thái nội tâm ('tôi cảm thấy buồn, lo lắng'). Các cụm như 'tôi thấy bị coi thường,
    bị phản bội, bị thao túng' thường chứa diễn giải về hành vi của người khác, nhưng cũng có thể là cách người
    nói báo cáo trải nghiệm bị hại trong một bối cảnh cụ thể. Hãy hỏi thêm dữ kiện, rồi giúp tách quan sát, cảm
    xúc và nhu cầu; đừng tự động bác bỏ báo cáo tổn hại.
  source_lesson: LifeSkills/notes/module-2/week-06-nonviolent-communication.md
  version: 1.0.0
  tags:
  - feelings
  - faux-feelings
  - module-2
  claim_ids:
  - W06-C01
- id: fc-ls-w06-004
  concept: Nhu cầu phổ quát (Universal Needs)
  front: Theo cách diễn giải của NVC, cảm xúc được liên hệ với điều gì?
  back: Theo cách diễn giải của NVC, cảm xúc được xem là liên quan đến những nhu cầu/giá trị đang được đáp ứng hoặc
    chưa được đáp ứng; đây là lăng kính thực hành của mô hình, không phải kết luận rằng mọi cảm xúc đều có một nguyên
    nhân duy nhất hay phủ nhận tác động của hành vi và hoàn cảnh.
  source_lesson: LifeSkills/notes/module-2/week-06-nonviolent-communication.md
  version: 1.0.0
  tags:
  - needs
  - universal-needs
  - module-2
  claim_ids:
  - W06-C02
- id: fc-ls-w06-005
  concept: Yêu cầu vs Mệnh lệnh (Request vs Demand)
  front: Làm thế nào để phân biệt một lời Yêu cầu (Request) và một Mệnh lệnh áp đặt (Demand)?
  back: Nếu người nghe từ chối mà bị chỉ trích, đổ lỗi hoặc trừng phạt, thì đó là Mệnh lệnh. Một Yêu cầu thực sự
    luôn tôn trọng sự tự do lựa chọn và sẵn sàng đón nhận lời từ chối.
  source_lesson: LifeSkills/notes/module-2/week-06-nonviolent-communication.md
  version: 1.0.0
  tags:
  - request
  - demand
  - module-2
  claim_ids:
  - W06-C02
- id: fc-ls-w06-006
  concept: Ngôn ngữ hươu cao cổ vs Ngôn ngữ chó rừng
  front: Phép ẩn dụ Ngôn ngữ Chó rừng (Jackal) và Ngôn ngữ Hươu cao cổ (Giraffe) trong NVC biểu trưng cho điều gì?
  back: 'Chó rừng: Phán xét, đổ lỗi, trừng phạt và đòi hỏi áp đặt; Hươu cao cổ: Trái tim lớn, tầm nhìn xa, kết nối
    thấu cảm bằng ngôn ngữ của cảm xúc và nhu cầu.'
  source_lesson: LifeSkills/notes/module-2/week-06-nonviolent-communication.md
  version: 1.0.0
  tags:
  - giraffe-language
  - jackal-language
  - module-2
  claim_ids:
  - W06-C03
- id: fc-ls-w06-007
  concept: Tự thấu cảm (Self-Empathy) trong NVC
  front: Thực hành Tự thấu cảm theo NVC khi đang tức giận diễn ra như thế nào?
  back: 'Tạm dừng phản hồi, tự hỏi: ''Hiện tại mình đang quan sát điều gì? Mình đang cảm thấy gì? Nhu cầu nào có
    thể đang quan trọng với mình?'' để tạo khoảng cách trước khi chọn cách đáp lại; bài tập này không bảo đảm biến
    cơn giận thành sự thấu suốt.'
  source_lesson: LifeSkills/notes/module-2/week-06-nonviolent-communication.md
  version: 1.0.0
  tags:
  - self-empathy
  - emotional-regulation
  - module-2
  claim_ids:
  - W06-C01
- id: fc-ls-w06-008
  concept: Công thức bày tỏ bức xúc bằng NVC
  front: Mẫu câu chuẩn để chuyển đổi lời than phiền thành thông điệp NVC là gì?
  back: '''Khi tôi thấy/nghe [Quan sát], tôi cảm thấy [Cảm xúc] vì tôi có nhu cầu [Nhu cầu]. Bạn có thể [Yêu cầu
    cụ thể] được không?''.'
  source_lesson: LifeSkills/notes/module-2/week-06-nonviolent-communication.md
  version: 1.0.0
  tags:
  - nvc-script
  - conflict-resolution
  - module-2
  claim_ids:
  - W06-C01
- id: fc-ls-w06-009
  concept: Yêu cầu bằng ngôn từ hành động tích cực
  front: Tại sao lời yêu cầu trong NVC phải được diễn đạt dưới dạng 'hành động tích cực' thay vì 'điều cấm đoán'?
  back: Nói điều mình KHÔNG muốn ('đừng lướt điện thoại nữa') không chỉ ra hành vi thay thế mong muốn. Cần nói điều
    mình MUỐN đối phương làm ('hãy cùng mình trò chuyện 15 phút không dùng thiết bị').
  source_lesson: LifeSkills/notes/module-2/week-06-nonviolent-communication.md
  version: 1.0.0
  tags:
  - positive-action
  - clarity
  - module-2
  claim_ids:
  - W06-C02
- id: fc-ls-w06-010
  concept: Thấu cảm khi nghe lời trách móc
  front: 'Khi bị ai đó mắng: ''Anh là người vô trách nhiệm!'', người thực hành NVC sẽ xử lý thông tin này như thế
    nào?'
  back: 'Thử dịch lời mắng mỏ thành một phỏng đoán có thể sửa về cảm xúc và nhu cầu: ''Bạn đang thấy mệt mỏi và
    thất vọng vì muốn được hỗ trợ và tin cậy trong công việc phải không?''; người nghe không được khẳng định mình
    biết chắc nội tâm đối phương.'
  source_lesson: LifeSkills/notes/module-2/week-06-nonviolent-communication.md
  version: 1.0.0
  tags:
  - empathic-listening
  - reframing
  - module-2
  claim_ids:
  - W06-C02
- id: fc-ls-w06-011
  concept: Bốn cách tiếp nhận thông điệp tiêu cực
  front: Bài luyện bốn cách tiếp nhận thông điệp tiêu cực gồm những gì?
  back: 1. Tự trách mình (cảm giác tội lỗi); 2. Đổ lỗi cho đối phương (phản công); 3. Nhận thức cảm xúc và nhu cầu
    của mình; 4. Nhận thức cảm xúc và nhu cầu của người khác. Đây là adaptation luyện tập của khóa học; mục four
    ears được CNVC liệt kê nhưng không tuyên bố đã kiểm tra nguyên văn toàn bộ sách Rosenberg.
  source_lesson: LifeSkills/notes/module-2/week-06-nonviolent-communication.md
  version: 1.0.0
  tags:
  - reaction-choices
  - mindfulness
  - module-2
  claim_ids:
  - W06-C03
- id: fc-ls-w06-012
  concept: Yêu cầu kết nối (Connection Request)
  front: Yêu cầu kiểm tra sự kết nối (Connection request) trước khi thảo luận giải pháp là gì?
  back: Hỏi đối phương xem họ cảm thấy thế nào sau khi nghe thông điệp của mình ('Nghe mình chia sẻ như vậy, bạn
    cảm thấy thế nào?') để kiểm tra cách thông điệp được tiếp nhận và tạo cơ hội sửa hiểu lầm.
  source_lesson: LifeSkills/notes/module-2/week-06-nonviolent-communication.md
  version: 1.0.0
  tags:
  - connection-request
  - dialogue
  - module-2
  claim_ids:
  - W06-C02
- id: fc-ls-w06-013
  concept: Biểu đạt lòng biết ơn chân thành theo NVC
  front: Cách khen ngợi hoặc cảm ơn theo NVC khác gì với lời khen hình thức 'Bạn làm giỏi lắm'?
  back: 'Chỉ rõ: 1. Hành động cụ thể người kia đã làm; 2. Nhu cầu nào của mình đã được đáp ứng; 3. Cảm xúc vui mừng,
    nhẹ nhõm hoặc xúc động trào dâng trong mình.'
  source_lesson: LifeSkills/notes/module-2/week-06-nonviolent-communication.md
  version: 1.0.0
  tags:
  - gratitude
  - appreciation
  - module-2
  claim_ids:
  - W06-C03
- id: fc-ls-w06-014
  concept: Giới hạn và tính kiên nhẫn khi áp dụng NVC
  front: Sai lầm phổ biến khi mới bắt đầu học NVC là gì?
  back: Dùng câu chữ NVC một cách máy móc như đọc kịch bản robot hoặc dùng cấu trúc NVC để thao túng người khác,
    thay vì giữ ý niệm chân thành muốn kết nối từ trái tim.
  source_lesson: LifeSkills/notes/module-2/week-06-nonviolent-communication.md
  version: 1.0.0
  tags:
  - pitfalls
  - authenticity
  - module-2
  claim_ids:
  - W06-C02
- id: fc-ls-w06-015
  concept: Sử dụng sức mạnh bảo vệ vs Sức mạnh trừng phạt
  front: Khi nào NVC cho phép sử dụng vũ lực hoặc quyền lực can thiệp?
  back: Trong cách trình bày của Rosenberg, cần phân biệt hành động bảo vệ khẩn cấp (ví dụ kéo đứa trẻ khỏi bánh
    xe tải) với sức mạnh nhằm trừng phạt hoặc trả thù. Đây là nguyên tắc an toàn/đạo đức của khung, không phải lời
    khuyên pháp lý hay giấy phép can thiệp trong mọi tình huống.
  source_lesson: LifeSkills/notes/module-2/week-06-nonviolent-communication.md
  version: 1.0.0
  tags:
  - protective-force
  - safety
  - module-2
  claim_ids:
  - W06-C03
