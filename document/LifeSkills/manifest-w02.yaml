learning_objectives:
- id: LO-W02-01
  bloom_level: Understand
  statement: Trình bày được bốn nhánh năng lực của mô hình EQ theo Mayer-Salovey (Perceiving, Using, Understanding,
    Managing) và phân biệt với các quan niệm sai lệch thông tục.
- id: LO-W02-02
  bloom_level: Apply
  statement: 'Phân tích một trải nghiệm cảm xúc qua chuỗi 4 mắt xích: Kích hoạt (Trigger) → Đánh giá nhận thức (Appraisal)
    → Biểu hiện sinh lý & Thôi thúc hành vi (Arousal & Action Urge) → Hành động (Action).'
- id: LO-W02-03
  bloom_level: Apply
  statement: So sánh cơ chế và tác động tâm sinh lý giữa Tái đánh giá nhận thức (Cognitive Reappraisal) và Đè nén
    biểu cảm (Expressive Suppression) theo mô hình James Gross, áp dụng vào kịch bản giả định.
- id: LO-W02-04
  bloom_level: Evaluate
  statement: Chỉ ra các giới hạn nghiên cứu của EQ (độ tin cậy của bài tự báo cáo, nguy cơ dùng EQ để thao túng),
    và xác định ranh giới an toàn khi cần tìm kiếm hỗ trợ chuyên môn thay vì tự điều hòa.
