learning_objectives:
- id: LO-W10-01
  bloom_level: Understand
  statement: Trình bày được 5 ngôn ngữ tình yêu của Gary Chapman và hiểu rõ vai trò của chúng như một công cụ gợi
    mở giao tiếp (heuristic) chứ không phải định luật tâm lý học tuyệt đối.
- id: LO-W10-02
  bloom_level: Analyze
  statement: Nêu năm nhóm được nhận diện trong abstract Stafford & Canary và phân tích giả thuyết/nhu cầu trong
    case; phân biệt mô tả nghiên cứu với thực hành gợi ý và kết luận nhân quả.
- id: LO-W10-03
  bloom_level: Apply
  statement: Xây dựng một kế hoạch duy trì quan hệ hàng tuần bao gồm việc chia sẻ trách nhiệm (sharing tasks) và
    cởi mở cảm xúc (openness) cho một tình huống giả định.
- id: LO-W10-04
  bloom_level: Evaluate
  statement: Phản biện ngụy niệm cho rằng "chỉ cần tìm người cùng ngôn ngữ tình yêu là bảo đảm hạnh phúc" và nhận
    diện tầm quan trọng của tính đáp ứng (responsiveness).
