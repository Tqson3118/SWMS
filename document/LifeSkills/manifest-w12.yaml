learning_objectives:
- id: LO-W12-01
  bloom_level: Understand
  statement: Giải thích grief, DABDA và Mô hình Xử lý Kép như các mô tả không bắt buộc; chọn cách hỗ trợ tôn trọng
    nhịp và lựa chọn của người đau.
- id: LO-W12-02
  bloom_level: Analyze
  statement: Phân tích các tình huống hỗ trợ và bối cảnh chia tay để nhận ra ép nhịp, nhai lại, ranh giới và giúp
    việc cụ thể.
- id: LO-W12-03
  bloom_level: Apply
  statement: Áp dụng nhịp tự chăm sóc tối thiểu, hoãn quyết định lớn và chọn low/no-contact hoặc liên lạc cấu trúc
    tùy trách nhiệm và an toàn.
- id: LO-W12-04
  bloom_level: Evaluate
  statement: Đánh giá giới hạn mô hình, dấu hiệu cần chuyên môn và lựa chọn an toàn khi có đe dọa, quấy rối hoặc
    suy giảm chức năng.
