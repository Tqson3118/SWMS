learning_objectives:
- id: LO-W09-01
  bloom_level: Understand
  statement: Mô tả hai chiều kích và các nhãn mô hình gắn bó ở người trưởng thành; dùng chúng để hỏi nhu cầu, không
    chẩn đoán hoặc kết luận từ một hành vi.
- id: LO-W09-02
  bloom_level: Analyze
  statement: Phân tích hành vi phản kháng (protest behavior) bằng dữ kiện và giả thuyết thay thế, rồi bộc lộ nhu
    cầu an toàn một cách chủ động.
- id: LO-W09-03
  bloom_level: Apply
  statement: Thực hành cấu trúc phản hồi an toàn khi đối phương kích hoạt cơ chế rút lui hoặc đòi hỏi dồn dập trong
    tình huống giả định.
- id: LO-W09-04
  bloom_level: Evaluate
  statement: Đánh giá được các giới hạn của lý thuyết gắn bó và từ chối việc sử dụng phong cách gắn bó để biện minh
    cho các hành vi thao túng hoặc vi phạm ranh giới.
