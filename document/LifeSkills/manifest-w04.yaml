learning_objectives:
- id: LO-W04-01
  bloom_level: Understand
  statement: 'Phân biệt được 5 loại ranh giới cá nhân phổ biến (Thể lý, Cảm xúc, Thời gian/Năng lượng, Vật chất/Tài
    chính, và Thông tin/Hội thoại) cùng 3 mức độ ranh giới: Cứng nhắc (Rigid), Lỏng lẻo (Porous), và Lành mạnh (Healthy).'
- id: LO-W04-02
  bloom_level: Apply
  statement: Áp dụng công thức 4 bước thiết lập ranh giới rõ ràng (Mô tả hành vi cụ thể → Nêu tác động → Tuyên bố
    ranh giới → Nêu hệ quả bảo vệ) vào một tình huống công việc hoặc đời sống thường nhật.
- id: LO-W04-03
  bloom_level: Apply
  statement: Nhận diện các hình thức phản kháng ranh giới phổ biến (thao túng cảm giác tội lỗi - guilt-tripping,
    im lặng trừng phạt - silent treatment, vượt ranh giới ngầm) và thực hành kỹ thuật "Đĩa hát xước" (Broken Record)
    để giữ vững ranh giới mà không leo thang xung đột.
- id: LO-W04-04
  bloom_level: Evaluate
  statement: Đánh giá bối cảnh bất cân bằng quyền lực (sếp - nhân viên, quan hệ gia đình truyền thống) để lựa chọn
    chiến lược ranh giới an toàn, có phương án dự phòng (safety branching) và tìm kiếm hỗ trợ khi cần thiết.
