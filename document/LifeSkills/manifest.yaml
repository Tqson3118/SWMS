- id: LO-W01-01
  bloom_level: Understand
  statement: Mô tả được các yếu tố của self-awareness và phân biệt dữ kiện với diễn giải trong một ví dụ.
- id: LO-W01-02
  bloom_level: Apply
  statement: Với một case giả định, nêu được các giả thuyết thay thế và dữ kiện còn thiếu mà không gán nhãn nhân
