- id: LO-W01-03
  bloom_level: Apply
  statement: Viết được một bước phản hồi hoặc tự quan sát nhỏ, tự nguyện, có thể đảo ngược và có điều kiện dừng.
- id: LO-W01-04
  bloom_level: Evaluate
  statement: Nêu được các giới hạn của introspection, Johari Window và strengths, đồng thời nhận biết khi cần tìm
    hỗ trợ phù hợp.
