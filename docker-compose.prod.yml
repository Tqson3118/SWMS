version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: studxy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-swms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-swms_password_prod_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-swms_db}
    ports:
      - "5432:5432"
    volumes:
      - studxy_pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-swms_user} -d ${POSTGRES_DB:-swms_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: studxy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - studxy_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: studxy-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:5080
      URLS: http://0.0.0.0:5080
      SWMS_USE_POSTGRES: ${SWMS_USE_POSTGRES:-true}
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-swms_db};Username=${POSTGRES_USER:-swms_user};Password=${POSTGRES_PASSWORD:-swms_password_prod_change_me};Timeout=5;Command Timeout=30"
      Jwt__Issuer: ${JWT_ISSUER:-https://api.studxy.vn}
      Jwt__Audience: ${JWT_AUDIENCE:-https://app.studxy.vn}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-CHANGE_THIS_TO_A_LONG_RANDOM_HMAC_SECRET_KEY_AT_LEAST_64_CHARS}
      Security__AesMasterKeyBase64: ${AES_MASTER_KEY_BASE64:-U1dNUy1hZXMtMjU2LWdjbS1tYXN0ZXIta2V5LTIwMjY=}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      AiProxy__BaseUrl: ${AI_PROXY_BASE_URL:-http://host.docker.internal:8045}
      AiProxy__ApiKey: ${AI_PROXY_API_KEY:-}
      AiProxy__Model: ${AI_PROXY_MODEL:-gemini-3.8-flash}
      DocumentLibrary__RootPath: /app/document
      Storage__LocalStoragePath: /app/App_Data/storage/documents
    ports:
      - "5080:5080"
    volumes:
      - studxy_uploads:/app/App_Data/storage/documents
      - ./document:/app/document:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        BACKEND_INTERNAL_URL: http://backend:5080
    container_name: studxy-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      BACKEND_INTERNAL_URL: http://backend:5080
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://studxy.vn}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  studxy_pgdata:
  studxy_redisdata:
  studxy_uploads:
